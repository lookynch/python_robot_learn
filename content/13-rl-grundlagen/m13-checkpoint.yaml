  - type: quiz
    question: |
      Ein Roboter soll mit 10 Steuerschritten pro Sekunde etwa 5 s vorausplanen. Welcher Diskontfaktor passt grob?
    options:
      - text: "$\\gamma = 0{,}98$"
        correct: true
        why: Horizont $1/(1-\gamma) = 50$ Schritte = 5 s.
      - text: "$\\gamma = 0{,}5$"
        correct: false
        why: Horizont 2 Schritte = 0,2 s.
      - text: "$\\gamma = 0{,}9$"
        correct: false
        why: Horizont 10 Schritte = 1 s.
