  - type: quiz
    question: |
      Ein Bandit-Agent wählt immer die Aktion mit der höchsten Schätzung $Q$, alle $Q$ starten bei 0, Belohnungen sind 0 oder 1. Was ist das Hauptproblem?
    options:
      - text: Er kann an einer mittelmäßigen Aktion hängen bleiben, weil er andere nie wieder ausprobiert.
        correct: true
        why: Ohne Exploration (ε-greedy, UCB) werden falsche Schätzungen nie korrigiert.
      - text: Die Schätzungen konvergieren nicht, weil der Mittelwert inkrementell berechnet wird.
        correct: false
        why: Der inkrementelle Mittelwert ist exakt der Mittelwert.
      - text: Er wählt zu oft zufällige Aktionen.
        correct: false
        why: Rein greedy wählt nie zufällig.
