      - |
        import numpy as np
        def ucb_action(Q, N, t, c=1.0):
            return int(np.argmax(Q + c * np.sqrt(np.log(t) / np.maximum(N, 1))))
    hints:
      - "Teilziel: erst den Sonderfall `N == 0`, dann die UCB-Bewertung."
      - "`np.any(N == 0)` prüft den Sonderfall; `np.argmin(N)` liefert dann eine unprobierte Aktion."
      - "`return int(np.argmax(Q + c * np.sqrt(np.log(t) / N)))`"
  - type: quiz
    question: |
      Welche Aussage über Value Iteration (VI) und Policy Iteration (PI) stimmt?
    options:
      - text: Beide brauchen das Modell `P` und liefern dieselbe optimale Wertfunktion.
        correct: true
        why: Beide sind dynamische Programmierung auf einem bekannten MDP.
      - text: VI braucht kein Modell, PI schon.
        correct: false
        why: Das Optimalitäts-Backup von VI braucht `P` genauso.
      - text: PI liefert nur eine Näherung, VI das exakte Optimum.
        correct: false
        why: PI endet mit einer exakt optimalen Policy; VI nähert sich $V^*$ an.
      - text: Eine PI-Iteration kostet genauso viel wie ein VI-Sweep.
        correct: false
        why: Eine PI-Iteration enthält eine vollständige Policy-Bewertung.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `greedy_policy(env, V, gamma)`: für jeden Zustand die Aktion mit dem größten $Q(s, a) = \sum p\,[r + \gamma V(s')(1 - \text{done})]$. Rückgabe: Integer-Array der Länge `env.n_states`.
    starter: |
      import numpy as np

      def greedy_policy(env, V, gamma):
          pi = np.zeros(env.n_states, dtype=int)
          for s in range(env.n_states):
              q = np.zeros(env.n_actions)
              # Q-Werte berechnen, beste Aktion wählen
          return pi
    solution: |
      import numpy as np

      def greedy_policy(env, V, gamma):
          pi = np.zeros(env.n_states, dtype=int)
          for s in range(env.n_states):
              q = np.zeros(env.n_actions)
              for a in range(env.n_actions):
                  for p, s2, r, done in env.P[s][a]:
                      q[a] += p * (r + gamma * V[s2] * (not done))
              pi[s] = np.argmax(q)
          return pi
    tests:
      - name: Policy aus V* erreicht das Ziel
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env_t = GridWorld()
          V_star = np.array([-5, -4, -3, -4, -4, 0, -2, -3, -3, -2, -1, 0, 0, -1, 0, 0], dtype=float)
          pi_t = greedy_policy(env_t, V_star, 1.0)
          s, steps, done = env_t.reset(), 0, False
          while not done and steps < 50:
              s, r, done = env_t.step(pi_t[s])
              steps += 1
          assert s == 15 and steps == 6, f"Erwartet: Ziel nach 6 Schritten, bekommen: Feld {s} nach {steps} Schritten"
      - name: Rutschige Welt – Policy ist optimal
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env_t = GridWorld(slip=0.2)
          V = np.zeros(16)
          for _ in range(400):
              V = np.array([max(sum(p * (r + 0.9 * V[s2] * (not d)) for p, s2, r, d in env_t.P[s][a]) for a in range(4)) for s in range(16)])
          pi_t = greedy_policy(env_t, V, 0.9)
          P_pi, r_pi = np.zeros((16, 16)), np.zeros(16)
          for s in range(16):
              for p, s2, r, d in env_t.P[s][int(pi_t[s])]:
                  r_pi[s] += p * r
                  if not d:
                      P_pi[s, s2] += p
          V_pi = np.linalg.solve(np.eye(16) - 0.9 * P_pi, r_pi)
          assert close(V_pi, V, 1e-5), f"Der Wert deiner Policy im Start ist {V_pi[0]:.3f}, optimal wäre {V[0]:.3f}"
    mutants:
      - |
