  - type: exercise
    mode: make
    prompt: |
      Schreibe `ucb_action(Q, N, t, c=1.0)`: Gibt es Aktionen mit `N == 0`, wähle die erste davon. Sonst wähle $\arg\max_a \big[Q(a) + c\sqrt{\ln t / N(a)}\big]$. Rückgabe als `int`.
    starter: |
      import numpy as np

      def ucb_action(Q, N, t, c=1.0):
          # dein Code
          pass
    solution: |
      import numpy as np

      def ucb_action(Q, N, t, c=1.0):
          if np.any(N == 0):
              return int(np.argmin(N))
          return int(np.argmax(Q + c * np.sqrt(np.log(t) / N)))
    tests:
      - name: Unprobierte Aktion zuerst
        code: |
          import numpy as np
          a = ucb_action(np.array([0.9, 0.0, 0.0]), np.array([5.0, 0.0, 3.0]), 9)
          assert a == 1, f"Aktion 1 wurde noch nie gewählt und muss drankommen, bekommen {a}"
      - name: Bonus überwiegt
        code: |
          import numpy as np
          a = ucb_action(np.array([0.6, 0.5]), np.array([90.0, 10.0]), 100)
          assert a == 1, f"Mit Bonus ist Aktion 1 besser (0.5 + 0.68 > 0.6 + 0.23), bekommen {a}"
      - name: Schätzwert überwiegt bei kleinem c
        code: |
          import numpy as np
          a = ucb_action(np.array([0.6, 0.5]), np.array([90.0, 10.0]), 100, c=0.1)
          assert a == 0, f"Mit c = 0.1 ist der Bonus klein, Aktion 0 erwartet, bekommen {a}"
          assert isinstance(a, int), f"Rückgabe sollte int sein, ist {type(a).__name__}"
    mutants:
      - |
        import numpy as np
        def ucb_action(Q, N, t, c=1.0):
            return int(np.argmax(Q))
      - |
        import numpy as np
        def ucb_action(Q, N, t, c=1.0):
