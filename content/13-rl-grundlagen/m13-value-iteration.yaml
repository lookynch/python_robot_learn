id: m13-value-iteration
title: Value Iteration
minutes: 12
goals:
  - Die Bellman-Optimalitätsgleichung als Update-Regel einsetzen
  - Value Iteration implementieren und gegen die bekannte Lösung prüfen
  - Aus V eine greedy Policy ableiten, anzeigen und ausführen
concepts: [dp-bellman-optimal, dp-value-iteration, dp-greedy-policy]
steps:
  - type: text
    body: |
      ## Vom Bewerten zum Optimieren

      Policy Evaluation fragt: Wie gut ist **diese** Policy? Jetzt wollen wir die **beste**. Der **Aktionswert** $Q(s, a)$ ist der erwartete Return, wenn man in $s$ zuerst $a$ wählt:

      $$Q(s, a) = \sum_{(p,\, s',\, r,\, \text{done})} p\,\big[\,r + \gamma\, V(s')(1 - \text{done})\,\big]$$

      Die optimale Wertfunktion erfüllt die **Bellman-Optimalitätsgleichung** – Maximum statt Mittel über die Aktionen:

      $$V^*(s) = \max_a Q^*(s, a)$$

      **Value Iteration:** diese Gleichung als Update immer wieder auf alle Zustände anwenden. Danach ist die **greedy Policy** $\pi(s) = \arg\max_a Q(s, a)$ optimal.
  - type: predict
    intro: |
      Ein Backup von Hand: drei Aktionen, jede kostet −1 und führt sicher in einen anderen Folgezustand.
    code: |
      gamma = 0.9
      V = [0.0, -2.0, -5.0]                  # Werte der Folgezustände
      q = [-1 + gamma * V[1], -1 + gamma * V[2], -1 + gamma * V[0]]
      print(round(max(q), 2), q.index(max(q)))
    options: ["-1.0 2", "-2.8 0", "0.0 0", "-5.5 1"]
    answer: "-1.0 2"
    explanation: |
      $Q = (-2{,}8;\ -5{,}5;\ -1{,}0)$. Das Maximum ist $-1{,}0$ bei Aktion 2 – sie führt in den Folgezustand mit Wert 0.
  - type: example
    code: |
      import numpy as np
      from lab.envs import GridWorld

      def q_values(env, V, s, gamma):
          q = np.zeros(env.n_actions)
          for a in range(env.n_actions):
              for p, s2, r, done in env.P[s][a]:
                  q[a] += p * (r + gamma * V[s2] * (not done))
          return q

      env, gamma = GridWorld(), 1.0
      V = np.zeros(env.n_states)
      for sweep in range(1000):
          V_new = np.array([np.max(q_values(env, V, s, gamma)) for s in range(env.n_states)])
          delta = np.max(np.abs(V_new - V))
          V = V_new
          if delta < 1e-8:
              break

      pi = np.array([np.argmax(q_values(env, V, s, gamma)) for s in range(env.n_states)])
      print("Sweeps:", sweep + 1)
      print(V.reshape(4, 4))
      env.render(values=V, policy=pi, title="V* und greedy Policy")
    subgoals:
      - lines: [4, 9]
        label: Q-Werte eines Zustands aus dem Modell
      - lines: [11, 18]
        label: Optimalitäts-Backup bis zur Konvergenz
      - lines: [20, 20]
        label: Greedy Policy ablesen
      - lines: [21, 23]
        label: Werte und Pfeile zeigen
    after: |
      Mit $\gamma = 1$ und −1 pro Schritt ist $V^*(s)$ einfach minus die Zahl der kostenpflichtigen Schritte auf dem kürzesten Weg: vom Start 5 (der sechste Schritt ins Ziel kostet 0). Die Pfeile machen um die Falle einen Bogen, Feld 7 läuft nach links statt nach unten in die Falle.
  - type: explain
    question: |
      Warum braucht Value Iteration hier genau 6 Sweeps?
    options:
      - text: Information breitet sich pro Sweep einen Schritt vom Ziel aus; der weiteste Zustand ist 6 Schritte entfernt, der 6. Sweep bestätigt nur noch, dass sich nichts mehr ändert.
        correct: true
        why: Nach Sweep $k$ sind alle Zustände korrekt, die höchstens $k$ Schritte vom Ziel weg sind. Der längste kürzeste Weg hat 6 Schritte (5 kostenpflichtige) – ab Sweep 5 stimmt alles, Sweep 6 hat Änderung 0.
      - text: Weil die Gitterwelt 6 freie Felder in der ersten Zeile hat.
        correct: false
        why: Die erste Zeile hat 4 Felder; die Zahl hat mit Entfernungen zu tun.
      - text: Weil $\gamma = 1$ immer zu 6 Sweeps führt.
        correct: false
        why: In einer größeren Welt mit längeren Wegen braucht es entsprechend mehr.
      - text: Zufall – mit anderem Seed wären es mehr.
        correct: false
        why: Die Welt ist deterministisch, Value Iteration verwendet keinen Zufall.
  - type: example
    intro: |
      Jetzt rutschig (`slip=0.2`) und mit $\gamma = 0{,}95$. Achte auf die Felder neben der Falle.
    code: |
      import numpy as np
      from lab.envs import GridWorld

      def q_values(env, V, s, gamma):
          q = np.zeros(env.n_actions)
          for a in range(env.n_actions):
              for p, s2, r, done in env.P[s][a]:
                  q[a] += p * (r + gamma * V[s2] * (not done))
          return q

      env, gamma = GridWorld(slip=0.2, seed=0), 0.95
      V = np.zeros(env.n_states)
      for sweep in range(1000):
          V_new = np.array([np.max(q_values(env, V, s, gamma)) for s in range(env.n_states)])
          if np.max(np.abs(V_new - V)) < 1e-8:
              break
          V = V_new
      pi = np.array([np.argmax(q_values(env, V, s, gamma)) for s in range(env.n_states)])

      s = env.reset()
      path, done = [s], False
      while not done:
          s, r, done = env.step(pi[s])
          path.append(s)
      print("Sweeps:", sweep + 1, " Pfad:", path)
      env.render(values=V, policy=pi, title="Rutschige Welt: V* und Policy")
      env.render(path=path, title="Eine Episode mit der greedy Policy")
    subgoals:
      - lines: [11, 18]
        label: Value Iteration
      - lines: [20, 24]
        label: Episode mit der Policy ausführen
      - lines: [25, 27]
        label: Ergebnis zeigen
    after: |
      Von Feld 10 geht die Policy jetzt **nach links** statt nach unten: Nach unten würde man mit 0,1 nach rechts in die Falle rutschen. Der Umweg über 9 → 13 → 14 kostet ein paar Schritte, aber weniger als das Risiko von −100. Diese Abwägung entsteht allein aus dem Modell – niemand hat sie einprogrammiert.
  - type: fill
    fading: true
    prompt: |
      Ergänze Optimalitäts-Backup und Policy-Extraktion. Der Test prüft, dass der Agent vom Start in 6 Schritten das Ziel erreicht.
    code: |
