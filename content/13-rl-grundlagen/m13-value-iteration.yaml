    explanation: |
      Der zweite Test prüft eine **Eigenschaft** statt Zahlen: $V^*$ ist der Fixpunkt der Bellman-Optimalitätsgleichung. Das Rezept „Ergebnis in die Gleichung einsetzen“ funktioniert für jede Welt.
  - type: quiz
    question: |
      Value Iteration hat $V^*$ geliefert. Was braucht man zusätzlich, um daraus die greedy Policy zu berechnen?
    options:
      - text: Das Modell `env.P` – für $\arg\max_a Q(s, a)$ muss man wissen, wohin jede Aktion führt.
        correct: true
        why: "$V$ allein sagt nicht, welche Aktion zu welchem Folgezustand führt. Darum lernt man ohne Modell (Modul 14) direkt $Q$."
      - text: Nichts – man nimmt in jedem Zustand die Aktion mit dem größten $V$.
        correct: false
        why: "$V$ hat einen Wert pro Zustand, nicht pro Aktion."
      - text: Eine Zufalls-Policy als Startpunkt.
        correct: false
        why: Value Iteration startet mit $V = 0$; eine Start-Policy braucht erst Policy Iteration.
cards:
  - id: m13-c-max-backup
    concept: dp-bellman-optimal
    variants:
      - type: predict
        code: |
          q = [-3.0, -1.5, -2.0, -1.5]
          print(max(q), q.index(max(q)))
        options: ["-1.5 1", "-1.5 3", "-3.0 0", "-2.0 2"]
        answer: "-1.5 1"
        explanation: Wert = Maximum; bei Gleichstand liefert `index` (wie `np.argmax`) den ersten Treffer.
      - type: quiz
        question: |
          Was unterscheidet das Backup der Value Iteration von dem der Policy Evaluation?
        options:
          - text: Maximum über die Aktionen statt Mittel mit den Policy-Wahrscheinlichkeiten.
            correct: true
            why: Optimalität statt Erwartung unter einer festen Policy.
          - text: Value Iteration ignoriert die Übergangswahrscheinlichkeiten.
            correct: false
            why: Über die Ergebnisse einer Aktion wird weiterhin mit $p$ gemittelt.
          - text: Value Iteration nutzt keinen Diskont.
            correct: false
            why: "$\\gamma$ steht in beiden Backups."
  - id: m13-c-vi-ausbreitung
    concept: dp-value-iteration
    variants:
      - type: quiz
        question: |
          Deterministische Welt, $\gamma = 1$, $V = 0$ zu Beginn. Nach dem ersten Sweep – welche Zustände haben **sicher** schon ihren endgültigen Wert?
        options:
          - text: Die Endzustände und alle, die das Ziel in einem Schritt erreichen.
            correct: true
            why: Information breitet sich pro Sweep einen Schritt vom Ziel aus.
          - text: Alle Zustände.
            correct: false
            why: Weit entfernte Zustände kennen nach einem Sweep nur die Kosten eines Schritts.
          - text: Keiner.
            correct: false
            why: Nachbarn des Ziels sind schon korrekt (Wert 0).
      - type: quiz
        question: |
          Die längsten kürzesten Wege einer Gitterwelt haben 20 Schritte. Wie viele Sweeps braucht Value Iteration mit $\gamma = 1$ (deterministisch, $V = 0$ zu Beginn) etwa?
        options:
          - text: Etwa 20 – plus einen, der die Konvergenz bestätigt.
            correct: true
            why: Ein Schritt Informationsausbreitung pro Sweep.
          - text: Genau einen.
            correct: false
            why: Ein Sweep schaut nur einen Schritt voraus.
          - text: Unendlich viele.
            correct: false
            why: In deterministischen Welten mit $\gamma = 1$ und erreichbarem Ziel endet es nach endlich vielen Sweeps.
  - id: m13-c-greedy
    concept: dp-greedy-policy
    variants:
      - type: predict
        code: |
          import numpy as np
          Q = np.array([[-2.0, -1.0, -3.0, -1.5],
                        [-0.5, -4.0, -0.5, -2.0]])
          print(np.argmax(Q, axis=1))
        options: ["[1 0]", "[1 2]", "[0 1]", "[-1.  -0.5]"]
        answer: "[1 0]"
        explanation: Pro Zeile (Zustand) die Aktion mit dem größten Q; bei Gleichstand die erste.
      - type: quiz
        question: |
          `pi[s] = np.max(q)` statt `np.argmax(q)` – was ist falsch?
        options:
          - text: "`np.max` liefert den Wert (z. B. −3.0), keine Aktionsnummer."
            correct: true
            why: Die Policy braucht den Index der besten Aktion.
          - text: Nichts, beides ist gleich.
            correct: false
            why: Wert und Index sind verschiedene Dinge.
          - text: "`np.max` ist langsamer."
            correct: false
            why: Es geht nicht um Geschwindigkeit, sondern um die Bedeutung.
