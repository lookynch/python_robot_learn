          assert s == 15 and steps == 6, f"Erwartet: Ziel 15 nach 6 Schritten, bekommen: Feld {s} nach {steps} Schritten"
    explanation: |
      Mit `mean` würde man die Zufalls-Policy bewerten statt zu optimieren. `max` liefert den **Wert**, `argmax` die **Aktion** – beim Backup braucht man den Wert, für die Policy die Aktion.
