    solution: |
      import numpy as np

      def q_values(env, V, s, gamma):
          q = np.zeros(env.n_actions)
          for a in range(env.n_actions):
              for p, s2, r, done in env.P[s][a]:
                  q[a] += p * (r + gamma * V[s2] * (not done))
          return q

      def value_iteration(env, gamma, theta=1e-8):
          V = np.zeros(env.n_states)
          for sweep in range(2000):
              V_new = np.zeros(env.n_states)
              for s in range(env.n_states):
                  V_new[s] = np.max(q_values(env, V, s, gamma))
              if np.max(np.abs(V_new - V)) < theta:
                  return V_new
              V = V_new
          return V
    tests:
      - name: Bekannte Lösung der Standardwelt (γ = 1)
        code: |
          import numpy as np
          from lab.envs import GridWorld
          V = value_iteration(GridWorld(), 1.0)
          known = np.array([-5, -4, -3, -4, -4, 0, -2, -3, -3, -2, -1, 0, 0, -1, 0, 0], dtype=float)
          assert np.shape(V) == (16,), f"V sollte Shape (16,) haben, hat {np.shape(V)}"
          assert close(V, known), f"Erwartet (Zeilen) {known.reshape(4, 4).tolist()}, bekommen {np.round(V, 2).reshape(4, 4).tolist()}"
      - name: Rutschige Welt erfüllt die Optimalitätsgleichung
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env_t = GridWorld(slip=0.2)
          V = value_iteration(env_t, 0.95)
          residual = max(abs(V[s] - max(sum(p * (r + 0.95 * V[s2] * (not d)) for p, s2, r, d in env_t.P[s][a]) for a in range(4))) for s in range(16))
          assert residual < 1e-6, f"V erfüllt die Bellman-Optimalitätsgleichung nicht (Abweichung {residual:.2e})"
          assert close(V[0], -6.43, 0.01), f"V[0] sollte etwa -6.43 sein, ist {V[0]:.3f}"
