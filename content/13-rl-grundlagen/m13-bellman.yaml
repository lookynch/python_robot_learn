    hints:
      - "Teilziel: Bellman-Backup für jeden Zustand, dann auf Konvergenz prüfen."
      - "Bei deterministischer Policy fällt die Summe über $a$ weg: nur `env.P[s][policy[s]]`, gewichtet mit `p`."
      - "`V_new[s] += p * (r + gamma * V[s2] * (not done))`"
      - |
        ```python
        if np.max(np.abs(V_new - V)) < theta:
            return V_new
