        ```
    explanation: |
      Der erste Test nutzt $\gamma = 1$: Weil die Policy sicher ins Ziel führt, konvergiert die Iteration trotzdem – nach wenigen Sweeps stehen die exakten Schrittkosten da. Eine Policy, die nie ankommt, hätte mit $\gamma = 1$ keinen endlichen Wert – dann bricht erst die Obergrenze von 2000 Sweeps die Schleife ab.
  - type: quiz
    question: |
      Unter der Zufalls-Policy ist $V^\pi(0) \approx -18{,}4$. Was bedeutet diese Zahl?
    options:
      - text: Startet der Agent in Feld 0 und wählt zufällig, ist sein diskontierter Return im Mittel etwa −18,4.
        correct: true
        why: Genau so ist $V^\pi$ definiert – ein Erwartungswert über alle möglichen Episoden.
      - text: Der Agent braucht 18,4 Schritte bis ins Ziel.
        correct: false
        why: Mit Diskont und Fallen-Strafe ist der Wert keine Schrittzahl.
      - text: Der bestmögliche Return von Feld 0 aus.
        correct: false
        why: Das wäre $V^*(0)$; die Zufalls-Policy ist weit davon entfernt.
cards:
  - id: m13-c-backup
    concept: dp-policy-evaluation
    variants:
      - type: predict
        code: |
          gamma = 0.5
          V_next = 8.0
          print(1.0 * (-1 + gamma * V_next))
        options: ["3.0", "7.0", "4.0", "-0.5"]
        answer: "3.0"
        explanation: "$-1 + 0{,}5 \\cdot 8 = 3$."
      - type: predict
        code: |
          gamma = 1.0
          outcomes = [(0.5, 4.0, -1.0, False), (0.5, 0.0, 0.0, True)]   # (p, V[s2], r, done)
          print(sum(p * (r + gamma * v * (not done)) for p, v, r, done in outcomes))
        options: ["1.5", "1.0", "3.0", "2.0"]
        answer: "1.5"
        explanation: "$0{,}5 \\cdot (-1 + 4) + 0{,}5 \\cdot 0 = 1{,}5$ – nach `done` zählt kein Folgewert."
  - id: m13-c-wert-bedeutung
    concept: dp-wertfunktion
    variants:
      - type: quiz
        question: |
          Welchen Wert hat ein Endzustand (z. B. das Ziel) in der Wertfunktion?
        options:
          - text: "0"
            correct: true
            why: Nach dem Ende der Episode gibt es keine Belohnungen mehr.
          - text: Die Belohnung fürs Erreichen des Ziels.
            correct: false
            why: Diese Belohnung gehört zum Übergang **ins** Ziel und steckt im Wert des Vorgängerzustands.
          - text: Unendlich.
            correct: false
            why: Ein Endzustand liefert keinen weiteren Return.
      - type: quiz
        question: |
          Hängt $V^\pi(s)$ von der Policy ab?
        options:
          - text: Ja – andere Aktionen führen zu anderen Returns.
            correct: true
            why: Deshalb das $\pi$ im Index; die beste erreichbare Wertfunktion heißt $V^*$.
          - text: Nein, nur von der Umgebung.
            correct: false
            why: Dieselbe Welt mit einer besseren Policy hat höhere Werte.
          - text: Nur bei stochastischen Umgebungen.
            correct: false
            why: Auch deterministisch bestimmt die Policy den Weg.
  - id: m13-c-sweeps
    concept: dp-policy-evaluation
    variants:
      - type: quiz
        question: |
          Policy Evaluation mit $\gamma = 0{,}5$ statt $0{,}9$. Was passiert mit der Zahl der Sweeps bis zur Konvergenz?
        options:
          - text: Sie sinkt deutlich, weil der Fehler pro Sweep auf die Hälfte statt auf 90 % schrumpft.
            correct: true
            why: Die Kontraktionsrate ist $\gamma$.
          - text: Sie steigt.
            correct: false
            why: Kleineres $\gamma$ heißt schnellere Kontraktion.
          - text: Sie bleibt gleich, weil die Welt gleich bleibt.
            correct: false
            why: Die Konvergenzgeschwindigkeit hängt von $\gamma$ ab.
      - type: quiz
        question: |
          Wozu dient `delta = np.max(np.abs(V_new - V))` in der Iteration?
        options:
          - text: Als Abbruchkriterium – ist die größte Änderung winzig, sind die Werte (fast) konvergiert.
            correct: true
            why: Der verbleibende Fehler ist höchstens etwa $\delta\,\gamma/(1-\gamma)$.
          - text: Es ist der Wert des Startzustands.
            correct: false
            why: Es misst eine Änderung, keinen Wert.
          - text: Es ist die Lernrate.
            correct: false
            why: Policy Evaluation mit Modell hat keine Lernrate.
