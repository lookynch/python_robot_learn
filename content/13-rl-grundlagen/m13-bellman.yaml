    solution: |
      import numpy as np

      def evaluate(env, policy, gamma, theta=1e-8):
          V = np.zeros(env.n_states)
          for sweep in range(2000):
              V_new = np.zeros(env.n_states)
              for s in range(env.n_states):
                  a = policy[s]
                  for p, s2, r, done in env.P[s][a]:
                      V_new[s] += p * (r + gamma * V[s2] * (not done))
              if np.max(np.abs(V_new - V)) < theta:
                  return V_new
              V = V_new
          return V
    tests:
      - name: Kurzer Weg ins Ziel (deterministisch)
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env_t = GridWorld()
          pol = np.full(16, 2)
          pol[[0, 1, 14]] = 1
          V = evaluate(env_t, pol, 1.0)
          assert close(V[0], -5.0), f"Vom Start sind es 5 Schritte à −1 bis vor das Ziel: V[0] = −5 erwartet, bekommen {V[0]:.3f}"
          assert close(V[14], 0.0), f"V[14] sollte 0 sein (ein Schritt ins Ziel), ist {V[14]:.3f}"
      - name: Rutschige Welt gegen exakte Lösung
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env_t = GridWorld(slip=0.2)
          pol = np.array([1, 1, 2, 3, 0, 0, 2, 2, 1, 1, 2, 2, 0, 1, 1, 0])
          V = evaluate(env_t, pol, 0.9)
          P_pi, r_pi = np.zeros((16, 16)), np.zeros(16)
          for s in range(16):
              for p, s2, r, done in env_t.P[s][pol[s]]:
                  r_pi[s] += p * r
                  if not done:
                      P_pi[s, s2] += p
          exact = np.linalg.solve(np.eye(16) - 0.9 * P_pi, r_pi)
          assert np.shape(V) == (16,), f"V sollte Shape (16,) haben, hat {np.shape(V)}"
          assert close(V, exact, 1e-5), f"V[0] erwartet {exact[0]:.3f}, bekommen {V[0]:.3f}"
