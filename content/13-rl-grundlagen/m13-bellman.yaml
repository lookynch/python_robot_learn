id: m13-bellman
title: Wertfunktion und Bellman-Gleichung
minutes: 12
goals:
  - Die Wertfunktion $V^\pi$ als erwarteten Return deuten
  - Einen Bellman-Backup von Hand und in Code berechnen
  - Policy Evaluation iterativ implementieren und mit der exakten Lösung prüfen
concepts: [dp-wertfunktion, dp-policy-evaluation]
steps:
  - type: text
    body: |
      ## Wie gut ist ein Zustand?

      Die **Wertfunktion** (value function) $V^\pi(s)$ ist der erwartete Return, wenn man in $s$ startet und der Policy $\pi$ folgt. Endzustände haben den Wert 0.

      Ein Schritt weiter gedacht: Wert jetzt = erwartete Belohnung + diskontierter Wert danach. Das ist die **Bellman-Erwartungsgleichung**:

      $$V^\pi(s) = \sum_a \pi(a \mid s) \sum_{(p,\, s',\, r,\, \text{done})} p\,\big[\,r + \gamma\, V^\pi(s')\cdot(1 - \text{done})\,\big]$$

      Die innere Summe läuft genau über die Liste `env.P[s][a]`. Ist die Episode vorbei (`done`), kommt kein Wert mehr dazu.
  - type: predict
    intro: |
      Ein Bellman-Backup von Hand: Aus Zustand A kommt man mit 0,5 nach B, mit 0,5 bleibt man in A, beides mit Belohnung −1.
    code: |
      gamma = 0.9
      V = {"A": 0.0, "B": 10.0}
      v_A = 0.5 * (-1 + gamma * V["B"]) + 0.5 * (-1 + gamma * V["A"])
      print(round(v_A, 2))
    options: ["3.5", "4.0", "8.0", "4.5"]
    answer: "3.5"
    explanation: |
      $0{,}5 \cdot (-1 + 9) + 0{,}5 \cdot (-1 + 0) = 4 - 0{,}5 = 3{,}5$. Die Belohnung −1 fällt in beiden Fällen an – wer sie nur einmal zählt, kommt auf 4,0.
  - type: example
    intro: |
      **Policy Evaluation:** Die Gleichung als Update-Regel immer wieder auf alle Zustände anwenden (ein **Sweep**), bis sich nichts mehr ändert. Hier für die Zufalls-Policy (jede Aktion mit 0,25).
    code: |
      import numpy as np
      from lab.envs import GridWorld

      env = GridWorld()
      gamma = 0.9
      pi = np.full((env.n_states, env.n_actions), 0.25)   # Zufalls-Policy

      V = np.zeros(env.n_states)
      for sweep in range(1000):
          V_new = np.zeros(env.n_states)
          for s in range(env.n_states):
              for a in range(env.n_actions):
                  for p, s2, r, done in env.P[s][a]:
                      V_new[s] += pi[s, a] * p * (r + gamma * V[s2] * (not done))
          delta = np.max(np.abs(V_new - V))
          V = V_new
          if delta < 1e-6:
              break

      print("Sweeps:", sweep + 1)
      print(np.round(V.reshape(4, 4), 1))
      env.render(values=V, title="V der Zufalls-Policy (γ = 0.9)")
    subgoals:
      - lines: [4, 6]
        label: Welt, Diskont und Policy festlegen
      - lines: [10, 14]
        label: Bellman-Backup für alle Zustände
      - lines: [15, 18]
        label: Auf Konvergenz prüfen
      - lines: [20, 22]
        label: Werte zeigen
    after: |
      Die Werte sind stark negativ: Zufällig herumirren dauert lange und führt oft in die Falle (−100). Felder neben der Falle sind am schlechtesten. Wände und Ziel haben Wert 0.
  - type: explain
    question: |
      Warum konvergiert die Iteration überhaupt?
    options:
      - text: Jeder Sweep verkleinert den größten Fehler zur wahren Lösung mindestens um den Faktor γ – die Bellman-Abbildung ist eine Kontraktion.
        correct: true
        why: Mit $\gamma = 0{,}9$ schrumpft der Fehler pro Sweep auf 90 %; nach 135 Sweeps sind es etwa $0{,}9^{135} \approx 10^{-6}$ des Anfangsfehlers.
      - text: Weil die Policy in jedem Sweep besser wird.
        correct: false
        why: Die Policy bleibt fest – hier wird nur bewertet, nicht verbessert.
      - text: Weil nach 16 Sweeps jeder Zustand einmal besucht wurde.
        correct: false
        why: Jeder Sweep besucht alle 16 Zustände; trotzdem braucht es viele Sweeps.
      - text: Sie konvergiert nur, weil `range(1000)` begrenzt ist.
        correct: false
        why: Die Grenze ist nur ein Sicherheitsnetz; abgebrochen wird über `delta`.
  - type: fill
    fading: true
    prompt: |
      Ergänze den Bellman-Backup in der Bewertung einer stochastischen Policy. Der Test vergleicht mit der exakten Lösung.
    code: |
      import numpy as np
      from lab.envs import GridWorld

      env = GridWorld(slip=0.2)
      gamma = 0.9
      pi = np.full((16, 4), 0.25)
      V = np.zeros(16)
      for sweep in range(1000):
          V_new = np.zeros(16)
          for s in range(16):
              for a in range(4):
                  for p, s2, r, done in env.P[s][a]:
                      V_new[s] ___ pi[s, a] * p * (r + ___ * V[s2] * (not done))
          if np.max(np.abs(V_new - V)) < 1e-8:
              V = V_new
              break
          V = V_new
    blanks:
      - answer: "+="
        options: ["+=", "="]
      - answer: gamma
        options: [gamma, "1", gamma ** 2]
    tests:
      - name: Werte stimmen mit der exakten Lösung
        code: |
          import numpy as np
          P_pi, r_pi = np.zeros((16, 16)), np.zeros(16)
          for s in range(16):
              for a in range(4):
                  for p, s2, r, done in env.P[s][a]:
                      r_pi[s] += 0.25 * p * r
                      if not done:
                          P_pi[s, s2] += 0.25 * p
          exact = np.linalg.solve(np.eye(16) - 0.9 * P_pi, r_pi)
          assert close(V, exact, 1e-5), f"V[0] erwartet {exact[0]:.3f}, bekommen {V[0]:.3f}"
    explanation: |
      `+=`, weil über alle Aktionen und alle Ergebnisse summiert wird. Mit `=` bliebe nur der letzte Summand übrig.
  - type: example
    intro: |
      Für kleine MDPs gibt es auch eine **direkte Lösung**. Mit Policy-gemittelten Übergängen $P_\pi$ und Belohnungen $r_\pi$ lautet die Bellman-Gleichung in Matrixform $V = r_\pi + \gamma P_\pi V$, also

      $$(I - \gamma P_\pi)\, V = r_\pi$$
    code: |
      import numpy as np
      from lab.envs import GridWorld

      env = GridWorld()
      gamma, n = 0.9, env.n_states
      pi = np.full((n, 4), 0.25)

      P_pi, r_pi = np.zeros((n, n)), np.zeros(n)
      for s in range(n):
          for a in range(4):
              for p, s2, r, done in env.P[s][a]:
                  r_pi[s] += pi[s, a] * p * r
                  if not done:
                      P_pi[s, s2] += pi[s, a] * p

      V = np.linalg.solve(np.eye(n) - gamma * P_pi, r_pi)
      print(np.round(V.reshape(4, 4), 1))
    subgoals:
      - lines: [8, 14]
        label: Übergänge und Belohnungen unter π mitteln
      - lines: [16, 17]
        label: Lineares Gleichungssystem lösen
    after: |
      Dieselben Werte wie iterativ. Kosten: $\mathcal O(n^3)$ für $n$ Zustände – bei 16 Feldern trivial, bei einer Million unmöglich. Darum lernt man das iterative Verfahren; es ist auch die Grundlage für das Lernen aus Erfahrung in Modul 14.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `evaluate(env, policy, gamma, theta=1e-8)` für eine **deterministische** Policy (`policy[s]` = Aktion). Wiederhole Sweeps, bis die größte Änderung kleiner als `theta` ist, und gib `V` zurück.
    starter: |
      import numpy as np

      def evaluate(env, policy, gamma, theta=1e-8):
          V = np.zeros(env.n_states)
          for sweep in range(2000):
              V_new = np.zeros(env.n_states)
