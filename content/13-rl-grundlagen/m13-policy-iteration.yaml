    solution: |
      import numpy as np

      def q_values(env, V, s, gamma):
          q = np.zeros(env.n_actions)
          for a in range(env.n_actions):
              for p, s2, r, done in env.P[s][a]:
                  q[a] += p * (r + gamma * V[s2] * (not done))
          return q

      def evaluate_exact(env, pi, gamma):
          n = env.n_states
          P_pi, r_pi = np.zeros((n, n)), np.zeros(n)
          for s in range(n):
              for p, s2, r, done in env.P[s][pi[s]]:
                  r_pi[s] += p * r
                  if not done:
                      P_pi[s, s2] += p
          return np.linalg.solve(np.eye(n) - gamma * P_pi, r_pi)

      def policy_iteration(env, gamma):
          pi = np.zeros(env.n_states, dtype=int)
          for it in range(100):
              V = evaluate_exact(env, pi, gamma)
              new_pi = np.array([np.argmax(q_values(env, V, s, gamma)) for s in range(env.n_states)])
              if np.array_equal(new_pi, pi):
                  break
              pi = new_pi
          return pi, V
    tests:
      - name: Deterministische Welt
        code: |
          import numpy as np
          from lab.envs import GridWorld
          pi_t, V_t = policy_iteration(GridWorld(), 0.9)
          assert close(V_t[0], -4.0951, 1e-4), f"V(Start) sollte -(1 + 0.9 + … + 0.9⁴) ≈ -4.0951 sein, ist {V_t[0]:.4f}"
      - name: Gleiche Werte wie Value Iteration (rutschig)
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env_t = GridWorld(slip=0.2)
          pi_t, V_t = policy_iteration(env_t, 0.9)
          V_ref = np.zeros(16)
          for _ in range(400):
              V_ref = np.array([max(sum(p * (r + 0.9 * V_ref[s2] * (not d)) for p, s2, r, d in env_t.P[s][a]) for a in range(4)) for s in range(16)])
          assert close(V_t, V_ref, 1e-6), f"V(Start) erwartet {V_ref[0]:.3f}, bekommen {V_t[0]:.3f}"
          assert len(pi_t) == 16 and all(0 <= int(a) < 4 for a in pi_t), f"pi sollte 16 Aktionen 0…3 enthalten, ist {pi_t}"
