id: m13-policy-iteration
title: Policy Iteration
minutes: 11
goals:
  - Policy Evaluation und greedy Verbesserung zu Policy Iteration verbinden
  - Policy Iteration implementieren und mit Value Iteration vergleichen
  - Begründen, warum Policy Iteration nach endlich vielen Schritten endet
concepts: [dp-policy-iteration, dp-greedy-policy]
steps:
  - type: text
    body: |
      ## Bewerten, verbessern, wiederholen

      **Policy Iteration** wechselt zwei Schritte ab:

      1. **Bewerten:** $V^\pi$ der aktuellen Policy berechnen (Lektion Bellman).
      2. **Verbessern:** $\pi'(s) = \arg\max_a Q^\pi(s, a)$ – greedy bezüglich $V^\pi$.

      Ändert sich die Policy nicht mehr, ist sie optimal.

      **Verbesserungssatz** (policy improvement theorem): Die greedy Policy $\pi'$ ist in **jedem** Zustand mindestens so gut wie $\pi$. Weil es nur endlich viele deterministische Policies gibt ($4^{16}$ hier) und keine zweimal vorkommt, endet das Verfahren.

      Zum Bewerten nehmen wir hier die exakte Lösung $(I - \gamma P_\pi)V = r_\pi$.
  - type: predict
    intro: |
      Start-Policy: überall „hoch“. Vom Startfeld oben links läuft der Agent damit immer gegen den Rand.
    code: |
      import numpy as np
      from lab.envs import GridWorld

      def evaluate_exact(env, pi, gamma):
          n = env.n_states
          P_pi, r_pi = np.zeros((n, n)), np.zeros(n)
          for s in range(n):
              for p, s2, r, done in env.P[s][pi[s]]:
                  r_pi[s] += p * r
                  if not done:
                      P_pi[s, s2] += p
          return np.linalg.solve(np.eye(n) - gamma * P_pi, r_pi)

      env = GridWorld()
      V = evaluate_exact(env, np.zeros(16, dtype=int), 0.9)
      print(round(V[0], 2), round(V[15], 2))
    options: ["-10.0 0.0", "-1.0 0.0", "-inf 0.0", "-9.0 -10.0"]
    answer: "-10.0 0.0"
    explanation: |
      Endlos −1 mit $\gamma = 0{,}9$: $-1/(1 - 0{,}9) = -10$. Mit $\gamma = 1$ wäre das Gleichungssystem singulär – dieser Wert wäre $-\infty$. Das Ziel ist Endzustand, Wert 0.
  - type: example
    code: |
      import numpy as np
      from lab.envs import GridWorld

      def q_values(env, V, s, gamma):
          q = np.zeros(env.n_actions)
          for a in range(env.n_actions):
              for p, s2, r, done in env.P[s][a]:
                  q[a] += p * (r + gamma * V[s2] * (not done))
          return q

      def evaluate_exact(env, pi, gamma):
          n = env.n_states
          P_pi, r_pi = np.zeros((n, n)), np.zeros(n)
          for s in range(n):
              for p, s2, r, done in env.P[s][pi[s]]:
                  r_pi[s] += p * r
                  if not done:
                      P_pi[s, s2] += p
          return np.linalg.solve(np.eye(n) - gamma * P_pi, r_pi)

      env, gamma = GridWorld(slip=0.2), 0.9
      pi = np.zeros(env.n_states, dtype=int)            # Start: überall hoch
      for it in range(100):
          V = evaluate_exact(env, pi, gamma)            # 1. bewerten
          new_pi = np.array([np.argmax(q_values(env, V, s, gamma)) for s in range(env.n_states)])
          print(f"Iteration {it + 1}: V(Start) = {V[0]:.3f}, geänderte Zustände: {np.sum(new_pi != pi)}")
          if np.array_equal(new_pi, pi):                # stabil -> optimal
              break
          pi = new_pi                                   # 2. verbessern
      env.render(values=V, policy=pi, title="Policy Iteration: Ergebnis")
    subgoals:
      - lines: [21, 22]
        label: Welt und Start-Policy
      - lines: [24, 24]
        label: Policy bewerten
      - lines: [25, 25]
        label: Greedy verbessern
      - lines: [27, 29]
        label: Auf Stabilität prüfen
    after: |
      Vier Bewertungen genügen. In den ersten Iterationen bleibt $V(\text{Start})$ bei −10: Die Verbesserung beginnt bei den Feldern nahe am Ziel und erreicht den Start erst, wenn eine Kette guter Aktionen bis dorthin existiert.
  - type: explain
    question: |
      Value Iteration braucht hier Dutzende Sweeps, Policy Iteration nur 4 Iterationen. Ist Policy Iteration also immer schneller?
    options:
      - text: Nicht unbedingt – jede Iteration enthält eine vollständige Bewertung (Gleichungssystem oder viele Sweeps), die viel teurer ist als ein einzelner Sweep.
        correct: true
        why: Wenige teure Schritte gegen viele billige. Was schneller ist, hängt von der Größe des Problems ab.
      - text: Ja, weil weniger Iterationen immer weniger Rechenzeit bedeuten.
        correct: false
        why: Eine PI-Iteration ist kein Sweep – sie löst ein ganzes lineares System.
      - text: Nein, Policy Iteration findet oft nur eine fast optimale Policy.
        correct: false
        why: Wenn sie stabil wird, ist die Policy exakt optimal.
      - text: Die beiden Verfahren sind identisch.
        correct: false
        why: VI optimiert die Werte direkt, PI wechselt zwischen expliziter Policy und ihrer Bewertung.
