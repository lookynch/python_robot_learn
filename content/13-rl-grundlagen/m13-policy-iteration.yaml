  - type: example
    intro: |
      Vergleich auf der rutschigen Welt: $V(\text{Start})$ über VI-Sweeps und PI-Iterationen.
    code: |
      import numpy as np
      import lab
      from lab.envs import GridWorld

      def q_values(env, V, s, gamma):
          q = np.zeros(env.n_actions)
          for a in range(env.n_actions):
              for p, s2, r, done in env.P[s][a]:
                  q[a] += p * (r + gamma * V[s2] * (not done))
          return q

      def evaluate_exact(env, pi, gamma):
          n = env.n_states
          P_pi, r_pi = np.zeros((n, n)), np.zeros(n)
          for s in range(n):
              for p, s2, r, done in env.P[s][pi[s]]:
                  r_pi[s] += p * r
                  if not done:
                      P_pi[s, s2] += p
          return np.linalg.solve(np.eye(n) - gamma * P_pi, r_pi)

      env, gamma = GridWorld(slip=0.2), 0.9
      V, vi_curve = np.zeros(16), []
      for sweep in range(60):
          V = np.array([np.max(q_values(env, V, s, gamma)) for s in range(16)])
          vi_curve.append(V[0])

      pi, pi_curve = np.zeros(16, dtype=int), []
      for it in range(100):
          V = evaluate_exact(env, pi, gamma)
          pi_curve.append(V[0])
          new_pi = np.array([np.argmax(q_values(env, V, s, gamma)) for s in range(16)])
          if np.array_equal(new_pi, pi):
              break
          pi = new_pi

      print(f"VI nach 60 Sweeps: {vi_curve[-1]:.3f}, PI nach {len(pi_curve)} Iterationen: {pi_curve[-1]:.3f}")
      fig = lab.Figure(title="V(Start) während der Optimierung", xlabel="Sweep bzw. Iteration", ylabel="V(Start)")
      fig.line(vi_curve, label="Value Iteration (Sweeps)")
      fig.line(pi_curve, label="Policy Iteration (Iterationen)")
      fig.show()
    subgoals:
      - lines: [22, 26]
        label: Value Iteration mitschreiben
      - lines: [28, 35]
        label: Policy Iteration mitschreiben
      - lines: [37, 41]
        label: Beide Kurven zeigen
    after: |
      Beide landen beim selben Wert. VI nähert sich von oben an (Startwert 0 ist zu optimistisch), PI springt von unten in wenigen großen Stufen auf das Optimum. Das allgemeine Muster „bewerten ↔ verbessern“ heißt **verallgemeinerte Policy Iteration** (GPI) – es steckt in fast jedem RL-Algorithmus, auch in Actor-Critic (Modul 15).
  - type: quiz
    question: |
      Policy Iteration liefert in einer Iteration `new_pi`, das identisch mit `pi` ist. Was folgt?
    options:
      - text: "`pi` ist optimal – greedy bezüglich der eigenen Werte zu sein heißt, die Bellman-Optimalitätsgleichung zu erfüllen."
        correct: true
        why: Wenn keine Aktion besser ist als die gewählte, gilt $V^\pi(s) = \max_a Q^\pi(s,a)$ für alle $s$.
      - text: Das Verfahren steckt in einem lokalen Optimum fest.
        correct: false
        why: Bei endlichen MDPs gibt es dieses Problem nicht – Stabilität bedeutet Optimalität.
      - text: Man muss mit einer zufälligen Policy neu starten.
        correct: false
        why: Unnötig; jede Start-Policy führt zu einer optimalen Policy.
cards:
  - id: m13-c-pi-schritte
    concept: dp-policy-iteration
    variants:
      - type: quiz
        question: |
          Welche zwei Schritte wechseln sich bei Policy Iteration ab?
        options:
          - text: Policy bewerten ($V^\pi$) und greedy bezüglich $V^\pi$ verbessern.
            correct: true
            why: Bewerten und Verbessern – das Grundmuster.
          - text: Zufällig explorieren und Belohnungen mitteln.
            correct: false
            why: Das ist ein Bandit-Verfahren; PI nutzt das Modell.
          - text: Ein Maximum-Backup und einen Mittelwert-Backup.
            correct: false
            why: Value Iteration nutzt das Maximum-Backup; PI bewertet und verbessert eine explizite Policy.
      - type: quiz
        question: |
          Warum endet Policy Iteration in einem endlichen MDP immer?
        options:
          - text: Jede Iteration liefert eine strikt bessere Policy, bis keine Verbesserung mehr möglich ist – und es gibt nur endlich viele deterministische Policies.
            correct: true
            why: Ohne Wiederholung muss die Folge nach höchstens $|A|^{|S|}$ Schritten enden – in der Praxis nach sehr viel weniger.
          - text: Weil $\gamma < 1$ ist.
            correct: false
            why: "$\\gamma < 1$ sichert endliche Werte, nicht das Ende der Policy-Folge."
          - text: Weil die Schleife auf 100 Iterationen begrenzt ist.
            correct: false
            why: Die Grenze ist nur ein Sicherheitsnetz.
  - id: m13-c-pi-vergleich
    concept: dp-policy-iteration
    variants:
      - type: quiz
        question: |
          Was ist eine Iteration der Policy Iteration im Vergleich zu einem Sweep der Value Iteration?
        options:
          - text: Deutlich teurer, weil sie die Policy vollständig bewertet.
            correct: true
            why: Eine vollständige Bewertung kostet ein Gleichungssystem oder viele Sweeps.
          - text: Genauso teuer.
            correct: false
            why: Ein VI-Sweep ist nur ein Backup pro Zustand.
          - text: Billiger, weil keine Maximierung nötig ist.
            correct: false
            why: Die Verbesserung braucht ebenfalls ein argmax über alle Aktionen.
      - type: predict
        code: |
          import numpy as np
          old = np.array([1, 2, 2, 0])
          new = np.array([1, 2, 3, 0])
          print(np.array_equal(old, new), int(np.sum(old != new)))
        options: ["False 1", "True 0", "False 3", "True 1"]
        answer: "False 1"
        explanation: Ein Zustand hat die Aktion gewechselt – die Policy ist noch nicht stabil.
