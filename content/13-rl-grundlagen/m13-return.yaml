      - |
        import numpy as np
        def all_returns(rewards, gamma):
            G = np.zeros(len(rewards))
            running = 0.0
            for t in reversed(range(len(rewards))):
                running = gamma * (rewards[t] + running)
                G[t] = running
            return G
    hints:
      - "Teilziel: vom letzten Zeitschritt zum ersten laufen und den laufenden Return mitführen."
      - "Rekursion $G_t = r_t + \\gamma G_{t+1}$; nach dem Ende ist $G = 0$."
      - "`for t in reversed(range(len(rewards))):`"
      - |
        ```python
        running = rewards[t] + gamma * running
        G[t] = running
        ```
    explanation: |
      Diese Funktion brauchst du in Modul 14 für Monte-Carlo-Methoden: Dort werden Werte aus den Returns echter Episoden geschätzt.
  - type: quiz
    question: |
      Gitterwelt mit −1 pro Schritt und 0 beim Betreten des Ziels, $\gamma = 1$. Der Agent braucht 6 Schritte bis ins Ziel. Wie groß ist $G_0$?
    options:
      - text: "−5"
        correct: true
        why: Fünf Schritte kosten −1, der sechste (ins Ziel) bringt 0.
      - text: "−6"
        correct: false
        why: Der letzte Schritt ins Ziel kostet hier nichts (`goal_reward = 0`).
      - text: "0"
        correct: false
        why: Nur der letzte Schritt bringt 0, die anderen kosten.
      - text: "−4,1"
        correct: false
        why: Das wäre der Wert mit $\gamma = 0{,}9$.
cards:
  - id: m13-c-return-rechnen
    concept: mdp-return
    variants:
      - type: predict
        code: |
          gamma = 0.5
          rewards = [2, 2, 2]
          print(sum(gamma ** k * r for k, r in enumerate(rewards)))
        options: ["3.5", "6", "2.0", "3.0"]
        answer: "3.5"
        explanation: "$2 + 1 + 0{,}5 = 3{,}5$."
      - type: predict
        code: |
          gamma = 0.9
          rewards = [0, 0, 10]
          print(round(sum(gamma ** k * r for k, r in enumerate(rewards)), 2))
        options: ["8.1", "10", "9.0", "7.29"]
        answer: "8.1"
        explanation: "Die 10 kommt im Schritt $k = 2$, also $0{,}9^2 \\cdot 10 = 8{,}1$."
      - type: predict
        code: |
          gamma = 0.0
          rewards = [3, 5, 7]
          print(sum(gamma ** k * r for k, r in enumerate(rewards)))
        options: ["3.0", "15", "0.0", "7.0"]
        answer: "3.0"
        explanation: "Mit $\\gamma = 0$ zählt nur die erste Belohnung ($0^0 = 1$ in Python)."
  - id: m13-c-return-rekursion
    concept: mdp-return-rekursiv
    variants:
      - type: quiz
        question: |
          $r_3 = 4$, $G_4 = 10$, $\gamma = 0{,}5$. Wie groß ist $G_3$?
        options:
          - text: "9"
            correct: true
            why: "$G_3 = r_3 + \\gamma G_4 = 4 + 5$."
          - text: "7"
            correct: false
            why: "Das wäre $0{,}5 \\cdot (4 + 10)$ – $\\gamma$ wirkt nur auf $G_4$."
          - text: "14"
            correct: false
            why: Der Diskont fehlt.
      - type: quiz
        question: |
          Warum berechnet man alle $G_t$ einer Episode rückwärts?
        options:
          - text: Weil $G_t$ von $G_{t+1}$ abhängt – rückwärts reicht ein Durchlauf.
            correct: true
            why: Vorwärts müsste man für jedes $t$ die ganze restliche Summe neu bilden.
          - text: Weil die letzten Belohnungen am wichtigsten sind.
            correct: false
            why: Mit $\gamma < 1$ zählen sie für $G_0$ sogar am wenigsten.
          - text: Weil Python Listen nur rückwärts effizient durchlaufen kann.
            correct: false
            why: Die Richtung kommt aus der Rekursion, nicht aus Python.
  - id: m13-c-horizont
    concept: mdp-return
    variants:
      - type: quiz
        question: |
          Konstante Belohnung −1 pro Schritt, unendlich lang, $\gamma = 0{,}9$. Wie groß ist der Return?
        options:
          - text: "−10"
            correct: true
            why: "$-1/(1 - 0{,}9) = -10$ (geometrische Reihe)."
          - text: "−∞"
            correct: false
            why: Mit $\gamma < 1$ konvergiert die Summe.
          - text: "−0,9"
            correct: false
            why: Das ist nur der zweite Summand.
      - type: quiz
        question: |
          Welcher effektive Horizont gehört zu $\gamma = 0{,}98$?
        options:
          - text: Etwa 50 Schritte.
            correct: true
            why: "$1/(1 - 0{,}98) = 50$."
          - text: Etwa 98 Schritte.
            correct: false
            why: Der Horizont ist $1/(1-\gamma)$, nicht $100\gamma$.
          - text: Etwa 2 Schritte.
            correct: false
            why: Das wäre $1/(1-\gamma)$ für $\gamma = 0{,}5$.
