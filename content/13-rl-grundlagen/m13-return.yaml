id: m13-return
title: Return und Diskont
minutes: 9
goals:
  - Den diskontierten Return einer Belohnungsfolge berechnen
  - Den Diskontfaktor γ als effektiven Planungshorizont deuten
  - Alle Returns einer Episode rückwärts in einem Durchlauf berechnen
concepts: [mdp-return, mdp-return-rekursiv]
steps:
  - type: text
    body: |
      ## Was zählt, ist die Summe

      Der Agent maximiert nicht die nächste Belohnung, sondern den **Return** – die (gewichtete) Summe aller künftigen Belohnungen ab Zeitschritt $t$:

      $$G_t = r_t + \gamma\, r_{t+1} + \gamma^2 r_{t+2} + \dots = \sum_{k \ge 0} \gamma^k\, r_{t+k}$$

      Der **Diskontfaktor** (discount) $\gamma \in [0, 1]$ macht spätere Belohnungen weniger wert. $\gamma = 0$: nur das Jetzt zählt. $\gamma \to 1$: weit vorausschauend.

      Konvention für alle RL-Module: $r_t$ ist die Belohnung für die Aktion im Schritt $t$, also $G_t = r_t + \gamma\, G_{t+1}$.
  - type: example
    code: |
      import numpy as np

      rewards = [-1, -1, -1, -1, -1, 0]     # Episode aus der Gitterwelt
      gamma = 0.9

      G = 0.0
      for k, r in enumerate(rewards):
          G += gamma ** k * r
      print(round(G, 4))

      weights = gamma ** np.arange(len(rewards))   # [1, 0.9, 0.81, ...]
      print(round(float(weights @ rewards), 4))
    subgoals:
      - lines: [3, 4]
        label: Belohnungen und γ festlegen
      - lines: [6, 9]
        label: Mit Schleife aufsummieren
      - lines: [11, 12]
        label: Vektorisiert als Skalarprodukt
    after: |
      Ohne Diskont wäre der Return −5. Mit $\gamma = 0{,}9$ zählt jeder spätere Schritt weniger: $-(1 + 0{,}9 + 0{,}81 + 0{,}729 + 0{,}6561) \approx -4{,}095$.
  - type: predict
    code: |
      rewards = [-1, -1, -1, 10]
      gamma = 0.5
      G = 0.0
      for k, r in enumerate(rewards):
          G += gamma ** k * r
      print(G)
    options: ["-0.5", "7.0", "-1.75", "1.25"]
    answer: "-0.5"
    explanation: |
      $-1 - 0{,}5 - 0{,}25 + 10 \cdot 0{,}125 = -1{,}75 + 1{,}25 = -0{,}5$. Bei kleinem $\gamma$ ist die späte große Belohnung kaum noch etwas wert – 7,0 wäre der Return ohne Diskont.
  - type: trace
    intro: |
      Rekursiv gilt $G_t = r_t + \gamma\, G_{t+1}$. Rückwärts über die Episode laufen spart alle Potenzen:
    code: |
      rewards = [1.0, 2.0, 3.0]
      G = 0.0
      for r in reversed(rewards):
          G = r + 0.5 * G
      print(G)
    questions:
      - line: 4
        hit: 1
        var: G
        answer: "3.0"
        prompt: Welchen Wert hat `G` nach dem ersten Durchlauf (letzte Belohnung)?
      - line: 4
        hit: 2
        var: G
        answer: "3.5"
    after: |
      Nach dem letzten Durchlauf ist `G` $= 1 + 0{,}5 \cdot 3{,}5 = 2{,}75 = G_0$. Nach dem Ende der Episode gibt es keine Belohnungen mehr, deshalb startet die Rekursion mit 0.
  - type: explain
    question: |
      Warum verwendet man meist $\gamma < 1$, z. B. $0{,}99$?
    options:
      - text: Bei Aufgaben ohne festes Ende bleibt die Summe endlich, und frühere Belohnungen werden bevorzugt; der effektive Horizont ist etwa $1/(1-\gamma)$ Schritte.
        correct: true
        why: Bei konstanter Belohnung $r$ ist $G = r/(1-\gamma)$. Mit $\gamma = 0{,}99$ blickt der Agent grob 100 Schritte voraus.
      - text: Damit alle Returns negativ werden.
        correct: false
        why: Das Vorzeichen hängt von den Belohnungen ab, nicht von $\gamma$.
      - text: Weil Belohnungen in der Zukunft unsicher sind und $\gamma$ diese Unsicherheit exakt modelliert.
        correct: false
        why: Man kann $\gamma$ so deuten, aber es ist eine Modellierungsentscheidung, kein exaktes Unsicherheitsmodell.
      - text: Weil $\gamma = 1$ mathematisch verboten ist.
        correct: false
        why: Bei Episoden, die sicher enden, ist $\gamma = 1$ erlaubt und üblich.
  - type: example
    intro: |
      Wie schnell verblassen spätere Belohnungen? Gewicht $\gamma^k$ über die Schritte $k$:
    code: |
      import numpy as np
      import lab

      k = np.arange(100)
      fig = lab.Figure(title="Gewicht späterer Belohnungen", xlabel="Schritte in der Zukunft k", ylabel="γ^k")
      for gamma in [0.5, 0.9, 0.99]:
          fig.line(gamma ** k, x=k, label=f"γ = {gamma}")
          print(f"γ = {gamma}: Horizont 1/(1-γ) ≈ {1 / (1 - gamma):.0f} Schritte")
      fig.show()
    after: |
      Mit $\gamma = 0{,}5$ ist eine Belohnung 10 Schritte später nur noch 0,1 % wert. Für eine Robotik-Aufgabe mit 50 Hz und 2 s Planungshorizont (100 Schritte) braucht man $\gamma \approx 0{,}99$.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `all_returns(rewards, gamma)`, die für **jeden** Zeitschritt $t$ den Return $G_t$ liefert (NumPy-Array, gleiche Länge wie `rewards`). Laufe dazu rückwärts.
    starter: |
      import numpy as np

      def all_returns(rewards, gamma):
          G = np.zeros(len(rewards))
          running = 0.0
          # rückwärts über t
          return G
    solution: |
      import numpy as np

      def all_returns(rewards, gamma):
          G = np.zeros(len(rewards))
          running = 0.0
          for t in reversed(range(len(rewards))):
              running = rewards[t] + gamma * running
              G[t] = running
          return G
    tests:
      - name: Kurzes Beispiel
        code: |
          import numpy as np
          got = all_returns([1.0, 2.0, 3.0], 0.5)
          assert close(got, [2.75, 3.5, 3.0]), f"Erwartet [2.75, 3.5, 3.0], bekommen {got}"
      - name: Gitterwelt-Episode mit γ = 1
        code: |
          import numpy as np
          got = all_returns([-1, -1, -1, 0], 1.0)
          assert close(got, [-3, -2, -1, 0]), f"Erwartet [-3, -2, -1, 0], bekommen {got}"
      - name: Vergleich mit direkter Summe
        code: |
          import numpy as np
          rng = np.random.default_rng(0)
          r = rng.normal(size=12)
          ref = [sum(0.9 ** k * r[t + k] for k in range(12 - t)) for t in range(12)]
          got = all_returns(list(r), 0.9)
          assert close(got, ref), f"G_0 erwartet {ref[0]:.4f}, bekommen {got[0]:.4f}"
    mutants:
      - |
