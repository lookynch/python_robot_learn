id: m07-gradientenabstieg
title: Gradientenabstieg
minutes: 9
goals:
  - Den Gradientenabstieg $p \leftarrow p - \eta \nabla f(p)$ implementieren
  - Kostenverlauf und Pfad eines Optimierers visualisieren
  - Grenzen erkennen – ein verschwindender Gradient heißt nicht automatisch Minimum
concepts: [gradientenabstieg, gradient-numerisch]
steps:
  - type: text
    body: |
      ## Bergab in kleinen Schritten

      Der negative Gradient zeigt bergab. Also: ein kleines Stück in diese Richtung gehen, neu messen, wiederholen.

      $$
      p_{k+1} = p_k - \eta\, \nabla f(p_k)
      $$

      $\eta$ (eta) heißt **Lernrate** (learning rate) oder Schrittweite. Kommt dir die Form bekannt vor? Es ist der **explizite Euler** aus Modul 6 für die ODE $\dot p = -\nabla f(p)$ mit $dt = \eta$.

      Gradientenabstieg (gradient descent) ist der Kern fast jedes Lernverfahrens in diesem Kurs: Regression, neuronale Netze, Policy-Gradient-RL, World-Model-Training.
  - type: example
    code: |
      import numpy as np
      import lab

      def f(p):
          return (p[0] - 1)**2 + 2 * (p[1] + 0.5)**2

      def grad(p):
          return np.array([2 * (p[0] - 1), 4 * (p[1] + 0.5)])

      lr = 0.1
      p = np.array([-1.0, 1.0])
      path = [p]
      for k in range(40):
          p = p - lr * grad(p)
          path.append(p)
      costs = [f(q) for q in path]
      print(f"nach 40 Schritten: p = ({p[0]:.4f}, {p[1]:.4f}), f = {costs[-1]:.1e}")

      lab.plot(costs, title="Kosten", xlabel="Schritt", ylabel="f(p)", logy=True)
      s = lab.Scene(title="Pfad in der (x, y)-Ebene", bounds=[-1.5, 2.0, -1.5, 1.5], fps=10)
      s.line(path, color="muted", static=True)
      s.circle(1, -0.5, 0.06, color="good", fill="good", static=True)
      for k, q in enumerate(path):
          if k > 0:
              s.next_frame()
          s.circle(q[0], q[1], 0.05, color="accent", fill="accent")
          s.caption(f"Schritt {k}: f = {costs[k]:.3f}")
      s.show()
    subgoals:
      - lines: [4, 8]
        label: Kosten und Gradient definieren
      - lines: [10, 15]
        label: Abstiegsschleife
      - lines: [16, 17]
        label: Kosten auswerten
      - lines: [19, 27]
        label: Verlauf und Pfad zeigen
    after: |
      Im logarithmischen Plot fallen die Kosten auf einer Geraden – die Konvergenz ist **linear** (der Fehler schrumpft pro Schritt um einen festen Faktor). Der Pfad ist gekrümmt: Zuerst wird $y$ (steiler) korrigiert, dann $x$. Statt `grad` könntest du auch `num_grad(f, p)` aus der letzten Lektion einsetzen.
  - type: explain
    question: |
      Warum wird der Gradient **abgezogen** und nicht addiert?
    options:
      - text: Der Gradient zeigt in die Richtung des steilsten **Anstiegs**; wir wollen $f$ verkleinern.
        correct: true
        why: Für kleines $\eta$ gilt $f(p - \eta \nabla f) \approx f(p) - \eta\,\|\nabla f\|^2 < f(p)$.
      - text: Weil Gradienten immer positiv sind.
        correct: false
        why: Die Komponenten können jedes Vorzeichen haben; im Beispiel ist der Gradient am Start $[-4, 6]$.
      - text: Damit die Lernrate positiv sein darf.
        correct: false
        why: Das ist eine Folge, nicht der Grund. Der Grund ist die Richtung des Gradienten.
  - type: predict
    code: |
      def grad(x):
          return 2 * x       # f(x) = x²

      x = 3.0
      lr = 0.1
      x = x - lr * grad(x)
      print(round(x, 4))
    options: ["2.4", "3.6", "2.7", "0.6"]
    answer: "2.4"
    explanation: |
      $f'(3) = 6$, Schritt $= 0{,}1 \cdot 6 = 0{,}6$, also $3 - 0{,}6 = 2{,}4$. `3.6` wäre ein Schritt bergauf, `2.7` vergisst den Faktor 2 der Ableitung.
  - type: trace
    code: |
      x = 0.0
      lr = 0.25
      for k in range(3):
          g = 2 * (x - 2)
          x = x - lr * g
      print(x)
    questions:
      - line: 5
        hit: 2
        var: x
        prompt: Welchen Wert hat `x` nach dem **zweiten** Durchlauf von Zeile 5?
        answer: "1.5"
      - line: 4
        hit: 3
        var: g
        prompt: Welchen Wert hat `g` nach dem **dritten** Durchlauf von Zeile 4?
        answer: "-1.0"
    after: |
      $f = (x-2)^2$, Minimum bei 2. Jeder Schritt halbiert den Abstand: 0 → 1 → 1,5 → 1,75. Der Gradient wird kleiner, je näher man kommt – deshalb werden auch die Schritte von selbst kleiner.
  - type: parsons
    fading: true
    prompt: |
      Baue den Gradientenabstieg für $f = (x-1)^2 + 2(y+0{,}5)^2$ mit Lernrate 0,1 und 100 Schritten. Ausgabe: `1.0 -0.5`.
    lines:
      - "import numpy as np"
      - "def grad(p):"
      - "    return np.array([2 * (p[0] - 1), 4 * (p[1] + 0.5)])"
      - "p = np.array([0.0, 0.0])"
      - "for k in range(100):"
      - "    p = p - 0.1 * grad(p)"
      - "print(round(p[0], 3), round(p[1], 3))"
    distractors:
      - "    p = p + 0.1 * grad(p)"
      - "    p = p - 0.1 * grad"
    expect_output: "1.0 -0.5"
  - type: exercise
    mode: make
    prompt: |
      Schreibe `gradient_descent(grad, x0, lr, n_steps)`. `grad` ist eine Funktion, die den Gradienten liefert. Rückgabe: alle Iterierten als Array der Form `(n_steps + 1, len(x0))`, Zeile 0 ist der Startpunkt.
    starter: |
      import numpy as np

      def gradient_descent(grad, x0, lr, n_steps):
          x = np.array(x0, dtype=float)
          path = [x]
          # n_steps Abstiegsschritte
          return np.array(path)
    solution: |
      import numpy as np

      def gradient_descent(grad, x0, lr, n_steps):
          x = np.array(x0, dtype=float)
          path = [x]
          for k in range(n_steps):
              x = x - lr * grad(x)
              path.append(x)
          return np.array(path)
    tests:
      - name: Eindimensionale Parabel
        code: |
          def g(x):
              return 2 * (x - 2)
          path = gradient_descent(g, [0.0], 0.25, 3)
          assert np.shape(path) == (4, 1), f"Erwartet Form (4, 1), bekommen {np.shape(path)}"
          assert close(path[:, 0], [0.0, 1.0, 1.5, 1.75]), f"Erwartet 0, 1, 1.5, 1.75, bekommen {path[:, 0]}"
      - name: Zwei Variablen
        code: |
          def g(p):
              return np.array([2 * (p[0] - 1), 4 * (p[1] + 0.5)])
          path = gradient_descent(g, [0.0, 0.0], 0.1, 100)
          assert np.shape(path) == (101, 2), f"Erwartet Form (101, 2), bekommen {np.shape(path)}"
          assert close(path[-1], [1.0, -0.5], tol=1e-6), f"Erwartet Minimum (1, -0.5), bekommen {path[-1]}"
      - name: Lernrate wird benutzt
        code: |
          def g(x):
              return 2 * x
          path = gradient_descent(g, [1.0], 0.1, 1)
          assert close(path[1, 0], 0.8), f"Mit lr = 0.1 ab x = 1 erwartet 0.8, bekommen {path[1, 0]}"
    mutants:
      - |
