      - |
        import numpy as np

        def gradient_descent(grad, x0, lr, n_steps):
            x = np.array(x0, dtype=float)
            path = [x]
            for k in range(n_steps):
                x = x - grad(x)
                path.append(x)
            return np.array(path)
    hints:
      - "Teilziel: Abstiegsschleife – in jedem Schritt Gradient am aktuellen Punkt, Schritt bergab, Punkt speichern."
      - "Ein Schritt ist $x \\leftarrow x - \\eta \\nabla f(x)$."
      - |
        ```python
        for k in range(n_steps):
            x = ...
            path.append(x)
        ```
      - "`x = x - lr * grad(x)`"
    explanation: |
      Vergleiche mit `euler` aus Modul 6: Es ist dieselbe Schleife mit `f(x) = -grad(x)` und `dt = lr`.
  - type: quiz
    question: |
      Der Gradientenabstieg bleibt bei einem Punkt stehen, an dem $\nabla f = 0$ ist. Was weißt du dann sicher?
    options:
      - text: Es ist ein stationärer Punkt – vielleicht ein (womöglich nur lokales) Minimum, vielleicht aber auch ein Sattelpunkt.
        correct: true
        why: Der Gradient sagt nur „hier ist es flach“. Bei $f = x^2 - y^2$ ist der Ursprung ein Sattelpunkt; startet man genau auf der $x$-Achse, landet man dort.
      - text: Es ist das globale Minimum.
        correct: false
        why: Gradientenabstieg sieht nur die lokale Steigung. Bei mehreren Tälern hängt das Ergebnis vom Startpunkt ab.
      - text: Die Lernrate war zu groß.
        correct: false
        why: Eine zu große Lernrate führt eher zu Oszillation oder Divergenz, nicht zum Stillstand bei $\nabla f = 0$.
cards:
  - id: m07-c-gd-schritt
    concept: gradientenabstieg
    variants:
      - type: predict
        code: |
          x = 5.0
          lr = 0.2
          x = x - lr * 2 * x     # Gradient von x²
          print(round(x, 4))
        options: ["3.0", "7.0", "4.0", "2.0"]
        answer: "3.0"
        explanation: "$5 - 0{,}2 \\cdot 10 = 3$."
      - type: predict
        code: |
          import numpy as np

          p = np.array([2.0, -1.0])
          grad = np.array([4.0, -2.0])
          p = p - 0.5 * grad
          print(p[0], p[1])
        options: ["0.0 0.0", "4.0 -2.0", "0.0 -2.0", "2.0 -1.0"]
        answer: "0.0 0.0"
        explanation: "$[2, -1] - 0{,}5 \\cdot [4, -2] = [0, 0]$ – für $f = \\|p\\|^2$ mit $\\eta = 0{,}5$ landet man in einem Schritt im Minimum."
      - type: predict
        code: |
          x = -2.0
          lr = 0.25
          for k in range(2):
              x = x - lr * 2 * (x - 2)
          print(x)
        options: ["1.0", "0.0", "-3.0", "2.0"]
        answer: "1.0"
        explanation: "Minimum bei 2; jeder Schritt halbiert den Abstand: −2 → 0 → 1."
  - id: m07-c-gd-vorzeichen
    concept: gradientenabstieg
    variants:
      - type: quiz
        question: Welche Zeile ist ein Gradientenabstiegs-Schritt?
        options:
          - text: "`p = p - lr * grad(p)`"
            correct: true
            why: Entgegen dem Gradienten, skaliert mit der Lernrate.
          - text: "`p = p + lr * grad(p)`"
            correct: false
            why: Das ist Gradientenaufstieg – $f$ wird größer.
          - text: "`p = lr * grad(p)`"
            correct: false
            why: Der alte Punkt fehlt; das Ergebnis ist nur der Schritt, nicht die neue Position.
      - type: quiz
        question: Gradientenabstieg mit Lernrate $\eta$ ist welches Verfahren aus Modul 6?
        options:
          - text: expliziter Euler für $\dot p = -\nabla f(p)$ mit $dt = \eta$
            correct: true
            why: "$p_{k+1} = p_k + dt \\cdot (-\\nabla f(p_k))$."
          - text: semi-impliziter Euler
            correct: false
            why: Es gibt keine Geschwindigkeit, die zuerst aktualisiert wird; der Zustand ist nur $p$.
          - text: eine exakte Lösung der ODE
            correct: false
            why: Es ist ein Näherungsverfahren mit Schrittweite $\eta$.
