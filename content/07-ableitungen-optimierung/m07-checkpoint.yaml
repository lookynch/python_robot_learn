  - type: exercise
    mode: make
    prompt: |
      Schreibe `descend(f, x0, lr, n_steps, h=1e-5)`: Gradientenabstieg für eine Funktion `f` mehrerer Variablen, deren Gradient du in jedem Schritt **numerisch** (zentrale Differenz, Komponente für Komponente) berechnest. Rückgabe: der Endpunkt als Array.
    starter: |
      import numpy as np

      def descend(f, x0, lr, n_steps, h=1e-5):
          x = np.array(x0, dtype=float)
          for k in range(n_steps):
              g = np.zeros(len(x))
              # g numerisch füllen, dann Abstiegsschritt
          return x
    solution: |
      import numpy as np

      def descend(f, x0, lr, n_steps, h=1e-5):
          x = np.array(x0, dtype=float)
          for k in range(n_steps):
              g = np.zeros(len(x))
              for i in range(len(x)):
                  e = np.zeros(len(x))
                  e[i] = h
                  g[i] = (f(x + e) - f(x - e)) / (2 * h)
              x = x - lr * g
          return x
    tests:
      - name: Verschobene Parabel
        code: |
          def f(p):
              return (p[0] - 1)**2 + 2 * (p[1] + 0.5)**2
          x = descend(f, [0.0, 0.0], 0.1, 100)
          assert close(x, [1.0, -0.5], tol=1e-4), f"Minimum bei (1, -0.5) erwartet, bekommen {np.round(x, 5)}"
      - name: Gekoppelte Variablen
        code: |
          def f(p):
              return (p[0] + p[1] - 1)**2 + (p[0] - p[1])**2
          x = descend(f, [2.0, -3.0], 0.1, 200)
          assert close(x, [0.5, 0.5], tol=1e-4), f"Minimum bei (0.5, 0.5) erwartet, bekommen {np.round(x, 5)}"
      - name: Ein Schritt in 2D
        code: |
          def f(p):
              return p[0] * p[1]
          x = descend(f, [1.0, 2.0], 0.1, 1)
          assert close(x, [0.8, 1.9], tol=1e-6), f"Gradient von xy bei (1, 2) ist (2, 1); erwartet (0.8, 1.9), bekommen {np.round(x, 5)}"
      - name: Ein Schritt
        code: |
          def f(p):
              return p[0]**2
          x = descend(f, [1.0], 0.25, 1)
          assert close(x, [0.5], tol=1e-6), f"Ein Schritt mit lr = 0.25 ab 1 auf x² ergibt 0.5, bekommen {x}"
