  - type: quiz
    question: |
      Für die **Vorwärts**differenz in `float64` (Werte der Größenordnung 1): Welches `h` liefert ungefähr den kleinsten Gesamtfehler?
    options:
      - text: "`1e-8`"
        correct: true
        why: Etwa $\sqrt{\varepsilon}$ – dort sind Verfahrensfehler ($\sim h$) und Rundungsfehler ($\sim \varepsilon/h$) gleich groß.
      - text: "`1e-16`"
        correct: false
        why: Dann ist $x + h$ nicht mehr von $x$ unterscheidbar; die Differenz ist reines Rauschen oder 0.
      - text: "`1e-2`"
        correct: false
        why: Der Verfahrensfehler $\sim h$ ist hier noch groß.
