    code: |
      def f(x):
          return 2 * x**2

      h = 0.1
      print(round((f(1 + h) - f(1)) / h, 4))
    options: ["4.2", "4.0", "4.4", "0.42"]
    answer: "4.2"
    explanation: |
      Vorwärtsdifferenz: $(2 \cdot 1{,}21 - 2)/0{,}1 = 4{,}2$. Exakt wäre $f'(1) = 4$; der Fehler $\tfrac h2 f'' = 0{,}05 \cdot 4 = 0{,}2$.
  - type: quiz
    question: |
      Du verkleinerst `h` von `1e-2` auf `1e-3` (weit weg vom Rundungsbereich). Wie ändert sich der Fehler der **zentralen** Differenz?
    options:
      - text: etwa um den Faktor 100 kleiner
        correct: true
        why: Zentrale Differenz ist 2. Ordnung, Fehler $\sim h^2$.
      - text: etwa um den Faktor 10 kleiner
        correct: false
        why: Das gilt für die Vorwärtsdifferenz (1. Ordnung).
      - text: gar nicht
        correct: false
        why: Solange Rundungsfehler keine Rolle spielen, sinkt der Fehler mit $h$.
