  - type: quiz
    question: |
      $L = (w x - y)^2$. Welcher Ausdruck ist $\dfrac{\partial L}{\partial w}$?
    options:
      - text: $2(wx - y)\cdot x$
        correct: true
        why: Äußere Ableitung $2e$ mal innere Ableitung $\partial e / \partial w = x$.
      - text: $2(wx - y)$
        correct: false
        why: Die innere Ableitung $x$ fehlt.
      - text: $2(y - wx)\cdot x$
        correct: false
        why: Falsches Vorzeichen – ein Abstieg damit liefe bergauf.
      - text: $(wx - y)\cdot x$
        correct: false
        why: Der Faktor 2 aus der Ableitung von $e^2$ fehlt.
  - type: quiz
    question: |
      $f(x, y) = 2x^2 + 0{,}5 y^2$ (Krümmungen 4 und 1). Welche Lernrate ist die größte, bei der der Gradientenabstieg noch sicher konvergiert?
    options:
      - text: knapp unter $0{,}5$
        correct: true
        why: "Die größte Krümmung 4 begrenzt: $\\eta < 2/4 = 0{,}5$."
      - text: knapp unter $2$
        correct: false
        why: Das passt nur zur flachen Richtung; in $x$ wäre der Faktor $1 - 2 \cdot 4 = -7$.
      - text: knapp unter $1{,}25$
        correct: false
        why: Das ist der Mittelwert der beiden Einzelgrenzen 0,5 und 2. Er hilft nicht – jede Richtung muss für sich stabil sein, in $x$ wäre der Faktor $1 - 1{,}25 \cdot 4 = -4$.
