      - "Teilziel: Schleife über alle Komponenten – je einen Einheitsvektor mal h bauen."
      - "Für Komponente `i`: `e` mit Nullen anlegen, `e[i] = h`, dann zentrale Differenz mit `p + e` und `p - e`."
      - |
        ```python
        e = np.zeros(len(p))
        e[i] = h
        g[i] = ...
        ```
      - "`g[i] = (f(p + e) - f(p - e)) / (2 * h)`"
  - type: quiz
    question: |
      Ein neuronales Netz hat $10^6$ Gewichte. Wie viele Auswertungen der Kostenfunktion braucht **ein** numerischer Gradient mit zentraler Differenz?
    options:
      - text: $2 \cdot 10^6$
        correct: true
        why: Pro Komponente zwei Auswertungen. Deshalb trainiert man Netze nicht so, sondern mit der Kettenregel (Backpropagation), die den ganzen Gradienten für etwa den Aufwand weniger Auswertungen liefert.
      - text: "2"
        correct: false
        why: Zwei Auswertungen liefern nur **eine** Richtungsableitung, nicht alle $10^6$ Komponenten.
      - text: $10^{12}$
        correct: false
        why: Es gibt keine paarweisen Kombinationen; jede Komponente wird einzeln gestört.
cards:
  - id: m07-c-gradient-werte
    concept: gradient-numerisch
    variants:
      - type: predict
        code: |
          import numpy as np

          def f(p):
              return 3 * p[0] + p[1]**2

          p = np.array([1.0, 2.0])
          h = 1e-4
          g0 = (f(p + [h, 0]) - f(p - [h, 0])) / (2 * h)
          g1 = (f(p + [0, h]) - f(p - [0, h])) / (2 * h)
          print(round(g0, 4), round(g1, 4))
        options: ["3.0 4.0", "4.0 3.0", "3.0 2.0", "5.0 5.0"]
        answer: "3.0 4.0"
        explanation: "$\\partial f/\\partial x = 3$, $\\partial f/\\partial y = 2y = 4$."
      - type: predict
        code: |
          import numpy as np

          def f(p):
              return p[0] * p[1]

          p = np.array([5.0, -1.0])
          h = 1e-4
          g0 = (f(p + [h, 0]) - f(p - [h, 0])) / (2 * h)
          g1 = (f(p + [0, h]) - f(p - [0, h])) / (2 * h)
          print(round(g0, 4), round(g1, 4))
        options: ["-1.0 5.0", "5.0 -1.0", "-5.0 -5.0", "4.0 4.0"]
        answer: "-1.0 5.0"
        explanation: "$\\partial(xy)/\\partial x = y = -1$, $\\partial(xy)/\\partial y = x = 5$."
  - id: m07-c-gradient-richtung
    concept: gradient-numerisch
    variants:
      - type: quiz
        question: In welche Richtung zeigt $\nabla f(p)$?
        options:
          - text: in die Richtung des steilsten Anstiegs von $f$
            correct: true
            why: Für einen Einheitsvektor $d$ ist die Steigung $\nabla f \cdot d$, maximal für $d \parallel \nabla f$.
          - text: immer direkt zum Minimum
            correct: false
            why: Nur bei kreisrunden Höhenlinien. Bei länglichen Tälern zeigt $-\nabla f$ schräg daran vorbei.
          - text: entlang der Höhenlinie
            correct: false
            why: Entlang der Höhenlinie ändert sich $f$ nicht; der Gradient steht senkrecht darauf.
      - type: quiz
        question: Wie viele Funktionsauswertungen braucht der zentrale numerische Gradient einer Funktion von 7 Variablen?
        options:
          - text: "14"
            correct: true
            why: Zwei pro Variable.
          - text: "7"
            correct: false
            why: Zentral braucht jede Variable zwei Auswertungen ($p \pm h e_i$). Mit Vorwärtsdifferenzen wären es 8 (eine pro Variable plus $f(p)$).
          - text: "2"
            correct: false
            why: Damit bekommt man nur eine Richtungsableitung.
