  - type: exercise
    mode: make
    prompt: |
      Schreibe `num_grad(f, p, h=1e-5)` für beliebig viele Variablen (zentrale Differenz). `p` kann eine Liste oder ein Array sein; die Rückgabe ist ein Array derselben Länge.
    starter: |
      import numpy as np

      def num_grad(f, p, h=1e-5):
          p = np.array(p, dtype=float)
          g = np.zeros(len(p))
          for i in range(len(p)):
              # Komponente i um +h und -h verschieben
              pass
          return g
    solution: |
      import numpy as np

      def num_grad(f, p, h=1e-5):
          p = np.array(p, dtype=float)
          g = np.zeros(len(p))
          for i in range(len(p)):
              e = np.zeros(len(p))
              e[i] = h
              g[i] = (f(p + e) - f(p - e)) / (2 * h)
          return g
    tests:
      - name: Quadratsumme in 3D
        code: |
          def sq(p):
              return np.sum(p**2)
          g = num_grad(sq, [1.0, -2.0, 0.5])
          assert close(g, [2.0, -4.0, 1.0], tol=1e-6), f"Gradient von Σp² ist 2p = [2, -4, 1], bekommen {g}"
      - name: Gekoppelte Variablen
        code: |
          def fxy(p):
              return p[0] * p[1] + p[1]**2
          g = num_grad(fxy, [3.0, 2.0])
          assert close(g, [2.0, 7.0], tol=1e-6), f"Für xy + y² bei (3, 2) erwartet [2, 7], bekommen {g}"
      - name: Nicht-polynomiell
        code: |
          def fse(p):
              return np.sin(p[0]) * np.exp(p[1])
          p = [0.7, -0.3]
          expected = [np.cos(0.7) * np.exp(-0.3), np.sin(0.7) * np.exp(-0.3)]
          g = num_grad(fse, p)
          assert close(g, expected, tol=1e-8), f"Erwartet {np.round(expected, 8)}, bekommen {np.round(g, 8)}"
