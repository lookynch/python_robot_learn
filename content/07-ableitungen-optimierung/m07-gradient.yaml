id: m07-gradient
title: Der Gradient
minutes: 9
goals:
  - Partielle Ableitungen numerisch mit Einheitsvektoren berechnen
  - Den Gradienten als Richtung des steilsten Anstiegs deuten und zeichnen
  - Den Aufwand des numerischen Gradienten abschätzen
concepts: [gradient-numerisch, zentraldifferenz]
steps:
  - type: text
    body: |
      ## Viele Eingaben, eine Zahl

      Kostenfunktionen hängen fast immer von mehreren Größen ab: zwei Gelenkwinkeln, zehn Aktionen, einer Million Netzgewichten. Der **Gradient** sammelt alle partiellen Ableitungen in einem Vektor:

      $$
      \nabla f(p) = \left[\frac{\partial f}{\partial p_1}, \dots, \frac{\partial f}{\partial p_n}\right]
      $$

      Er zeigt in die Richtung des **steilsten Anstiegs**, seine Länge ist die Steigung in dieser Richtung, und er steht senkrecht auf den Höhenlinien.

      Numerisch: Für jede Komponente $i$ nur $p_i$ um $\pm h$ verschieben, alle anderen festhalten. Dafür addiert man $h \cdot e_i$ – den $i$-ten Einheitsvektor mal $h$.
  - type: example
    code: |
      import numpy as np

      def f(p):
          x, y = p
          return (x - 1)**2 + 2 * (y + 0.5)**2

      def num_grad(f, p, h=1e-5):
          g = np.zeros(len(p))
          for i in range(len(p)):
              e = np.zeros(len(p))
              e[i] = h
              g[i] = (f(p + e) - f(p - e)) / (2 * h)
          return g

      p = np.array([0.0, 0.0])
      g_num = num_grad(f, p)
      g_ana = np.array([2 * (p[0] - 1), 4 * (p[1] + 0.5)])
      print(f"numerisch:  [{g_num[0]:.6f}, {g_num[1]:.6f}]")
      print(f"analytisch: [{g_ana[0]:.6f}, {g_ana[1]:.6f}]")
    subgoals:
      - lines: [3, 5]
        label: Funktion mehrerer Variablen definieren
      - lines: [7, 9]
        label: Schleife über alle Komponenten
      - lines: [10, 11]
        label: Einheitsvektor mal h bauen
      - lines: [12, 13]
        label: Zentrale Differenz je Komponente
      - lines: [15, 19]
        label: Mit analytischem Gradienten vergleichen
    after: |
      Analytisch ist $\nabla f = [2(x-1),\ 4(y+0{,}5)]$, bei $(0, 0)$ also $[-2, 2]$. Der numerische Gradient stimmt auf 6 Stellen überein. Ein solcher Vergleich heißt **Gradient-Check** – du wirst ihn in Modul 12 nutzen, um handgeschriebene Ableitungen zu prüfen.
  - type: explain
    question: |
      Warum wird in jedem Durchlauf ein neues `e = np.zeros(len(p))` angelegt, bevor `e[i] = h` gesetzt wird?
    options:
      - text: Damit immer nur **eine** Komponente verschoben wird; sonst bliebe das `h` aus früheren Durchläufen stehen.
        correct: true
        why: Eine partielle Ableitung hält alle anderen Variablen fest. Ohne Zurücksetzen wäre im zweiten Durchlauf `e = [h, h]` – eine schräge Richtungsableitung.
      - text: Weil NumPy-Arrays nach einem Zugriff gelöscht werden.
        correct: false
        why: Arrays bleiben bestehen, bis man sie überschreibt. Genau deshalb muss `e` neu angelegt werden.
      - text: Damit `p` nicht verändert wird.
        correct: false
        why: "`p + e` erzeugt ohnehin ein neues Array; `p` bleibt unverändert. Es geht um `e` selbst."
  - type: predict
    code: |
      import numpy as np

      def f(p):
          return p[0]**2 * p[1]

      def num_grad(f, p, h=1e-5):
          g = np.zeros(len(p))
          for i in range(len(p)):
              e = np.zeros(len(p))
              e[i] = h
              g[i] = (f(p + e) - f(p - e)) / (2 * h)
          return g

      g = num_grad(f, np.array([2.0, 3.0]))
      print(round(g[0], 4), round(g[1], 4))
    options: ["12.0 4.0", "4.0 12.0", "6.0 4.0", "12.0 2.0"]
    answer: "12.0 4.0"
    explanation: |
      $f = x^2 y$: $\partial f/\partial x = 2xy = 12$, $\partial f/\partial y = x^2 = 4$. Die Reihenfolge der Einträge folgt der Reihenfolge der Variablen in `p`.
  - type: example
    intro: |
      Zeichnen wir den **negativen** Gradienten an vielen Punkten – das ist die Richtung, in die es am steilsten bergab geht.
    code: |
      import numpy as np
      import lab

      def grad(x, y):
          return np.array([2 * (x - 1), 4 * (y + 0.5)])

      s = lab.Scene(title="−∇f und Höhenlinien von f", bounds=[-1.5, 3.5, -2.5, 1.5])
      t = np.linspace(0, 2 * np.pi, 60)
      for c in [0.25, 1.0, 2.25, 4.0]:
          pts = np.stack([1 + np.sqrt(c) * np.cos(t), -0.5 + np.sqrt(c / 2) * np.sin(t)], axis=1)
          s.line(pts, color="muted", width=1, static=True)
      for x in np.linspace(-1, 3, 5):
          for y in np.linspace(-2, 1, 4):
              g = grad(x, y)
              s.arrow(x, y, -0.12 * g[0], -0.12 * g[1], color="accent")
      s.circle(1, -0.5, 0.06, color="good", fill="good")
      s.show()
    subgoals:
      - lines: [4, 5]
        label: Analytischen Gradienten definieren
      - lines: [9, 11]
        label: Höhenlinien zeichnen
      - lines: [12, 15]
        label: Pfeile an Gitterpunkten
    after: |
      Die Pfeile stehen senkrecht auf den Höhenlinien und zeigen zum Minimum bei $(1, -0{,}5)$ (grüner Punkt). Weil $f$ in $y$ doppelt so stark gekrümmt ist, zeigen sie **nicht** direkt auf das Minimum – das wird beim Gradientenabstieg wichtig.
  - type: fill
    fading: true
    prompt: |
