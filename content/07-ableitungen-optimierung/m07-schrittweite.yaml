id: m07-schrittweite
title: Die richtige Lernrate
minutes: 9
goals:
  - Die Konvergenzbedingung $0 < \eta < 2/a$ für eine Parabel herleiten und anwenden
  - Langsame Konvergenz, Oszillation und Divergenz im Plot erkennen
  - Ein Abbruchkriterium mit `while` umsetzen
concepts: [lernrate, gradientenabstieg]
steps:
  - type: text
    body: |
      ## Ein Faktor entscheidet

      Für die Parabel $f(x) = \tfrac{a}{2} x^2$ (Krümmung $a > 0$) ist $\nabla f = a x$, ein Schritt also

      $$
      x_{k+1} = x_k - \eta a x_k = (1 - \eta a)\, x_k
      $$

      Alles hängt am Faktor $1 - \eta a$:

      | Lernrate | Faktor | Verhalten |
      |---|---|---|
      | $0 < \eta < 1/a$ | zwischen 0 und 1 | konvergiert monoton |
      | $\eta = 1/a$ | 0 | Minimum in einem Schritt |
      | $1/a < \eta < 2/a$ | zwischen −1 und 0 | konvergiert, springt hin und her |
      | $\eta > 2/a$ | kleiner −1 | **divergiert** |

      Es ist dieselbe Rechnung wie bei der Stabilität von $x_{k+1} = A x_k$ aus Modul 5 – mit einer $1 \times 1$-Matrix.
  - type: example
    code: |
      import numpy as np
      import lab

      a = 2.0                       # f(x) = x², Krümmung 2
      fig = lab.Figure(title="Gradientenabstieg auf f = x²", xlabel="Schritt", ylabel="x")
      for lr in [0.1, 0.4, 0.9, 1.05]:
          x = 1.0
          xs = [x]
          for k in range(20):
              x = x - lr * a * x
              xs.append(x)
          fig.line(xs, label=f"lr = {lr}")
          print(f"lr = {lr}: Faktor {1 - lr * a:+.1f}, x nach 20 Schritten = {x:+.2e}")
      fig.hline(0.0)
      fig.show()
    subgoals:
      - lines: 4
        label: Krümmung festlegen
      - lines: [6, 11]
        label: Abstieg für mehrere Lernraten
      - lines: [12, 15]
        label: Verläufe vergleichen
    after: |
      Grenze ist $2/a = 1$. `lr = 0.1` und `lr = 0.9` haben denselben Betrag des Faktors (0,8) und sind gleich schnell – aber 0,9 springt jedes Mal über das Minimum. `lr = 1.05` schaukelt sich auf. Am schnellsten ist `lr = 0.4` nahe am Optimum $1/a = 0{,}5$.
  - type: predict
    code: |
      x = 3.0
      lr = 1.0
      for k in range(3):
          x = x - lr * 2 * x      # f = x², a = 2
      print(x)
    options: ["-3.0", "0.0", "3.0", "-24.0"]
    answer: "-3.0"
    explanation: |
      $\eta = 1 = 2/a$ liegt genau auf der Grenze: Faktor $1 - 2 = -1$. $x$ springt endlos zwischen $3$ und $-3$, ohne zu konvergieren oder zu divergieren.
  - type: explain
    question: |
      $f(x, y) = x^2 + 10 y^2$ (Krümmungen 2 und 20). Warum braucht der Gradientenabstieg hier viele Schritte?
    options:
      - text: Die steile Richtung $y$ erzwingt $\eta < 2/20 = 0{,}1$; damit ist der Faktor in $x$ mindestens $1 - 0{,}2 = 0{,}8$ – die flache Richtung kriecht.
        correct: true
        why: Eine Lernrate für alle Richtungen muss zur **größten** Krümmung passen (größter Eigenwert der Hesse-Matrix). Das Verhältnis größte/kleinste Krümmung (Konditionszahl, hier 10) bestimmt, wie langsam es wird.
      - text: Weil der numerische Gradient in 2D ungenau ist.
        correct: false
        why: Auch mit dem exakten Gradienten bleibt das Problem. Es liegt an der Form der Funktion.
      - text: Weil das Minimum nicht im Ursprung liegt.
        correct: false
        why: Das Minimum ist $(0, 0)$. Eine Verschiebung würde an der Konvergenzgeschwindigkeit nichts ändern.
  - type: exercise
    mode: modify
    prompt: |
      Mit `lr = 0.12` divergiert dieser Abstieg auf $f = x^2 + 10y^2$. Ändere **nur** die Lernrate, sodass nach 100 Schritten $\|p\| < 10^{-3}$ gilt.
    starter: |
      import numpy as np

      def grad(p):
          return np.array([2 * p[0], 20 * p[1]])   # f = x² + 10 y²

      lr = 0.12
      p = np.array([1.0, 1.0])
      for k in range(100):
          p = p - lr * grad(p)
    solution: |
      import numpy as np

      def grad(p):
          return np.array([2 * p[0], 20 * p[1]])   # f = x² + 10 y²

      lr = 0.08
      p = np.array([1.0, 1.0])
      for k in range(100):
          p = p - lr * grad(p)
    tests:
      - name: Konvergiert nach 100 Schritten
        code: |
          n = float(np.linalg.norm(p))
          assert n < 1e-3, f"Nach 100 Schritten ist |p| = {n:.3g}, gefordert < 1e-3 (lr = {lr})"
    mutants:
      - |
        import numpy as np

        def grad(p):
            return np.array([2 * p[0], 20 * p[1]])

        lr = 0.1
        p = np.array([1.0, 1.0])
        for k in range(100):
            p = p - lr * grad(p)
      - |
        import numpy as np

        def grad(p):
            return np.array([2 * p[0], 20 * p[1]])

        lr = 0.01
        p = np.array([1.0, 1.0])
        for k in range(100):
            p = p - lr * grad(p)
    hints:
      - "Teilziel: Lernrate passend zur größten Krümmung wählen."
      - "Stabil in $y$ nur für $\\eta < 2/20$. Zu klein darf $\\eta$ aber auch nicht sein, sonst kommt $x$ in 100 Schritten nicht weit genug."
      - "Probiere einen Wert etwas unter 0,1, etwa `lr = 0.08`."
    explanation: |
      Geeignet ist etwa $0{,}034 < \eta < 0{,}097$. Genau `lr = 0.1` reicht nicht: Der Faktor in $y$ ist dann $-1$, $y$ springt ewig zwischen $\pm 1$.
  - type: exercise
    mode: make
    prompt: |
      Statt fester Schrittzahl soll der Abstieg aufhören, sobald $\|\nabla f\| <$ `tol` ist – spätestens aber nach `max_steps` Schritten. Schreibe `minimize(grad, x0, lr, tol=1e-6, max_steps=10000)`, die `(x, steps)` zurückgibt (`steps` = Anzahl ausgeführter Schritte).

      Neu: `steps += 1` ist die Kurzform für `steps = steps + 1`.
    starter: |
      import numpy as np

      def minimize(grad, x0, lr, tol=1e-6, max_steps=10000):
          x = np.array(x0, dtype=float)
          steps = 0
          # while: Gradient noch zu groß UND noch Schritte übrig
          return x, steps
    solution: |
      import numpy as np

      def minimize(grad, x0, lr, tol=1e-6, max_steps=10000):
          x = np.array(x0, dtype=float)
          steps = 0
          while np.linalg.norm(grad(x)) >= tol and steps < max_steps:
              x = x - lr * grad(x)
              steps += 1
          return x, steps
    tests:
      - name: Parabel konvergiert
        code: |
          def g(x):
              return 2 * x
          x, steps = minimize(g, [1.0], 0.25)
          assert steps == 21, f"Mit lr = 0.25 halbiert sich x pro Schritt; |grad| < 1e-6 nach 21 Schritten, bekommen {steps}"
          assert abs(x[0]) < 1e-6, f"x sollte fast 0 sein, ist {x[0]}"
      - name: Schon am Minimum
        code: |
          def g(x):
              return 2 * x
          x, steps = minimize(g, [0.0], 0.25)
          assert steps == 0, f"Am Minimum ist kein Schritt nötig, bekommen steps = {steps}"
      - name: Divergenz wird begrenzt
        code: |
          def g(x):
              return 2 * x
          x, steps = minimize(g, [1.0], 1.5, max_steps=50)
          assert steps == 50, f"Bei Divergenz muss nach max_steps = 50 Schluss sein, bekommen {steps}"
    mutants:
      - |
        import numpy as np

        def minimize(grad, x0, lr, tol=1e-6, max_steps=10000):
            x = np.array(x0, dtype=float)
            steps = 0
            while np.linalg.norm(grad(x)) < tol and steps < max_steps:
                x = x - lr * grad(x)
                steps += 1
            return x, steps
      - |
        import numpy as np

        def minimize(grad, x0, lr, tol=1e-6, max_steps=10000):
            x = np.array(x0, dtype=float)
            steps = 1
            while np.linalg.norm(grad(x)) >= tol and steps < max_steps:
                x = x - lr * grad(x)
                steps += 1
            return x, steps
      - |
        import numpy as np

        def minimize(grad, x0, lr, tol=1e-6, max_steps=10000):
            x = np.array(x0, dtype=float)
            steps = 0
            while np.linalg.norm(grad(x)) >= tol and steps < max_steps:
                x = x - grad(x)
                steps += 1
            return x, steps
    hints:
      - "Teilziel: Schleife mit Abbruchbedingung – weiter, solange der Gradient groß ist und Schritte übrig sind."
      - "`np.linalg.norm(grad(x))` ist die Länge des Gradienten. Beide Bedingungen mit `and` verknüpfen."
      - |
        ```python
        while np.linalg.norm(grad(x)) >= tol and steps < max_steps:
            x = ...
            steps += 1
        ```
    explanation: |
      Ein Abbruch über die Gradientennorm passt sich der Aufgabe an; `max_steps` schützt vor Endlosschleifen bei zu großer Lernrate. Beides findest du in jedem Optimierer.
  - type: quiz
    question: |
      Eine Kostenfunktion ist näherungsweise $f = 4 x^2$. Bis zu welcher Lernrate konvergiert der Gradientenabstieg?
    options:
      - text: $\eta < 0{,}25$
        correct: true
        why: $f = \tfrac{a}{2} x^2$ mit $a = 8$; Grenze $2/a = 0{,}25$.
      - text: $\eta < 0{,}5$
        correct: false
        why: Das wäre $2/4$ – die Krümmung ist aber $f'' = 8$, nicht 4.
      - text: $\eta < 0{,}125$
        correct: false
        why: Das ist $1/a$, die Grenze für **monotone** Konvergenz. Bis $2/a$ konvergiert es noch, nur oszillierend.
      - text: für jede Lernrate, die Funktion ist konvex
        correct: false
        why: Konvexität garantiert kein Konvergieren bei zu großer Schrittweite.
cards:
  - id: m07-c-lr-faktor
    concept: lernrate
    variants:
      - type: predict
        code: |
          x = 1.0
          lr = 0.75
          for k in range(2):
              x = x - lr * 2 * x      # f = x²
          print(x)
        options: ["0.25", "-0.5", "0.0", "4.0"]
        answer: "0.25"
        explanation: "Faktor $1 - 0{,}75 \\cdot 2 = -0{,}5$; zwei Schritte: $(-0{,}5)^2 = 0{,}25$. Konvergiert, aber springend."
      - type: predict
        code: |
          x = 1.0
          lr = 1.5
          for k in range(2):
              x = x - lr * 2 * x      # f = x²
          print(x)
        options: ["4.0", "-2.0", "0.25", "1.0"]
        answer: "4.0"
        explanation: "Faktor $1 - 3 = -2$: $1 \\to -2 \\to 4$. Divergenz, weil $\\eta > 2/a = 1$."
  - id: m07-c-lr-grenze
    concept: lernrate
    variants:
      - type: quiz
        question: "$f(x) = \\tfrac{a}{2}x^2$ mit $a = 10$. Welche Lernrate führt in **einem** Schritt ins Minimum?"
        options:
          - text: $\eta = 0{,}1$
            correct: true
            why: Faktor $1 - \eta a = 0$ für $\eta = 1/a$.
          - text: $\eta = 0{,}2$
            correct: false
            why: Das ist $2/a$, der Rand der Stabilität – Faktor $-1$.
          - text: $\eta = 10$
            correct: false
            why: Viel zu groß, Faktor $-99$.
      - type: quiz
        question: "$f(x, y) = x^2 + 50 y^2$. Was begrenzt die Lernrate?"
        options:
          - text: die Krümmung in $y$ (100), also $\eta < 0{,}02$
            correct: true
            why: Die steilste Richtung bestimmt die Stabilitätsgrenze $2/a_{\max}$.
          - text: die Krümmung in $x$ (2), also $\eta < 1$
            correct: false
            why: Mit $\eta = 0{,}5$ würde $y$ sofort divergieren.
          - text: der Mittelwert der Krümmungen
            correct: false
            why: Schon eine einzige instabile Richtung lässt den Abstieg divergieren.
