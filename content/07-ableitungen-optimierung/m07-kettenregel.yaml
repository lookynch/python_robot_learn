id: m07-kettenregel
title: Kettenregel und Rechengraph
minutes: 10
goals:
  - Eine verkettete Rechnung als Rechengraph mit Vorwärts- und Rückwärtsdurchlauf schreiben
  - Mehrfach benutzte Variablen korrekt behandeln (Beiträge addieren)
  - Mit dem so berechneten Gradienten einen Arm per Gradientenabstieg ausrichten
concepts: [kettenregel, rechengraph, gradientenabstieg]
steps:
  - type: text
    body: |
      ## Ableiten in Etappen

      Kettenregel: Für $L(q) = g(h(q))$ gilt $\dfrac{dL}{dq} = g'(h(q)) \cdot h'(q)$.

      Im Code zerlegt man eine Rechnung in kleine Schritte mit Zwischenwerten – einen **Rechengraphen** (computational graph). Beispiel: Ein Arm mit einem Glied (Länge $l$) soll mit der Spitze die Koordinate $x^* = 0{,}5$ m erreichen:

      $$
      q \;\to\; p = l\cos q \;\to\; e = p - x^* \;\to\; L = e^2
      $$

      1. **Vorwärts** (forward pass): Zwischenwerte $p, e, L$ ausrechnen und merken.
      2. **Rückwärts** (backward pass): Vom Ende her die lokalen Ableitungen multiplizieren: $\frac{dL}{de} = 2e$, $\frac{de}{dp} = 1$, $\frac{dp}{dq} = -l\sin q$.

      Genau so funktioniert Backpropagation in neuronalen Netzen (Modul 12).
  - type: example
    code: |
      import numpy as np

      l, target = 1.0, 0.5     # m
      q = 0.3                  # rad

      # Vorwärts: Zwischenwerte merken
      p = l * np.cos(q)
      e = p - target
      L = e**2

      # Rückwärts: lokale Ableitungen vom Ende her multiplizieren
      dL_de = 2 * e
      dL_dp = dL_de * 1.0
      dL_dq = dL_dp * (-l * np.sin(q))

      def loss(q):
          return (l * np.cos(q) - target)**2

      h = 1e-5
      num = (loss(q + h) - loss(q - h)) / (2 * h)
      print(f"Kettenregel: {dL_dq:.8f}, numerisch: {num:.8f}")
    subgoals:
      - lines: [6, 9]
        label: Vorwärtsdurchlauf mit Zwischenwerten
      - lines: [11, 14]
        label: Rückwärtsdurchlauf mit lokalen Ableitungen
      - lines: [16, 21]
        label: Mit numerischer Ableitung prüfen
    after: |
      Beide Werte stimmen auf etwa 10 Stellen überein. Der Rückwärtsdurchlauf braucht nur die gespeicherten Zwischenwerte `e` und `q` – keine zusätzliche Auswertung von `loss`.
  - type: explain
    question: |
      Warum werden die Zwischenwerte (`p`, `e`) im Vorwärtsdurchlauf gespeichert?
    options:
      - text: Die lokalen Ableitungen hängen von ihnen ab, z. B. $\frac{dL}{de} = 2e$. Rückwärts werden sie wiederverwendet statt neu berechnet.
        correct: true
        why: Deshalb braucht Backpropagation Speicher proportional zur Größe des Rechengraphen – ein Grund, warum große Netze viel Grafikspeicher brauchen.
      - text: Nur zur Kontrolle, für die Ableitung sind sie nicht nötig.
        correct: false
        why: "`dL_de = 2 * e` braucht `e`, `dp/dq` braucht `q`. Ohne Zwischenwerte keine lokalen Ableitungen."
      - text: Weil Python Variablen sonst sofort löscht.
        correct: false
        why: Variablen bleiben erhalten, solange ihr Name gültig ist. Es geht darum, was der Rückwärtsdurchlauf braucht.
  - type: predict
    code: |
      x = 1.0
      a = 3 * x
      b = a**2
      db_da = 2 * a
      db_dx = db_da * 3
      print(b, db_dx)
    options: ["9.0 18.0", "9.0 6.0", "3.0 18.0", "9.0 2.0"]
    answer: "9.0 18.0"
    explanation: |
      Vorwärts: $a = 3$, $b = 9$. Rückwärts: $\frac{db}{da} = 2a = 6$, mal $\frac{da}{dx} = 3$ ergibt 18. Probe: $b = 9x^2$, $b' = 18x = 18$. `6.0` vergisst die innere Ableitung.
  - type: fill
    fading: true
    prompt: |
      $L = 3\sin(x^2)$ bei $x = 0{,}5$. Ergänze den Rückwärtsdurchlauf, sodass $\frac{dL}{dx} = 6x\cos(x^2) \approx 2{,}9067$ herauskommt.
    code: |
      import math

      x = 0.5
      u = x**2
      v = math.sin(u)
      L = 3 * v

      dL_dv = 3
      dL_du = dL_dv * math.___(u)
      dL_dx = dL_du * ___
      print(round(dL_dx, 4))
    blanks:
      - answer: cos
        options: [cos, sin, tan]
      - answer: 2 * x
        options: [2 * x, "x**2", "2"]
    expect_output: "2.9067"
    explanation: |
      Jede Zeile des Rückwärtsdurchlaufs ist „bisherige Ableitung × lokale Ableitung des Knotens“: $\sin' = \cos$ (ausgewertet am gespeicherten $u$), $(x^2)' = 2x$.
  - type: example
    intro: |
      Jetzt soll die Spitze den **Punkt** $(-0{,}6;\ 0{,}8)$ erreichen. $q$ geht über zwei Wege in die Kosten ein ($e_x$ und $e_y$) – die Beiträge beider Wege werden **addiert**:
      $L = e_x^2 + e_y^2$, $\;\frac{dL}{dq} = 2e_x \cdot (-l\sin q) + 2e_y \cdot l\cos q$.
    code: |
      import math
      import lab

      l = 1.0
      tx, ty = -0.6, 0.8
      q, lr = 0.3, 0.3
      qs = [[q]]
      for k in range(30):
          ex = l * math.cos(q) - tx          # vorwärts
          ey = l * math.sin(q) - ty
          dL_dq = 2 * ex * (-l * math.sin(q)) + 2 * ey * (l * math.cos(q))   # rückwärts
          q = q - lr * dL_dq
          qs.append([q])

      print(f"q = {q:.4f} rad, Restfehler L = {ex**2 + ey**2:.1e}")
      lab.arm(qs, links=(l,), target=(tx, ty), title="Gradientenabstieg auf den Gelenkwinkel", fps=10)
    subgoals:
      - lines: [4, 7]
        label: Ziel, Start und Lernrate festlegen
      - lines: [9, 10]
        label: Vorwärtsdurchlauf
      - lines: 11
        label: Rückwärtsdurchlauf, beide Wege addieren
      - lines: [12, 13]
        label: Abstiegsschritt
    after: |
      Der Winkel läuft gegen $\operatorname{atan2}(0{,}8, -0{,}6) \approx 2{,}2143$ rad. `lab.arm(qs, links=(l,))` animiert einen Arm aus einer Liste von Stellungen – hier je ein Gelenkwinkel. In Modul 8 machst du das Gleiche mit zwei Gelenken – dann heißt es inverse Kinematik.
  - type: exercise
    mode: make
    prompt: |
      Ein lineares Modell sagt $\hat y = w x + b$ voraus, die Kosten sind $L = (\hat y - y)^2$. Schreibe `loss_and_grad(w, b, x, y)`, die mit Vorwärts- und Rückwärtsdurchlauf `(L, dL_dw, dL_db)` zurückgibt.
    starter: |
      def loss_and_grad(w, b, x, y):
          # vorwärts: pred, e, L
          # rückwärts: dL_de, dann dL_dw und dL_db
          return 0.0, 0.0, 0.0
    solution: |
      def loss_and_grad(w, b, x, y):
          pred = w * x + b
          e = pred - y
          L = e**2
          dL_de = 2 * e
          dL_dw = dL_de * x
          dL_db = dL_de * 1.0
          return L, dL_dw, dL_db
    tests:
      - name: Werte an einem Punkt
        code: |
          L, dw, db = loss_and_grad(2.0, 1.0, 3.0, 4.0)
          assert close([L, dw, db], [9.0, 18.0, 6.0]), f"Für w=2, b=1, x=3, y=4 erwartet (9, 18, 6), bekommen ({L}, {dw}, {db})"
      - name: Vergleich mit numerischer Ableitung
        code: |
          w, b, x, y, h = -0.7, 0.4, 1.5, -2.0, 1e-5
          def Lw(w_):
              return loss_and_grad(w_, b, x, y)[0]
          def Lb(b_):
              return loss_and_grad(w, b_, x, y)[0]
          num_w = (Lw(w + h) - Lw(w - h)) / (2 * h)
          num_b = (Lb(b + h) - Lb(b - h)) / (2 * h)
          L, dw, db = loss_and_grad(w, b, x, y)
          assert close(L, (w * x + b - y)**2), f"L stimmt nicht: {L}"
          assert close([dw, db], [num_w, num_b], tol=1e-5), f"Gradient ({dw:.5f}, {db:.5f}), numerisch ({num_w:.5f}, {num_b:.5f})"
      - name: Perfekte Vorhersage
        code: |
          L, dw, db = loss_and_grad(1.0, 0.0, 2.0, 2.0)
          assert close([L, dw, db], [0.0, 0.0, 0.0]), f"Bei exakter Vorhersage muss alles 0 sein, bekommen ({L}, {dw}, {db})"
    mutants:
      - |
        def loss_and_grad(w, b, x, y):
            pred = w * x + b
            e = pred - y
            L = e**2
            dL_dw = e * x
            dL_db = e
            return L, dL_dw, dL_db
      - |
        def loss_and_grad(w, b, x, y):
            pred = w * x + b
            e = pred - y
            L = e**2
            dL_dw = 2 * e
            dL_db = 2 * e
            return L, dL_dw, dL_db
      - |
        def loss_and_grad(w, b, x, y):
            pred = w * x + b
            e = y - pred
            L = e**2
            dL_dw = 2 * e * x
            dL_db = 2 * e
            return L, dL_dw, dL_db
    hints:
      - "Teilziel: erst vorwärts (Vorhersage, Fehler, Kosten), dann rückwärts (lokale Ableitungen multiplizieren)."
      - "$\\frac{dL}{de} = 2e$, $\\frac{\\partial e}{\\partial w} = x$, $\\frac{\\partial e}{\\partial b} = 1$."
      - |
        ```python
        pred = w * x + b
        e = pred - y
        L = e**2
        dL_de = 2 * e
        ...
        ```
      - "`dL_dw = dL_de * x` und `dL_db = dL_de`"
    explanation: |
      Mit diesen Ableitungen kannst du per Gradientenabstieg eine Gerade an Daten anpassen – das ist Modul 12, Lektion 1. Der dritte Mutant (`e = y - pred`) liefert dieselben Kosten, aber den Gradienten mit falschem Vorzeichen: Der Abstieg würde bergauf laufen.
  - type: quiz
    question: |
      In `b = x * (2 * x)` wird `x` zweimal benutzt. Wie berechnet der Rückwärtsdurchlauf $\frac{db}{dx}$ bei $x = 3$?
    options:
      - text: Beitrag über den direkten Faktor ($2x = 6$) plus Beitrag über $a = 2x$ ($x \cdot 2 = 6$), zusammen 12
        correct: true
        why: Mehrdimensionale Kettenregel – alle Wege von `x` zum Ergebnis werden addiert. Probe $b = 2x^2$, $b' = 4x = 12$.
      - text: nur über einen Weg, also 6
        correct: false
        why: Dann fehlt der zweite Weg, und das Ergebnis ist halb so groß wie die richtige Ableitung.
      - text: die Beiträge werden multipliziert, also 36
        correct: false
        why: Multipliziert wird **entlang** eines Weges; **verschiedene** Wege werden addiert.
cards:
  - id: m07-c-kette-produkt
    concept: kettenregel
    variants:
      - type: predict
        code: |
          x = 2.0
          a = x + 1
          b = 5 * a
          c = b**2
          dc_db = 2 * b
          dc_dx = dc_db * 5 * 1
          print(c, dc_dx)
        options: ["225.0 150.0", "225.0 30.0", "225.0 10.0", "15.0 150.0"]
        answer: "225.0 150.0"
        explanation: "$b = 15$, $c = 225$; $\\frac{dc}{dx} = 2b \\cdot 5 \\cdot 1 = 150$."
      - type: predict
        code: |
          x = 0.5
          a = 4 * x
          b = a**3
          db_dx = 3 * a**2 * 4
          print(b, db_dx)
        options: ["8.0 48.0", "8.0 12.0", "8.0 3.0", "2.0 48.0"]
        answer: "8.0 48.0"
        explanation: "$a = 2$, $b = 8$; $3a^2 = 12$, mal innere Ableitung 4 ergibt 48."
  - id: m07-c-kette-summe
    concept: rechengraph
    variants:
      - type: predict
        code: |
          x = 3.0
          a = 2 * x
          b = x * a
          db_dx = a + x * 2      # direkter Weg + Weg über a
          print(b, db_dx)
        options: ["18.0 12.0", "18.0 6.0", "18.0 36.0", "18.0 18.0"]
        answer: "18.0 12.0"
        explanation: "Zwei Wege von `x` zu `b`, ihre Beiträge (6 und 6) werden addiert: $b = 2x^2$, $b' = 4x = 12$."
      - type: quiz
        question: Was passiert im **Rückwärtsdurchlauf** eines Rechengraphen?
        options:
          - text: Vom Ergebnis aus werden lokale Ableitungen mit den gespeicherten Zwischenwerten multipliziert.
            correct: true
            why: So entsteht die Ableitung nach allen Eingaben in einem Durchgang.
          - text: Die Funktion wird für jede Eingabe einmal mit $\pm h$ neu ausgewertet.
            correct: false
            why: Das ist der numerische Gradient – genau das, was Backpropagation vermeidet.
          - text: Die Zwischenwerte werden in umgekehrter Reihenfolge neu berechnet.
            correct: false
            why: Sie werden im Vorwärtsdurchlauf gespeichert und rückwärts nur gelesen.
