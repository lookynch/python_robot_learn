      - "Teilziel: sampeln → bewerten → Index der kleinsten Kosten → Folge und Kosten zurückgeben."
      - "Gleichverteilt: `rng.uniform(low, high, size=(N, H))`. Den Index des Minimums liefert `np.argmin`."
      - "`A = rng.uniform(low, high, size=(N, H))` und `J = rollout_costs(dynamics, cost, s0, A)`"
      - "`i = np.argmin(J)` und `return A[i], J[i]`"
  - type: quiz
    question: |
      Mit $H = 60$ findet Random Shooting bei $N = 1000$ und $N = 10\,000$ fast dieselben besten Kosten (jeweils etwa 470–490). Was ist der Hauptgrund?
    options:
      - text: Der Suchraum hat 60 Dimensionen; zufällige Punkte treffen gute Bereiche darin fast nie, auch bei 10-mal mehr Samples.
        correct: true
        why: Das ist der **Fluch der Dimensionalität**. Abhilfe – kürzer planen und oft neu planen (MPC) oder die Suche gezielt verfeinern (CEM, MPPI).
      - text: Das Modell ist zu ungenau.
        correct: false
        why: Hier ist das Modell exakt – das Problem ist die Suche, nicht das Modell.
      - text: Bei 10 000 Samples läuft der Speicher über.
        correct: false
        why: Ein $(10000, 60)$-Array hat 4,8 MB – kein Problem. Die Ergebnisse sind einfach nicht besser.
cards:
  - id: m11-c-batch-shape
    concept: plan-batch-rollout
    variants:
      - type: predict
        code: |
          import numpy as np
          A = np.zeros((100, 20))
          s = np.tile(np.array([0.0, 0.0]), (100, 1))
          print(A[:, 3].shape, s.shape)
        options: ["(100,) (100, 2)", "(20,) (100, 2)", "(100,) (2, 100)", "(100, 20) (100, 2)"]
        answer: "(100,) (100, 2)"
        explanation: "`A[:, 3]`: Aktion zum Zeitpunkt 3 für alle 100 Folgen. `tile` stapelt den Zustand 100-mal."
      - type: predict
        code: |
          import numpy as np
          A = np.arange(6).reshape(2, 3)
          print(A[:, 0], A[0])
        options: ["[0 3] [0 1 2]", "[0 1 2] [0 3]", "[0 1] [0 1 2]", "[0 3] [0 3]"]
        answer: "[0 3] [0 1 2]"
        explanation: "`A[:, 0]` ist die erste Spalte (erste Aktion jeder Folge), `A[0]` die erste Zeile (ganze erste Folge)."
  - id: m11-c-argmin
    concept: plan-random-shooting
    variants:
      - type: predict
        code: |
          import numpy as np
          J = np.array([7.0, 2.5, 9.0, 3.0])
          A = np.array([[1, 1], [2, 2], [3, 3], [4, 4]])
          print(A[np.argmin(J)])
        options: ["[2 2]", "[3 3]", "1", "2.5"]
        answer: "[2 2]"
        explanation: "`np.argmin(J)` ist der **Index** 1 des Minimums; damit holt man die zugehörige Folge."
      - type: quiz
        question: Welche Zeile wählt bei Random Shooting die beste Folge?
        options:
          - text: "`A[np.argmin(J)]`"
            correct: true
            why: Kleinste Kosten = beste Folge; `argmin` liefert ihren Index.
          - text: "`A[np.argmax(J)]`"
            correct: false
            why: Das ist die **teuerste** Folge – Planer minimieren Kosten.
          - text: "`np.min(A)`"
            correct: false
            why: Das ist die kleinste einzelne Aktion, unabhängig von den Kosten.
  - id: m11-c-fluch
    concept: plan-random-shooting
    variants:
      - type: quiz
        question: Wann funktioniert Random Shooting am besten?
        options:
          - text: Bei kurzem Horizont und wenigen Aktionsdimensionen
            correct: true
            why: Dann ist der Suchraum klein und zufällige Samples decken ihn gut ab.
          - text: Bei möglichst langem Horizont
            correct: false
            why: Jeder Zeitschritt fügt eine Dimension hinzu – der Suchraum wächst exponentiell.
          - text: Unabhängig vom Horizont, wenn $N$ groß genug ist
            correct: false
            why: Das nötige $N$ wächst exponentiell mit der Dimension – praktisch unerreichbar.
      - type: quiz
        question: Random Shooting mit $H = 60$ verbessert sich von $N = 1000$ auf $N = 10\,000$ kaum. Was hilft eher?
        options:
          - text: Kürzer planen und in jedem Schritt neu planen (MPC) oder gezielter suchen (CEM, MPPI)
            correct: true
            why: Beides verkleinert bzw. nutzt den Suchraum besser, statt nur mehr blind zu ziehen.
          - text: Noch einmal zehnmal mehr Samples
            correct: false
            why: In 60 Dimensionen bringt das kaum etwas – der Fluch der Dimensionalität.
          - text: Die Aktionsgrenzen weglassen
            correct: false
            why: Das Modell begrenzt das Moment ohnehin; der Suchraum würde nur größer.
