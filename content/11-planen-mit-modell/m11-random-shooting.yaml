id: m11-random-shooting
title: Random Shooting
minutes: 9
goals:
  - N Aktionsfolgen gleichzeitig als Array `(N, H)` simulieren
  - Mit Random Shooting die beste von N zufälligen Folgen bestimmen
  - Die Grenzen von Random Shooting bei langen Horizonten erkennen
concepts: [plan-batch-rollout, plan-random-shooting]
steps:
  - type: text
    body: |
      ## Raten, simulieren, das Beste nehmen

      Der einfachste Planer: Ziehe $N$ zufällige Aktionsfolgen der Länge $H$ (dem **Horizont**), rechne alle im Modell durch und nimm die mit den kleinsten Kosten. Das heißt **Random Shooting**.

      Damit das schnell geht, simulieren wir alle $N$ Folgen **gleichzeitig**:

      - Aktionen als Array `A` der Form `(N, H)`: Zeile $i$ = Folge $i$
      - Zustände als Array der Form `(N, 2)`: eine Zeile pro Folge
      - Python-Schleife nur über die Zeit $t$; `A[:, t]` sind die $N$ Aktionen zum Zeitpunkt $t$

      Die Umgebungen in `lab.envs` sind dafür gebaut: `dynamics` und `cost` rechnen über führende Achsen.
  - type: example
    code: |
      import numpy as np
      from lab.envs import Pendulum

      def rollout_costs(dynamics, cost, s0, A):
          N, H = A.shape[0], A.shape[1]
          s = np.tile(s0, (N, 1))
          total = np.zeros(N)
          for t in range(H):
              u = A[:, t]
              total = total + cost(s, u)
              s = dynamics(s, u)
          return total

      env = Pendulum()
      s0 = env.reset()
      rng = np.random.default_rng(0)
      A = rng.uniform(-2, 2, size=(500, 60))
      J = rollout_costs(env.dynamics, env.cost, s0, A)
      best = np.argmin(J)
      print("beste:", round(float(J[best]), 1), "Mittel:", round(float(np.mean(J)), 1))

      states = [s0]
      for u in A[best]:
          states.append(env.dynamics(states[-1], u))
      env.render(np.array(states), title="Beste von 500 Zufallsfolgen")
    subgoals:
      - lines: [5, 7]
        label: N Startzustände und Kostenzähler anlegen
      - lines: [8, 11]
        label: Alle Folgen zugleich einen Schritt weiter
      - lines: [17, 20]
        label: Sampeln, bewerten, das Beste wählen
      - lines: [22, 25]
        label: Beste Folge abspielen
    after: |
      `np.tile(s0, (N, 1))` stapelt den Startzustand $N$-mal zu einer $(N, 2)$-Matrix. Die beste Folge ist besser als der Durchschnitt (491 statt 548) – aber das Pendel wackelt nur unten herum. Unter 500 zufälligen Folgen mit je 60 Zufallszahlen ist keine, die im richtigen Takt Schwung holt.
  - type: predict
    code: |
      import numpy as np
      N, H = 5, 3
      s0 = np.array([np.pi, 0.0])
      A = np.zeros((N, H))
      s = np.tile(s0, (N, 1))
      print(s.shape, A[:, 0].shape)
    options: ["(5, 2) (5,)", "(2, 5) (3,)", "(5, 2) (3,)", "(10,) (5,)"]
    answer: "(5, 2) (5,)"
    explanation: |
      `np.tile(s0, (N, 1))` wiederholt `s0` 5-mal untereinander und 1-mal nebeneinander. `A[:, 0]` ist die **Spalte** 0: die erste Aktion jeder der 5 Folgen. `(3,)` wäre `A[0]`, die ganze erste Folge.
  - type: explain
    question: |
      Warum schreibt man `rollout_costs` mit einer Schleife über $t$ und Arrays über die Folgen – statt einer Schleife über alle $N$ Folgen, die je `rollout` aufruft?
    options:
      - text: Dann laufen nur $H$ Python-Schleifendurchläufe; die $N$ Folgen rechnet NumPy in einem Aufruf.
        correct: true
        why: "Mit $N = 500$, $H = 60$: 60 statt 30 000 Durchläufe. Der Aufwand pro NumPy-Aufruf ist fast unabhängig von $N$ – im Browser und auf dem Handy entscheidend."
      - text: Weil die Ergebnisse sonst anders wären
        correct: false
        why: Beide Varianten rechnen dasselbe – nur unterschiedlich schnell.
      - text: Weil `env.dynamics` nur Arrays der Form `(N, 2)` akzeptiert
        correct: false
        why: "`dynamics` funktioniert auch mit einem einzelnen Zustand `(2,)` – das haben wir in der letzten Lektion genutzt."
