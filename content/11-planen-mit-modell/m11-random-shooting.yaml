        import numpy as np
        def rollout_costs(dynamics, cost, s0, A):
            N, H = A.shape[0], A.shape[1]
            s = np.tile(s0, (N, 1))
            total = np.zeros(N)
            for t in range(H):
                total = total + cost(s, A[:, t])
                s = dynamics(s, A[:, t])
            return total
        def random_shooting(dynamics, cost, s0, N, H, rng, low, high):
            A = rng.uniform(low, high, size=(N, H))
            J = rollout_costs(dynamics, cost, s0, A)
            i = np.argmin(J)
            return A[:, i], J[i]
