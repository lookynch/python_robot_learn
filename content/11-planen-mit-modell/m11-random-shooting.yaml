    solution: |
      import numpy as np
      from lab.envs import Pendulum

      def rollout_costs(dynamics, cost, s0, A):
          N, H = A.shape[0], A.shape[1]
          s = np.tile(s0, (N, 1))
          total = np.zeros(N)
          for t in range(H):
              u = A[:, t]
              total = total + cost(s, u)
              s = dynamics(s, u)
          return total

      def random_shooting(dynamics, cost, s0, N, H, rng, low, high):
          A = rng.uniform(low, high, size=(N, H))
          J = rollout_costs(dynamics, cost, s0, A)
          i = np.argmin(J)
          return A[i], J[i]

      env = Pendulum()
      plan, J = random_shooting(env.dynamics, env.cost, env.reset(), 300, 20, np.random.default_rng(0), -2, 2)
      print(plan.shape, round(float(J), 1))
    tests:
      - name: Bekanntes Minimum (Spielzeugmodell)
        code: |
          def dyn_t(s, u):
              return s + u[:, None]
          def cost_t(s, u):
              return s[:, 0] ** 2 + u ** 2
          r = random_shooting(dyn_t, cost_t, np.array([1.0]), 2000, 2, np.random.default_rng(0), -1.0, 1.0)
          assert r is not None, "Die Funktion gibt nichts zurück – fehlt return?"
          folge, J_t = r
          assert 1.5 - 1e-9 <= J_t <= 1.52, f"Das Minimum ist J = 1.5 bei u = (-0.5, 0); bestes gefundenes J = {J_t}"
          assert close(folge, [-0.5, 0.0], tol=0.15), f"Beste Folge sollte nahe (-0.5, 0) liegen, ist {np.round(folge, 3)}"
      - name: Kosten passen zur Folge
        code: |
          env_t = Pendulum()
          folge, J_t = random_shooting(env_t.dynamics, env_t.cost, env_t.reset(), 200, 15, np.random.default_rng(1), -2.0, 2.0)
          assert np.shape(folge) == (15,), f"Die Folge sollte Form (15,) haben, hat {np.shape(folge)}"
          echt = rollout_costs(env_t.dynamics, env_t.cost, env_t.reset(), np.array([folge]))[0]
          assert close(J_t, echt), f"Zurückgegebene Kosten {J_t} passen nicht zur Folge (echt {echt})"
      - name: Besser als Nichtstun
        code: |
          env_t = Pendulum()
          folge, J_t = random_shooting(env_t.dynamics, env_t.cost, np.array([0.8, 0.0]), 300, 15, np.random.default_rng(2), -2.0, 2.0)
          J0 = rollout_costs(env_t.dynamics, env_t.cost, np.array([0.8, 0.0]), np.zeros((1, 15)))[0]
          assert J_t < J0, f"Die beste Zufallsfolge ({J_t:.1f}) sollte besser sein als u = 0 ({J0:.1f})"
