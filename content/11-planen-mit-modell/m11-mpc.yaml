    hints:
      - "Teilziel: Schleife über `T` Schritte – planen, erste Aktion ausführen, Zustand und Aktion speichern."
      - Geplant wird mit `modell_dyn` vom **aktuellen** Zustand `s`; ausgeführt wird mit `echt_dyn`.
      - "`plan, _ = random_shooting(modell_dyn, cost, s, N, H, rng, -2, 2)`"
      - "Danach `u = plan[0]`, `s = echt_dyn(s, u)`, `states.append(s)`, `actions.append(u)`"
  - type: quiz
    question: |
      Was passiert, wenn der MPC-Horizont $H$ sehr **kurz** ist, z. B. 2 Schritte (0,1 s) beim hängenden Pendel?
    options:
      - text: Der Planer ist kurzsichtig – er sieht nicht, dass Schwungholen sich später lohnt, und bleibt nahe unten.
        correct: true
        why: Erst über mehrere Sekunden zeigt sich, dass Ausholen die Kosten senkt. Der Horizont muss die wichtige Dynamik abdecken.
      - text: Er wird genauer, weil weniger Zufallszahlen zu wählen sind.
        correct: false
        why: Die Suche wird zwar leichter, aber das Ziel des Planers (Kosten über 2 Schritte) passt nicht mehr zum eigentlichen Ziel.
      - text: Das spielt keine Rolle, weil MPC sowieso jeden Schritt neu plant.
        correct: false
        why: Neu planen korrigiert Abweichungen, ersetzt aber nicht die fehlende Voraussicht.
cards:
  - id: m11-c-receding
    concept: plan-mpc
    variants:
      - type: quiz
        question: Was führt MPC nach jeder Planung am echten System aus?
        options:
          - text: Nur die erste Aktion der geplanten Folge
            correct: true
            why: Danach wird gemessen und vom neuen Zustand aus neu geplant.
          - text: Die ganze geplante Folge
            correct: false
            why: Das wäre offene Steuerung – ohne Korrektur.
          - text: Die letzte Aktion der Folge
            correct: false
            why: Die letzte Aktion gehört zum Ende des Horizonts, nicht zum aktuellen Zeitpunkt.
      - type: predict
        code: |
          plaene = [[5, 6, 7], [8, 9, 1], [2, 3, 4]]
          print([p[0] for p in plaene])
        options: ["[5, 8, 2]", "[5, 6, 7]", "[7, 1, 4]", "[5, 6, 7, 8, 9, 1, 2, 3, 4]"]
        answer: "[5, 8, 2]"
        explanation: Aus jedem der drei Pläne wird nur die erste Aktion ausgeführt.
  - id: m11-c-modellfehler
    concept: plan-modellfehler
    variants:
      - type: quiz
        question: Ein Planer arbeitet mit einem leicht falschen Modell. Was ist robuster?
        options:
          - text: MPC – jeden Schritt vom gemessenen Zustand aus neu planen
            correct: true
            why: Die Rückkopplung korrigiert die Abweichung, bevor sie wächst.
          - text: Einmal sehr lange und genau planen und die Folge abspielen
            correct: false
            why: Offen ausgeführt summieren sich Modellfehler über die Zeit.
          - text: Beides gleich, das Modell ist ja in beiden Fällen gleich falsch
            correct: false
            why: Das Modell ja – aber nur MPC benutzt die echten Messungen.
      - type: quiz
        question: Warum ist MPC wichtig für gelernte World Models (Modul 16)?
        options:
          - text: Gelernte Modelle sind nie exakt; MPC verhindert, dass sich ihre Fehler über lange Zeit aufsummieren.
            correct: true
            why: Ein Plan aus einem ungenauen Modell gilt nur kurz – deshalb wird ständig neu geplant.
          - text: Weil gelernte Modelle nur einen Schritt vorhersagen können
            correct: false
            why: Man kann sie beliebig oft hintereinander anwenden, nur wächst dabei der Fehler.
          - text: Weil MPC das Modell währenddessen trainiert
            correct: false
            why: MPC plant nur. Training ist ein eigener Schritt.
