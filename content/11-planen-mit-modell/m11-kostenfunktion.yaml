    hints:
      - "Teilziel: Schleife über alle Aktionen – Kosten addieren, Zustand weiterrechnen, Zustand speichern."
      - Die Reihenfolge zählt – erst `cost(s, u)` mit dem **aktuellen** Zustand, dann `s = dynamics(s, u)`.
      - |
        ```python
        for u in actions:
            total = total + cost(s, u)
            ...
        ```
      - "Im Schleifenrumpf: `total = total + cost(s, u)`, `s = dynamics(s, u)`, `states.append(s)`"
  - type: quiz
    question: |
      Welche Kostenfunktion passt, wenn der Arm mit der Spitze `fk(q)` den Punkt `ziel` erreichen und dabei nicht wild zappeln soll?
    options:
      - text: "`np.linalg.norm(fk(q) - ziel) + 0.01 * np.sum(u ** 2)`"
        correct: true
        why: Abstand zum Ziel plus kleine Strafe auf große Geschwindigkeiten – genau so ist `Reacher2D.cost` aufgebaut.
      - text: "`-np.linalg.norm(fk(q) - ziel)`"
        correct: false
        why: Mit Minuszeichen würde ein **großer** Abstand belohnt, weil Planer Kosten minimieren.
      - text: "`np.sum(q ** 2)`"
        correct: false
        why: Das bestraft nur Gelenkwinkel ungleich 0 – das Ziel kommt gar nicht vor.
cards:
  - id: m11-c-kosten-reihenfolge
    concept: plan-rollout
    variants:
      - type: predict
        code: |
          s, total = 2.0, 0.0
          for u in [1.0, 1.0]:
              total = total + s ** 2
              s = s + u
          print(total, s)
        options: ["13.0 4.0", "25.0 4.0", "29.0 4.0", "13.0 3.0"]
        answer: "13.0 4.0"
        explanation: Kosten vor jedem Schritt – $2^2 + 3^2 = 13$; der Endzustand 4 wird nicht bewertet.
      - type: predict
        code: |
          s, total = 1.0, 0.0
          for u in [-0.5, -0.5]:
              total = total + s ** 2 + u ** 2
              s = s + u
          print(total, s)
        options: ["1.75 0.0", "1.25 0.0", "0.75 0.0", "1.75 -1.0"]
        answer: "1.75 0.0"
        explanation: "Schritt 1: $1 + 0.25$, Schritt 2: $0.25 + 0.25$ – zusammen 1,75."
  - id: m11-c-funktion-als-wert
    concept: plan-rollout
    variants:
      - type: quiz
        question: Was übergibt `rollout(env.dynamics, env.cost, s0, a)` als erstes Argument?
        options:
          - text: Die Funktion `env.dynamics` selbst, damit `rollout` sie aufrufen kann
            correct: true
            why: Ohne Klammern ist `env.dynamics` ein Wert vom Typ Funktion.
          - text: Das Ergebnis eines Modellschritts
            correct: false
            why: Dafür müsste `env.dynamics(s, u)` mit Klammern und Argumenten dastehen.
          - text: Einen Fehler, weil Argumente fehlen
            correct: false
            why: Aufgerufen wird die Funktion erst in `rollout` – dort mit Argumenten.
      - type: quiz
        question: Warum bekommt ein Planer Modell und Kosten als Funktionsargumente?
        options:
          - text: So funktioniert derselbe Planer für Pendel, Arm oder ein gelerntes Modell.
            correct: true
            why: Der Planer braucht nur „Zustand + Aktion → nächster Zustand“ und „Kosten“, nicht die Physik dahinter.
          - text: Weil Python sonst die Umgebung nicht importieren kann
            correct: false
            why: Mit Importen hat das nichts zu tun – es geht um Wiederverwendbarkeit.
          - text: Damit die Simulation schneller läuft
            correct: false
            why: Die Übergabe einer Funktion macht nichts schneller; sie macht den Code allgemein.
  - id: m11-c-kosten-normiert
    concept: plan-kosten
    variants:
      - type: quiz
        question: Warum normiert `Pendulum.cost` den Winkel auf $[-\pi, \pi)$, bevor er quadriert wird?
        options:
          - text: "$\\theta = 2\\pi$ ist dieselbe Stellung wie $\\theta = 0$ und soll auch nichts kosten."
            correct: true
            why: Ohne Normierung würde eine volle Umdrehung bestraft, obwohl das Pendel oben steht.
          - text: Damit die Kosten nie größer als 1 werden
            correct: false
            why: Unten kostet ein Schritt fast $\pi^2 \approx 9.9$.
          - text: Weil `np.sin` sonst falsche Werte liefert
            correct: false
            why: Sinus ist $2\pi$-periodisch; die Normierung betrifft nur das Quadrat in den Kosten.
      - type: predict
        code: |
          import numpy as np
          from lab.envs import angle_normalize
          print(round(float(angle_normalize(3 * np.pi / 2)), 3))
        options: ["-1.571", "4.712", "1.571", "-4.712"]
        answer: "-1.571"
        explanation: $3\pi/2$ ist dieselbe Stellung wie $-\pi/2$ – waagrecht, eine Vierteldrehung im Uhrzeigersinn von oben.
