id: m11-cem
title: Cross-Entropy-Method (CEM)
minutes: 10
goals:
  - Den CEM-Algorithmus (sampeln, Elite wählen, Verteilung anpassen) erklären
  - CEM für beliebige Batch-Kostenfunktionen selbst implementieren
  - CEM als Planer mit Random Shooting bei gleichem Rechenbudget vergleichen
concepts: [plan-cem, plan-elite]
steps:
  - type: text
    body: |
      ## Die Suche verfeinern

      Random Shooting zieht jedes Mal blind neu. Die **Cross-Entropy-Method** (CEM) lernt aus jedem Durchgang, **wo** gute Lösungen liegen:

      1. $N$ Samples aus $N(\mu, \sigma^2)$ ziehen (diagonal, wie in Modul 10).
      2. Alle bewerten, die $K$ besten behalten (z. B. 10 % der Samples) – die **Elite**.
      3. $\mu \leftarrow$ Mittelwert der Elite, $\sigma \leftarrow$ Standardabweichung der Elite.
      4. Wiederholen.

      Die Verteilung wandert zu den guten Samples und zieht sich dort zusammen. Für den Planer ist ein Sample eine ganze Aktionsfolge – $\mu$ und $\sigma$ haben dann die Form `(H,)`.
  - type: example
    intro: |
      Erst an einer 2D-Funktion mit bekanntem Minimum bei $(1, -0.5)$: $f(a) = (a_1 - 1)^2 + 4\,(a_2 + 0.5)^2$. `f` bewertet einen ganzen Batch `A` der Form `(N, 2)` auf einmal.
    code: |
      import numpy as np
      import lab

      def f(A):
          return (A[:, 0] - 1) ** 2 + 4 * (A[:, 1] + 0.5) ** 2

      rng = np.random.default_rng(0)
      mu = np.array([-1.5, 1.5])
      sigma = np.array([2.5, 2.5])
      fig = lab.Figure(title="CEM: Samples pro Iteration", xlabel="a1", ylabel="a2")
      for it in range(5):
          A = mu + sigma * rng.standard_normal((100, 2))
          c = f(A)
          elite = A[np.argsort(c)[:10]]
          mu = elite.mean(axis=0)
          sigma = elite.std(axis=0)
          fig.scatter(A[:, 0], A[:, 1], label=f"Iteration {it}")
          print(it, np.round(mu, 3), np.round(sigma, 3))
      fig.scatter([1.0], [-0.5], label="Minimum")
      fig.show()
    subgoals:
      - lines: [8, 9]
        label: Startverteilung festlegen
      - lines: [12, 13]
        label: Sampeln und bewerten
      - lines: 14
        label: Elite auswählen
      - lines: [15, 16]
        label: Verteilung an die Elite anpassen
    after: |
      Nach 5 Iterationen à 100 Samples sitzt $\mu$ auf $(1, -0.5)$. Die Punktwolken schrumpfen von Iteration zu Iteration – sichtbar im Plot und an $\sigma$.
  - type: predict
    code: |
      import numpy as np
      c = np.array([3.0, 1.0, 4.0, 1.5, 9.0])
      print(np.argsort(c)[:2])
    options: ["[1 3]", "[1. 1.5]", "[4 2]", "[0 1]"]
    answer: "[1 3]"
    explanation: |
      `np.argsort` liefert die **Indizes** in aufsteigender Reihenfolge der Werte: kleinster Wert (1.0) bei Index 1, dann 1.5 bei Index 3. Die Werte selbst wären `np.sort(c)[:2]`.
  - type: explain
    question: |
      $\sigma$ schrumpft bei CEM von Iteration zu Iteration. Was ist daran gut – und was ist die Gefahr?
    options:
      - text: Gut, weil die Suche sich auf den vielversprechenden Bereich konzentriert; gefährlich, weil $\sigma$ zu früh kollabieren kann, bevor das Minimum erreicht ist.
        correct: true
        why: Startet man weit weg mit zu wenig Streuung, bleibt CEM irgendwo stehen. Abhilfe in der Praxis – genug Start-$\sigma$, mehr Samples oder eine Untergrenze für $\sigma$.
      - text: Das ist ein Fehler im Algorithmus; $\sigma$ sollte konstant bleiben.
        correct: false
        why: Ohne Anpassung von $\sigma$ würde die Suche nie feiner – das Ergebnis bliebe so grob wie die Startverteilung.
      - text: Gut, weil dann weniger Samples gezogen werden.
        correct: false
        why: Gezogen werden immer $N$ Samples; nur ihre Streuung wird kleiner.
  - type: fill
    fading: true
    prompt: |
      Ergänze eine CEM-Iteration: Elite auswählen und den neuen Mittelwert **pro Komponente** berechnen.
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      mu, sigma = np.zeros(3), np.ones(3)
      n_elite = 5
      A = mu + sigma * rng.standard_normal((50, 3))
      c = np.sum((A - 2.0) ** 2, axis=1)
      elite = A[np.argsort(c)[:___]]
      mu = elite.mean(axis=___)
    blanks:
      - answer: "n_elite"
        options: ["n_elite", "50", "-n_elite", "1"]
      - answer: "0"
        options: ["0", "1", "None"]
    tests:
      - name: Elite und Mittelwert
        code: |
          assert elite.shape == (5, 3), f"Die Elite sollte 5 Samples à 3 Werte haben, Form {elite.shape}"
          beste = A[np.argsort(c)[:5]]
          assert close(mu, beste.mean(axis=0)), f"mu sollte der Mittelwert der 5 besten Samples pro Komponente sein, ist {mu}"
  - type: exercise
    mode: make
    prompt: |
      Schreibe `cem(f, mu, sigma, N, n_elite, iters, rng)`. `f` bewertet einen Batch `A` (erste Achse = Samples) und liefert ein Kosten-Array der Länge `N`. `mu` und `sigma` haben dieselbe Form (z. B. `(H,)` oder `(H, 2)`).

      In jeder der `iters` Iterationen: `N` Samples ziehen, bewerten, `n_elite` beste wählen, `mu` und `sigma` auf Mittelwert und Standardabweichung der Elite setzen. Rückgabe: `(mu, sigma)`.
    starter: |
      import numpy as np

      def cem(f, mu, sigma, N, n_elite, iters, rng):
          for it in range(iters):
              A = mu + sigma * rng.standard_normal((N,) + mu.shape)
              # bewerten, Elite wählen, mu und sigma anpassen
          return mu, sigma

      ziel = np.array([1.0, -2.0, 0.5])
      def f(A):
          return np.sum((A - ziel) ** 2, axis=1)

      mu, sigma = cem(f, np.zeros(3), np.full(3, 2.0), 100, 10, 10, np.random.default_rng(0))
      print(np.round(mu, 3))
    solution: |
      import numpy as np

      def cem(f, mu, sigma, N, n_elite, iters, rng):
          for it in range(iters):
              A = mu + sigma * rng.standard_normal((N,) + mu.shape)
              c = f(A)
              elite = A[np.argsort(c)[:n_elite]]
              mu = elite.mean(axis=0)
              sigma = elite.std(axis=0)
          return mu, sigma

      ziel = np.array([1.0, -2.0, 0.5])
      def f(A):
          return np.sum((A - ziel) ** 2, axis=1)

      mu, sigma = cem(f, np.zeros(3), np.full(3, 2.0), 100, 10, 10, np.random.default_rng(0))
      print(np.round(mu, 3))
    tests:
      - name: Findet das Minimum (3D)
        code: |
          ziel_t = np.array([1.0, -2.0, 0.5])
          def f_t(A):
              return np.sum((A - ziel_t) ** 2, axis=1)
          r = cem(f_t, np.zeros(3), np.full(3, 2.0), 100, 10, 10, np.random.default_rng(1))
          assert r is not None, "Die Funktion gibt nichts zurück – fehlt return?"
          mu_t, sigma_t = r
          assert close(mu_t, ziel_t, tol=0.05), f"mu sollte gegen das Minimum {ziel_t} konvergieren, ist {np.round(mu_t, 3)}"
          assert np.all(sigma_t < 0.5), f"sigma sollte geschrumpft sein, ist {np.round(sigma_t, 3)}"
      - name: Funktioniert für Folgen der Form (H, 2)
        code: |
          ziel_t = np.array([[0.5, -0.5], [1.0, 0.0], [0.0, 1.5], [-1.0, 0.2]])
          def f_t(A):
              return np.sum((A - ziel_t) ** 2, axis=(1, 2))
          mu_t, sigma_t = cem(f_t, np.zeros((4, 2)), np.full((4, 2), 2.0), 200, 20, 12, np.random.default_rng(2))
          assert np.shape(mu_t) == (4, 2), f"mu sollte Form (4, 2) behalten, hat {np.shape(mu_t)}"
          assert close(mu_t, ziel_t, tol=0.1), f"mu sollte nahe {ziel_t.tolist()} liegen, ist {np.round(mu_t, 2).tolist()}"
