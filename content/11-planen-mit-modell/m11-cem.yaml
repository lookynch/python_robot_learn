    hints:
      - "Teilziel: bewerten → Elite per Index auswählen → Mittelwert und Streuung der Elite."
      - "`np.argsort(c)` sortiert aufsteigend – die ersten `n_elite` Indizes gehören zu den kleinsten Kosten. Gemittelt wird über die Samples, also `axis=0`."
      - "`c = f(A)` und `elite = A[np.argsort(c)[:n_elite]]`"
      - "`mu = elite.mean(axis=0)` und `sigma = elite.std(axis=0)`"
  - type: example
    intro: |
      Jetzt als Planer: Eine Folge von 40 Drehmomenten für das hängende Pendel. Beide Verfahren bekommen dasselbe Budget von 1000 Rollouts – Random Shooting auf einmal, CEM in 10 Runden à 100.
    code: |
      import numpy as np
      import lab
      from lab.envs import Pendulum

      def rollout_costs(dynamics, cost, s0, A):
          s = np.tile(s0, (A.shape[0], 1))
          total = np.zeros(A.shape[0])
          for t in range(A.shape[1]):
              total = total + cost(s, A[:, t])
              s = dynamics(s, A[:, t])
          return total

      env = Pendulum()
      s0 = env.reset()
      def f(A):
          return rollout_costs(env.dynamics, env.cost, s0, A)

      rng = np.random.default_rng(0)
      rs = np.min(f(rng.uniform(-2, 2, size=(1000, 40))))

      mu, sigma = np.zeros(40), np.full(40, 1.5)
      verlauf = []
      for it in range(10):
          A = mu + sigma * rng.standard_normal((100, 40))
          elite = A[np.argsort(f(A))[:10]]
          mu, sigma = elite.mean(axis=0), elite.std(axis=0)
          verlauf.append(f(mu[None])[0])
      print("Random Shooting:", round(float(rs), 1), " CEM:", round(float(verlauf[-1]), 1))

      fig = lab.Figure(title="Kosten der CEM-Folge", xlabel="Iteration", ylabel="J")
      fig.line(verlauf, label="CEM-Mittelwert μ")
      fig.hline(rs, label="Random Shooting (1000)")
      fig.show()
    subgoals:
      - lines: [14, 16]
        label: Batch-Kostenfunktion für den Planer
      - lines: [18, 19]
        label: Random Shooting als Vergleich
      - lines: [21, 27]
        label: CEM-Iterationen
      - lines: [30, 33]
        label: Kostenverlauf zeigen
    after: |
      Mit gleichem Budget kommt CEM auf deutlich kleinere Kosten (≈ 257 statt ≈ 332). `mu[None]` macht aus der Folge `(40,)` einen Batch `(1, 40)`, damit `f` sie bewerten kann. Ganz hoch kommt das Pendel mit einem einzigen offenen Plan noch nicht – dafür kombinieren wir in Kürze Planer **und** MPC.
  - type: quiz
    question: |
      Was unterscheidet CEM grundsätzlich von Random Shooting?
    options:
      - text: CEM passt die Sampling-Verteilung an die besten Samples an und sucht dadurch gezielt weiter.
        correct: true
        why: Random Shooting vergisst nach jedem Zug alles; CEM nutzt die Elite als Information für die nächste Runde.
      - text: CEM braucht kein Modell.
        correct: false
        why: Beide bewerten Samples mit Rollouts im Modell.
      - text: CEM findet immer das globale Minimum.
        correct: false
        why: CEM ist eine stochastische, lokale Suche – sie kann in einem Nebenminimum hängen bleiben oder zu früh zusammenfallen.
cards:
  - id: m11-c-argsort-elite
    concept: plan-elite
    variants:
      - type: predict
        code: |
          import numpy as np
          c = np.array([5.0, 0.5, 2.0, 8.0])
          print(np.argsort(c)[:2])
        options: ["[1 2]", "[3 0]", "[0.5 2. ]", "[0 1]"]
        answer: "[1 2]"
        explanation: Indizes aufsteigend nach Kosten – 0.5 (Index 1), dann 2.0 (Index 2).
      - type: predict
        code: |
          import numpy as np
          A = np.array([[0.0, 1.0], [2.0, 2.0], [4.0, 0.0]])
          c = np.array([3.0, 1.0, 2.0])
          elite = A[np.argsort(c)[:2]]
          print(elite.mean(axis=0))
        options: ["[3. 1.]", "[1. 1.5]", "[2. 1.]", "[1.5 2. ]"]
        answer: "[3. 1.]"
        explanation: Die zwei billigsten Samples sind Zeile 1 und Zeile 2; ihr Mittelwert pro Spalte ist $(3, 1)$.
  - id: m11-c-cem-schritte
    concept: plan-cem
    variants:
      - type: quiz
        question: Was passiert in einer CEM-Iteration **nach** der Auswahl der Elite?
        options:
          - text: $\mu$ und $\sigma$ werden auf Mittelwert und Standardabweichung der Elite gesetzt.
            correct: true
            why: Die neue Verteilung beschreibt, wo die guten Samples lagen.
          - text: Die Elite wird ausgeführt.
            correct: false
            why: Ausgeführt wird erst am Ende (bei MPC nur die erste Aktion von $\mu$).
          - text: Alle Samples außer der Elite werden mit $\sigma$ multipliziert.
            correct: false
            why: Nicht-Elite-Samples werden einfach verworfen.
      - type: quiz
        question: Bei CEM ist $\sigma$ nach zwei Iterationen fast 0, $\mu$ aber noch weit vom Minimum. Was hilft am ehesten?
        options:
          - text: Größeres Start-$\sigma$ oder mehr Samples pro Iteration
            correct: true
            why: Die Verteilung ist zu früh kollabiert. Mehr Streuung oder mehr Samples erhalten die Suche.
          - text: Weniger Iterationen
            correct: false
            why: Das Problem entsteht früh; weniger Iterationen ändern daran nichts.
          - text: Die Elite aus den **schlechtesten** Samples bilden
            correct: false
            why: Dann läuft die Suche vom Minimum weg.
