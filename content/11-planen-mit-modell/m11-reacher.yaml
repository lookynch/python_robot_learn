  - type: example
    intro: |
      MPC reagiert sofort, wenn sich das Ziel ändert – es plant ja jeden Schritt neu. Hier springt das Ziel alle 40 Schritte (2 s).
    code: |
      import numpy as np
      import lab
      from lab.envs import Reacher2D

      def rollout_costs(dynamics, cost, s0, A):
          s = np.tile(s0, (A.shape[0], 1))
          total = np.zeros(A.shape[0])
          for t in range(A.shape[1]):
              total = total + cost(s, A[:, t])
              s = dynamics(s, A[:, t])
          return total

      def cem(f, mu, sigma, N, n_elite, iters, rng):
          for it in range(iters):
              A = mu + sigma * rng.standard_normal((N,) + mu.shape)
              elite = A[np.argsort(f(A))[:n_elite]]
              mu, sigma = elite.mean(axis=0), elite.std(axis=0)
          return mu, sigma

      env = Reacher2D()
      rng = np.random.default_rng(0)
      q, mu = np.zeros(2), np.zeros((10, 2))
      szene = lab.Scene(title="Wechselnde Ziele", bounds=[-2.3, 2.3, -2.3, 2.3], fps=20)
      szene.circle(0, 0, 2.0, color="muted", width=1, static=True)
      for i, ziel in enumerate([(-0.5, 1.2), (1.4, -0.6), (-1.2, -1.0)]):
          env.reset(q=q, goal=ziel)
          for k in range(40):
              def f(A):
                  return rollout_costs(env.dynamics, env.cost, q, A)
              mu, _ = cem(f, mu, np.ones((10, 2)), 60, 6, 3, rng)
              q = env.dynamics(q, mu[0])
              mu = np.vstack([mu[1:], np.zeros((1, 2))])
              szene.circle(ziel[0], ziel[1], 0.08, color="bad", fill="bad")
              szene.line(lab.arm_points(q), color="c1", width=6)
              szene.caption(f"Ziel {i + 1}, Abstand {np.linalg.norm(env.fk(q) - env.goal):.2f} m")
              szene.next_frame()
          print("Ziel", i + 1, "Abstand:", round(float(np.linalg.norm(env.fk(q) - env.goal)), 2))
      szene.show()
    subgoals:
      - lines: [23, 24]
        label: Szene vorbereiten
      - lines: [25, 26]
        label: Neues Ziel setzen
      - lines: [27, 31]
        label: CEM-MPC-Schritt
      - lines: [32, 35]
        label: Frame zeichnen
    after: |
      Nach jedem Zielwechsel dreht der Arm sofort um. Die Gelenkgeschwindigkeit ist auf 2 rad/s begrenzt, deshalb dauert ein großer Umweg sichtbar länger. Dasselbe Programm würde mit einem **gelernten** Modell statt `env.dynamics` funktionieren – genau das baust du in Modul 16.
  - type: predict
    intro: |
      Das Ziel $(0, 3)$ liegt außerhalb der Reichweite (beide Glieder 1 m). Welcher Endabstand ist nach 40 Schritten CEM-MPC zu erwarten?
    code: |
      import numpy as np
      from lab.envs import Reacher2D

      def rollout_costs(dynamics, cost, s0, A):
          s = np.tile(s0, (A.shape[0], 1))
          total = np.zeros(A.shape[0])
          for t in range(A.shape[1]):
              total = total + cost(s, A[:, t])
              s = dynamics(s, A[:, t])
          return total

      def cem(f, mu, sigma, N, n_elite, iters, rng):
          for it in range(iters):
              A = mu + sigma * rng.standard_normal((N,) + mu.shape)
              elite = A[np.argsort(f(A))[:n_elite]]
              mu, sigma = elite.mean(axis=0), elite.std(axis=0)
          return mu, sigma

      env = Reacher2D()
      q = env.reset(q=(0.0, 0.0), goal=(0.0, 3.0))[:2]
      rng = np.random.default_rng(0)
      mu = np.zeros((10, 2))
      for k in range(40):
          def f(A):
              return rollout_costs(env.dynamics, env.cost, q, A)
          mu, _ = cem(f, mu, np.ones((10, 2)), 60, 6, 3, rng)
          q = env.dynamics(q, mu[0])
          mu = np.vstack([mu[1:], np.zeros((1, 2))])
      print(round(float(np.linalg.norm(env.fk(q) - env.goal)), 1))
    options: ["1.0", "0.0", "3.0", "2.0"]
    answer: "1.0"
    explanation: |
      Der Planer minimiert den Abstand, so gut es geht: Er streckt den Arm ($q_2 \approx 0$) in Richtung Ziel ($q_1 \approx \pi/2$). Die Spitze steht dann bei $(0, 2)$ – 1 m vor dem Ziel. Ein Planer meldet keinen Fehler; ob ein Ziel erreichbar ist, muss man selbst prüfen.
  - type: quiz
    question: |
      Ohne den Term $0.01\,\lVert u \rVert^2$ in den Kosten zittert der Arm am Ziel stärker. Warum?
    options:
      - text: Dann sind alle Geschwindigkeiten gleich teuer, und zufällige, große Ausgleichsbewegungen werden nicht bestraft.
        correct: true
        why: Der kleine Aufwandsterm macht unter fast gleich guten Folgen die ruhigere zur besseren – ein übliches Mittel gegen Zappeln.
      - text: Weil das Modell ohne den Term instabil wird
        correct: false
        why: Das Modell ist unabhängig von der Kostenfunktion; nur die Bewertung der Folgen ändert sich.
      - text: Weil der Arm sonst das Ziel nicht erreichen kann
        correct: false
        why: Erreichen kann er es weiterhin – der Term betrifft die Ruhe, nicht die Erreichbarkeit.
cards:
  - id: m11-c-aktion-form
    concept: plan-mehrdim-aktion
    variants:
      - type: predict
        code: |
          import numpy as np
          A = np.zeros((60, 10, 2))
          print(A[:, 0].shape, A[0].shape)
        options: ["(60, 2) (10, 2)", "(10, 2) (60, 2)", "(60,) (10,)", "(60, 10) (10, 2)"]
        answer: "(60, 2) (10, 2)"
        explanation: "`A[:, 0]`: erste Aktion aller 60 Folgen. `A[0]`: die ganze erste Folge mit 10 Aktionsvektoren."
      - type: quiz
        question: Welche Form hat ein CEM-Mittelwert `mu` für den Arm mit Horizont 15?
        options:
          - text: "`(15, 2)`"
            correct: true
            why: 15 Zeitschritte, je 2 Gelenkgeschwindigkeiten.
          - text: "`(2, 15)`"
            correct: false
            why: Konvention hier – Zeit zuerst, damit `mu[0]` die nächste Aktion ist.
          - text: "`(15,)`"
            correct: false
            why: Das reicht nur für eine skalare Aktion wie beim Pendel.
  - id: m11-c-unerreichbar
    concept: plan-mehrdim-aktion
    variants:
      - type: quiz
        question: Ein Ziel liegt 2,5 m von der Basis entfernt, der Arm reicht 2 m. Was macht ein Planer, der den Abstand minimiert?
        options:
          - text: Er streckt den Arm in Richtung Ziel; es bleibt ein Abstand von etwa 0,5 m.
            correct: true
            why: Das ist das Minimum der Kosten über den Arbeitsraum.
          - text: Er meldet einen Fehler.
            correct: false
            why: Ein Sampling-Planer optimiert nur – er weiß nichts von Erreichbarkeit.
          - text: Er bleibt in der Startstellung stehen.
            correct: false
            why: Jede Annäherung senkt die Kosten, also bewegt er sich.
      - type: quiz
        question: "Ziel $(3, 0)$, Arm mit $l_1 = l_2 = 1$ m startet gestreckt bei $q = (0, 0)$. Was passiert?"
        options:
          - text: Fast nichts – der Arm zeigt schon zum Ziel, der Abstand bleibt 1 m.
            correct: true
            why: Gestreckt entlang der x-Achse liegt die Spitze bei $(2, 0)$, näher geht es nicht.
          - text: Der Arm dreht sich, bis der Abstand 0 ist.
            correct: false
            why: Das Ziel liegt außerhalb der Reichweite von 2 m.
          - text: Der Arm knickt ein, um das Ziel zu erreichen.
            correct: false
            why: Einknicken verkürzt die Reichweite und erhöht den Abstand.
  - id: m11-c-mpc-zielwechsel
    concept: plan-mpc
    variants:
      - type: quiz
        question: Warum reagiert der Arm im MPC sofort auf ein neues Ziel?
        options:
          - text: Weil in jedem Schritt mit der aktuellen Kostenfunktion neu geplant wird
            correct: true
            why: Das neue Ziel steckt sofort in den Kosten, also auch im nächsten Plan.
          - text: Weil der Warmstart das neue Ziel kennt
            correct: false
            why: Der Warmstart enthält den **alten** Plan – er wird nach dem Zielwechsel schnell überschrieben.
          - text: Weil die Gelenke keine Geschwindigkeitsgrenze haben
            correct: false
            why: Doch, ±2 rad/s – deshalb dauert ein großer Umweg sichtbar länger.
      - type: quiz
        question: Das Ziel springt plötzlich auf die andere Seite. Warum braucht der Arm trotz MPC ein, zwei Sekunden?
        options:
          - text: Die Gelenkgeschwindigkeit ist auf 2 rad/s begrenzt – ein halber Umlauf ($\pi$ rad) dauert mindestens etwa 1,6 s.
            correct: true
            why: Der Planer reagiert sofort, die Physik (hier die Geschwindigkeitsgrenze) bestimmt das Tempo.
          - text: Weil MPC erst nach einigen Schritten neu plant
            correct: false
            why: MPC plant in jedem Schritt neu.
          - text: Weil der Warmstart das alte Ziel dauerhaft festhält
            correct: false
            why: Der alte Plan ist nur der Startpunkt und wird nach wenigen Updates ersetzt.
