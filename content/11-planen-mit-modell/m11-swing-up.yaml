id: m11-swing-up
title: "Höhepunkt: Pendel-Swing-up mit MPPI"
minutes: 12
goals:
  - MPPI und MPC zu einem Echtzeit-Planer verbinden
  - Den Plan per Warmstart von Schritt zu Schritt weiterverwenden
  - Das Pendel aus der hängenden Lage nach oben schwingen und halten
concepts: [plan-warmstart, plan-unteraktuiert, plan-mppi, plan-mpc]
steps:
  - type: text
    body: |
      ## Ein schwacher Motor muss Schwung holen

      Das Pendel hängt, der Motor schafft höchstens 2 N·m, die Schwerkraft bis zu 5 N·m. Kein PD-Regler und kein konstantes Moment bringen es direkt hoch – ein Planer muss **erfinden**, dass Hin- und Herpumpen Energie aufbaut.

      Rezept: MPC mit **einem** MPPI-Update pro Zeitschritt (64 Samples, Horizont 15 Schritte = 0,75 s). Damit ein einziges Update reicht, braucht es einen Trick – den **Warmstart**: Der Plan von eben ist auch jetzt noch fast richtig, nur um einen Schritt verschoben.

      $$
      \mu = (u_0, u_1, \dots, u_{H-1}) \;\xrightarrow{u_0 \text{ ausführen}}\; (u_1, \dots, u_{H-1}, 0)
      $$

      Zuerst ohne Warmstart – als Vergleich.
  - type: example
    code: |
      import numpy as np
      from lab.envs import Pendulum, angle_normalize

      def rollout_costs(dynamics, cost, s0, A):
          s = np.tile(s0, (A.shape[0], 1))
          total = np.zeros(A.shape[0])
          for t in range(A.shape[1]):
              total = total + cost(s, A[:, t])
              s = dynamics(s, A[:, t])
          return total

      def mppi_update(f, mu, sigma, N, lam, rng):
          A = mu + sigma * rng.standard_normal((N,) + mu.shape)
          c = f(A)
          w = np.exp(-(c - c.min()) / lam)
          return np.average(A, axis=0, weights=w)

      env = Pendulum()
      s = env.reset()
      rng = np.random.default_rng(0)
      states = [s]
      for k in range(100):
          mu = np.zeros(15)
          def f(A):
              return rollout_costs(env.dynamics, env.cost, s, A)
          mu = mppi_update(f, mu, 1.0, 64, 1.0, rng)
          s = env.dynamics(s, mu[0])
          states.append(s)

      states = np.array(states)
      print("max |θ| in den letzten 20 Schritten:", round(float(np.max(np.abs(angle_normalize(states[-20:, 0])))), 2))
      env.render(states, title="MPPI ohne Warmstart")
    subgoals:
      - lines: [4, 16]
        label: Bausteine aus den letzten Lektionen
      - lines: [22, 23]
        label: Jeden Schritt kalt starten
      - lines: [24, 26]
        label: Ein MPPI-Update vom aktuellen Zustand
      - lines: [27, 28]
        label: Erste Aktion ausführen
    after: |
      Das Pendel wackelt unten herum (max $|\theta| \approx 2.5$ rad). Ein einziges Update mit 64 Samples aus $N(0, 1)$ ist zu wenig, um jedes Mal von vorn eine gute 15-Schritte-Folge zu finden. `def f(A)` steht **in** der Schleife, damit `f` immer vom aktuellen `s` aus simuliert.
  - type: predict
    code: |
      import numpy as np
      mu = np.array([1.0, 2.0, 3.0])
      mu = np.append(mu[1:], 0.0)
      print(mu)
    options: ["[2. 3. 0.]", "[0. 1. 2.]", "[1. 2. 3. 0.]", "[0. 2. 3.]"]
    answer: "[2. 3. 0.]"
    explanation: |
      `mu[1:]` wirft die gerade ausgeführte erste Aktion weg, `np.append(…, 0.0)` hängt hinten einen neuen Wert an – die Länge bleibt $H$. `[0. 1. 2.]` wäre die Verschiebung in die falsche Richtung.
  - type: explain
    question: |
      Warum hilft der Warmstart so stark?
    options:
      - text: Jedes Update verfeinert den Plan von gestern weiter – über viele Zeitschritte summieren sich die Verbesserungen, statt jedes Mal neu bei null zu beginnen.
        correct: true
        why: MPC mit Warmstart verteilt die Optimierung über die Zeit. Ein Update pro Schritt genügt dann, weil die Startverteilung schon in der Nähe einer guten Lösung liegt.
      - text: Weil der verschobene Plan genau optimal ist
        correct: false
        why: Er ist nur ein guter Startpunkt – am Ende fehlt ein Schritt (mit 0 aufgefüllt), und der Zustand weicht ab.
      - text: Weil dadurch mehr Samples gezogen werden
        correct: false
        why: Die Samplezahl bleibt 64; nur ihr Mittelpunkt ist besser gewählt.
  - type: exercise
    mode: modify
    prompt: |
      Ändere `swing_up` so, dass der Plan **warm gestartet** wird:

      - die Zeile, die `mu` jeden Schritt auf null setzt, entfernen,
      - nach dem Ausführen von `u` den Plan um einen Schritt verschieben und hinten `0.0` anhängen.

      Ziel: Nach 100 Schritten (5 s) steht das Pendel oben.
    starter: |
      import numpy as np
      from lab.envs import Pendulum, angle_normalize

      def rollout_costs(dynamics, cost, s0, A):
          s = np.tile(s0, (A.shape[0], 1))
          total = np.zeros(A.shape[0])
          for t in range(A.shape[1]):
              total = total + cost(s, A[:, t])
              s = dynamics(s, A[:, t])
          return total

      def mppi_update(f, mu, sigma, N, lam, rng):
          A = mu + sigma * rng.standard_normal((N,) + mu.shape)
          c = f(A)
          w = np.exp(-(c - c.min()) / lam)
          return np.average(A, axis=0, weights=w)

      def swing_up(T, N, H, lam, rng):
          env = Pendulum()
          s = env.reset()
          mu = np.zeros(H)
          states, actions = [s], []
          for k in range(T):
              mu = np.zeros(H)
              def f(A):
                  return rollout_costs(env.dynamics, env.cost, s, A)
              mu = mppi_update(f, mu, 1.0, N, lam, rng)
              u = mu[0]
              s = env.dynamics(s, u)
              states.append(s)
              actions.append(u)
          return np.array(states), np.array(actions)

      states, actions = swing_up(100, 64, 15, 1.0, np.random.default_rng(0))
      Pendulum().render(states, title="Swing-up mit MPPI")
    solution: |
      import numpy as np
      from lab.envs import Pendulum, angle_normalize

      def rollout_costs(dynamics, cost, s0, A):
          s = np.tile(s0, (A.shape[0], 1))
          total = np.zeros(A.shape[0])
          for t in range(A.shape[1]):
              total = total + cost(s, A[:, t])
              s = dynamics(s, A[:, t])
          return total

      def mppi_update(f, mu, sigma, N, lam, rng):
          A = mu + sigma * rng.standard_normal((N,) + mu.shape)
          c = f(A)
          w = np.exp(-(c - c.min()) / lam)
          return np.average(A, axis=0, weights=w)

      def swing_up(T, N, H, lam, rng):
          env = Pendulum()
          s = env.reset()
          mu = np.zeros(H)
          states, actions = [s], []
          for k in range(T):
              def f(A):
                  return rollout_costs(env.dynamics, env.cost, s, A)
              mu = mppi_update(f, mu, 1.0, N, lam, rng)
              u = mu[0]
              s = env.dynamics(s, u)
              states.append(s)
              actions.append(u)
              mu = np.append(mu[1:], 0.0)
          return np.array(states), np.array(actions)

      states, actions = swing_up(100, 64, 15, 1.0, np.random.default_rng(0))
      Pendulum().render(states, title="Swing-up mit MPPI")
    tests:
      - name: Zustände passen zum Modell
        code: |
          S_t, U_t = swing_up(10, 16, 5, 1.0, np.random.default_rng(3))
          env_t = Pendulum()
          assert np.shape(S_t) == (11, 2) and np.shape(U_t) == (10,), f"Formen (11, 2) und (10,) erwartet, bekommen {np.shape(S_t)} und {np.shape(U_t)}"
          for k in range(10):
              assert close(S_t[k + 1], env_t.dynamics(S_t[k], U_t[k])), f"states[{k + 1}] passt nicht zu dynamics(states[{k}], actions[{k}])"
      - name: Pendel steht nach 5 s oben
        code: |
          S_t, U_t = swing_up(100, 64, 15, 1.0, np.random.default_rng(0))
          rest = np.abs(angle_normalize(S_t[-20:, 0]))
          assert rest.max() < 0.3, f"In den letzten 20 Schritten sollte |θ| < 0.3 rad sein, maximal {rest.max():.2f} rad – wird der Plan warm gestartet?"
