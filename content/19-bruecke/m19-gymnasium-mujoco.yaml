id: m19-gymnasium-mujoco
title: Gymnasium und MuJoCo – Reacher-v5
minutes: 11
goals:
  - Die Gymnasium-Schnittstelle mit terminated und truncated anwenden
  - Reacher2D aus lab.envs in eine Gymnasium-artige Umgebung verpacken
  - Reacher-v5 (MuJoCo) mit Reacher2D vergleichen
concepts: [gymnasium-api, terminated-truncated]
steps:
  - type: text
    body: |
      ## Die Standard-Schnittstelle

      **Gymnasium** (Farama Foundation) ist die Standard-API für RL-Umgebungen in Python, aktuell Version 1.4.0 vom 05.10.2026 ([PyPI](https://pypi.org/project/gymnasium/)). Die Schleife sieht so aus ([Doku](https://gymnasium.farama.org/introduction/basic_usage/)) – nur außerhalb dieser App lauffähig:

      ```python
      import gymnasium as gym

      env = gym.make("Reacher-v5")
      obs, info = env.reset(seed=0)
      episode_over = False
      while not episode_over:
          action = env.action_space.sample()      # hier kommt deine Policy hin
          obs, reward, terminated, truncated, info = env.step(action)
          episode_over = terminated or truncated
      env.close()
      ```

      *Stand: Oktober 2026.*
  - type: text
    body: |
      ## Zwei Arten, aufzuhören

      - `terminated = True`: Die Episode ist **wirklich** zu Ende – Ziel erreicht, Pendel umgefallen, Absturz. Danach gibt es keine Zukunft mehr.
      - `truncated = True`: Die Episode wurde **künstlich** abgebrochen, meist durch ein Zeitlimit. Die Welt ginge eigentlich weiter.

      Reacher-v5 terminiert laut Doku **nie**; jede Episode wird nach 50 Schritten abgeschnitten ([Reacher-Doku](https://gymnasium.farama.org/environments/mujoco/reacher/)). `lab.envs.Reacher2D.step` kennt nur ein `done` – das ist dort „Ziel erreicht“, also `terminated`.
  - type: explain
    question: |
      Warum ist die Unterscheidung für TD-Lernen (Q-Learning, Actor-Critic) wichtig?
    options:
      - text: Bei terminated ist der Wert danach 0, das Ziel ist nur $r$; bei truncated geht die Welt weiter, also $r + \gamma V(s')$.
        correct: true
        why: Genau. Wer ein Zeitlimit wie ein echtes Ende behandelt, bringt dem Agenten bei, dass kurz vor Schluss „nichts mehr kommt“ – das verfälscht die Werte.
      - text: Bei truncated muss man die ganze Episode verwerfen.
        correct: false
        why: Die Daten sind gültig; nur das Bootstrapping am Ende muss richtig behandelt werden.
      - text: Die Unterscheidung ist nur für die Anzeige wichtig.
        correct: false
        why: Sie ändert das Lernziel und damit, was der Agent lernt.
      - text: Bei terminated wird $r + \gamma V(s')$ benutzt, bei truncated nur $r$.
        correct: false
        why: Genau umgekehrt – nach einem echten Ende gibt es keinen Folgewert.
  - type: exercise
    mode: make
    prompt: |
      Verpacke `Reacher2D` Gymnasium-artig. Ergänze `step`:

      - Schrittzähler `self.t` um 1 erhöhen,
      - `terminated` ist das `done` von `Reacher2D` (Ziel erreicht),
      - `truncated` ist `True`, sobald `self.t` den Wert `self.max_steps` erreicht.
    starter: |
      import numpy as np
      from lab.envs import Reacher2D

      class GymReacher:
          def __init__(self, max_steps=50):
              self.env = Reacher2D()
              self.max_steps = max_steps
              self.t = 0

          def reset(self, seed=None):
              if seed is not None:
                  self.env.rng = np.random.default_rng(seed)
              self.t = 0
              return self.env.reset(), {}

          def step(self, action):
              obs, reward, done = self.env.step(action)
              # Zähler erhöhen, terminated und truncated bestimmen
              terminated = False
              truncated = False
              return obs, reward, terminated, truncated, {}
    solution: |
      import numpy as np
      from lab.envs import Reacher2D

      class GymReacher:
          def __init__(self, max_steps=50):
              self.env = Reacher2D()
              self.max_steps = max_steps
              self.t = 0

          def reset(self, seed=None):
              if seed is not None:
                  self.env.rng = np.random.default_rng(seed)
              self.t = 0
              return self.env.reset(), {}

          def step(self, action):
              obs, reward, done = self.env.step(action)
              self.t += 1
              terminated = done
              truncated = self.t >= self.max_steps
              return obs, reward, terminated, truncated, {}
    tests:
      - name: Zeitlimit genau nach max_steps
        code: |
          env = GymReacher(max_steps=5)
          env.reset(seed=0)
          flags = [env.step(np.zeros(2))[3] for _ in range(5)]
          assert flags == [False, False, False, False, True], f"truncated nach Schritt 1..5 sollte [F, F, F, F, T] sein, ist {flags}"
      - name: Kein falsches terminated
        code: |
          env = GymReacher(max_steps=3)
          env.reset(seed=1)
          term = [env.step(np.zeros(2))[2] for _ in range(3)]
          assert term == [False, False, False], f"Ohne Zielerreichen darf terminated nicht True sein, ist {term}"
      - name: Ziel erreicht heißt terminated
        code: |
          env = GymReacher(max_steps=10)
          env.reset()
          env.env.reset(goal=(2.0, 0.0))
          _, _, term, trunc, _ = env.step(np.zeros(2))
          assert term is True or term == True, "Spitze liegt auf dem Ziel – terminated sollte True sein."
          assert not trunc, "Nach einem Schritt von 10 darf truncated noch nicht True sein."
      - name: reset setzt den Zähler zurück
        code: |
          env = GymReacher(max_steps=2)
          env.reset(seed=0)
          env.step(np.zeros(2)); env.step(np.zeros(2))
          env.reset(seed=0)
          trunc = env.step(np.zeros(2))[3]
          assert not trunc, "Nach reset() sollte der erste Schritt nicht truncated sein."
    mutants:
