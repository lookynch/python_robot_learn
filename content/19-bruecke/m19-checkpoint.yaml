id: m19-checkpoint
title: "Checkpoint: Brücke nach draußen"
kind: checkpoint
minutes: 15
goals:
  - PyTorch-Trainingsschleife, Gymnasium-API, LeRobot-Workflow und ROS-2-Grundbegriffe sicher anwenden
  - Realistisch einschätzen, welcher Ansatz für welches Projekt passt
concepts: [pytorch-autograd, pytorch-trainingsschleife, pytorch-nn-module, gymnasium-api, terminated-truncated, lerobot-workflow, hobby-arm-einordnung, ros2-middleware]
steps:
  - type: quiz
    question: |
      In dieser PyTorch-Schleife wird der Verlust nach einigen Schritten riesig. Was fehlt?
    code: |
      for epoch in range(500):
          loss = loss_fn(model(X), y)
          loss.backward()
          opt.step()
    options:
      - text: "`opt.zero_grad()` vor `loss.backward()`"
        correct: true
        why: Ohne Zurücksetzen summieren sich die Gradienten aller Schritte; die Updates werden immer größer.
      - text: "`torch.no_grad()` um die ganze Schleife"
        correct: false
        why: Dann würde gar kein Gradient berechnet – Training wäre unmöglich.
      - text: Ein zweites `opt.step()`
        correct: false
        why: Das würde die falschen, aufsummierten Gradienten nur doppelt anwenden.
  - type: predict
    code: |
      grad = 0.0
      for schritt in range(5):
          if schritt % 2 == 0:
              grad = 0.0         # zero_grad() nur bei geraden Schritten
          grad = grad + 1.0      # backward()
      print(grad)
    options: ["1.0", "5.0", "2.0", "3.0"]
    answer: "1.0"
    explanation: "Im letzten Schritt (schritt = 4, gerade) wird zurückgesetzt, danach kommt 1,0 dazu."
  - type: quiz
    question: |
      Welche Form hat `nn.Linear(6, 64).weight`?
    options:
      - text: (64, 6)
        correct: true
        why: PyTorch speichert (Ausgänge, Eingänge) und rechnet $x W^T + b$.
      - text: (6, 64)
        correct: false
        why: Das wäre die NumPy-Gewohnheit $x W$ – PyTorch speichert transponiert.
      - text: (64,)
        correct: false
        why: Das ist die Form des Bias.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `run_episode(env, policy)` für eine Gymnasium-artige Umgebung: `env.reset(seed=0)` liefert `(obs, info)`, `env.step(a)` liefert `(obs, reward, terminated, truncated, info)`. Rufe in jedem Schritt `policy(obs)` auf, summiere die Belohnungen und höre auf, sobald `terminated` **oder** `truncated` wahr ist. Gib `(gesamt, schritte)` zurück.
    starter: |
      def run_episode(env, policy):
          obs, info = env.reset(seed=0)
          gesamt = 0.0
          schritte = 0
          # Schleife bis terminated oder truncated
          return gesamt, schritte
    solution: |
      def run_episode(env, policy):
          obs, info = env.reset(seed=0)
          gesamt = 0.0
          schritte = 0
          episode_over = False
          while not episode_over:
              obs, reward, terminated, truncated, info = env.step(policy(obs))
              gesamt += reward
              schritte += 1
              episode_over = terminated or truncated
          return gesamt, schritte
    tests:
      - name: Echtes Ende (terminated)
        code: |
          class TestEnv:
              def __init__(self, ende, limit):
                  self.ende, self.limit = ende, limit
              def reset(self, seed=None):
                  self.t = 0
                  return 0, {}
              def step(self, action):
                  self.t += 1
                  return self.t, float(action), self.t >= self.ende, self.t >= self.limit, {}
          r = run_episode(TestEnv(ende=3, limit=10), lambda obs: 2.0)
          assert r == (6.0, 3), f"Bei Ende nach 3 Schritten und Aktion 2.0 erwartet (6.0, 3), bekommen {r}"
      - name: Zeitlimit (truncated)
        code: |
          class TestEnv:
              def __init__(self, ende, limit):
                  self.ende, self.limit = ende, limit
              def reset(self, seed=None):
                  self.t = 0
                  return 0, {}
              def step(self, action):
                  self.t += 1
                  return self.t, float(action), self.t >= self.ende, self.t >= self.limit, {}
          r = run_episode(TestEnv(ende=100, limit=4), lambda obs: 1.0)
          assert r == (4.0, 4), f"Bei Zeitlimit 4 erwartet (4.0, 4), bekommen {r} – wird truncated beachtet?"
      - name: Policy bekommt die Beobachtung
        code: |
          class TestEnv:
              def __init__(self, ende, limit):
                  self.ende, self.limit = ende, limit
              def reset(self, seed=None):
                  self.t = 0
                  return 0, {}
              def step(self, action):
                  self.t += 1
                  return self.t, float(action), self.t >= self.ende, self.t >= self.limit, {}
          r = run_episode(TestEnv(ende=3, limit=10), lambda obs: obs + 1)
          assert r == (6.0, 3), f"Aktionen 1, 2, 3 (obs + 1) ergeben (6.0, 3), bekommen {r}"
