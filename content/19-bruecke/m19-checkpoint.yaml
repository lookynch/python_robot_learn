  - type: quiz
    question: |
      Ein Zeitlimit bricht eine Episode ab, obwohl der Arm noch unterwegs ist. Welches Flag ist gesetzt, und welches TD-Ziel gilt?
    options:
      - text: truncated; Ziel $r + \gamma V(s')$
        correct: true
        why: Die Welt ginge weiter, also wird gebootstrappt.
      - text: terminated; Ziel $r$
        correct: false
        why: Ein Zeitlimit ist kein echtes Ende der Aufgabe.
      - text: truncated; Ziel $r$
        correct: false
        why: Das Flag stimmt, aber bei truncated existiert ein Folgewert.
  - type: quiz
    question: |
      Welche Reihenfolge entspricht dem LeRobot-Workflow?
    options:
      - text: Kalibrieren → teleoperieren und aufnehmen → `lerobot-train` → `lerobot-rollout`
        correct: true
        why: Erst konsistente Messwerte, dann Daten, dann Training, dann Ausführung.
      - text: "`lerobot-train` → aufnehmen → kalibrieren"
        correct: false
        why: Ohne Daten kein Training.
      - text: "`lerobot-rollout` → `lerobot-train` → aufnehmen"
        correct: false
        why: Ausführen kann man nur eine bereits trainierte Policy.
  - type: quiz
    question: |
      Deine ACT-Policy greift daneben, wenn der Würfel hinter dem Greifer verschwindet. Was hilft am ehesten?
    options:
      - text: Eine zweite Kamera (z. B. am Handgelenk) und neue Demos, in denen der Würfel sichtbar bleibt
        correct: true
        why: Die Policy kann nur lernen, was in den Beobachtungen steckt.
      - text: Mehr Trainingsschritte mit denselben Daten
        correct: false
        why: Fehlende Information lässt sich nicht wegtrainieren.
      - text: Ein größeres Netz
        correct: false
        why: Auch ein größeres Netz sieht den verdeckten Würfel nicht.
  - type: quiz
    question: |
      Welche Aussage über Hobby-Arme ist (Stand: Oktober 2026) realistisch?
    options:
      - text: Sie werden meist mit Imitation Learning (ACT) oder feinjustierten kleinen VLAs gesteuert; Planen mit gelernten World Models ist dort Forschung.
        correct: true
        why: Das ist der dokumentierte LeRobot-Weg; V-JEPA 2-AC lief auf Franka-Forschungsarmen.
      - text: Sie werden standardmäßig mit V-JEPA 2-AC gesteuert.
        correct: false
        why: V-JEPA 2-AC wurde auf Franka-Armen gezeigt; für Hobby-Arme ist das nicht der Standard.
      - text: Sie lernen meist mit modellfreiem RL direkt am Arm.
        correct: false
        why: Zu viele Versuche, keine automatische Belohnung, ständiges Zurücksetzen.
  - type: quiz
    question: |
      In welchem Projekt ist ROS 2 am wenigsten nötig?
    options:
      - text: Ein einzelner SO-101, gesteuert mit LeRobot über USB
        correct: true
        why: LeRobot spricht die Servos direkt an; ROS bringt hier keinen Vorteil.
      - text: Ein mobiler Roboter mit Lidar, Navigation und Arm auf zwei Rechnern
        correct: false
        why: Viele Komponenten über mehrere Rechner – genau dafür ist ROS 2 gemacht.
      - text: Ein Industriearm, dessen Hersteller nur einen ROS-2-Treiber anbietet
        correct: false
        why: Dann ist ROS 2 der einfachste Weg zur Hardware.
  - type: predict
    code: |
      abonnenten = {}
      def subscribe(topic, callback):
          abonnenten.setdefault(topic, []).append(callback)
      def publish(topic, nachricht):
          for callback in abonnenten.get(topic, []):
              callback(nachricht)
      subscribe("/goal", lambda m: print("Planer:", m))
      publish("/goal", "A")
      subscribe("/goal", lambda m: print("Logger:", m))
      publish("/goal", "B")
    options:
      - |
        Planer: A
        Planer: B
        Logger: B
      - |
        Planer: A
        Logger: A
        Planer: B
        Logger: B
      - |
        Planer: B
        Logger: B
      - |
        Planer: A
        Planer: B
    answer: |
      Planer: A
      Planer: B
      Logger: B
    explanation: |
      Der Logger abonniert erst nach der ersten Nachricht und verpasst „A“. Bei Topics bekommt man nur, was nach dem Abonnieren gesendet wird (in ROS 2 lässt sich das über QoS-Einstellungen beeinflussen).
