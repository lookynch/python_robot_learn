    explanation: |
      Mit 0 als dritter Komponente wirkt nur die Rotation: $(1, 0)$ wird zu $(0, 1)$, keine Verschiebung.
  - type: example
    intro: |
      Für einen Arm definieren wir pro Glied `glied(q, l)`: drehe um `q`, dann gehe `l` entlang der neuen x-Achse. Die Translationsspalte ist dann $(l\cos q,\ l\sin q)$.
    code: |
      import numpy as np
      import lab

      def glied(q, l):
          c, s = np.cos(q), np.sin(q)
          return np.array([[c, -s, l * c],
                           [s, c, l * s],
                           [0.0, 0.0, 1.0]])

      q1, q2 = 0.5, 0.9
      l1, l2 = 1.0, 0.7
      T1 = glied(q1, l1)
      T12 = T1 @ glied(q2, l2)
      ellbogen = T1[:2, 2]
      spitze = T12[:2, 2]
      formel = np.array([l1 * np.cos(q1) + l2 * np.cos(q1 + q2),
                         l1 * np.sin(q1) + l2 * np.sin(q1 + q2)])
      print(np.round(spitze, 4), np.allclose(spitze, formel))
      lab.chain([[(0, 0), ellbogen, spitze]], title="Kette T1 · T2")
    subgoals:
      - lines: [4, 8]
        label: Gliedtransformation definieren
      - lines: [10, 13]
        label: Kette von der Basis zur Spitze multiplizieren
      - lines: [14, 15]
        label: Positionen aus der Translationsspalte lesen
      - lines: [16, 19]
        label: Mit der FK-Formel vergleichen und zeichnen
    after: |
      Die Position jedes Gelenks steht in der letzten Spalte der Kette bis dorthin: `T[:2, 2]`. Das Ergebnis stimmt mit der Formel $x = l_1\cos q_1 + l_2\cos(q_1+q_2)$ usw. überein – ohne dass du $q_1 + q_2$ selbst addieren musstest; die Matrixmultiplikation erledigt das. `lab.chain` zeichnet einen Arm aus einer Liste von Stellungen, jede als Liste von Gelenkpositionen.
  - type: predict
