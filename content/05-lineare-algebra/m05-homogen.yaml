id: m05-homogen
title: Homogene Transformationen und Ketten
minutes: 10
goals:
  - Rotation und Translation in einer 3×3-Matrix zusammenfassen
  - Punkte (mit 1) und Richtungen (mit 0) richtig erweitern
  - Gliedtransformationen zu einer Kette multiplizieren – die Vorstufe der Vorwärtskinematik
concepts: [la-homogen, la-kette]
steps:
  - type: text
    body: |
      ## Drehen **und** Verschieben in einer Matrix

      $\vec p' = R\,\vec p + \vec t$ ist keine Matrixmultiplikation allein. Trick: Hänge an jeden Punkt eine **1** an, $(x, y, 1)$, und schreibe

      $$ T = \begin{pmatrix} R & \vec t \\ 0\;\,0 & 1 \end{pmatrix}, \qquad \begin{pmatrix} \vec p' \\ 1 \end{pmatrix} = T \begin{pmatrix} \vec p \\ 1 \end{pmatrix} $$

      Das sind **homogene Koordinaten**. Der Gewinn: Mehrere Transformationen hintereinander sind einfach ein Produkt $T_1 T_2 T_3$.

      **Robotik-Bild:** Jedes Glied ist eine Transformation „drehe um $q_i$, gehe $l_i$ entlang der neuen x-Achse“. Die Kette $T = T_1 T_2 \cdots$ führt von der Basis bis zur Spitze.
  - type: example
    code: |
      import numpy as np

      def transform(theta, tx, ty):
          c, s = np.cos(theta), np.sin(theta)
          return np.array([[c, -s, tx],
                           [s, c, ty],
                           [0.0, 0.0, 1.0]])

      T = transform(np.pi / 2, 2.0, 0.0)
      p = np.array([1.0, 0.0, 1.0])        # Punkt (1, 0) homogen
      print(np.round(T, 3))
      print(np.round(T @ p, 3))
    subgoals:
      - lines: [3, 7]
        label: Homogene Matrix aus Winkel und Verschiebung
      - lines: [9, 10]
        label: Transformation und Punkt festlegen
      - lines: [11, 12]
        label: Anwenden und ausgeben
    after: |
      Erst wird $(1, 0)$ um 90° auf $(0, 1)$ gedreht, dann um $(2, 0)$ verschoben: $(2, 1)$. Die letzte Komponente bleibt 1.
  - type: explain
    question: |
      Warum bekommen Punkte als dritte Koordinate eine **1**, Richtungsvektoren (z. B. eine Geschwindigkeit) aber eine **0**?
    options:
      - text: Die dritte Koordinate multipliziert die Translationsspalte. Mit 1 wird verschoben, mit 0 nur gedreht – eine Richtung ändert sich durch Verschieben nicht.
        correct: true
        why: Genau. Ein Punkt hat einen Ort, eine Richtung nicht.
      - text: Die 1 ist nur Platzhalter; man könnte jede Zahl nehmen.
        correct: false
        why: Mit 2 würde doppelt verschoben (und das Ergebnis hätte nicht mehr 1 als letzte Komponente).
      - text: Mit 0 wird der Vektor auf den Ursprung gesetzt.
        correct: false
        why: Gedreht wird er trotzdem; nur die Translation fällt weg.
  - type: predict
    code: |
      import numpy as np

