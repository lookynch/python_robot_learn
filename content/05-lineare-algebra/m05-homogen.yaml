          c, s = np.cos(theta), np.sin(theta)
          return np.array([[c, -s, tx], [s, c, ty], [0.0, 0.0, 1.0]])

      T = transform(np.pi / 2, 2.0, 0.0)
      richtung = np.array([1.0, 0.0, 0.0])
      print(np.round(T @ richtung, 3))
    options:
      - "[0. 1. 0.]"
      - "[2. 1. 0.]"
      - "[2. 1. 1.]"
      - "[3. 0. 0.]"
