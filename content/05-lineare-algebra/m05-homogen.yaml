  - type: exercise
    mode: make
    prompt: |
      Schreibe `fk_homogen(q, l)` für einen planaren Arm mit beliebig vielen Gliedern (Winkel relativ, in rad). Gib alle Gelenkpositionen als Array der Form `(n + 1, 2)` zurück: Basis $(0, 0)$, dann das Ende jedes Glieds. `glied` ist schon da.
    starter: |
      import numpy as np

      def glied(q, l):
          c, s = np.cos(q), np.sin(q)
          return np.array([[c, -s, l * c], [s, c, l * s], [0.0, 0.0, 1.0]])

      def fk_homogen(q, l):
          T = np.eye(3)
          punkte = [T[:2, 2]]
          # Schleife über die Glieder
          return np.array(punkte)
    solution: |
      import numpy as np

      def glied(q, l):
          c, s = np.cos(q), np.sin(q)
          return np.array([[c, -s, l * c], [s, c, l * s], [0.0, 0.0, 1.0]])

      def fk_homogen(q, l):
          T = np.eye(3)
          punkte = [T[:2, 2]]
          for qi, li in zip(q, l):
              T = T @ glied(qi, li)
              punkte.append(T[:2, 2])
          return np.array(punkte)
    tests:
      - name: Zwei Glieder gegen die Formel
        code: |
          import numpy as np
          q1, q2, l1, l2 = 0.3, 0.8, 1.0, 0.5
          P = fk_homogen([q1, q2], [l1, l2])
          erwartet = [[0.0, 0.0],
                      [l1 * np.cos(q1), l1 * np.sin(q1)],
                      [l1 * np.cos(q1) + l2 * np.cos(q1 + q2), l1 * np.sin(q1) + l2 * np.sin(q1 + q2)]]
          assert np.shape(P) == (3, 2), f"Erwartet Form (3, 2), bekommen {np.shape(P)}"
          assert close(P, erwartet), f"Erwartet {np.round(erwartet, 3).tolist()}, bekommen {np.round(P, 3).tolist()}"
      - name: Drei Glieder
        code: |
          import numpy as np
          P = fk_homogen([np.pi / 2, -np.pi / 2, -np.pi / 2], [1.0, 1.0, 1.0])
          assert np.shape(P) == (4, 2), f"Erwartet Form (4, 2), bekommen {np.shape(P)}"
          assert close(P, [[0, 0], [0, 1], [1, 1], [1, 0]]), f"Erwartet [[0, 0], [0, 1], [1, 1], [1, 0]], bekommen {np.round(P, 3).tolist()}"
