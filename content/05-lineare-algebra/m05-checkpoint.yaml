id: m05-checkpoint
title: "Checkpoint: Lineare Algebra in Code"
kind: checkpoint
minutes: 15
goals:
  - Vektoren, Matrizen und Rotationen in NumPy sicher verrechnen
  - Homogene Transformationen, Gleichungssysteme und Stabilität anwenden
concepts: [la-vektor, la-norm, la-skalarprodukt, la-matmul, la-transponiert, la-rotation, la-rotation-inverse, la-homogen, la-kette, la-solve, la-lstsq, la-stabilitaet]
steps:
  - type: predict
    code: |
      import numpy as np
      A = np.array([[1, 2],
                    [3, 4]])
      x = np.array([1, 1])
      print(A @ x)
      print(A * x)
    options:
      - |
        [3 7]
        [[1 2]
         [3 4]]
      - |
        [4 6]
        [[1 2]
         [3 4]]
      - |
        [3 7]
        [3 7]
      - |
        [[1 2]
         [3 4]]
        [3 7]
    answer: |
      [3 7]
      [[1 2]
       [3 4]]
    explanation: |
      `A @ x` summiert jede Zeile ($1+2$, $3+4$). `A * x` multipliziert elementweise (per Broadcasting jede Zeile mit $(1, 1)$) und ändert hier nichts.
  - type: predict
    code: |
      import numpy as np
      P = np.array([[0.0, 2.0],
                    [1.0, 1.0],
                    [-3.0, 4.0]])
      print(np.round(np.linalg.norm(P, axis=1), 3))
    options: ["[2.    1.414 5.   ]", "[3.162 7.   ]", "5.568", "[ 2.  2.  1.]"]
    answer: "[2.    1.414 5.   ]"
    explanation: |
      `axis=1`: eine Länge pro Zeile – $2$, $\sqrt 2$, $5$.
  - type: quiz
    question: |
      `R` ist eine 2D-Rotationsmatrix um $\theta = 0.6$ rad. Welche Aussage ist **falsch**?
    options:
      - text: "`R @ R` ist die Einheitsmatrix."
        correct: true
        why: "`R @ R` dreht um $1.2$ rad. Die Einheitsmatrix ergibt `R.T @ R`."
      - text: "`R.T` dreht um $-0.6$ rad."
        correct: false
        why: Stimmt – die Transponierte ist die Inverse.
      - text: "`R @ v` hat dieselbe Länge wie `v`."
        correct: false
        why: Stimmt – Rotationen erhalten Längen.
      - text: "`R @ R.T` ist die Einheitsmatrix."
        correct: false
        why: Stimmt – auch in dieser Reihenfolge.
  - type: fill
    prompt: |
      `T` dreht um 90° und verschiebt um $(1, 2)$. Wende `T` auf den **Punkt** $(3, 0)$ an und gib die Position aus.
    code: |
      import numpy as np
      c, s = np.cos(np.pi / 2), np.sin(np.pi / 2)
      T = np.array([[c, -s, 1.0],
                    [s, c, 2.0],
                    [0.0, 0.0, 1.0]])
      p = T @ np.array([3.0, 0.0, ___])
      print(np.round(p[:___], 3))
    blanks:
      - answer: "1.0"
        options: ["1.0", "0.0", "2.0"]
      - answer: "2"
        options: ["2", "3", "1"]
    expect_output: "[1. 5.]"
  - type: parsons
    prompt: |
      Löse das System $x_1 + x_2 = 3$, $x_1 - x_2 = 1$ und gib die Lösung aus. Achtung: überzählige Zeilen.
    lines:
      - "import numpy as np"
      - "A = np.array([[1.0, 1.0], [1.0, -1.0]])"
      - "b = np.array([3.0, 1.0])"
      - "x = np.linalg.solve(A, b)"
      - "print(x)"
    distractors:
      - "x = A @ b"
      - "x = np.linalg.solve(b, A)"
    expect_output: "[2. 1.]"
  - type: quiz
    question: |
      Ein 2-Glied-Arm hat die Gliedtransformationen `A1` (an der Basis) und `A2`. Wo steht die Position der Spitze in Basiskoordinaten?
    options:
      - text: "`(A1 @ A2)[:2, 2]`"
        correct: true
        why: Kette von der Basis zur Spitze, Position in der Translationsspalte.
      - text: "`(A2 @ A1)[:2, 2]`"
        correct: false
        why: Umgekehrte Reihenfolge – das wäre ein anderer Arm.
      - text: "`(A1 @ A2)[2, :2]`"
        correct: false
        why: Die letzte Zeile ist immer $(0, 0, 1)$; die Position steht in der letzten Spalte.
  - type: quiz
    question: |
      Welche Systemmatrix macht $x_{k+1} = A x_k$ **stabil**?
    options:
      - text: Eigenwerte $0.9$ und $-0.7$
        correct: true
        why: Beide Beträge < 1.
      - text: Eigenwerte $0.3$ und $-1.05$
        correct: false
        why: "$|-1.05| > 1$ – diese Komponente wächst (mit Vorzeichenwechsel)."
      - text: Eigenwerte $1.0$ und $0.2$
        correct: false
        why: Bei Betrag genau 1 klingt diese Komponente nie ab.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `drehe_punkte(punkte, theta)`. `punkte` hat die Form `(N, 2)` (Punkte als Zeilen). Gib alle Punkte um `theta` (rad, gegen den Uhrzeigersinn) um den Ursprung gedreht zurück – ohne Schleife.
    starter: |
      import numpy as np

      def drehe_punkte(punkte, theta):
          # Rotationsmatrix bauen, dann alle Punkte drehen
          pass
    solution: |
      import numpy as np

      def drehe_punkte(punkte, theta):
          c, s = np.cos(theta), np.sin(theta)
          R = np.array([[c, -s], [s, c]])
          return punkte @ R.T
    tests:
      - name: 90 Grad
        code: |
          import numpy as np
          r = drehe_punkte(np.array([[1.0, 0.0], [0.0, 2.0], [1.0, 1.0]]), np.pi / 2)
          assert np.shape(r) == (3, 2), f"Erwartet Form (3, 2), bekommen {np.shape(r)}"
          assert close(r, [[0.0, 1.0], [-2.0, 0.0], [-1.0, 1.0]]), f"Erwartet [[0, 1], [-2, 0], [-1, 1]], bekommen {np.round(r, 3).tolist()}"
      - name: Beliebiger Winkel erhält Längen
        code: |
          import numpy as np
          P = np.array([[3.0, 4.0], [-1.0, 2.0]])
          r = drehe_punkte(P, 0.7)
          assert close(np.linalg.norm(r, axis=1), np.linalg.norm(P, axis=1)), "Drehen darf die Abstände zum Ursprung nicht ändern."
          assert close(r[0], [3 * np.cos(0.7) - 4 * np.sin(0.7), 3 * np.sin(0.7) + 4 * np.cos(0.7)]), f"Erster Punkt falsch gedreht: {r[0]}"
    mutants:
      - |
        import numpy as np

        def drehe_punkte(punkte, theta):
            c, s = np.cos(theta), np.sin(theta)
            R = np.array([[c, -s], [s, c]])
            return punkte @ R
      - |
        import numpy as np

        def drehe_punkte(punkte, theta):
            c, s = np.cos(theta), np.sin(theta)
            R = np.array([[c, s], [-s, c]])
            return punkte @ R.T
      - |
        import numpy as np

        def drehe_punkte(punkte, theta):
            c, s = np.cos(theta), np.sin(theta)
            R = np.array([[c, -s], [s, c]])
            return punkte * R.T
    hints:
      - "Teilziel: Rotationsmatrix aufstellen und auf jede Zeile anwenden."
      - "Punkte als Zeilen dreht man mit `punkte @ R.T`."
      - "`R = np.array([[c, -s], [s, c]])` mit `c, s = np.cos(theta), np.sin(theta)`"
  - type: exercise
    mode: make
    prompt: |
      Schreibe `winkel_zwischen(a, b)`, die den Winkel zwischen zwei Vektoren in **rad** zurückgibt ($0$ bis $\pi$). Begrenze den Kosinus vor `np.arccos` mit `np.clip(…, -1.0, 1.0)` – Rundungsfehler können sonst Werte knapp über 1 erzeugen.
    starter: |
      import numpy as np

      def winkel_zwischen(a, b):
          # cos_theta = ...
          pass
    solution: |
      import numpy as np

      def winkel_zwischen(a, b):
          cos_theta = (a @ b) / (np.linalg.norm(a) * np.linalg.norm(b))
          return np.arccos(np.clip(cos_theta, -1.0, 1.0))
    tests:
      - name: Rechter Winkel
        code: |
          import numpy as np
          r = winkel_zwischen(np.array([2.0, 0.0]), np.array([0.0, 5.0]))
          assert close(r, np.pi / 2), f"Erwartet pi/2 = 1.5708, bekommen {r}"
      - name: 45 Grad mit verschiedenen Längen
        code: |
          import numpy as np
          r = winkel_zwischen(np.array([3.0, 0.0]), np.array([2.0, 2.0]))
          assert close(r, np.pi / 4), f"Erwartet pi/4 = 0.7854, bekommen {r}"
      - name: Stumpfer Winkel und Gegenrichtung
        code: |
          import numpy as np
          r = winkel_zwischen(np.array([1.0, 0.0]), np.array([-1.0, 1.0]))
          assert close(r, 3 * np.pi / 4), f"Erwartet 3pi/4 = 2.3562, bekommen {r}"
          r = winkel_zwischen(np.array([1.0, 2.0]), np.array([-2.0, -4.0]))
          assert close(r, np.pi), f"Erwartet pi, bekommen {r}"
    mutants:
      - |
        import numpy as np

        def winkel_zwischen(a, b):
            return np.arccos(np.clip(a @ b, -1.0, 1.0))
      - |
        import numpy as np

        def winkel_zwischen(a, b):
            cos_theta = (a @ b) / (np.linalg.norm(a) * np.linalg.norm(b))
            return np.degrees(np.arccos(np.clip(cos_theta, -1.0, 1.0)))
      - |
        import numpy as np

        def winkel_zwischen(a, b):
            cos_theta = (a @ b) / (np.linalg.norm(a) * np.linalg.norm(b))
            return np.arcsin(np.clip(cos_theta, -1.0, 1.0))
    hints:
      - "Teilziel: Kosinus aus Skalarprodukt und Längen, dann Umkehrfunktion."
      - "$\\cos\\theta = \\dfrac{\\vec a \\cdot \\vec b}{\\|\\vec a\\|\\,\\|\\vec b\\|}$"
      - "`cos_theta = (a @ b) / (np.linalg.norm(a) * np.linalg.norm(b))`"
      - "`return np.arccos(np.clip(cos_theta, -1.0, 1.0))`"
