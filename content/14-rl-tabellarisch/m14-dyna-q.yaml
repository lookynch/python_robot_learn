      - "(2) `plan(Q, model, n_plan, alpha, gamma, rng)`"
  - type: example
    title: Wie viel Planen lohnt sich?
    intro: |
      Gleiches Labyrinth, $n = 0$ (reines Q-Learning), $5$ und $20$ Planungsschritte pro echtem Schritt. Die y-Achse ist logarithmisch.
    code: |
      import numpy as np
      import lab
      from lab.envs import GridWorld

      MAZE = [".......#G", "..#....#.", "S.#....#.", "..#......", ".....#...", "........."]
      env = GridWorld(MAZE, step_reward=0, goal_reward=1, max_steps=2000)

      def dyna_q(n_plan, episodes=20, alpha=0.1, gamma=0.95, eps=0.1):
          rng = np.random.default_rng(0)
          Q, model, steps = np.zeros((env.n_states, 4)), {}, []
          for k in range(episodes):
              s, done, n = env.reset(), False, 0
              while not done:
                  if rng.random() < eps:
                      a = int(rng.integers(4))
                  else:
                      a = int(rng.choice(np.flatnonzero(Q[s] == Q[s].max())))
                  s2, r, done = env.step(a)
                  model[(s, a)] = (r, s2, done)
                  Q[s, a] += alpha * ((r if done else r + gamma * np.max(Q[s2])) - Q[s, a])
                  keys = list(model)
                  for _ in range(n_plan):
                      ps, pa = keys[rng.integers(len(keys))]
                      pr, ps2, pd = model[(ps, pa)]
                      Q[ps, pa] += alpha * ((pr if pd else pr + gamma * np.max(Q[ps2])) - Q[ps, pa])
                  s, n = s2, n + 1
              steps.append(n)
          return Q, steps

      fig = lab.Figure(title="Schritte pro Episode", xlabel="Episode", ylabel="Schritte", logy=True)
      for n_plan in (0, 5, 20):
          Q, steps = dyna_q(n_plan)
          fig.line(steps, label=f"n = {n_plan}")
      fig.hline(14, label="kürzester Weg")
      fig.show()

      s, path = env.reset(), [env.start]
      while not env.is_terminal(s) and len(path) < 40:
          s, r, done = env.step(int(np.argmax(Q[s])))
          path.append(s)
      env.render(values=np.max(Q, axis=1), policy=np.argmax(Q, axis=1), path=path, title="n = 20: Werte und Pfad")
    heavy: true
    subgoals:
      - lines: [12, 18]
        label: Echten Schritt ausführen
      - lines: [19, 20]
        label: Modell und Q aktualisieren
      - lines: [21, 25]
        label: Planen
      - lines: [30, 35]
        label: Lernkurven vergleichen
      - lines: [37, 41]
        label: Greedy-Pfad zeigen
    after: |
      Ohne Planen braucht der Agent viele Episoden, mit Planen wenige: In Sutton & Barto erreicht der Agent mit $n = 50$ nach etwa drei Episoden den kürzesten Weg, ohne Planen erst nach etwa 25. Die erste Episode ist bei allen lang – vorher gibt es nichts zu planen. Die Werte fallen vom Ziel aus mit $\gamma = 0.95$ pro Schritt ab.
  - type: quiz
    question: |
      Nach dem Training wird im Labyrinth eine neue Abkürzung frei. Was passiert mit Dyna-Q?
    options:
      - text: Es bemerkt die Abkürzung erst, wenn es sie beim Erkunden zufällig ausprobiert – das Modell kennt sie nicht.
        correct: true
        why: Das Tabellenmodell enthält nur Erlebtes. Sutton & Barto (Abschnitt 8.3) zeigen genau dieses Problem und Dyna-Q+, das lange nicht besuchte Paare mit einem Bonus belohnt.
      - text: Es findet sie sofort durch Planen.
        correct: false
        why: Planen nutzt nur bekannte Übergänge – neue Wege kommen darin nicht vor.
      - text: Das Modell aktualisiert sich automatisch aus `env.P`.
        correct: false
        why: Dyna-Q ist modellbasiert mit **gelerntem** Modell; `env.P` kennt es nicht.
  - type: text
    body: |
      ## Ausblick: World Models

      Dyna-Q enthält schon das Grundrezept modellbasierten Lernens: **Erfahrung sammeln → Modell lernen → im Modell planen → besser handeln.**

      Für einen Roboterarm reicht eine Tabelle nicht: Zustände sind kontinuierlich, und kein Paar $(s, a)$ kommt zweimal exakt vor. In Modul 16 ersetzt du die Tabelle deshalb durch ein **neuronales Netz**, das $s' \approx f(s, a)$ vorhersagt und auch für nie gesehene Zustände eine Antwort hat – und das Planen erledigt dann MPC mit CEM aus Modul 11.
cards:
  - id: m14-c-dyna-schritte
    concept: dyna-q-planen
    variants:
      - type: quiz
        question: Welche drei Teile hat ein Dyna-Q-Schritt?
        options:
          - text: Direktes Q-Update, Modell aktualisieren, $n$ Planungs-Updates aus dem Modell
            correct: true
            why: So kombiniert Dyna echtes und simuliertes Lernen.
          - text: Modell aus `env.P` lesen, Value Iteration, handeln
            correct: false
            why: Das wäre Planen mit bekanntem Modell (Modul 13), kein Dyna.
          - text: Episode sammeln, Returns mitteln, ε senken
            correct: false
            why: Das beschreibt Monte-Carlo-Control.
      - type: quiz
        question: Was steht im Tabellenmodell von Dyna-Q unter dem Schlüssel $(s, a)$?
        options:
          - text: Die zuletzt erlebte Belohnung und der Folgezustand
            correct: true
            why: In einer deterministischen Welt reicht das, um den Schritt zu simulieren.
          - text: Der Q-Wert von $(s, a)$
            correct: false
            why: Der steht in `Q`. Das Modell beschreibt die Welt, nicht ihren Wert.
          - text: Die Wahrscheinlichkeit, $a$ zu wählen
            correct: false
            why: Das wäre eine Policy, kein Modell.
  - id: m14-c-dyna-modell
    concept: dyna-q-planen
    variants:
      - type: predict
        code: |
          model = {}
          for s, a, s2 in [(0, 1, 1), (1, 1, 2), (1, 1, 2), (2, 0, 2)]:
              model[(s, a)] = (0, s2)
          print(len(model))
        options: ["3", "4", "2", "1"]
        answer: "3"
        explanation: Der doppelte Übergang `(1, 1)` überschreibt nur seinen Eintrag.
      - type: predict
        code: |
          model = {(0, 1): (0, 1), (1, 2): (1, 5)}
          r, s2 = model[(1, 2)]
          print(r, s2)
        options: ["1 5", "0 1", "(1, 5)", "5 1"]
        answer: "1 5"
        explanation: Das Tupel `(1, 5)` wird in `r` und `s2` entpackt.
