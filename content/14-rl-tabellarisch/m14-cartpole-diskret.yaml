            return (int(np.digitize(state[1], XD)),
                    int(np.digitize(state[3], TH)),
                    int(np.digitize(state[2], THD)))
    hints:
      - "Teilziel: drei Größen einzeln einsortieren, dann als Tupel bündeln."
      - "`x_dot` ist `state[1]`, `theta` ist `state[2]`, `theta_dot` ist `state[3]`. Jede bekommt ihr eigenes Grenzen-Array."
      - "`int(np.digitize(state[2], TH))` liefert den theta-Index."
      - "`return (int(np.digitize(state[1], XD)), int(np.digitize(state[2], TH)), int(np.digitize(state[3], THD)))`"
  - type: text
    body: |
      ## Umgefallen oder nur Zeit abgelaufen?

      `env.step` meldet `done=True` in zwei verschiedenen Fällen:

      - **Terminal:** Der Stab ist umgefallen oder der Wagen aus der Bahn. Danach kommt nichts mehr – das Ziel ist nur $r$.
      - **Abbruch durch Zeitlimit** (`env.t == env.max_steps`): Der Stab steht noch! Ohne Limit ginge es weiter. Das Ziel bleibt $r + \gamma \max_{a'} Q(s', a')$.

      Behandelt man das Zeitlimit wie einen Sturz, lernt der Agent fälschlich, dass Zustände kurz vor Schritt 200 schlecht sind. In Gymnasium heißen die beiden Fälle `terminated` und `truncated`.
  - type: explain
    question: |
      Bei CartPole gibt jeder Schritt $r = 1$. Warum darf beim Zeitlimit **nicht** einfach `target = r` gesetzt werden?
    options:
      - text: Der Zustand ist nicht wirklich schlecht – nur die Uhr ist abgelaufen; mit `target = r` würde sein Wert künstlich klein.
        correct: true
        why: Der Wert eines aufrechten Stabs liegt nahe $1/(1-\gamma)$, nicht bei 1. Das Zeitlimit gehört nicht zur Aufgabe.
      - text: Weil `r` beim Zeitlimit 0 ist.
        correct: false
        why: "`CartPole.step` liefert immer `r = 1.0`."
      - text: Weil Q-Learning beim letzten Schritt kein Update machen darf.
        correct: false
        why: Ein Update ist richtig – nur das Ziel muss weiter bootstrappen.
      - text: Das ist egal, weil es nur einmal pro Episode passiert.
        correct: false
        why: Es passiert gerade bei guten Episoden – und verfälscht genau die Zustände, auf die es ankommt.
  - type: example
    title: Q-Learning auf CartPole
    intro: |
      150 Episoden mit ε-Zerfall. Danach eine greedy Episode als Animation. Die Rechnung dauert einen Moment.
    code: |
      import numpy as np
      import lab
      from lab.envs import CartPole

      XD, TH, THD = np.array([-0.5, 0.5]), np.linspace(-0.2, 0.2, 5), np.linspace(-1.5, 1.5, 5)

      def discretize(state):
          return (int(np.digitize(state[1], XD)), int(np.digitize(state[2], TH)),
                  int(np.digitize(state[3], THD)))

      env = CartPole(max_steps=200, seed=0)
      rng = np.random.default_rng(0)
      Q = np.zeros((3, 6, 6, 2))
      lengths = []
      for k in range(150):
          eps = max(0.02, 0.97 ** k)
          d, done = discretize(env.reset()), False
          while not done:
              a = int(rng.integers(2)) if rng.random() < eps else int(np.argmax(Q[d]))
              state, r, done = env.step(a)
              d2 = discretize(state)
              fell = done and env.t < env.max_steps
              target = r if fell else r + 0.99 * np.max(Q[d2])
              Q[d + (a,)] += 0.2 * (target - Q[d + (a,)])
              d = d2
          lengths.append(env.t)
          lab.progress((k + 1) / 150, "Training")

      fig = lab.Figure(title="CartPole: Schritte pro Episode", xlabel="Episode", ylabel="Schritte")
      fig.line(lengths, label="Episode")
      fig.line(np.convolve(lengths, np.ones(10) / 10, mode="valid"), x=np.arange(9, 150), label="Mittel über 10")
      fig.show()

      state, done = env.reset(), False
      states = [state]
      while not done:
          state, r, done = env.step(int(np.argmax(Q[discretize(state)])))
          states.append(state)
      env.render(np.array(states), title=f"Greedy-Episode: {len(states) - 1} Schritte")
    subgoals:
      - lines: [5, 9]
        label: Zustände diskretisieren
      - lines: [11, 16]
        label: Tabelle und ε-Plan
      - lines: [18, 25]
        label: Q-Learning mit Terminal-Check
      - lines: [29, 32]
        label: Lernkurve zeichnen
      - lines: [34, 39]
        label: Greedy-Episode animieren
    heavy: true
    after: |
      Eine zufällige Policy hält den Stab etwa 20 Schritte. Nach 150 Episoden schafft der Agent meist ein Vielfaches – stabil ist das aber nicht: Die Kurve springt, und manche Zellen wurden kaum besucht. Mehr Bins würden feiner steuern, aber jede Zelle seltener sehen.
  - type: exercise
    mode: modify
    heavy: true
    prompt: |
      In `train` fehlt das Lernen: Der Agent handelt, aber $Q$ bleibt null. Ergänze an der markierten Stelle das Q-Learning-Update mit Lernrate `alpha` und Diskont `gamma` – mit echtem Terminal-Check (`fell`). Getestet wird, ob die letzten 20 Episoden im Mittel über 60 Schritte dauern.
    starter: |
      import numpy as np
      from lab.envs import CartPole

      XD, TH, THD = np.array([-0.5, 0.5]), np.linspace(-0.2, 0.2, 5), np.linspace(-1.5, 1.5, 5)

      def discretize(state):
          return (int(np.digitize(state[1], XD)), int(np.digitize(state[2], TH)),
                  int(np.digitize(state[3], THD)))

      def train(episodes, seed=0, alpha=0.2, gamma=0.99):
          env = CartPole(max_steps=200, seed=seed)
          rng = np.random.default_rng(seed)
          Q = np.zeros((3, 6, 6, 2))
          lengths = []
          for k in range(episodes):
              eps = max(0.02, 0.97 ** k)
              d, done = discretize(env.reset()), False
              while not done:
                  a = int(rng.integers(2)) if rng.random() < eps else int(np.argmax(Q[d]))
                  state, r, done = env.step(a)
                  d2 = discretize(state)
                  fell = done and env.t < env.max_steps
                  # hier fehlt das Update von Q[d + (a,)]
                  d = d2
              lengths.append(env.t)
          return lengths
    solution: |
      import numpy as np
      from lab.envs import CartPole

      XD, TH, THD = np.array([-0.5, 0.5]), np.linspace(-0.2, 0.2, 5), np.linspace(-1.5, 1.5, 5)

      def discretize(state):
          return (int(np.digitize(state[1], XD)), int(np.digitize(state[2], TH)),
                  int(np.digitize(state[3], THD)))

      def train(episodes, seed=0, alpha=0.2, gamma=0.99):
          env = CartPole(max_steps=200, seed=seed)
          rng = np.random.default_rng(seed)
          Q = np.zeros((3, 6, 6, 2))
          lengths = []
          for k in range(episodes):
              eps = max(0.02, 0.97 ** k)
              d, done = discretize(env.reset()), False
              while not done:
                  a = int(rng.integers(2)) if rng.random() < eps else int(np.argmax(Q[d]))
                  state, r, done = env.step(a)
                  d2 = discretize(state)
                  fell = done and env.t < env.max_steps
                  target = r if fell else r + gamma * np.max(Q[d2])
                  Q[d + (a,)] += alpha * (target - Q[d + (a,)])
                  d = d2
              lengths.append(env.t)
          return lengths
    tests:
      - name: Lernt, den Stab länger zu halten
        code: |
          import numpy as np
          lengths = train(150, seed=0)
          first, last = np.mean(lengths[:20]), np.mean(lengths[-20:])
          assert last > 60, f"Die letzten 20 Episoden dauern im Mittel {last:.0f} Schritte (die ersten 20: {first:.0f}). Erwartet über 60 – stimmt das Update?"
    mutants:
      - |
