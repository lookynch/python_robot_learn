id: m14-cartpole-diskret
title: CartPole mit einer Q-Tabelle
minutes: 12
goals:
  - Kontinuierliche Zustände mit `np.digitize` auf Tabellenindizes abbilden
  - Echtes Episodenende und Zeitlimit beim TD-Ziel unterscheiden
  - Q-Learning auf CartPole trainieren und das Ergebnis animieren
concepts: [zustands-diskretisierung, terminal-vs-abbruch, q-learning-update]
steps:
  - type: text
    body: |
      ## Aus Zahlen werden Fächer

      In Modul 9 hast du gesehen, dass ein PD-Regler den Stab auf dem Wagen schlecht hält. Jetzt soll ein Agent es **lernen**. Der Zustand $[x, \dot x, \theta, \dot\theta]$ ist aber kontinuierlich – eine Tabelle braucht endlich viele Zeilen.

      Lösung: Jede Größe wird in **Intervalle** (Bins) einsortiert. Mit 3 Bins für $\dot x$ und je 6 für $\theta$ und $\dot\theta$ hat die Tabelle $3 \cdot 6 \cdot 6 = 108$ Zustände mal 2 Aktionen (0 = links schieben, 1 = rechts). Die Position $x$ lassen wir weg, um die Tabelle klein zu halten (dafür kann der Wagen aus der Bahn rollen).

      Der Haken: Mit $b$ Bins pro Dimension und $n$ Dimensionen gibt es $b^n$ Zellen – der **Fluch der Dimensionalität**.
  - type: example
    code: |
      import numpy as np

      edges = np.linspace(-0.2, 0.2, 5)       # Grenzen für theta in rad
      print(edges)
      for theta in (-0.25, -0.05, 0.0, 0.03, 0.15, 0.3):
          print(theta, "->", np.digitize(theta, edges))
    subgoals:
      - lines: 3
        label: Intervallgrenzen festlegen
      - lines: [5, 6]
        label: Werte einsortieren
    after: |
      5 Grenzen ergeben **6** Fächer: 0 = „unter −0.2“, …, 5 = „ab 0.2“. Ein Wert genau auf einer Grenze kommt ins **obere** Fach (`0.0` → 3). Der CartPole-Stab gilt ab $|\theta| > 12° \approx 0.21$ rad als umgefallen; die äußeren Fächer sind also schon „fast verloren“.
  - type: predict
    code: |
      import numpy as np
      edges = np.array([-0.2, -0.1, 0.0, 0.1, 0.2])
      print(np.digitize(0.15, edges), np.digitize(-0.25, edges))
    options: ["4 0", "3 0", "4 -1", "5 1"]
    answer: "4 0"
    explanation: |
      `0.15` liegt zwischen den Grenzen 0.1 (Index 3) und 0.2 (Index 4) → Fach 4. Alles unter der ersten Grenze landet in Fach 0 – negative Indizes gibt es nicht.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `discretize(state)`, die einen CartPole-Zustand `[x, x_dot, theta, theta_dot]` auf ein Tupel `(i_xd, i_th, i_thd)` aus ganzen Zahlen abbildet. Nutze die vorgegebenen Grenzen `XD` (für `x_dot`), `TH` und `THD`. Ein **Tupel** brauchst du, damit `Q[d]` die richtige Zelle der 4D-Tabelle trifft.
    starter: |
      import numpy as np

      XD = np.array([-0.5, 0.5])
      TH = np.linspace(-0.2, 0.2, 5)
      THD = np.linspace(-1.5, 1.5, 5)

      def discretize(state):
          # drei Indizes mit np.digitize, als Tupel zurückgeben
          pass
    solution: |
      import numpy as np

      XD = np.array([-0.5, 0.5])
      TH = np.linspace(-0.2, 0.2, 5)
      THD = np.linspace(-1.5, 1.5, 5)

      def discretize(state):
          return (int(np.digitize(state[1], XD)),
                  int(np.digitize(state[2], TH)),
                  int(np.digitize(state[3], THD)))
    tests:
      - name: Ruhelage
        code: |
          d = discretize([0.0, 0.0, 0.0, 0.0])
          assert d == (1, 3, 3), f"Ruhelage sollte (1, 3, 3) ergeben, bekommen {d}"
      - name: Gemischter Zustand
        code: |
          d = discretize([2.0, -0.7, 0.05, -2.0])
          assert d == (0, 3, 0), f"[2.0, -0.7, 0.05, -2.0] sollte (0, 3, 0) ergeben, bekommen {d}"
          d = discretize([-1.0, 0.7, -0.15, 0.4])
          assert d == (2, 1, 3), f"[-1.0, 0.7, -0.15, 0.4] sollte (2, 1, 3) ergeben, bekommen {d}"
      - name: Tupel für die Q-Tabelle
        code: |
          import numpy as np
          d = discretize(np.array([0.0, 0.1, 0.12, 1.0]))
          assert isinstance(d, tuple), f"discretize sollte ein Tupel liefern, liefert {type(d).__name__}"
          Q = np.zeros((3, 6, 6, 2))
          assert Q[d].shape == (2,), f"Q[d] sollte die zwei Q-Werte einer Zelle liefern, hat Form {Q[d].shape}"
    mutants:
