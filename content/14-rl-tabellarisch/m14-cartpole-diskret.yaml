    hints:
      - "Teilziel: TD-Ziel mit Terminal-Check bilden, dann den Tabelleneintrag verschieben."
      - Nur wenn `fell` wahr ist, endet die Zukunft. Sonst kommt der beste Wert der **nächsten** Zelle `d2` dazu.
      - "`target = r if fell else r + gamma * np.max(Q[d2])`"
      - "`Q[d + (a,)] += alpha * (target - Q[d + (a,)])`"
    explanation: |
      `d + (a,)` hängt die Aktion an das Zustandstupel an – so wird aus `(1, 3, 2)` der Index `(1, 3, 2, a)` einer einzelnen Zelle.
  - type: quiz
    question: |
      Du nimmst alle vier CartPole-Größen mit je 20 Bins. Wie viele Q-Werte hat die Tabelle (2 Aktionen)?
    options:
      - text: "320 000"
        correct: true
        why: "$20^4 \\cdot 2 = 160\\,000 \\cdot 2$. Die meisten Zellen würden in 150 Episoden nie besucht."
      - text: "160"
        correct: false
        why: "Das wäre $20 \\cdot 4 \\cdot 2$ – Bins multiplizieren sich aber über die Dimensionen."
      - text: "80"
        correct: false
        why: Das zählt nur die Bins, nicht ihre Kombinationen.
      - text: "1 600"
        correct: false
        why: "$20^2 \\cdot 4$ – die Exponentialität fehlt."
cards:
  - id: m14-c-digitize
    concept: zustands-diskretisierung
    variants:
      - type: predict
        code: |
          import numpy as np
          print(np.digitize(0.05, [-0.1, 0.0, 0.1]))
        options: ["2", "1", "3", "0"]
        answer: "2"
        explanation: "0.0 ≤ 0.05 < 0.1 → Fach 2 (Fächer 0 bis 3)."
      - type: predict
        code: |
          import numpy as np
          print(np.digitize(-0.3, [-0.1, 0.0, 0.1]), np.digitize(0.5, [-0.1, 0.0, 0.1]))
        options: ["0 3", "-1 3", "0 2", "1 4"]
        answer: "0 3"
        explanation: Unter der ersten Grenze → 0, über der letzten → Anzahl der Grenzen (3).
      - type: predict
        code: |
          import numpy as np
          print(np.digitize(0.0, [-0.1, 0.0, 0.1]))
        options: ["2", "1", "1.5", "0"]
        answer: "2"
        explanation: Ein Wert genau auf einer Grenze kommt ins obere Fach.
  - id: m14-c-tabellengroesse
    concept: zustands-diskretisierung
    variants:
      - type: quiz
        question: Ein Roboterarm hat 6 Gelenke, jeder Winkel wird in 10 Bins geteilt. Wie viele Zustände hat die Tabelle?
        options:
          - text: "$10^6$ = eine Million"
            correct: true
            why: Bins multiplizieren sich über alle Dimensionen.
          - text: "60"
            correct: false
            why: Das ist $6 \cdot 10$ – die Kombinationen fehlen.
          - text: "$6^{10}$"
            correct: false
            why: Basis und Exponent vertauscht – es sind 10 Möglichkeiten pro Gelenk.
      - type: quiz
        question: Warum lässt man bei CartPole oft die Position $x$ weg?
        options:
          - text: Um die Tabelle klein zu halten – für das Balancieren zählen Winkel und Winkelgeschwindigkeit am meisten.
            correct: true
            why: Jede Dimension multipliziert die Zellenzahl. Der Preis ist, dass der Wagen aus der Bahn rollen kann.
          - text: Weil $x$ in CartPole immer 0 ist.
            correct: false
            why: Der Wagen bewegt sich; bei $|x| > 2.4$ endet die Episode.
          - text: Weil `np.digitize` nur drei Größen gleichzeitig kann.
            correct: false
            why: "`np.digitize` sortiert jede Größe einzeln ein – die Anzahl ist beliebig."
  - id: m14-c-terminal-abbruch
    concept: terminal-vs-abbruch
    variants:
      - type: quiz
        question: Eine Episode endet, weil `max_steps` erreicht ist, der Stab steht noch. Welches TD-Ziel ist richtig?
        options:
          - text: $r + \gamma \max_{a'} Q(s', a')$
            correct: true
            why: Das Zeitlimit ist kein echtes Ende – es wird weiter gebootstrapt.
          - text: $r$
            correct: false
            why: Das gilt nur bei einem echten Endzustand (Stab umgefallen).
          - text: $0$
            correct: false
            why: Auch die Belohnung des letzten Schritts zählt.
      - type: quiz
        question: Der Stab fällt in Schritt 37 um. Welches TD-Ziel gilt für diesen letzten Übergang?
        options:
          - text: $r$
            correct: true
            why: Nach einem echten Ende kommt nichts mehr, $V(s') = 0$.
          - text: $r + \gamma \max_{a'} Q(s', a')$
            correct: false
            why: Der Folgezustand ist terminal; sein Q-Wert darf nicht einfließen.
          - text: $\gamma \max_{a'} Q(s', a')$
            correct: false
            why: Die Belohnung fehlt, und der Folgezustand ist terminal.
