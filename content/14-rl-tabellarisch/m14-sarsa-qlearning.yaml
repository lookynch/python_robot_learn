                  if rng.random() < eps:
                      a = int(rng.integers(4))
                  else:
                      a = int(np.argmax(Q[s]))
                  s2, r, done = env.step(a)
                  target = r if done else r + gamma * ___
                  Q[s, a] += ___
                  s = s2
