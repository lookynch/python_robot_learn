    blanks:
      - answer: "np.max(Q[s2])"
        options: ["np.max(Q[s2])", "np.max(Q[s])", "np.min(Q[s2])", "np.argmax(Q[s2])"]
      - answer: "alpha * (target - Q[s, a])"
        options: ["alpha * (target - Q[s, a])", "alpha * (Q[s, a] - target)", "alpha * target"]
    tests:
      - name: Kürzester Weg an der Kante
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env = GridWorld(CLIFF, goal_reward=-1, max_steps=500)
          for seed in (0, 1):
              Q = q_learning(env, 200, seed=seed)
              s, n = env.reset(), 0
              while not env.is_terminal(s) and n < 40:
                  s, r, done = env.step(int(np.argmax(Q[s])))
                  n += 1
              assert env.char(s) == "G" and n == 13, f"Seed {seed}: Greedy-Pfad sollte in 13 Schritten am Ziel sein, endet nach {n} Schritten auf '{env.char(s)}'."
    explanation: |
      Das Ziel braucht den besten Wert im **Folgezustand** `s2` – nicht in `s`, nicht das Minimum und nicht den **Index** der besten Aktion (`argmax`). Das Update schiebt $Q$ **zum** Ziel hin, gewichtet mit $\alpha$.
  - type: exercise
