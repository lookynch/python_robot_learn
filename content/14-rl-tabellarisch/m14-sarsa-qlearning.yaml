    solution: |
      import numpy as np

      def eps_greedy(Q, s, eps, rng):
          if rng.random() < eps:
              return int(rng.integers(4))
          return int(np.argmax(Q[s]))

      def sarsa(env, episodes, alpha=0.5, gamma=1.0, eps=0.1, seed=0):
          rng = np.random.default_rng(seed)
          Q = np.zeros((env.n_states, 4))
          returns = []
          for k in range(episodes):
              s, done, G = env.reset(), False, 0.0
              a = eps_greedy(Q, s, eps, rng)
              while not done:
                  s2, r, done = env.step(a)
                  a2 = eps_greedy(Q, s2, eps, rng)
                  target = r if done else r + gamma * Q[s2, a2]
                  Q[s, a] += alpha * (target - Q[s, a])
                  s, a, G = s2, a2, G + r
              returns.append(G)
          return Q, returns
    tests:
      - name: Rückgabe
        code: |
          from lab.envs import GridWorld
          env = GridWorld(["S..", "..G"], goal_reward=-1)
          Q, rets = sarsa(env, 5, seed=0)
          assert Q.shape == (6, 4), f"Q sollte die Form (6, 4) haben, hat {Q.shape}"
          assert len(rets) == 5, f"Für 5 Episoden sollte returns 5 Einträge haben, hat {len(rets)}"
      - name: Sicherer als Q-Learning während des Lernens
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env = GridWorld(["............", "............", "............", "SXXXXXXXXXXG"], goal_reward=-1, max_steps=500)
          means = [np.mean(sarsa(env, 300, seed=seed)[1][-100:]) for seed in range(5)]
          m = float(np.mean(means))
          assert m > -40, f"Mittlerer Return der letzten 100 Episoden (5 Läufe) ist {m:.1f}. SARSA liegt hier um −27, Q-Learning um −49; erwartet über −40. Nutzt dein Ziel Q[s2, a2] und führst du a2 auch aus?"
