    hints:
      - "Teilziel: erste Aktion vor der Schleife wählen, nächste Aktion nach dem Schritt wählen, Update, weiterreichen."
      - SARSA braucht $a'$ schon **vor** dem Update – und genau diese Aktion muss im nächsten Schritt ausgeführt werden.
      - "Vor `while`: `a = eps_greedy(Q, s, eps, rng)`. Nach `env.step(a)`: `a2 = eps_greedy(Q, s2, eps, rng)`."
      - "Ziel: `r if done else r + gamma * Q[s2, a2]`; am Ende der Schleife `s, a, G = s2, a2, G + r`."
  - type: example
    title: Beide im Vergleich
    intro: |
      Gleiche Klippe, gleicher Seed, je 300 Episoden. Die Lernkurven sind über 10 Episoden geglättet (gleitender Mittelwert mit `np.convolve`).
    code: |
      import numpy as np
      import lab
      from lab.envs import GridWorld

      env = GridWorld(["............", "............", "............", "SXXXXXXXXXXG"],
                      goal_reward=-1, max_steps=500)

      def eps_greedy(Q, s, rng):
          return int(rng.integers(4)) if rng.random() < 0.1 else int(np.argmax(Q[s]))

      def train(method, episodes=300, alpha=0.5):
          rng = np.random.default_rng(0)
          Q, returns = np.zeros((env.n_states, 4)), []
          for k in range(episodes):
              s, done, G = env.reset(), False, 0.0
              a = eps_greedy(Q, s, rng)
              while not done:
                  s2, r, done = env.step(a)
                  a2 = eps_greedy(Q, s2, rng)
                  nxt = Q[s2, a2] if method == "sarsa" else np.max(Q[s2])
                  Q[s, a] += alpha * ((r if done else r + nxt) - Q[s, a])
                  s, a, G = s2, a2, G + r
              returns.append(G)
          return Q, np.convolve(returns, np.ones(10) / 10, mode="valid")

      fig = lab.Figure(title="Return beim Lernen (geglättet)", xlabel="Episode", ylabel="Return")
      for method in ("sarsa", "q"):
          Q, curve = train(method)
          fig.line(curve, label="SARSA" if method == "sarsa" else "Q-Learning")
          s, path = env.reset(), [env.start]
          while not env.is_terminal(s) and len(path) < 40:
              s, r, done = env.step(int(np.argmax(Q[s])))
              path.append(s)
          env.render(policy=np.argmax(Q, axis=1), path=path, title=f"{method}: Greedy-Pfad")
      fig.show()
    subgoals:
      - lines: [8, 9]
        label: ε-greedy wählen
      - lines: [11, 24]
        label: Ein Trainingscode für beide Ziele
      - lines: [26, 29]
        label: Lernkurven sammeln
      - lines: [30, 34]
        label: Greedy-Pfade zeigen
    after: |
      **SARSA** lernt einen Umweg weiter oben – länger, aber ein zufälliger Schritt führt dort nicht in die Klippe. Sein Return **während des Lernens** ist deutlich besser. **Q-Learning** findet den optimalen Weg an der Kante, verliert aber durch die eigene Erkundung immer wieder 100 Punkte. Würde $\varepsilon$ langsam gegen 0 gehen, kämen beide beim optimalen Weg an (Sutton & Barto, Abschnitt 6.5).
  - type: explain
    question: |
      Warum lernt SARSA an der Klippe den **sicheren** Umweg, Q-Learning aber den Weg direkt an der Kante?
    options:
      - text: SARSA bewertet die ε-greedy Policy samt ihrer Zufallsschritte; an der Kante enden die oft mit −100.
        correct: true
        why: Genau – on-policy heißt, die eigene Erkundung fließt in die Werte ein. Q-Learning bewertet die greedy Policy, die nie zufällig fällt.
      - text: Q-Learning erkundet weniger als SARSA.
        correct: false
        why: Beide handeln mit demselben ε-greedy. Der Unterschied liegt nur im Lernziel.
      - text: SARSA kennt die Klippe aus `env.P`, Q-Learning nicht.
        correct: false
        why: Beide sind modellfrei und kennen `env.P` nicht.
      - text: Q-Learning ignoriert die Belohnung −100.
        correct: false
        why: Q-Learning lernt den Sturz genauso – es nimmt nur an, dass es später nicht mehr zufällig handelt.
  - type: quiz
    question: |
      Ein Roboter soll aus Aufzeichnungen eines **anderen**, vorsichtigen Bedieners die bestmögliche Policy lernen. Welcher Ansatz passt?
    options:
      - text: Q-Learning, weil es off-policy ist
        correct: true
        why: Das Ziel $\max_{a'} Q$ hängt nicht davon ab, wer die Daten erzeugt hat.
      - text: SARSA, weil es on-policy ist
        correct: false
        why: SARSA bewertet die Policy, die die Daten erzeugt – hier also nur den vorsichtigen Bediener.
      - text: Keiner – modellfreie Verfahren brauchen eigene Erfahrung
        correct: false
        why: Off-policy-Verfahren können aus fremden Übergängen lernen (in der Praxis mit Grenzen, wenn wichtige Aktionen nie vorkommen).
cards:
  - id: m14-c-sarsa-vs-q-ziel
    concept: sarsa-update
    variants:
      - type: predict
        code: |
          Q_s2 = [1.0, 4.0, 2.0, 0.0]
          r, gamma, a2 = 0.0, 0.5, 2
          print(r + gamma * max(Q_s2), r + gamma * Q_s2[a2])
        options: ["2.0 1.0", "1.0 2.0", "2.0 2.0", "4.0 2.0"]
        answer: "2.0 1.0"
        explanation: "Q-Learning: 0.5·4 = 2. SARSA mit a′ = 2: 0.5·2 = 1."
      - type: predict
        code: |
          Q_s2 = [-1.0, -7.0, -2.0, -3.0]
          r, gamma, a2 = -1.0, 1.0, 0
          print(r + gamma * max(Q_s2), r + gamma * Q_s2[a2])
        options: ["-2.0 -2.0", "-2.0 -8.0", "-8.0 -2.0", "-1.0 -1.0"]
        answer: "-2.0 -2.0"
        explanation: Hier hat ε-greedy die beste Aktion gezogen – dann sind beide Ziele gleich.
  - id: m14-c-q-update
    concept: q-learning-update
    variants:
      - type: predict
        code: |
          Q = {("s", "a"): 2.0}
          alpha, r, gamma = 0.5, 1.0, 1.0
          best_next = 5.0
          Q[("s", "a")] += alpha * (r + gamma * best_next - Q[("s", "a")])
          print(Q[("s", "a")])
        options: ["4.0", "6.0", "3.0", "2.5"]
        answer: "4.0"
        explanation: "Ziel = 1 + 5 = 6, δ = 4, Q = 2 + 0.5·4 = 4."
      - type: predict
        code: |
          q, alpha = 0.0, 0.1
          target = -10.0
          q += alpha * (target - q)
          print(q)
        options: ["-1.0", "-10.0", "1.0", "-0.1"]
        answer: "-1.0"
        explanation: Ein Zehntel des Weges zum Ziel −10.
  - id: m14-c-on-off
    concept: on-vs-off-policy
    variants:
      - type: quiz
        question: Was macht SARSA zu einem **on-policy**-Verfahren?
        options:
          - text: Das Ziel nutzt die Aktion, die die handelnde Policy als Nächstes wirklich wählt.
            correct: true
            why: Bewertet wird genau die Policy, die auch handelt – inklusive Erkundung.
          - text: Es aktualisiert nach jedem Schritt statt am Episodenende.
            correct: false
            why: Das tut Q-Learning auch; das ist TD, nicht on-policy.
          - text: Es braucht kein ε-greedy.
            correct: false
            why: SARSA nutzt typischerweise ε-greedy – genau diese Policy bewertet es.
      - type: quiz
        question: Q-Learning heißt **off-policy**, weil …
        options:
          - text: … es die greedy Policy lernt, während eine andere (z. B. ε-greedy) handelt.
            correct: true
            why: Ziel- und Verhaltenspolicy sind verschieden.
          - text: … es ohne Policy auskommt.
            correct: false
            why: Es handelt mit einer Verhaltenspolicy und lernt eine Zielpolicy.
          - text: … es die Policy erst am Episodenende ausschaltet.
            correct: false
            why: Mit „off“ ist nicht Ausschalten gemeint, sondern dass die gelernte Policy nicht die handelnde ist.
