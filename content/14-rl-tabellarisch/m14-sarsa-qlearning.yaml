id: m14-sarsa-qlearning
title: SARSA und Q-Learning an der Klippe
minutes: 12
goals:
  - Die Updates von SARSA und Q-Learning aufschreiben und unterscheiden
  - On-policy und off-policy an einem Beispiel erklären
  - Beide Verfahren auf Cliff Walking trainieren und die Pfade vergleichen
concepts: [sarsa-update, q-learning-update, on-vs-off-policy]
steps:
  - type: text
    body: |
      ## TD für Entscheidungen

      TD(0) bewertet eine feste Policy. Zum **Steuern** wendest du dieselbe Idee auf $Q(s, a)$ an. Zwei Varianten unterscheiden sich nur im Ziel:

      **SARSA** (aus $S, A, R, S', A'$): die Aktion $a'$, die der Agent als Nächstes **wirklich** wählt.
      $$Q(s,a) \leftarrow Q(s,a) + \alpha\,[r + \gamma\, Q(s', a') - Q(s,a)]$$

      **Q-Learning**: die **beste** Aktion in $s'$, egal was der Agent dann tut.
      $$Q(s,a) \leftarrow Q(s,a) + \alpha\,[r + \gamma \max_{a'} Q(s', a') - Q(s,a)]$$

      SARSA ist **on-policy**: Es bewertet die ε-greedy Policy, die handelt. Q-Learning ist **off-policy**: Es lernt die greedy Policy, während eine andere (ε-greedy) erkundet.
  - type: example
    intro: |
      **Cliff Walking** (Sutton & Barto, Beispiel 6.6): Start `S` unten links, Ziel `G` unten rechts, dazwischen die Klippe `X`. Jeder Schritt kostet −1, ein Sturz −100 und zurück zum Start.
    code: |
      import numpy as np
      import lab
      from lab.envs import GridWorld

      CLIFF = ["............",
               "............",
               "............",
               "SXXXXXXXXXXG"]
      env = GridWorld(CLIFF, goal_reward=-1, max_steps=500)

      def eps_greedy(Q, s, eps, rng):
          if rng.random() < eps:
              return int(rng.integers(4))
          return int(np.argmax(Q[s]))

      def q_learning(env, episodes, alpha=0.5, gamma=1.0, eps=0.1, seed=0):
          rng = np.random.default_rng(seed)
          Q = np.zeros((env.n_states, 4))
          returns = []
          for k in range(episodes):
              s, done, G = env.reset(), False, 0.0
              while not done:
                  a = eps_greedy(Q, s, eps, rng)
                  s2, r, done = env.step(a)
                  target = r if done else r + gamma * np.max(Q[s2])
                  Q[s, a] += alpha * (target - Q[s, a])
                  s, G = s2, G + r
              returns.append(G)
          return Q, returns

      Q, returns = q_learning(env, 200)
      lab.plot(returns, title="Q-Learning: Return pro Episode", xlabel="Episode", ylabel="Return")
      policy = np.argmax(Q, axis=1)
      s, path = env.reset(), [env.start]
      while not env.is_terminal(s) and len(path) < 40:
          s, r, done = env.step(int(policy[s]))
          path.append(s)
      env.render(policy=policy, path=path, title=f"Greedy-Pfad: {len(path) - 1} Schritte")
    subgoals:
      - lines: [5, 9]
        label: Eigenes Layout anlegen
      - lines: [11, 14]
        label: ε-greedy wählen
      - lines: [22, 27]
        label: Q-Learning-Update
      - lines: [31, 38]
        label: Lernkurve und Pfad zeigen
    after: |
      Die greedy Policy läuft direkt an der Klippenkante entlang: 13 Schritte, der kürzeste Weg. Die Lernkurve zeigt aber auch später noch Einbrüche bis −100 und tiefer – mit $\varepsilon = 0.1$ tritt der Agent beim Erkunden immer wieder über die Kante.
  - type: predict
    intro: |
      Derselbe Übergang, zwei Lernziele. Die ε-greedy Policy hat in $s'$ zufällig Aktion 1 gezogen.
    code: |
      import numpy as np
      Q_s2 = np.array([-3.0, -5.0, -2.0, -4.0])   # Q(s', ·)
      r, gamma = -1.0, 1.0
      a2 = 1
      print("Q-Learning:", r + gamma * np.max(Q_s2))
      print("SARSA:", r + gamma * Q_s2[a2])
    options:
      - |
        Q-Learning: -3.0
        SARSA: -6.0
      - |
        Q-Learning: -3.0
        SARSA: -3.0
      - |
        Q-Learning: -2.0
        SARSA: -5.0
      - |
        Q-Learning: -6.0
        SARSA: -3.0
    answer: |
      Q-Learning: -3.0
      SARSA: -6.0
    explanation: |
      Q-Learning nimmt das Maximum $-2$, SARSA den Wert der tatsächlich gezogenen Aktion $-5$; dazu kommt jeweils $r = -1$. SARSA „rechnet die Erkundung mit ein“.
  - type: fill
    fading: true
    prompt: |
      Ergänze das Q-Learning-Update. Getestet wird, ob die greedy Policy nach 200 Episoden in 13 Schritten zum Ziel läuft.
    code: |
      import numpy as np
