id: m15-baseline
title: Baseline – weniger Rauschen im Gradienten
minutes: 12
goals:
  - Begründen, warum eine Baseline den Erwartungswert des Gradienten nicht ändert
  - Die Varianzreduktion an einem Experiment messen
  - REINFORCE mit Baseline implementieren
concepts: [baseline-varianz, policy-gradient]
steps:
  - type: text
    body: |
      ## Alles ist gut – also lerne nichts?

      Bei CartPole ist jeder Return positiv. REINFORCE verstärkt deshalb **jede** gewählte Aktion, gute nur etwas stärker. Ob eine Aktion besser oder schlechter als üblich war, sieht der Gradient nur im Mittel über viele Episoden – die Schätzung ist stark verrauscht.

      Abhilfe: Ziehe vom Return eine **Baseline** $b(s)$ ab, die nicht von der Aktion abhängt:

      $$W \leftarrow W + \alpha \sum_t \big(G_t - b(s_t)\big)\, \nabla \log \pi(a_t \mid s_t)$$

      Dann zählt nur noch, ob es **besser als erwartet** lief. Der Erwartungswert bleibt gleich, denn
      $$\sum_a \pi(a \mid s)\, \nabla \log \pi(a \mid s) = \sum_a \nabla \pi(a \mid s) = \nabla 1 = 0.$$
  - type: predict
    intro: |
      Die Gleichung $\sum_a \pi(a)\,(e_a - \pi) = 0$ für die Softmax-Policy, nachgerechnet:
    code: |
      import numpy as np
      p = np.array([0.25, 0.75])
      print(p @ (np.eye(2) - p))
    options: ["[0. 0.]", "[0.25 0.75]", "[ 0.1875 -0.1875]", "[1. 1.]"]
    answer: "[0. 0.]"
    explanation: |
      Zeile $a$ von `np.eye(2) - p` ist $e_a - \pi$. Gewichtet mit $\pi(a)$ und summiert: $0.25 \cdot [0.75, -0.75] + 0.75 \cdot [-0.25, 0.25] = [0, 0]$. Eine konstante Baseline mal null bleibt null – kein Bias.
  - type: example
    intro: |
      Ein Banditen-Experiment: zwei Arme mit mittlerer Belohnung 10 und 11 (Rauschen $\sigma = 1$), Policy $\pi = [0.5, 0.5]$. Wir ziehen 10 000 einzelne Gradientenschätzungen für den Parameter von Arm 1 – einmal mit $G$, einmal mit $G - b$, $b = 10.5$.
    code: |
      import numpy as np

      rng = np.random.default_rng(0)
      p = np.array([0.5, 0.5])
      mu = np.array([10.0, 11.0])
      N = 10000
      a = rng.integers(2, size=N)                    # Aktionen gemäß pi
      R = mu[a] + rng.normal(size=N)
      grad1 = (a == 1) - p[1]                        # Komponente 1 von e_a - pi
      for b in (0.0, 10.5):
          g = (R - b) * grad1
          print(f"b = {b:4.1f}: Mittel {g.mean():.3f}, Standardabweichung {g.std():.2f}")
      print("wahrer Gradient:", 0.5 * 0.5 * (mu[1] - mu[0]))
    subgoals:
      - lines: [3, 6]
        label: Bandit und Policy festlegen
      - lines: [7, 9]
        label: Viele Stichproben vektorisiert ziehen
      - lines: [10, 12]
        label: Mit und ohne Baseline schätzen
      - lines: 13
        label: Mit der Wahrheit vergleichen
    after: |
      Beide Mittelwerte liegen nahe am wahren Wert 0.25, aber ohne Baseline schwankt eine Einzelschätzung um etwa ±5 – zwanzigmal mehr als das Signal. Mit Baseline ist die Streuung rund zehnmal kleiner. Weniger Varianz heißt: weniger Episoden oder größere Schritte.
  - type: explain
    question: |
      Warum darf die Baseline vom Zustand $s$ abhängen, aber **nicht** von der Aktion $a$?
    options:
      - text: Nur dann lässt sie sich vor die Summe über $a$ ziehen, und $\sum_a \nabla \pi(a \mid s) = 0$ macht ihren Beitrag zu null.
        correct: true
        why: Hinge $b$ von $a$ ab, bliebe $\sum_a b(s, a)\,\nabla\pi(a \mid s)$ im Allgemeinen ungleich null – der Gradient wäre verzerrt.
      - text: Weil eine Baseline immer konstant sein muss.
        correct: false
        why: Sie darf vom Zustand abhängen – $b(s) = \hat v(s)$ ist sogar die übliche Wahl.
      - text: Weil Aktionen diskret sind.
        correct: false
        why: Das Argument gilt genauso für kontinuierliche Aktionen (Integral statt Summe).
      - text: Weil sonst die Varianz steigt.
        correct: false
        why: Das Problem wäre nicht die Varianz, sondern ein falscher Erwartungswert.
  - type: exercise
    mode: make
    prompt: |
      **Gradient-Bandit** (Sutton & Barto, Abschnitt 2.8): eine Softmax-Policy über `len(mu)` Arme mit Präferenzen `theta`. In jedem Schritt: Arm ziehen, Belohnung `r` beobachten, Baseline `b` als laufenden Mittelwert aller bisherigen Belohnungen aktualisieren, dann

      $$\theta \leftarrow \theta + \alpha\,(r - b)\,(e_a - \pi)$$

      Ergänze die Schleife und gib am Ende die Wahrscheinlichkeiten `softmax(theta)` zurück.
    starter: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def gradient_bandit(steps, mu, lr=0.1, seed=0):
          rng = np.random.default_rng(seed)
          mu = np.asarray(mu, dtype=float)
          theta, b = np.zeros(len(mu)), 0.0
          for t in range(steps):
              p = softmax(theta)
              a = int(rng.choice(len(mu), p=p))
              r = mu[a] + rng.normal()
              # Baseline aktualisieren, dann theta
          return softmax(theta)
    solution: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def gradient_bandit(steps, mu, lr=0.1, seed=0):
          rng = np.random.default_rng(seed)
          mu = np.asarray(mu, dtype=float)
          theta, b = np.zeros(len(mu)), 0.0
          for t in range(steps):
              p = softmax(theta)
              a = int(rng.choice(len(mu), p=p))
              r = mu[a] + rng.normal()
              b += (r - b) / (t + 1)
              theta += lr * (r - b) * (np.eye(len(mu))[a] - p)
          return softmax(theta)
    tests:
      - name: Findet den besten Arm trotz Belohnung um +10
        code: |
          import numpy as np
          best = np.mean([gradient_bandit(300, [10.0, 10.5, 11.0], seed=s)[2] for s in range(5)])
          assert best > 0.8, f"Wahrscheinlichkeit für den besten Arm nach 300 Schritten im Mittel {best:.2f}, erwartet über 0.8"
      - name: Auch bei negativen Belohnungen
        code: |
          import numpy as np
          best = np.mean([gradient_bandit(300, [-11.0, -10.0, -10.5], seed=s)[1] for s in range(5)])
          assert best > 0.8, f"Bei Belohnungen um −10 sollte Arm 1 gewinnen, Wahrscheinlichkeit im Mittel {best:.2f}"
      - name: Wahrscheinlichkeiten
        code: |
          import numpy as np
          p = gradient_bandit(10, [0.0, 1.0], seed=0)
          assert np.shape(p) == (2,) and close(np.sum(p), 1.0), f"Rückgabe sollte ein Wahrscheinlichkeitsvektor der Länge 2 sein, ist {p}"
    mutants:
      - |
