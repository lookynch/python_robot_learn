    hints:
      - "Teilziel: anhängen und bei Überlauf vorne entfernen; zum Ziehen zufällige Indizes erzeugen."
      - "`list.pop(0)` entfernt das **erste** (älteste) Element, `pop()` das letzte. `rng.integers(k, size=n)` liefert `n` Indizes aus `0 … k−1`."
      - "In `add`: `self.data.append(transition)` und `if len(self.data) > self.capacity: self.data.pop(0)`"
      - "In `sample`: `idx = rng.integers(len(self.data), size=n)` und `return [self.data[i] for i in idx]`"
  - type: predict
    intro: |
      DQN-Ziele für einen Minibatch aus zwei Übergängen, vektorisiert. Der zweite endet in einem Endzustand.
    code: |
      import numpy as np
      q_target_next = np.array([[1.0, 3.0],
                                [2.0, 0.5]])     # Q(s', ·; θ⁻)
      r = np.array([0.0, 1.0])
      done = np.array([0.0, 1.0])
      y = r + 0.9 * q_target_next.max(axis=1) * (1 - done)
      print(y)
    options: ["[2.7 1. ]", "[2.7 2.8]", "[3. 2.]", "[0.9 1. ]"]
    answer: "[2.7 1. ]"
    explanation: |
      Zeile 1: $0 + 0.9 \cdot 3 = 2.7$. Zeile 2: `1 - done` ist 0, also nur $r = 1$. `max(axis=1)` nimmt das Maximum **pro Übergang** über die Aktionen.
  - type: explain
    question: |
      Warum rechnet DQN das Ziel mit einem **eingefrorenen** Target-Netz $\theta^-$ statt mit dem aktuellen Netz?
    options:
      - text: Sonst ändert jedes Update auch das Ziel, dem es folgen soll – die Schätzung jagt sich selbst und kann aufschwingen.
        correct: true
        why: Mit $\theta^-$ bleibt das Ziel für $C$ Schritte fest; das Problem wird für eine Weile zu normalem überwachtem Lernen.
      - text: Weil das Target-Netz genauer ist.
        correct: false
        why: Es ist eine **ältere** Kopie, also eher ungenauer – dafür stabil.
      - text: Damit weniger Speicher gebraucht wird.
        correct: false
        why: Eine zweite Kopie des Netzes braucht sogar mehr Speicher.
      - text: Weil Q-Learning ohne zweites Netz on-policy wäre.
        correct: false
        why: On/off-policy hängt vom Ziel ($\max$ vs. tatsächliche Aktion) ab, nicht von der Zahl der Netze.
  - type: example
    title: DQN-Spielversion
    intro: |
      Die DQN-Mechanik mit der linearen Q-Funktion aus der ersten Lektion statt eines Faltungsnetzes: Replay Buffer (Kapazität 2000), Minibatch von 8 Übergängen pro Schritt, Target-Gewichte `W_target` alle 50 Schritte kopiert.
    code: |
      import numpy as np
      import lab
      from lab.envs import GridWorld

      env = GridWorld(["S......."] + ["........"] * 6 + [".......G"], max_steps=200)

      def features(s):
          r, c = divmod(s, 8)
          phi = np.zeros(16)
          phi[r], phi[8 + c] = 1.0, 1.0
          return phi

      rng = np.random.default_rng(0)
      W = np.zeros((4, 16))
      W_target, buffer, steps, returns = W.copy(), [], 0, []
      for k in range(60):
          s, done, G = env.reset(), False, 0.0
          while not done:
              a = int(rng.integers(4)) if rng.random() < 0.1 else int(np.argmax(W @ features(s)))
              s2, r, done = env.step(a)
              buffer.append((features(s), a, r, features(s2), env.is_terminal(s2)))
              if len(buffer) > 2000:
                  buffer.pop(0)
              for i in rng.integers(len(buffer), size=8):
                  phi, a_i, r_i, phi2, end = buffer[i]
                  y = r_i if end else r_i + np.max(W_target @ phi2)
                  W[a_i] += 0.1 * (y - W[a_i] @ phi) * phi
              steps += 1
              if steps % 50 == 0:
                  W_target = W.copy()
              s, G = s2, G + r
          returns.append(G)

      lab.plot(returns, title="DQN-Spielversion: Return pro Episode", xlabel="Episode", ylabel="Return")
      Q = np.array([W @ features(s) for s in range(env.n_states)])
      env.render(values=Q.max(axis=1), policy=Q.argmax(axis=1), title="Gelernte Werte und Policy")
    subgoals:
      - lines: [13, 15]
        label: Netz, Target-Kopie und Puffer anlegen
      - lines: [19, 23]
        label: Handeln und Übergang speichern
      - lines: [24, 27]
        label: Minibatch aus dem Puffer lernen
      - lines: [28, 30]
        label: Target-Netz synchronisieren
      - lines: [34, 36]
        label: Ergebnis zeigen
    heavy: true
    after: |
      Hier lernt die Spielversion nicht schneller als einfaches lineares Q-Learning – die Aufgabe ist zu klein und die Merkmale passen zu gut. Die Tricks lohnen sich bei **Netzen**, die ohne sie leicht divergieren. Ehrlich: Echtes DQN auf Atari braucht ein Faltungsnetz und zig Millionen Bilder Training – das läuft nicht im Browser. In Modul 19 lernst du mit PyTorch das Werkzeug kennen, mit dem man solche Netze baut.
  - type: text
    body: |
      ## PPO: Policy Gradient mit Sicherheitsgurt

      Policy-Gradient-Schritte sind heikel: Ein zu großer Schritt kann die Policy ruinieren, und die gesammelten Daten passen dann nicht mehr. **PPO** (Proximal Policy Optimization, Schulman et al., 2017) nutzt einen Batch mehrfach und begrenzt, wie weit sich die Policy entfernen darf. Mit dem Verhältnis $\rho = \pi_\text{neu}(a \mid s) / \pi_\text{alt}(a \mid s)$ und einem Advantage $\hat A$ (z. B. vom Critic):

      $$L^\text{CLIP} = \mathbb{E}\Big[\min\big(\rho \hat A,\; \operatorname{clip}(\rho, 1-\varepsilon, 1+\varepsilon)\, \hat A\big)\Big]$$

      Im Paper ist $\varepsilon = 0.2$. Ist $\hat A > 0$, bringt ein $\rho$ über $1.2$ nichts mehr; ist $\hat A < 0$, bringt ein $\rho$ unter $0.8$ nichts mehr. Das $\min$ sorgt dafür, dass das Ziel eine **pessimistische** Schätzung bleibt. PPO ist on-policy und heute ein Standardverfahren, z. B. für Laufroboter in der Simulation.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `ppo_objective(ratio, adv, eps=0.2)`: elementweise $\min(\rho \hat A, \operatorname{clip}(\rho, 1-\varepsilon, 1+\varepsilon)\,\hat A)$, danach der **Mittelwert**. Nutze `np.minimum` und `np.clip`.
    starter: |
      import numpy as np

      def ppo_objective(ratio, adv, eps=0.2):
          ratio, adv = np.asarray(ratio, dtype=float), np.asarray(adv, dtype=float)
          # ungeclippter Term, geclippter Term, Minimum, Mittelwert
          pass
    solution: |
      import numpy as np

      def ppo_objective(ratio, adv, eps=0.2):
          ratio, adv = np.asarray(ratio, dtype=float), np.asarray(adv, dtype=float)
          unclipped = ratio * adv
          clipped = np.clip(ratio, 1 - eps, 1 + eps) * adv
          return float(np.mean(np.minimum(unclipped, clipped)))
    tests:
      - name: Ohne Änderung der Policy
        code: |
          v = ppo_objective([1.0, 1.0], [2.0, -1.0])
          assert v is not None and close(v, 0.5), f"Bei ratio = 1 ist das Ziel der mittlere Advantage 0.5, bekommen {v}"
      - name: Positiver Advantage wird gedeckelt
        code: |
          v = ppo_objective([1.5], [1.0])
          assert close(v, 1.2), f"ratio 1.5, A = 1: min(1.5, 1.2) = 1.2 erwartet, bekommen {v}"
          v = ppo_objective([0.5], [1.0])
          assert close(v, 0.5), f"ratio 0.5, A = 1: min(0.5, 0.8) = 0.5 erwartet, bekommen {v}"
      - name: Negativer Advantage
        code: |
          v = ppo_objective([0.5], [-1.0])
          assert close(v, -0.8), f"ratio 0.5, A = −1: min(−0.5, −0.8) = −0.8 erwartet, bekommen {v}"
          v = ppo_objective([1.5], [-1.0])
          assert close(v, -1.5), f"ratio 1.5, A = −1: min(−1.5, −1.2) = −1.5 erwartet, bekommen {v}"
      - name: Anderes epsilon
        code: |
          v = ppo_objective([2.0, 0.2], [1.0, -2.0], eps=0.5)
          assert close(v, 0.25), f"Mit eps = 0.5: (min(2, 1.5) + min(−0.4, −1.0)) / 2 = 0.25 erwartet, bekommen {v}"
    mutants:
      - |
        import numpy as np

        def ppo_objective(ratio, adv, eps=0.2):
            ratio, adv = np.asarray(ratio, dtype=float), np.asarray(adv, dtype=float)
            return float(np.mean(np.maximum(ratio * adv, np.clip(ratio, 1 - eps, 1 + eps) * adv)))
      - |
        import numpy as np

        def ppo_objective(ratio, adv, eps=0.2):
            ratio, adv = np.asarray(ratio, dtype=float), np.asarray(adv, dtype=float)
            return float(np.mean(np.clip(ratio, 1 - eps, 1 + eps) * adv))
      - |
