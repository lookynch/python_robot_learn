        def ppo_objective(ratio, adv, eps=0.2):
            ratio, adv = np.asarray(ratio, dtype=float), np.asarray(adv, dtype=float)
            return float(np.mean(np.minimum(ratio * adv, np.clip(ratio, 0.8, 1.2) * adv)))
    hints:
      - "Teilziel: zwei Terme elementweise bilden, das kleinere nehmen, mitteln."
      - "Der geclippte Term ist `np.clip(ratio, 1 - eps, 1 + eps) * adv` – der Advantage gehört **in** beide Terme."
      - "`return float(np.mean(np.minimum(ratio * adv, np.clip(ratio, 1 - eps, 1 + eps) * adv)))`"
  - type: quiz
    question: |
      Für einen Übergang mit $\hat A = +2$ ist das Verhältnis schon $\rho = 1.4$ ($\varepsilon = 0.2$). Was bewirkt das PPO-Ziel für diesen Übergang?
    options:
      - text: Er trägt keinen Gradienten mehr bei – das Ziel ist bei $1.2 \cdot 2$ gedeckelt.
        correct: true
        why: Der geclippte Term ist kleiner und konstant in $\rho$; die Policy wird für diese Aktion nicht weiter verschoben.
      - text: Die Policy wird zurück auf $\rho = 1$ gezogen.
        correct: false
        why: Das Clipping zieht nicht zurück, es nimmt nur den Anreiz weg, weiterzugehen.
      - text: Der Übergang wird noch stärker verstärkt, weil $\rho \hat A = 2.8$ groß ist.
        correct: false
        why: Das $\min$ wählt $2.4$, nicht $2.8$.
      - text: Der Advantage wird auf $0.2$ begrenzt.
        correct: false
        why: Geclippt wird das Verhältnis $\rho$, nicht $\hat A$.
cards:
  - id: m15-c-dqn-ziel
    concept: dqn-replay-target
    variants:
      - type: predict
        code: |
          import numpy as np
          q_next = np.array([0.5, 2.0, 1.0])     # Q(s', ·; θ⁻)
          r, gamma, done = 1.0, 0.5, False
          print(r + gamma * q_next.max() * (not done))
        options: ["2.0", "1.25", "3.0", "1.0"]
        answer: "2.0"
        explanation: "1 + 0.5·2 = 2: das Maximum aus dem Target-Netz."
      - type: predict
        code: |
          import numpy as np
          q_next = np.array([4.0, 9.0])
          r, gamma, done = -1.0, 0.9, True
          print(r + gamma * q_next.max() * (not done))
        options: ["-1.0", "7.1", "8.1", "0.0"]
        answer: "-1.0"
        explanation: Bei einem Endzustand zählt nur die Belohnung.
  - id: m15-c-dqn-tricks
    concept: dqn-replay-target
    variants:
      - type: quiz
        question: Wogegen hilft der **Replay Buffer** in DQN vor allem?
        options:
          - text: Gegen stark korrelierte aufeinanderfolgende Trainingsdaten – und er nutzt Erfahrung mehrfach
            correct: true
            why: Zufällige Minibatches aus dem Puffer ähneln eher unabhängigen Stichproben.
          - text: Gegen ein Ziel, das sich mit jedem Update verschiebt
            correct: false
            why: Dafür ist das Target-Netz da.
          - text: Gegen zu wenig Erkundung
            correct: false
            why: Erkundet wird weiterhin ε-greedy; der Puffer speichert nur.
      - type: quiz
        question: Welche drei Zutaten bilden die „tödliche Triade“?
        options:
          - text: Funktionsapproximation, Bootstrapping, off-policy-Lernen
            correct: true
            why: Jede einzeln ist harmlos; zusammen kann das Lernen divergieren.
          - text: Neuronale Netze, große Lernrate, kleine Batches
            correct: false
            why: Das sind Stabilitätsthemen, aber nicht die Triade aus Sutton & Barto.
          - text: Exploration, Exploitation, Diskont
            correct: false
            why: Diese Begriffe gehören zu jedem RL-Verfahren.
  - id: m15-c-ppo-clip
    concept: ppo-clipping
    variants:
      - type: predict
        code: |
          import numpy as np
          ratio, adv, eps = 0.6, -1.0, 0.2
          print(min(ratio * adv, np.clip(ratio, 1 - eps, 1 + eps) * adv))
        options: ["-0.8", "-0.6", "0.6", "-1.2"]
        answer: "-0.8"
        explanation: "min(−0.6, −0.8) = −0.8. Die Aktion noch unwahrscheinlicher zu machen, bringt nichts mehr."
      - type: predict
        code: |
          import numpy as np
          ratio, adv, eps = 1.1, 3.0, 0.2
          print(round(min(ratio * adv, np.clip(ratio, 1 - eps, 1 + eps) * adv), 2))
        options: ["3.3", "3.6", "3.0", "0.6"]
        answer: "3.3"
        explanation: Innerhalb von $[0.8, 1.2]$ greift das Clipping nicht.
