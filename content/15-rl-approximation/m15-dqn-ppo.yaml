id: m15-dqn-ppo
title: DQN und PPO – die Bausteine im Kleinen
minutes: 14
goals:
  - Replay Buffer und Target-Netz von DQN begründen und selbst bauen
  - Das PPO-Clipping-Ziel berechnen und deuten
  - Einschätzen, was davon im Browser geht und was nicht
concepts: [dqn-replay-target, toedliche-triade, ppo-clipping]
steps:
  - type: text
    body: |
      ## DQN: Q-Learning mit neuronalem Netz

      **DQN** (Mnih et al., 2013; erweitert 2015 in *Nature*) lernte in der Nature-Version 49 Atari-Spiele direkt aus Bildern – mit einem Faltungsnetz als $Q(s, a; \theta)$ und denselben Hyperparametern für alle Spiele. Q-Learning mit einem Netz ist allerdings instabil. Sutton & Barto nennen die Ursache die **tödliche Triade**: Funktionsapproximation + Bootstrapping + off-policy-Lernen können zusammen divergieren.

      DQN entschärft das mit zwei Tricks:

      1. **Replay Buffer:** Übergänge $(s, a, r, s', \text{done})$ speichern und zufällige Minibatches daraus lernen. Aufeinanderfolgende Schritte sind stark korreliert – zufälliges Ziehen bricht das auf, und jede Erfahrung wird mehrfach genutzt.
      2. **Target-Netz:** Das Ziel $y = r + \gamma \max_{a'} Q(s', a'; \theta^-)$ nutzt eine **eingefrorene Kopie** $\theta^-$, die nur alle $C$ Schritte aktualisiert wird. Sonst verschiebt jedes Update auch das eigene Ziel. (Das Target-Netz kam erst in der Version von 2015 dazu.)
  - type: exercise
    mode: make
    prompt: |
      Baue einen `ReplayBuffer` mit fester Kapazität:

      - `add(transition)` hängt einen Übergang an; ist die Kapazität überschritten, fliegt der **älteste** raus.
      - `sample(n, rng)` gibt eine Liste von `n` zufällig (mit Zurücklegen) gezogenen Übergängen zurück.
      - `len(buffer)` liefert die aktuelle Anzahl.
    starter: |
      class ReplayBuffer:
          def __init__(self, capacity):
              self.capacity = capacity
              self.data = []

          def add(self, transition):
              pass

          def sample(self, n, rng):
              pass

          def __len__(self):
              return len(self.data)
    solution: |
      class ReplayBuffer:
          def __init__(self, capacity):
              self.capacity = capacity
              self.data = []

          def add(self, transition):
              self.data.append(transition)
              if len(self.data) > self.capacity:
                  self.data.pop(0)

          def sample(self, n, rng):
              idx = rng.integers(len(self.data), size=n)
              return [self.data[i] for i in idx]

          def __len__(self):
              return len(self.data)
    tests:
      - name: Kapazität wird eingehalten
        code: |
          buf = ReplayBuffer(3)
          for i in range(5):
              buf.add((i, 0, 0.0, i + 1, False))
          assert len(buf) == 3, f"Nach 5 add() bei Kapazität 3 sollten 3 Übergänge drin sein, sind {len(buf)}"
      - name: Der älteste fliegt raus
        code: |
          import numpy as np
          buf = ReplayBuffer(3)
          for i in range(5):
              buf.add((i, 0, 0.0, i + 1, False))
          got = {t[0] for t in buf.sample(200, np.random.default_rng(0))}
          assert got == {2, 3, 4}, f"Im Puffer sollten die neuesten Übergänge 2, 3, 4 liegen; gezogen wurden {sorted(got)}"
      - name: Stichprobe hat die richtige Größe
        code: |
          import numpy as np
          buf = ReplayBuffer(100)
          for i in range(10):
              buf.add((i, 1, -1.0, i, False))
          batch = buf.sample(32, np.random.default_rng(1))
          assert len(batch) == 32, f"sample(32, rng) sollte 32 Übergänge liefern, liefert {len(batch)}"
          assert len({t[0] for t in batch}) > 3, "Die Stichprobe sollte zufällig verschiedene Übergänge enthalten."
