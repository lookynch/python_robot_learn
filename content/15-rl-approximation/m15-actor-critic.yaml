    hints:
      - "Teilziel: TD-Fehler einmal berechnen und für Critic **und** Actor verwenden."
      - "Critic wie TD(0) aus Modul 14; Actor wie REINFORCE, nur mit $\\delta$ statt $G$. Der One-hot-Vektor ist `np.eye(len(p))[a]`."
      - "`delta = (r if done else r + gamma * V[s2]) - V[s]`"
      - "`V[s] += alpha_critic * delta` und `H[s] += alpha_actor * delta * (np.eye(len(p))[a] - p)`, dann `return delta`."
  - type: example
    title: Actor-Critic an der Klippe
    code: |
      import numpy as np
      import lab
      from lab.envs import GridWorld

      env = GridWorld(["............", "............", "............", "SXXXXXXXXXXG"],
                      goal_reward=-1, max_steps=300)

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      rng = np.random.default_rng(0)
      H, V, returns = np.zeros((env.n_states, 4)), np.zeros(env.n_states), []
      for k in range(200):
          s, done, G = env.reset(), False, 0.0
          while not done:
              p = softmax(H[s])
              a = int(rng.choice(4, p=p))
              s2, r, done = env.step(a)
              delta = (r if env.is_terminal(s2) else r + V[s2]) - V[s]
              V[s] += 0.1 * delta                          # Critic
              H[s] += 0.1 * delta * (np.eye(4)[a] - p)     # Actor
              s, G = s2, G + r
          returns.append(G)

      lab.plot(np.convolve(returns, np.ones(10) / 10, mode="valid"), title="Actor-Critic: Return (gleitendes Mittel)", xlabel="Episode", ylabel="Return")
      policy = np.argmax(H, axis=1)
      s, path = env.reset(), [env.start]
      while not env.is_terminal(s) and len(path) < 40:
          s, r, done = env.step(int(policy[s]))
          path.append(s)
      env.render(values=V, policy=policy, path=path, title="Critic V und wahrscheinlichste Aktionen")
      print("P(Aktionen) am Start:", np.round(softmax(H[env.start]), 2))
    subgoals:
      - lines: [12, 13]
        label: Actor und Critic anlegen
      - lines: [17, 18]
        label: Aktion aus der Policy ziehen
      - lines: [19, 22]
        label: TD-Fehler für beide nutzen
      - lines: [26, 32]
        label: Lernkurve, Werte und Pfad zeigen
    after: |
      Die Lernkurve steigt ohne ε, ohne Episodenende-Warten. Der wahrscheinlichste Pfad hält Abstand zur Klippe (hier zwei Reihen) – wie bei SARSA, denn auch Actor-Critic ist **on-policy**: Er bewertet die stochastische Policy, mit der er handelt. Die Policy bleibt stochastisch; die Pfeile zeigen nur die jeweils wahrscheinlichste Aktion.
  - type: text
    body: |
      ## Von hier zu A2C und A3C

      Die großen Actor-Critic-Verfahren bauen genau diese Struktur aus:

      - **Neuronale Netze** statt Tabellen für Policy und Wertfunktion (oft ein Netz mit zwei „Köpfen“).
      - **n-Schritt-Ziele** $r_t + \gamma r_{t+1} + \dots + \gamma^{n-1} r_{t+n-1} + \gamma^n \hat v(s_{t+n})$ – ein Mittelweg zwischen TD (n = 1) und Monte Carlo.
      - **Mehrere Umgebungen parallel**, damit die Daten eines Updates weniger korreliert sind. A3C (Mnih et al., 2016) lässt viele Worker asynchron updaten; A2C ist die synchrone Variante, bei der alle Worker gemeinsam einen Batch liefern.
      - Ein **Entropie-Bonus** im Ziel, damit die Policy nicht zu früh deterministisch wird.

      Den Advantage-Ausdruck $\delta$ bzw. $\hat A$ triffst du in PPO wieder.
  - type: quiz
    question: |
      Welche Aussage über Ein-Schritt-Actor-Critic im Vergleich zu REINFORCE stimmt?
    options:
      - text: Er lernt nach jedem Schritt und hat weniger Varianz, aber ein verzerrtes Signal, solange der Critic ungenau ist.
        correct: true
        why: Das ist der klassische Bias-Varianz-Tausch durch Bootstrapping.
      - text: Er braucht ein Modell der Umgebung für den Critic.
        correct: false
        why: Der Critic lernt modellfrei per TD aus erlebten Übergängen.
      - text: Er ist off-policy und kann beliebige alte Daten nutzen.
        correct: false
        why: Die einfache Version ist on-policy – Actor und Critic lernen aus der aktuellen Policy.
      - text: Er braucht ε-greedy zur Erkundung.
        correct: false
        why: Die Softmax-Policy ist stochastisch und erkundet selbst.
cards:
  - id: m15-c-ac-delta
    concept: actor-critic-td
    variants:
      - type: predict
        code: |
          V_s, V_s2, r, gamma = 2.0, 3.0, 1.0, 0.5
          print(r + gamma * V_s2 - V_s)
        options: ["0.5", "2.0", "-0.5", "1.5"]
        answer: "0.5"
        explanation: "1 + 0.5·3 − 2 = 0.5: leicht besser als erwartet."
      - type: predict
        code: |
          V_s, V_s2, r, gamma = -3.0, -6.0, -1.0, 1.0
          print(r + gamma * V_s2 - V_s)
        options: ["-4.0", "4.0", "-10.0", "2.0"]
        answer: "-4.0"
        explanation: "−1 − 6 + 3 = −4: Die Aktion führte in einen schlechten Zustand und wird abgeschwächt."
  - id: m15-c-ac-rollen
    concept: actor-critic-td
    variants:
      - type: quiz
        question: Was lernt der **Critic** im Actor-Critic?
        options:
          - text: Eine Wertfunktion $\hat v(s)$, deren TD-Fehler das Lernsignal des Actors ist
            correct: true
            why: Der Critic bewertet, der Actor handelt.
          - text: Die Policy $\pi(a \mid s)$
            correct: false
            why: Das ist der Actor.
          - text: Ein Modell der Übergänge
            correct: false
            why: Das wäre modellbasiertes RL wie Dyna.
      - type: quiz
        question: Warum laufen bei A2C/A3C mehrere Umgebungen parallel?
        options:
          - text: Damit die Daten eines Updates aus verschiedenen Situationen stammen und weniger korreliert sind
            correct: true
            why: Aufeinanderfolgende Schritte einer Episode ähneln sich stark; parallele Worker mischen die Daten.
          - text: Weil sonst kein Gradient berechnet werden kann
            correct: false
            why: Ein Worker reicht dafür – nur sind die Daten stärker korreliert.
          - text: Um ein Modell der Welt zu lernen
            correct: false
            why: A2C/A3C sind modellfrei.
