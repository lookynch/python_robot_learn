id: m15-actor-critic
title: Actor-Critic – Policy und Kritiker lernen gemeinsam
minutes: 12
goals:
  - Den TD-Fehler als Schätzung des Vorteils (advantage) deuten
  - Einen Ein-Schritt-Actor-Critic implementieren
  - Die Idee hinter A2C/A3C einordnen
concepts: [actor-critic-td, baseline-varianz, td0-update]
steps:
  - type: text
    body: |
      ## Der Kritiker ersetzt den Return

      REINFORCE mit Baseline nutzt $G_t - \hat v(s_t)$ – und muss dafür bis zum Episodenende warten. **Actor-Critic** ersetzt $G_t$ durch das TD-Ziel aus Modul 14:

      $$\delta = r + \gamma\, \hat v(s') - \hat v(s)$$

      - Der **Critic** lernt $\hat v$ per TD(0): $\hat v(s) \leftarrow \hat v(s) + \alpha_v\, \delta$.
      - Der **Actor** (die Policy) macht einen Policy-Gradient-Schritt mit $\delta$ statt $G - b$: $\theta \leftarrow \theta + \alpha_\theta\, \delta\, \nabla \log \pi(a \mid s)$.

      Beides passiert **nach jedem Schritt**. Der Preis: $\delta$ ist verzerrt, solange $\hat v$ ungenau ist (Bootstrapping), dafür viel weniger verrauscht als $G_t$. Wir nutzen hier eine tabellarische Version: Präferenzen `H[s, a]` mit Softmax-Policy und Werte `V[s]` (Sutton & Barto, Abschnitt 13.5).
  - type: predict
    code: |
      import numpy as np
      H = np.array([0.0, 0.0])          # Präferenzen in s, 2 Aktionen
      V_s, V_s2 = -5.0, -2.0
      r, gamma, a, alpha = -1.0, 1.0, 1, 0.5
      p = np.exp(H) / np.exp(H).sum()
      delta = r + gamma * V_s2 - V_s
      H += alpha * delta * (np.eye(2)[a] - p)
      print(delta, H)
    options: ["2.0 [-0.5  0.5]", "-2.0 [ 0.5 -0.5]", "2.0 [0.  1.]", "-8.0 [ 2. -2.]"]
    answer: "2.0 [-0.5  0.5]"
    explanation: |
      $\delta = -1 + (-2) - (-5) = 2 > 0$: Es lief besser als erwartet, also wird Aktion 1 wahrscheinlicher. Mit $\pi = [0.5, 0.5]$ ist der Schritt $0.5 \cdot 2 \cdot [-0.5, 0.5]$.
  - type: explain
    question: |
      Warum ist $\delta = r + \gamma V(s') - V(s)$ eine sinnvolle Schätzung dafür, **wie viel besser** Aktion $a$ war als üblich?
    options:
      - text: Mit dem wahren $V$ gilt $\mathbb{E}[\delta \mid s, a] = Q(s, a) - V(s)$ – genau der Vorteil (advantage) von $a$.
        correct: true
        why: $r + \gamma V(s')$ schätzt $Q(s, a)$, und $V(s)$ ist der Durchschnitt über die Policy – die Differenz ist der Vorteil.
      - text: Weil $\delta$ immer positiv ist.
        correct: false
        why: $\delta$ ist negativ, wenn es schlechter lief als erwartet – dann wird die Aktion abgeschwächt.
      - text: Weil $\delta$ der vollständige Return ist.
        correct: false
        why: $\delta$ enthält nur eine Belohnung und zwei Schätzungen.
      - text: Weil der Critic die Policy kennt.
        correct: false
        why: Der Critic bewertet Zustände; die Policy fließt nur indirekt über die Daten ein.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `actor_critic_step(H, V, s, a, r, s2, done, alpha_actor, alpha_critic, gamma)`:

      1. Policy in `s` berechnen: `p = softmax(H[s])` (vorgegeben).
      2. TD-Fehler `delta` (bei `done` ohne `V[s2]`).
      3. Critic: `V[s]` um `alpha_critic * delta` verschieben.
      4. Actor: `H[s]` um `alpha_actor * delta * (e_a - p)` verschieben.
      5. `delta` zurückgeben.

      Ein Test trainiert damit einen Agenten an der Klippe aus Modul 14.
    starter: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def actor_critic_step(H, V, s, a, r, s2, done, alpha_actor, alpha_critic, gamma):
          p = softmax(H[s])
          # TD-Fehler, Critic, Actor
          pass
    solution: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def actor_critic_step(H, V, s, a, r, s2, done, alpha_actor, alpha_critic, gamma):
          p = softmax(H[s])
          delta = (r if done else r + gamma * V[s2]) - V[s]
          V[s] += alpha_critic * delta
          H[s] += alpha_actor * delta * (np.eye(len(p))[a] - p)
          return delta
    tests:
      - name: Ein Schritt mit Zahlen
        code: |
          import numpy as np
          H, V = np.zeros((2, 2)), np.array([-5.0, -2.0])
          d = actor_critic_step(H, V, 0, 1, -1.0, 1, False, 0.5, 0.1, 1.0)
          assert d is not None and close(d, 2.0), f"δ = −1 + (−2) − (−5) = 2 erwartet, bekommen {d}"
          assert close(V, [-4.8, -2.0]), f"V[0] sollte −5 + 0.1·2 = −4.8 sein, V ist {V.tolist()}"
          assert close(H, [[-0.5, 0.5], [0.0, 0.0]]), f"H[0] sollte [−0.5, 0.5] sein, H ist {H.tolist()}"
      - name: Endzustand und negativer Fehler
        code: |
          import numpy as np
          H, V = np.zeros((2, 3)), np.array([1.0, 50.0])
          d = actor_critic_step(H, V, 0, 0, -1.0, 1, True, 0.3, 0.5, 1.0)
          assert close(d, -2.0), f"Bei done ist das Ziel nur r = −1 → δ = −2 erwartet, bekommen {d}"
          assert close(V[0], 0.0), f"V[0] sollte 1 + 0.5·(−2) = 0 sein, ist {V[0]}"
          assert close(H[0], [-0.4, 0.2, 0.2]), f"H[0] sollte 0.3·(−2)·([1, 0, 0] − 1/3) = [−0.4, 0.2, 0.2] sein, ist {np.round(H[0], 3).tolist()}"
      - name: Lernt an der Klippe
        code: |
          import numpy as np
          from lab.envs import GridWorld
          env = GridWorld(["............", "............", "............", "SXXXXXXXXXXG"], goal_reward=-1, max_steps=300)
          rng = np.random.default_rng(0)
          H, V, rets = np.zeros((env.n_states, 4)), np.zeros(env.n_states), []
          for k in range(150):
              s, done, G = env.reset(), False, 0.0
              while not done:
                  a = int(rng.choice(4, p=softmax(H[s])))
                  s2, r, done = env.step(a)
                  actor_critic_step(H, V, s, a, r, s2, env.is_terminal(s2), 0.1, 0.1, 1.0)
                  s, G = s2, G + r
              rets.append(G)
          m = np.mean(rets[-20:])
          assert m > -30, f"Mittlerer Return der letzten 20 Episoden ist {m:.0f}, erwartet über −30"
    mutants:
