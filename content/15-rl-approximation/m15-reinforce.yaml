      - "Teilziel: One-hot-Vektor bilden, Wahrscheinlichkeiten abziehen, mit dem Zustand außen multiplizieren."
      - "`np.eye(2)[a]` ist der One-hot-Vektor $e_a$. `np.outer(u, v)` bildet die Matrix $u_i v_j$."
      - "`return np.outer(s, np.eye(2)[a] - p)`"
  - type: example
    title: REINFORCE auf CartPole
    intro: |
      Pro Episode: mit der stochastischen Policy spielen, Returns rückwärts berechnen, dann **einmal** updaten. Die Summe $\sum_t G_t\, s_t \otimes (e_{a_t} - \pi_t)$ ist vektorisiert eine Matrixmultiplikation `S.T @ (...)`.
    code: |
      import numpy as np
      import lab
      from lab.envs import CartPole

      def softmax(z):
          e = np.exp(z - np.max(z, axis=-1, keepdims=True))
          return e / e.sum(axis=-1, keepdims=True)

      def returns(rewards, gamma):
          G, out = 0.0, np.zeros(len(rewards))
          for t in reversed(range(len(rewards))):
              G = rewards[t] + gamma * G
              out[t] = G
          return out

      env = CartPole(max_steps=200, seed=0)
      rng = np.random.default_rng(0)
      W = np.zeros((4, 2))
      lengths = []
      for k in range(100):
          s, done, S, A, R = env.reset(), False, [], [], []
          while not done:
              p = softmax(s @ W)
              a = int(rng.random() < p[1])         # Aktion 1 mit Wahrscheinlichkeit p[1]
              S.append(s)
              A.append(a)
              s, r, done = env.step(a)
              R.append(r)
          S, A, G = np.array(S), np.array(A), returns(R, 0.99)
          P = softmax(S @ W)                       # T × 2
          W += 0.005 * S.T @ ((np.eye(2)[A] - P) * G[:, None])
          lengths.append(len(R))
          lab.progress((k + 1) / 100, "Training")

      fig = lab.Figure(title="REINFORCE: Schritte pro Episode", xlabel="Episode", ylabel="Schritte")
      fig.line(lengths, label="Episode")
      fig.line(np.convolve(lengths, np.ones(10) / 10, mode="valid"), x=np.arange(9, 100), label="Mittel über 10")
      fig.show()

      s, done, states = env.reset(), False, []
      while not done:
          states.append(s)
          s, r, done = env.step(int(np.argmax(s @ W)))
      env.render(np.array(states), title=f"Greedy: {len(states)} Schritte")
    subgoals:
      - lines: [5, 14]
        label: Softmax und Returns
      - lines: [21, 28]
        label: Episode mit der Policy spielen
      - lines: [29, 31]
        label: Policy-Gradient-Schritt
      - lines: [35, 38]
        label: Lernkurve zeichnen
      - lines: [40, 44]
        label: Ergebnis animieren
    heavy: true
    after: |
      Acht Gewichte genügen, um den Stab oft über 100 Schritte zu halten. Die Kurve ist stark verrauscht: Jede Episode liefert nur **eine** Stichprobe des Gradienten. Und weil bei CartPole jeder Return positiv ist, wird jede gewählte Aktion verstärkt – nur unterschiedlich stark. Genau da setzt die nächste Lektion (Baseline) an.
  - type: exercise
    mode: modify
    heavy: true
    prompt: |
      In `train` fehlt der Lernschritt. Ergänze nach der Berechnung von `G` das REINFORCE-Update: Für jeden Zeitschritt `t` wird `W` um `lr * G[t] * grad_log_pi(W, S[t], A[t])` verschoben. Getestet wird, ob die letzten 20 Episoden im Mittel über 60 Schritte dauern.
    starter: |
      import numpy as np
      from lab.envs import CartPole

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def grad_log_pi(W, s, a):
          return np.outer(s, np.eye(2)[a] - softmax(s @ W))

      def train(episodes, seed=0, lr=0.005, gamma=0.99):
          env = CartPole(max_steps=200, seed=seed)
          rng = np.random.default_rng(seed)
          W = np.zeros((4, 2))
          lengths = []
          for k in range(episodes):
              s, done, S, A, R = env.reset(), False, [], [], []
              while not done:
                  a = int(rng.random() < softmax(s @ W)[1])
                  S.append(s)
                  A.append(a)
                  s, r, done = env.step(a)
                  R.append(r)
              G, g = np.zeros(len(R)), 0.0
              for t in reversed(range(len(R))):
                  g = R[t] + gamma * g
                  G[t] = g
              # hier fehlt das Update von W
              lengths.append(len(R))
          return lengths
    solution: |
      import numpy as np
      from lab.envs import CartPole

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def grad_log_pi(W, s, a):
          return np.outer(s, np.eye(2)[a] - softmax(s @ W))

      def train(episodes, seed=0, lr=0.005, gamma=0.99):
          env = CartPole(max_steps=200, seed=seed)
          rng = np.random.default_rng(seed)
          W = np.zeros((4, 2))
          lengths = []
          for k in range(episodes):
              s, done, S, A, R = env.reset(), False, [], [], []
              while not done:
                  a = int(rng.random() < softmax(s @ W)[1])
                  S.append(s)
                  A.append(a)
                  s, r, done = env.step(a)
                  R.append(r)
              G, g = np.zeros(len(R)), 0.0
              for t in reversed(range(len(R))):
                  g = R[t] + gamma * g
                  G[t] = g
              for t in range(len(R)):
                  W += lr * G[t] * grad_log_pi(W, S[t], A[t])
              lengths.append(len(R))
          return lengths
    tests:
