  - type: quiz
    question: |
      Warum braucht REINFORCE **kein Modell** der Umgebung, obwohl $J$ von der Dynamik abhängt?
    options:
      - text: Im Gradienten von $\log p_W(\tau)$ fallen die Übergangswahrscheinlichkeiten weg, weil sie nicht von $W$ abhängen.
        correct: true
        why: Übrig bleibt $\sum_t \nabla \log \pi_W(a_t \mid s_t)$ – das kann der Agent selbst berechnen, die Dynamik steckt nur in den gesammelten Episoden.
      - text: Weil CartPole deterministisch ist.
        correct: false
        why: Die Herleitung gilt auch für stochastische Umgebungen.
      - text: Weil die Policy linear ist.
        correct: false
        why: REINFORCE funktioniert mit beliebigen differenzierbaren Policies, z. B. neuronalen Netzen.
      - text: Weil das Update erst am Episodenende passiert.
        correct: false
        why: Der Zeitpunkt ändert nichts daran, ob man ein Modell braucht.
cards:
  - id: m15-c-grad-log-softmax
    concept: softmax-policy-gradient
    variants:
      - type: predict
        code: |
          import numpy as np
          p = np.array([0.5, 0.5])
          print(np.eye(2)[1] - p)
        options: ["[-0.5  0.5]", "[0.5 0.5]", "[ 0.5 -0.5]", "[0. 1.]"]
        answer: "[-0.5  0.5]"
        explanation: Gewählte Aktion 1 bekommt $1 - 0.5$, die andere $0 - 0.5$.
      - type: predict
        code: |
          import numpy as np
          p = np.array([0.9, 0.1])
          print(np.round(np.eye(2)[0] - p, 2))
        options: ["[ 0.1 -0.1]", "[ 0.9 -0.1]", "[-0.1  0.1]", "[0.1 0.9]"]
        answer: "[ 0.1 -0.1]"
        explanation: War die Aktion schon wahrscheinlich, ist der Schritt klein – es gibt wenig zu verstärken.
  - id: m15-c-reinforce-idee
    concept: reinforce-algorithmus
    variants:
      - type: quiz
        question: Womit wird $\nabla \log \pi(a_t \mid s_t)$ im REINFORCE-Update gewichtet?
        options:
          - text: Mit dem Return $G_t$ ab Zeitschritt $t$
            correct: true
            why: Aktionen, nach denen viel Belohnung kam, werden stärker verstärkt.
          - text: Mit der Belohnung $r_t$ allein
            correct: false
            why: Dann zählte nur der unmittelbare Effekt; bei CartPole wäre das immer 1.
          - text: Mit dem Return der ganzen Episode ab $t = 0$
            correct: false
            why: Das ist erwartungstreu, aber unnötig verrauscht – frühere Belohnungen hängen nicht von $a_t$ ab.
      - type: quiz
        question: Wie erkundet eine Softmax-Policy?
        options:
          - text: Sie zieht Aktionen zufällig gemäß ihren Wahrscheinlichkeiten.
            correct: true
            why: Die Erkundung ist in der stochastischen Policy eingebaut.
          - text: Mit einem zusätzlichen ε-greedy-Schritt.
            correct: false
            why: Nicht nötig – sie ist schon stochastisch.
          - text: Gar nicht, sie wählt immer die wahrscheinlichste Aktion.
            correct: false
            why: Das wäre die greedy Auswertung, nicht das Lernen.
  - id: m15-c-log-trick
    concept: policy-gradient
    variants:
      - type: quiz
        question: Welche Identität steckt hinter dem Policy-Gradienten?
        options:
          - text: $\nabla p = p\, \nabla \log p$
            correct: true
            why: Damit wird aus dem Gradienten einer Summe ein Erwartungswert, den man per Stichprobe schätzen kann.
          - text: $\nabla \log p = \log \nabla p$
            correct: false
            why: Das gilt nicht; Ableitung und Logarithmus vertauschen nicht.
          - text: $\nabla p = 1/p$
            correct: false
            why: Das ist die Ableitung von $\log p$ nach $p$, nicht nach $W$.
      - type: quiz
        question: Warum taucht die Dynamik der Umgebung in $\nabla_W \log p_W(\tau)$ nicht auf?
        options:
          - text: Die Übergangswahrscheinlichkeiten hängen nicht von $W$ ab, ihr Gradient ist null.
            correct: true
            why: Übrig bleiben nur die Terme $\nabla \log \pi_W(a_t \mid s_t)$.
          - text: Weil die Umgebung deterministisch angenommen wird.
            correct: false
            why: Die Herleitung gilt auch für stochastische Umgebungen.
          - text: Weil man sie vorher aus Daten schätzt.
            correct: false
            why: REINFORCE schätzt kein Modell – das ist gerade der Vorteil.
