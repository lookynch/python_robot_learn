id: m15-reinforce
title: REINFORCE – die Policy direkt lernen
minutes: 14
goals:
  - Den Policy-Gradienten mit dem Log-Ableitungs-Trick begründen
  - "$\\nabla \\log \\pi$ einer linearen Softmax-Policy berechnen und numerisch prüfen"
  - REINFORCE auf CartPole implementieren
concepts: [policy-gradient, softmax-policy-gradient, reinforce-algorithmus]
steps:
  - type: text
    body: |
      ## Ohne Umweg über Q

      Bisher: Werte lernen, dann $\arg\max$. Jetzt parametrisierst du die **Policy selbst**. Für CartPole reicht eine lineare Softmax-Policy mit einer $4 \times 2$-Matrix $W$:

      $$\pi_W(a \mid s) = \operatorname{softmax}(s^\top W)_a$$

      Sie ist **stochastisch** – das Erkunden ist eingebaut, kein ε nötig. Ziel ist der erwartete Return $J(W) = \mathbb{E}[G_0]$. Gesucht: $\nabla_W J$, um Gradientenaufstieg zu machen. Das Problem: $J$ hängt über die **Umgebung** von $W$ ab, und die kennst du nicht.
  - type: text
    body: |
      ## Der Log-Ableitungs-Trick

      Für eine Episode $\tau$ mit Wahrscheinlichkeit $p_W(\tau)$ gilt $\nabla p = p\, \nabla \log p$. Damit

      $$\nabla_W J = \nabla_W \sum_\tau p_W(\tau) R(\tau) = \mathbb{E}_\tau\big[R(\tau)\, \nabla_W \log p_W(\tau)\big]$$

      $\log p_W(\tau)$ ist eine Summe aus $\log$ Übergangswahrscheinlichkeiten (hängen **nicht** von $W$ ab, fallen weg) und $\sum_t \log \pi_W(a_t \mid s_t)$. Ersetzt man $R(\tau)$ noch durch den Return **ab** $t$ (frühere Belohnungen hängen nicht von $a_t$ ab), folgt **REINFORCE** (Williams 1992):

      $$W \leftarrow W + \alpha \sum_t G_t\, \nabla_W \log \pi_W(a_t \mid s_t)$$

      Sutton & Barto schreiben noch einen Faktor $\gamma^t$ dazu; in der Praxis lässt man ihn meist weg.
  - type: example
    intro: |
      Für die lineare Softmax-Policy ist $\nabla_W \log \pi(a \mid s) = s \otimes (e_a - \pi(\cdot \mid s))$ – ein äußeres Produkt aus Zustand und „One-hot minus Wahrscheinlichkeiten“. Prüfung mit dem numerischen Gradienten aus Modul 12:
    code: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def grad_log_pi(W, s, a):
          p = softmax(s @ W)
          return np.outer(s, np.eye(2)[a] - p)

      rng = np.random.default_rng(0)
      W, s, a = rng.normal(size=(4, 2)), rng.normal(size=4), 1
      num = np.zeros_like(W)
      for i in range(4):
          for j in range(2):
              Wp, Wm = W.copy(), W.copy()
              Wp[i, j] += 1e-5
              Wm[i, j] -= 1e-5
              num[i, j] = (np.log(softmax(s @ Wp)[a]) - np.log(softmax(s @ Wm)[a])) / 2e-5
      print("pi(.|s) =", np.round(softmax(s @ W), 3))
      print("max. Abweichung:", np.max(np.abs(num - grad_log_pi(W, s, a))))
    subgoals:
      - lines: [3, 5]
        label: Softmax stabil berechnen
      - lines: [7, 9]
        label: Analytischer Gradient
      - lines: [11, 19]
        label: Zentraldifferenz je Gewicht
      - lines: [20, 21]
        label: Vergleichen
    after: |
      Die Abweichung liegt weit unter $10^{-9}$ – die Formel stimmt. Anschaulich: Für die gewählte Aktion ist $e_a - \pi$ positiv, ein Schritt in Richtung $\nabla \log \pi$ macht sie also wahrscheinlicher, umso stärker, je größer $G_t$ war.
  - type: predict
    code: |
      import numpy as np
      p = np.array([0.25, 0.75])
      a = 0
      s = np.array([2.0, 0.0, 1.0, 0.0])
      print(np.eye(2)[a] - p)
      print(np.outer(s, np.eye(2)[a] - p)[0])
    options:
      - |
        [ 0.75 -0.75]
        [ 1.5 -1.5]
      - |
        [0.75 0.25]
        [1.5 0.5]
      - |
        [-0.25  0.25]
        [-0.5  0.5]
      - |
        [ 0.75 -0.75]
        [ 0.75 -0.75]
    answer: |
      [ 0.75 -0.75]
      [ 1.5 -1.5]
    explanation: |
      $e_0 - \pi = [1 - 0.25,\; 0 - 0.75]$. Zeile 0 des äußeren Produkts ist $s_0 \cdot [0.75, -0.75]$ mit $s_0 = 2$. Die Einträge einer Zeile summieren sich zu 0: Was eine Aktion gewinnt, verliert die andere.
  - type: explain
    question: |
      Warum steht im Update $\nabla \log \pi(a \mid s)$ und nicht einfach $\nabla \pi(a \mid s)$?
    options:
      - text: "$\\nabla \\log \\pi = \\nabla \\pi / \\pi$ gleicht aus, dass häufige Aktionen auch häufiger gezogen werden."
        correct: true
        why: Ohne die Division würden Aktionen schon deshalb verstärkt, weil sie oft vorkommen – der Schätzer wäre verzerrt.
      - text: Weil der Logarithmus negative Returns verhindert.
        correct: false
        why: Returns können trotzdem negativ sein; der Logarithmus wirkt auf die Wahrscheinlichkeit, nicht auf $G$.
      - text: Weil $\log$ die Rechnung schneller macht.
        correct: false
        why: Es geht um Korrektheit des Schätzers (Erwartungswert), nicht um Rechenzeit.
      - text: Weil $\pi$ selbst nicht differenzierbar ist.
        correct: false
        why: Die Softmax ist überall differenzierbar.
