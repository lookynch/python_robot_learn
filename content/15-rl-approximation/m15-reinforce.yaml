    solution: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def grad_log_pi(W, s, a):
          p = softmax(s @ W)
          return np.outer(s, np.eye(2)[a] - p)
    tests:
      - name: Form 4 × 2
        code: |
          import numpy as np
          g = grad_log_pi(np.zeros((4, 2)), np.ones(4), 0)
          assert np.shape(g) == (4, 2), f"Erwartet Form (4, 2), bekommen {np.shape(g)}"
      - name: Bei W = 0 einfach
        code: |
          import numpy as np
          g = grad_log_pi(np.zeros((4, 2)), np.array([1.0, 2.0, 0.0, -1.0]), 1)
          expected = [[-0.5, 0.5], [-1.0, 1.0], [0.0, 0.0], [0.5, -0.5]]
          assert close(g, expected), f"Bei W = 0 ist π = [0.5, 0.5]; erwartet {expected}, bekommen {np.round(g, 3).tolist()}"
      - name: Stimmt mit numerischem Gradienten überein
        code: |
          import numpy as np
          rng = np.random.default_rng(3)
          for a in (0, 1):
              W, s = rng.normal(size=(4, 2)), rng.normal(size=4)
              num = np.zeros((4, 2))
              for i in range(4):
                  for j in range(2):
                      Wp, Wm = W.copy(), W.copy()
                      Wp[i, j] += 1e-5
                      Wm[i, j] -= 1e-5
                      num[i, j] = (np.log(softmax(s @ Wp)[a]) - np.log(softmax(s @ Wm)[a])) / 2e-5
              err = np.max(np.abs(num - grad_log_pi(W, s, a)))
              assert err < 1e-6, f"Aktion {a}: Abweichung zum numerischen Gradienten ist {err:.2e}"
    mutants:
      - |
