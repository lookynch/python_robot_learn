    hints:
      - "Teilziel: pro Zeitschritt Policy berechnen, Gradient von log π bilden, mit G[t] gewichtet aufsummieren."
      - "$\\nabla \\log \\pi(a \\mid s) = s \\otimes (e_a - \\pi)$ – `np.outer(S[t], np.eye(2)[A[t]] - p)`."
      - "In der Schleife: `p = softmax(S[t] @ W)` und `grad += G[t] * np.outer(S[t], np.eye(2)[A[t]] - p)`"
  - type: quiz
    question: |
      Warum ändert eine Baseline $b(s)$ den **Erwartungswert** des Policy-Gradienten nicht?
    options:
      - text: "Weil $\\sum_a \\pi(a \\mid s)\\,\\nabla \\log \\pi(a \\mid s) = \\nabla \\sum_a \\pi(a \\mid s) = 0$"
        correct: true
        why: Der Beitrag $b(s) \cdot 0$ verschwindet im Mittel.
      - text: Weil $b(s)$ immer 0 ist
        correct: false
        why: Die Baseline ist meist gerade nicht 0, z. B. $\hat v(s)$.
      - text: Weil die Baseline nur die Lernrate skaliert
        correct: false
        why: Sie wird abgezogen, nicht multipliziert.
  - type: predict
    code: |
      V = {"s": 4.0, "s2": 6.0}
      r, gamma = -1.0, 0.5
      delta = r + gamma * V["s2"] - V["s"]
      print(delta, "verstärken" if delta > 0 else "abschwächen")
    options: ["-2.0 abschwächen", "2.0 verstärken", "-2.0 verstärken", "1.0 verstärken"]
    answer: "-2.0 abschwächen"
    explanation: |
      $\delta = -1 + 3 - 4 = -2$: schlechter als vom Critic erwartet, der Actor macht die Aktion unwahrscheinlicher.
  - type: quiz
    question: |
      Welche Aufgabe hat das **Target-Netz** in DQN?
    options:
      - text: Es hält das TD-Ziel für einige Schritte fest, damit das Netz nicht seinem eigenen, ständig wandernden Ziel hinterherläuft.
        correct: true
        why: Die eingefrorene Kopie $\theta^-$ stabilisiert das Lernen.
      - text: Es zieht zufällige Minibatches aus alten Erfahrungen.
        correct: false
        why: Das macht der Replay Buffer.
      - text: Es wählt die Aktionen beim Erkunden.
        correct: false
        why: Gehandelt wird mit dem aktuellen Netz (ε-greedy).
  - type: predict
    code: |
      import numpy as np
      ratio = np.array([1.5, 0.7])
      adv = np.array([1.0, -2.0])
      obj = np.minimum(ratio * adv, np.clip(ratio, 0.8, 1.2) * adv)
      print(obj)
    options: ["[ 1.2 -1.6]", "[ 1.5 -1.4]", "[ 1.2 -1.4]", "[ 1.5 -1.6]"]
    answer: "[ 1.2 -1.6]"
    explanation: |
      Erster Übergang: $\min(1.5, 1.2) = 1.2$. Zweiter: $\min(-1.4, -1.6) = -1.6$. Das Ziel ist jeweils die pessimistischere Variante.
  - type: quiz
    question: |
      Was belohnt das Ziel von SAC zusätzlich zur Umweltbelohnung?
    options:
      - text: Die Entropie der Policy, gewichtet mit der Temperatur $\alpha$
        correct: true
        why: Maximum-Entropie-RL – die Policy bleibt so zufällig, wie es die Belohnung erlaubt.
      - text: Möglichst kleine Änderungen der Policy pro Update
        correct: false
        why: Das ist die Idee von PPOs Clipping.
      - text: Die Anzahl der gespeicherten Übergänge
        correct: false
        why: Der Replay Buffer ist ein Datenspeicher, kein Teil des Ziels.
