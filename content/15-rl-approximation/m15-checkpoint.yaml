          # für jeden Zeitschritt t aufaddieren
          return grad
    solution: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

      def reinforce_gradient(W, S, A, G):
          grad = np.zeros_like(W)
          for t in range(len(A)):
              p = softmax(S[t] @ W)
              grad += G[t] * np.outer(S[t], np.eye(2)[A[t]] - p)
          return grad
    tests:
      - name: Ein Schritt bei W = 0
        code: |
          import numpy as np
          g = reinforce_gradient(np.zeros((2, 2)), np.array([[1.0, 2.0]]), np.array([0]), np.array([4.0]))
          assert close(g, [[2.0, -2.0], [4.0, -4.0]]), f"4·[1, 2] ⊗ [0.5, −0.5] = [[2, −2], [4, −4]] erwartet, bekommen {np.round(g, 3).tolist()}"
      - name: Mehrere Schritte
        code: |
          import numpy as np
          rng = np.random.default_rng(5)
          W, S = rng.normal(size=(3, 2)), rng.normal(size=(4, 3))
          A, G = np.array([0, 1, 1, 0]), np.array([3.0, 2.0, 1.5, 0.5])
          P = np.exp(S @ W) / np.exp(S @ W).sum(axis=1, keepdims=True)
          expected = S.T @ ((np.eye(2)[A] - P) * G[:, None])
          g = reinforce_gradient(W, S, A, G)
          assert close(g, expected), f"Summe über 4 Zeitschritte stimmt nicht: erwartet {np.round(expected, 3).tolist()}, bekommen {np.round(g, 3).tolist()}"
