  - type: exercise
    mode: make
    prompt: |
      Schreibe `reinforce_gradient(W, S, A, G)` für die lineare Softmax-Policy mit 2 Aktionen: Rückgabe ist $\sum_t G_t\, s_t \otimes (e_{a_t} - \pi(\cdot \mid s_t))$ als $d \times 2$-Matrix. `S` hat Form $T \times d$, `A` und `G` die Länge $T$. Eine Schleife über $t$ ist erlaubt.
    starter: |
      import numpy as np

      def softmax(z):
          e = np.exp(z - np.max(z))
          return e / e.sum()

