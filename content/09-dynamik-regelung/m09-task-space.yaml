          return np.array([[-s1 - s12, -s12], [c1 + c12, c12]])

      J = jacobian([0.0, np.pi / 2])
      F = np.array([0.0, 5.0])
      tau = ___
    blanks:
      - answer: "J.T @ F"
        options: ["J.T @ F", "J @ F", "np.linalg.solve(J, F)"]
    tests:
      - name: Haltemomente
        code: |
          assert close(tau, [5.0, 0.0]), f"Erwartet τ ≈ (5, 0) N·m, bekommen {tau}"
    explanation: |
      Die Spitze sitzt bei $(1, 1)$, der Ellbogen bei $(1, 0)$: Die senkrechte Kraft wirkt mit Hebelarm 1 m um die Basis, aber **durch** den Ellbogen hindurch (Glied 2 steht senkrecht). Also $\tau = (5, 0)$ N·m.
