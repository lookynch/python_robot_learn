    solution: |
      import numpy as np
      from lab.envs import TwoLinkArm

      def fk(q):
          return np.array([np.cos(q[0]) + np.cos(q[0] + q[1]), np.sin(q[0]) + np.sin(q[0] + q[1])])

      def jacobian(q):
          s1, c1, s12, c12 = np.sin(q[0]), np.cos(q[0]), np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-s1 - s12, -s12], [c1 + c12, c12]])

      def task_space_controller(state, x_ref, Kp=50.0, Kd=10.0):
          q, qd = state[:2], state[2:]
          J = jacobian(q)
          F = Kp * (x_ref - fk(q)) - Kd * (J @ qd)
          return J.T @ F

      arm = TwoLinkArm()
      state = arm.reset(q=(0.3, 1.2))
      states = [state]
      for x_ref in [np.array([1.2, 0.6]), np.array([0.5, -1.0]), np.array([-1.0, 0.8])]:
          for k in range(150):
              state = arm.dynamics(state, task_space_controller(state, x_ref))
              states.append(state)
      arm.render(np.array(states), target=(-1.0, 0.8), title="Drei Ziele nacheinander")
    tests:
      - name: Am Ziel in Ruhe kein Moment
        code: |
          import numpy as np
          q = np.array([0.4, 0.9])
          tau = np.asarray(task_space_controller(np.array([0.4, 0.9, 0.0, 0.0]), fk(q)), dtype=float)
          assert close(tau, [0.0, 0.0]), f"Steht die Spitze in Ruhe am Ziel, sollte τ = 0 sein, ist {np.round(tau, 3)}"
      - name: Feder über Jᵀ
        code: |
          import numpy as np
          q = np.array([0.0, np.pi / 2])
          tau = np.asarray(task_space_controller(np.array([0.0, np.pi / 2, 0.0, 0.0]), fk(q) + np.array([0.0, 0.1]), Kp=50.0), dtype=float)
          assert close(tau, [5.0, 0.0], tol=1e-6), f"Ziel 0.1 m über der Spitze bei q = (0, π/2): erwartet τ = Jᵀ·(0, 5) = (5, 0), bekommen {np.round(tau, 3)}"
      - name: Erreicht Ziele
        code: |
          import numpy as np
          from lab.envs import TwoLinkArm
          _arm = TwoLinkArm()
          for xr in [(1.2, 0.6), (-0.4, 1.3), (0.5, -1.0), (-1.2, -0.5)]:
              xr = np.array(xr)
              s = _arm.reset(q=(0.3, 1.2))
              for k in range(300):
                  s = _arm.dynamics(s, task_space_controller(s, xr))
              d = np.linalg.norm(fk(s[:2]) - xr)
              assert d < 0.01, f"Ziel {xr}: nach 3 s noch {d:.3f} m entfernt (J statt Jᵀ? Dämpfung?)"
