id: m09-task-space
title: Kräfte an der Spitze – τ = Jᵀ F
minutes: 9
goals:
  - Eine Kraft an der Spitze in Gelenkmomente umrechnen
  - Die Spitze mit einer virtuellen Feder im kartesischen Raum führen
  - Erklären, warum dafür $J^T$ und nicht $J^{-1}$ gebraucht wird
concepts: [jacobi-transponiert]
steps:
  - type: text
    body: |
      ## Von der Kraft zum Moment

      Soll die Spitze mit der Kraft $F = (F_x, F_y)$ drücken, welche Gelenkmomente braucht man? Prinzip der virtuellen Arbeit: Die Arbeit an der Spitze $F^T \Delta p$ muss gleich der Arbeit der Gelenke $\tau^T \Delta q$ sein. Mit $\Delta p = J\,\Delta q$ folgt für alle $\Delta q$:

      $$\tau = J(q)^T F$$

      Damit kann man im **kartesischen Raum** regeln (task-space control): eine virtuelle Feder zwischen Spitze und Ziel,

      $$F = K_p\,(x_{\text{ref}} - \mathrm{fk}(q)) - K_d\,\dot x, \qquad \dot x = J\dot q$$

      und dann $\tau = J^T F$. Keine IK nötig.
  - type: predict
    code: |
      import numpy as np

      def jacobian(q, l1=1.0, l2=1.0):
          s1, c1 = np.sin(q[0]), np.cos(q[0])
          s12, c12 = np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-l1 * s1 - l2 * s12, -l2 * s12], [l1 * c1 + l2 * c12, l2 * c12]])

      J = jacobian([0.0, 0.0])           # gestreckt auf der x-Achse
      F = np.array([0.0, 1.0])           # 1 N nach oben
      tau = J.T @ F
      print(f"{tau[0]:.1f} {tau[1]:.1f}")
    options: ["2.0 1.0", "1.0 2.0", "1.0 1.0", "0.0 1.0"]
    answer: "2.0 1.0"
    explanation: |
      Moment = Kraft mal Hebelarm: Gelenk 1 sitzt 2 m von der Spitze entfernt, Gelenk 2 nur 1 m. Genau das rechnet $J^T F$ aus.
  - type: example
    intro: |
      Eine virtuelle Feder zieht die Spitze des (schwerkraftfreien) Arms zum Ziel.
    code: |
      import numpy as np
      from lab.envs import TwoLinkArm

      def fk(q):
          return np.array([np.cos(q[0]) + np.cos(q[0] + q[1]), np.sin(q[0]) + np.sin(q[0] + q[1])])

      def jacobian(q):
          s1, c1, s12, c12 = np.sin(q[0]), np.cos(q[0]), np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-s1 - s12, -s12], [c1 + c12, c12]])

      arm = TwoLinkArm()
      x_ref = np.array([-0.4, 1.3])
      state = arm.reset(q=(0.3, 1.2))
      states = [state]
      for k in range(300):
          q, qd = state[:2], state[2:]
          J = jacobian(q)
          F = 50.0 * (x_ref - fk(q)) - 10.0 * (J @ qd)
          state = arm.dynamics(state, J.T @ F)
          states.append(state)
      print("Abstand zum Ziel:", round(float(np.linalg.norm(x_ref - fk(state[:2]))), 4), "m")
      arm.render(np.array(states), target=x_ref, title="Virtuelle Feder an der Spitze")
    subgoals:
      - lines: [11, 14]
        label: Arm, Ziel und Start festlegen
      - lines: [16, 18]
        label: Kraft der virtuellen Feder berechnen
      - lines: 19
        label: Kraft über Jᵀ in Gelenkmomente umrechnen
      - lines: [21, 22]
        label: Ergebnis prüfen und animieren
    after: |
      Die Spitze läuft ziemlich direkt zum Ziel, ohne dass wir je eine IK gelöst haben. $K_p$ ist hier eine kartesische Steifigkeit (N/m), $K_d$ eine Dämpfung (N·s/m).
  - type: explain
    question: |
      Warum $\tau = J^T F$ und nicht $\tau = J^{-1} F$?
    options:
      - text: Kräfte und Momente transformieren „dual“ zu Geschwindigkeiten – aus der Gleichheit der Arbeit $F^T J \Delta q = \tau^T \Delta q$ folgt $J^T$. Das gilt auch in Singularitäten.
        correct: true
        why: $J$ bildet Gelenk- auf Spitzengeschwindigkeiten ab, $J^T$ Spitzenkräfte auf Gelenkmomente. Keine Inversion nötig.
      - text: Weil $J^{-1} = J^T$ für Roboterarme.
        correct: false
        why: Das gilt für Rotationsmatrizen, nicht für Jacobi-Matrizen.
      - text: Weil $J^T$ schneller zu berechnen ist; physikalisch wäre $J^{-1}$ richtiger.
        correct: false
        why: $J^T$ ist die physikalisch richtige Abbildung, $J^{-1}$ wäre falsch.
