        import numpy as np
        def fk(q):
            return np.array([np.cos(q[0]) + np.cos(q[0] + q[1]), np.sin(q[0]) + np.sin(q[0] + q[1])])
        def jacobian(q):
            s1, c1, s12, c12 = np.sin(q[0]), np.cos(q[0]), np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
            return np.array([[-s1 - s12, -s12], [c1 + c12, c12]])
        def task_space_controller(state, x_ref, Kp=50.0, Kd=10.0):
            q, qd = state[:2], state[2:]
            J = jacobian(q)
            return J.T @ (Kp * (x_ref - fk(q)) + Kd * (J @ qd))
    hints:
      - "Teilziel: Kraft der virtuellen Feder berechnen, dann über Jᵀ in Gelenkmomente umrechnen."
      - "Feder: `Kp * (x_ref - fk(q))`. Dämpfer: Spitzengeschwindigkeit $\\dot x = J\\dot q$, also `- Kd * (J @ qd)`."
      - |
        ```python
        J = jacobian(q)
        F = Kp * (x_ref - fk(q)) - Kd * (J @ qd)
        ```
      - "`return J.T @ F`"
    explanation: |
      Die Dämpfung darf man auch direkt in den Gelenken ansetzen (`J.T @ (Kp * (x_ref - fk(q))) - Kd * qd`) – das stabilisiert ebenfalls, bremst dann aber jede Gelenkbewegung und nicht nur die Bewegung der Spitze.
  - type: quiz
    question: |
      Der Arm ist gestreckt auf der x-Achse ($q = (0, 0)$). An der Spitze zieht eine Kraft $F = (3, 0)$ N **in Richtung des Arms**. Welche Gelenkmomente braucht man, um sie zu halten?
    options:
      - text: Keine – $\tau = J^T F = (0, 0)$, die Kraft wird von der Struktur getragen
        correct: true
        why: Die erste Zeile von $J$ ist null; radiale Kräfte erzeugen um die Gelenke kein Moment.
      - text: $\tau = (6, 3)$ N·m
        correct: false
        why: Das wäre eine **senkrechte** Kraft von 3 N.
      - text: Unendlich große Momente, weil der Arm singulär ist
        correct: false
        why: Mit $J^T$ gibt es in Singularitäten kein Problem – dort braucht man im Gegenteil für radiale Kräfte gar kein Moment.
cards:
  - id: m09-c-jt-f
    concept: jacobi-transponiert
    variants:
      - type: predict
        code: |
          import numpy as np
          J = np.array([[0.0, 0.0], [2.0, 1.0]])
          F = np.array([0.0, -4.0])
          print(J.T @ F)
        options: ["[-8. -4.]", "[ 0. -8.]", "[-4. -8.]", "[0. 0.]"]
        answer: "[-8. -4.]"
        explanation: $\tau = J^T F$; Hebelarme 2 m und 1 m, Kraft nach unten → negative Momente (im Uhrzeigersinn).
      - type: predict
        code: |
          import numpy as np
          J = np.array([[0.0, 0.0], [1.5, 0.5]])
          F = np.array([0.0, 2.0])
          print(J.T @ F)
        options: ["[3. 1.]", "[1. 3.]", "[0. 0.]", "[2. 2.]"]
        answer: "[3. 1.]"
        explanation: Gestreckter Arm mit $l_1 = 1$ und $l_2 = 0.5$, also Hebelarme 1.5 m und 0.5 m.
  - id: m09-c-task-space-feder
    concept: jacobi-transponiert
    variants:
      - type: quiz
        question: Was braucht ein kartesischer PD-Regler $\tau = J^T F$ **nicht**?
        options:
          - text: Eine inverse Kinematik
            correct: true
            why: Der Fehler wird direkt im kartesischen Raum gebildet und über $J^T$ umgerechnet.
          - text: Die Vorwärtskinematik
            correct: false
            why: Für $x_{\text{ref}} - \mathrm{fk}(q)$ braucht er sie.
          - text: Die Jacobi-Matrix
            correct: false
            why: Sie steckt in $J^T F$ und in $\dot x = J\dot q$.
      - type: quiz
        question: Wie berechnet man die Spitzengeschwindigkeit $\dot x$ für den D-Anteil?
        options:
          - text: $\dot x = J(q)\,\dot q$
            correct: true
            why: Die Jacobi-Matrix bildet Gelenk- auf Spitzengeschwindigkeiten ab.
          - text: $\dot x = J^T \dot q$
            correct: false
            why: $J^T$ bildet Kräfte auf Momente ab, nicht Geschwindigkeiten.
          - text: $\dot x = \mathrm{fk}(\dot q)$
            correct: false
            why: Die FK ist nichtlinear – auf Geschwindigkeiten angewandt ergibt sie keinen Sinn.
