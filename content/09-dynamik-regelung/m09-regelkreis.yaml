  - type: quiz
    question: |
      Soll $q_{\text{ref}} = 1.2$ rad, Ist $q = 0.8$ rad, $K_p = 5$ N·m/rad. Welches Moment stellt der P-Regler?
    options:
      - text: $+2.0$ N·m
        correct: true
        why: $e = 1.2 - 0.8 = 0.4$, $\tau = 5 \cdot 0.4$.
      - text: $-2.0$ N·m
        correct: false
        why: Vorzeichenfehler – $e$ ist Soll **minus** Ist.
      - text: $6.0$ N·m
        correct: false
        why: Das wäre $K_p \cdot q_{\text{ref}}$ – der Regler muss den Istwert berücksichtigen.
cards:
  - id: m09-c-p-moment
    concept: regelkreis
    variants:
      - type: predict
        code: |
          Kp, q_ref, q = 4.0, 0.5, 0.8
          e = q_ref - q
          print(round(Kp * e, 2))
        options: ["-1.2", "1.2", "2.0", "3.2"]
        answer: "-1.2"
        explanation: Das Gelenk steht **über** dem Sollwert, also zieht das Moment zurück (negativ).
      - type: predict
        code: |
          Kp, q_ref, q = 10.0, -0.2, 0.1
          e = q_ref - q
          print(round(Kp * e, 2))
        options: ["-3.0", "3.0", "-1.0", "-2.0"]
        answer: "-3.0"
        explanation: $e = -0.2 - 0.1 = -0.3$, $\tau = 10 \cdot (-0.3)$.
  - id: m09-c-vorzeichen-regler
    concept: regelkreis
    variants:
      - type: quiz
        question: Ein Regler nutzt versehentlich $\tau = K_p (q - q_{\text{ref}})$. Was passiert?
        options:
          - text: Das Gelenk läuft vom Sollwert weg – der Kreis ist instabil
            correct: true
            why: Das Moment verstärkt den Fehler statt ihn abzubauen (Mitkopplung).
          - text: Das Gelenk erreicht den Sollwert langsamer
            correct: false
            why: Es erreicht ihn gar nicht – jede Abweichung wächst.
          - text: Nichts, das Vorzeichen ist egal
            correct: false
            why: Das Vorzeichen entscheidet zwischen Gegen- und Mitkopplung.
      - type: quiz
        question: Was ist beim P-Regler die **Stellgröße**?
        options:
          - text: Das Drehmoment $\tau$
            correct: true
            why: Das gibt der Regler an den Motor.
          - text: Der Fehler $e$
            correct: false
            why: Der Fehler ist der Eingang des Reglers.
          - text: Der Sollwert $q_{\text{ref}}$
            correct: false
            why: Der Sollwert wird vorgegeben, nicht gestellt.
