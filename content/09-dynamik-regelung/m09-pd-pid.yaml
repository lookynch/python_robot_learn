      - "Teilziel: Fehler aufintegrieren, dann PID-Moment plus Last an `step` geben."
      - "Das Integral lebt **außerhalb** der Schleife und wächst um `e * dt` pro Schritt. D-Anteil: `- Kd * state[1]`."
      - |
        ```python
