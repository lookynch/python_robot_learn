            ...
        ```
      - "`tau = Kp * e + Ki * integral - Kd * state[1]`, dann `state = step(state, tau + load, dt)` und `qs.append(state[0])`."
    explanation: |
      Achtung in der Praxis: Ist das Motormoment begrenzt (Sättigung, siehe nächste Lektion), wächst das Integral weiter, obwohl der Motor schon am Anschlag ist. Dieses **Windup** führt später zu großem Überschwingen. Gegenmittel (Anti-Windup): das Integral begrenzen oder nicht weiter aufsummieren, solange die Stellgröße sättigt.
  - type: exercise
    mode: modify
    prompt: |
      Stelle den PD-Regler (ohne Last) ein: Ändere `Kp` und `Kd` so, dass

      - $q$ nach **1.5 s** dauerhaft innerhalb $\pm 0.02$ rad um den Sollwert 1.0 bleibt,
      - das Überschwingen unter **5 %** liegt ($q_{\max} < 1.05$).

      Tipp: Für $\zeta \approx 1$ gilt $(b + K_d)^2 \approx 4 I K_p$ mit $I = b = 1$.
    starter: |
      import numpy as np
      import lab

      Kp = 5.0
      Kd = 0.0

      def simulate(Kp, Kd, T=3.0, dt=0.01):
          state, qs = np.array([0.0, 0.0]), [0.0]
          for k in range(round(T / dt)):
              tau = Kp * (1.0 - state[0]) - Kd * state[1]
              qd = state[1] + dt * (tau - state[1])
              state = np.array([state[0] + dt * qd, qd])
              qs.append(state[0])
          return np.array(qs)

      qs = simulate(Kp, Kd)
      fig = lab.Figure(title=f"Kp = {Kp}, Kd = {Kd}", xlabel="t (s)", ylabel="q (rad)")
      fig.line(qs, x=np.arange(len(qs)) * 0.01, label="Ist")
      fig.hline(1.0, label="Soll")
      fig.show()
    solution: |
      import numpy as np
      import lab

      Kp = 50.0
      Kd = 13.0

      def simulate(Kp, Kd, T=3.0, dt=0.01):
          state, qs = np.array([0.0, 0.0]), [0.0]
          for k in range(round(T / dt)):
              tau = Kp * (1.0 - state[0]) - Kd * state[1]
              qd = state[1] + dt * (tau - state[1])
              state = np.array([state[0] + dt * qd, qd])
              qs.append(state[0])
          return np.array(qs)

      qs = simulate(Kp, Kd)
      fig = lab.Figure(title=f"Kp = {Kp}, Kd = {Kd}", xlabel="t (s)", ylabel="q (rad)")
      fig.line(qs, x=np.arange(len(qs)) * 0.01, label="Ist")
      fig.hline(1.0, label="Soll")
      fig.show()
    tests:
      - name: Überschwingen unter 5 %
        code: |
          import numpy as np
          def _sim(Kp, Kd, T=3.0, dt=0.01):
              s, out = np.array([0.0, 0.0]), [0.0]
              for k in range(round(T / dt)):
                  tau = Kp * (1.0 - s[0]) - Kd * s[1]
                  qd = s[1] + dt * (tau - s[1])
                  s = np.array([s[0] + dt * qd, qd])
                  out.append(s[0])
              return np.array(out)
          qs = _sim(float(Kp), float(Kd))
          assert np.all(np.isfinite(qs)), "Die Simulation ist explodiert – Kp oder Kd extrem groß? Mit dt = 0.01 s wird die Simulation dann numerisch instabil."
          assert qs.max() < 1.05, f"Maximum {qs.max():.3f} – Überschwingen über 5 %. Mehr Kd?"
      - name: Nach 1.5 s eingeschwungen
        code: |
          import numpy as np
          def _sim(Kp, Kd, T=3.0, dt=0.01):
              s, out = np.array([0.0, 0.0]), [0.0]
              for k in range(round(T / dt)):
                  tau = Kp * (1.0 - s[0]) - Kd * s[1]
                  qd = s[1] + dt * (tau - s[1])
                  s = np.array([s[0] + dt * qd, qd])
                  out.append(s[0])
              return np.array(out)
          qs = _sim(float(Kp), float(Kd))
          late = np.abs(qs[150:] - 1.0).max()
          assert late < 0.02, f"Nach 1.5 s weicht q noch bis zu {late:.3f} rad ab (erlaubt 0.02). Zu langsam (Kp größer) oder zu schwingend (Kd größer)?"
    mutants:
      - |
        Kp = 50.0
        Kd = 0.0
      - |
        Kp = 1.0
        Kd = 10.0
      - |
        Kp = 5.0
        Kd = 2.0
    hints:
      - "Teilziel: zuerst schnell genug (Kp), dann genug Dämpfung (Kd)."
      - "Größeres $K_p$ macht die Bewegung schneller, größeres $K_d$ dämpft. Probiere z. B. $K_p$ zwischen 20 und 100."
      - "Für $\\zeta \\approx 1$: $K_d \\approx 2\\sqrt{K_p} - 1$."
      - "Zum Beispiel `Kp = 50.0` und `Kd = 13.0`."
    explanation: |
      Es gibt viele richtige Paare – z. B. auch $K_p = 100$, $K_d = 19$. Reale Grenzen sind Motormoment, Sensorrauschen (ein großes $K_d$ verstärkt Rauschen in $\dot q$) und Abtastrate.
  - type: quiz
    question: |
      Ein Gelenk hält unter Dauerlast 0.05 rad unter dem Sollwert. Welcher Anteil beseitigt das?
    options:
      - text: Der I-Anteil
        correct: true
        why: Das Integral wächst, solange ein Fehler bleibt, bis es die Last ausgleicht.
      - text: Ein größerer D-Anteil
        correct: false
        why: In Ruhe ist $\dot q = 0$ – der D-Anteil liefert dann kein Moment.
      - text: Ein kleineres $K_p$
        correct: false
        why: Die bleibende Abweichung ist Last$/K_p$ – kleineres $K_p$ macht sie **größer**.
cards:
  - id: m09-c-pid-rollen
    concept: pid-regler
    variants:
      - type: quiz
        question: Welcher Regleranteil wirkt wie ein **Dämpfer**?
        options:
          - text: D
            correct: true
            why: $-K_d \dot q$ bremst proportional zur Geschwindigkeit.
          - text: P
            correct: false
            why: P wirkt wie eine Feder.
          - text: I
            correct: false
            why: I summiert den Fehler über die Zeit auf.
      - type: quiz
        question: Welcher Anteil liefert auch dann noch Moment, wenn der Fehler gerade null ist und das Gelenk ruht?
        options:
          - text: I
            correct: true
            why: Das Integral „erinnert“ sich an vergangene Fehler.
          - text: P
            correct: false
            why: $K_p \cdot 0 = 0$.
          - text: D
            correct: false
            why: In Ruhe ist $\dot q = 0$.
      - type: quiz
        question: Ein PD-Regler schwingt stark über. Was hilft am direktesten?
        options:
          - text: $K_d$ erhöhen
            correct: true
            why: Mehr Dämpfung reduziert Überschwingen.
          - text: $K_p$ erhöhen
            correct: false
            why: Steifere Feder – eher mehr Schwingen (kleineres $\zeta$).
          - text: $K_i$ hinzufügen
            correct: false
            why: Der I-Anteil verstärkt Überschwingen eher.
  - id: m09-c-bleibende-abweichung
    concept: pd-regler
    variants:
      - type: predict
        code: |
          Kp, load = 40.0, -2.0
          print(round(-load / Kp, 3))
        options: ["0.05", "0.0", "2.0", "0.5"]
        answer: "0.05"
        explanation: In Ruhe gilt $K_p e = -\text{Last}$, also $e = 2/40$.
      - type: predict
        code: |
          Kp, load = 10.0, -3.0
          print(round(-load / Kp, 3))
        options: ["0.3", "0.0", "3.0", "0.03"]
        answer: "0.3"
        explanation: $e = 3/10$ rad – mit kleinem $K_p$ hängt das Gelenk deutlich durch.
