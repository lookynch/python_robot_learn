id: m09-pd-pid
title: PD und PID – dämpfen und nachführen
minutes: 10
goals:
  - Mit dem D-Anteil Überschwingen und Ausschwingen reduzieren
  - Mit dem I-Anteil eine bleibende Regelabweichung beseitigen
  - Regler-Parameter nach Kriterien (Zeit, Überschwingen) einstellen
concepts: [pd-regler, pid-regler]
steps:
  - type: text
    body: |
      ## Drei Anteile

      $$\tau = K_p\,e \;+\; K_i \int_0^t e\,dt \;-\; K_d\,\dot q$$

      | Anteil | wirkt wie | hilft gegen |
      |---|---|---|
      | P: $K_p e$ | Feder | großen Fehler |
      | D: $-K_d \dot q$ | Dämpfer | Überschwingen, langes Ausschwingen |
      | I: $K_i \int e\,dt$ | „Gedächtnis“ | bleibende Abweichung bei Dauerlast |

      Bei konstantem Sollwert ist $\dot e = -\dot q$. Deshalb nimmt man für den D-Anteil meist direkt die gemessene Geschwindigkeit. Das Integral wird im Code einfach aufsummiert: `integral += e * dt`.
  - type: example
    code: |
      import numpy as np
      import lab

      def step(state, tau, dt, I=1.0, b=1.0):
          q, qd = state
          qd = qd + dt * (tau - b * qd) / I
          return np.array([q + dt * qd, qd])

      def simulate(Kp, Kd, q_ref=1.0, T=3.0, dt=0.01):
          state, qs = np.array([0.0, 0.0]), [0.0]
          for k in range(round(T / dt)):
              tau = Kp * (q_ref - state[0]) - Kd * state[1]
              state = step(state, tau, dt)
              qs.append(state[0])
          return np.array(qs)

      t = np.arange(301) * 0.01
      fig = lab.Figure(title="P vs. PD (Kp = 50)", xlabel="t (s)", ylabel="q (rad)")
      fig.line(simulate(50.0, 0.0), x=t, label="P")
      fig.line(simulate(50.0, 13.0), x=t, label="PD, Kd = 13")
      fig.hline(1.0, label="Soll")
      fig.show()
    subgoals:
      - lines: [4, 7]
        label: Strecke festlegen
      - lines: [9, 15]
        label: Regelschleife mit P- und D-Anteil
      - lines: [17, 22]
        label: Varianten im selben Plot vergleichen
    after: |
      Mit $K_d = 13$ fährt das Gelenk in unter einer Sekunde ohne Überschwingen auf den Sollwert. Die Regel dahinter (lineare Schwingung): Dämpfungsgrad $\zeta = \frac{b + K_d}{2\sqrt{I K_p}}$, hier $\zeta = 14/(2\sqrt{50}) \approx 1$ – **aperiodischer Grenzfall**.
  - type: explain
    question: |
      Warum hilft beim reinen P-Regler ein **größeres** $K_p$ nicht gegen das lange Ausschwingen?
    options:
      - text: Die Abklingrate hängt nur von der Dämpfung ab ($b/2I$); größeres $K_p$ macht die Schwingung schneller, aber nicht kürzer.
        correct: true
        why: Die Einhüllende fällt mit $e^{-bt/(2I)}$, unabhängig von $K_p$. Erst $K_d$ erhöht die effektive Dämpfung auf $b + K_d$.
      - text: Größeres $K_p$ macht das System instabil.
        correct: false
        why: Dieses idealisierte Gelenk bleibt für jedes $K_p > 0$ stabil – es schwingt nur heftiger. (Mit Verzögerungen oder Abtastung kann zu großes $K_p$ allerdings tatsächlich instabil werden.)
      - text: Das Moment ist begrenzt.
        correct: false
        why: In diesem Modell gibt es keine Begrenzung.
  - type: example
    title: Dauerlast und I-Anteil
    intro: |
      Jetzt hängt eine konstante Last am Gelenk: $\tau_{\text{last}} = -2$ N·m (z. B. ein Gewicht). PD gegen PID.
    code: |
      import numpy as np
      import lab

      def step(state, tau, dt, I=1.0, b=1.0):
          q, qd = state
          qd = qd + dt * (tau - b * qd) / I
          return np.array([q + dt * qd, qd])

      def simulate(Kp, Ki, Kd, load, q_ref=1.0, T=8.0, dt=0.01):
          state, integral, qs = np.array([0.0, 0.0]), 0.0, [0.0]
          for k in range(round(T / dt)):
              e = q_ref - state[0]
              integral += e * dt
              tau = Kp * e + Ki * integral - Kd * state[1]
              state = step(state, tau + load, dt)
              qs.append(state[0])
          return np.array(qs)

      t = np.arange(801) * 0.01
      fig = lab.Figure(title="Last -2 N·m: PD vs. PID", xlabel="t (s)", ylabel="q (rad)")
      fig.line(simulate(20.0, 0.0, 8.0, -2.0), x=t, label="PD")
      fig.line(simulate(20.0, 10.0, 8.0, -2.0), x=t, label="PID, Ki = 10")
      fig.hline(1.0, label="Soll")
      fig.show()
    subgoals:
      - lines: [10, 13]
        label: Fehler aufintegrieren
      - lines: [14, 15]
        label: PID-Moment plus Last
      - lines: [18, 23]
        label: PD und PID vergleichen
    after: |
      PD bleibt unter dem Sollwert hängen, PID zieht langsam nach: Solange ein Fehler bleibt, wächst das Integral – bis es die Last genau ausgleicht.
  - type: predict
    intro: |
      Wie groß ist die bleibende Abweichung $q_{\text{ref}} - q$ mit dem **PD**-Regler ($K_p = 20$) unter der Last $-2$ N·m?
    code: |
      import numpy as np

      def step(state, tau, dt, I=1.0, b=1.0):
          q, qd = state
          qd = qd + dt * (tau - b * qd) / I
          return np.array([q + dt * qd, qd])

      state = np.array([0.0, 0.0])
      for k in range(500):
          tau = 20.0 * (1.0 - state[0]) - 8.0 * state[1]
          state = step(state, tau - 2.0, 0.01)
      print(round(1.0 - state[0], 2))
    options: ["0.1", "0.0", "2.0", "0.05"]
    answer: "0.1"
    explanation: |
      In Ruhe muss das Reglermoment die Last tragen: $K_p\,e = 2$ → $e = 2/20 = 0.1$ rad. Größeres $K_p$ verkleinert die Abweichung, beseitigt sie aber nie – das kann nur der I-Anteil.
  - type: fill
    fading: true
    prompt: |
      Ergänze den PID-Regler, sodass das Gelenk trotz Last den Sollwert 1.0 erreicht.
    code: |
      import numpy as np

      def step(state, tau, dt):
          q, qd = state
          qd = qd + dt * (tau - qd)
          return np.array([q + dt * qd, qd])

      Kp, Ki, Kd, dt = 20.0, 10.0, 8.0, 0.01
      state, integral = np.array([0.0, 0.0]), 0.0
      for k in range(1000):
          e = 1.0 - state[0]
          ___
          tau = ___
          state = step(state, tau - 2.0, dt)
      print(round(state[0], 2))
    blanks:
      - answer: "integral += e * dt"
        options: ["integral += e * dt", "integral = e * dt", "integral += e"]
      - answer: "Kp * e + Ki * integral - Kd * state[1]"
        options: ["Kp * e + Ki * integral - Kd * state[1]", "Kp * e + Ki * integral + Kd * state[1]", "Kp * e + Ki * integral"]
    expect_output: "1.0"
    explanation: |
      `integral = e * dt` vergisst die Vergangenheit (kein I-Anteil, Ergebnis 0.9). `integral += e` ohne `dt` macht $K_i$ effektiv 100-mal größer – der Kreis wird instabil. `+ Kd * state[1]` „entdämpft“: Das System schaukelt sich auf.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `simulate_pid(Kp, Ki, Kd, load=0.0, q_ref=1.0, T=8.0, dt=0.01)`: Start bei $q = 0$, $\dot q = 0$; in jedem Schritt PID-Moment berechnen, `load` dazuaddieren, `step` aufrufen. Rückgabe: Array aller Winkel inklusive Start.
    starter: |
      import numpy as np
      import lab

      def step(state, tau, dt, I=1.0, b=1.0):
          q, qd = state
          qd = qd + dt * (tau - b * qd) / I
          return np.array([q + dt * qd, qd])

      def simulate_pid(Kp, Ki, Kd, load=0.0, q_ref=1.0, T=8.0, dt=0.01):
          state, integral = np.array([0.0, 0.0]), 0.0
          qs = [state[0]]
          # PID-Schleife
          return np.array(qs)

      fig = lab.Figure(title="Mein PID", xlabel="Schritt", ylabel="q (rad)")
      fig.line(simulate_pid(20.0, 10.0, 8.0, load=-2.0), label="PID")
      fig.hline(1.0, label="Soll")
      fig.show()
    solution: |
      import numpy as np
      import lab

      def step(state, tau, dt, I=1.0, b=1.0):
          q, qd = state
          qd = qd + dt * (tau - b * qd) / I
          return np.array([q + dt * qd, qd])

      def simulate_pid(Kp, Ki, Kd, load=0.0, q_ref=1.0, T=8.0, dt=0.01):
          state, integral = np.array([0.0, 0.0]), 0.0
          qs = [state[0]]
          for k in range(round(T / dt)):
              e = q_ref - state[0]
              integral += e * dt
              tau = Kp * e + Ki * integral - Kd * state[1]
              state = step(state, tau + load, dt)
              qs.append(state[0])
          return np.array(qs)

      fig = lab.Figure(title="Mein PID", xlabel="Schritt", ylabel="q (rad)")
      fig.line(simulate_pid(20.0, 10.0, 8.0, load=-2.0), label="PID")
      fig.hline(1.0, label="Soll")
      fig.show()
    tests:
      - name: Länge und Start
        code: |
          qs = simulate_pid(20.0, 0.0, 8.0, T=1.0)
          assert len(qs) == 101 and qs[0] == 0.0, f"Erwartet 101 Werte mit Start 0, bekommen {len(qs)} Werte, Start {qs[0]}"
      - name: PD unter Last hängt durch
        code: |
          qs = simulate_pid(20.0, 0.0, 8.0, load=-2.0)
          assert abs((1.0 - qs[-1]) - 0.1) < 0.01, f"Ohne I-Anteil sollte die bleibende Abweichung load/Kp = 0.1 sein, ist {1.0 - qs[-1]:.3f} (Last addiert?)"
      - name: PID erreicht den Sollwert trotz Last
        code: |
          for load, q_ref in [(-2.0, 1.0), (1.5, -0.5)]:
              qs = simulate_pid(20.0, 10.0, 8.0, load=load, q_ref=q_ref)
              assert abs(qs[-1] - q_ref) < 0.01, f"Last {load}, Soll {q_ref}: nach 8 s ist q = {qs[-1]:.3f} (Integral mit dt? Vorzeichen des D-Anteils?)"
      - name: D-Anteil verhindert Überschwingen
        code: |
          qs = simulate_pid(50.0, 0.0, 13.0, T=3.0)
          assert qs.max() < 1.02, f"Mit Kp=50, Kd=13 sollte q kaum über 1 gehen, Maximum {qs.max():.3f}"
