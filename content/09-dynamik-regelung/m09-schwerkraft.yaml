          - |
            9.81
            8.50
            0.00
        answer: |
          9.81
          4.91
          0.00
        explanation: $G = m g l_c \cos q$; $\cos(\pi/3) = 0.5$.
      - type: predict
        code: |
          import numpy as np
          m, g, lc, Kp = 1.0, 9.81, 0.5, 49.05
          print(round(m * g * lc * np.cos(0.0) / Kp, 2))
        options: ["0.1", "0.0", "4.91", "0.2"]
        answer: "0.1"
        explanation: Ohne Kompensation hängt ein PD-Regler waagerecht um $G/K_p = 4.905/49.05 = 0.1$ rad durch.
  - id: m09-c-kompensation
    concept: schwerkraftkompensation
    variants:
      - type: quiz
        question: Was addiert man bei Schwerkraftkompensation zum PD-Moment?
        options:
          - text: Das Modell-Schwerkraftmoment $G(q)$
            correct: true
            why: Damit trägt das Modell die Last, nicht der Fehler.
          - text: Einen größeren $K_p$-Wert
            correct: false
            why: Das verkleinert das Durchhängen nur, beseitigt es nicht.
          - text: $-G(q)$
            correct: false
            why: Das zieht in dieselbe Richtung wie die Schwerkraft – doppeltes Durchhängen.
      - type: quiz
        question: Ein schwerkraftkompensierter Arm hängt trotzdem leicht durch. Wahrscheinlichste Ursache?
        options:
          - text: Das Modell (Masse, Schwerpunkt) stimmt nicht genau
            correct: true
            why: Die Kompensation ist nur so gut wie das Modell; den Rest muss $K_p$ (oder ein I-Anteil) tragen.
          - text: $K_d$ ist zu klein
            correct: false
            why: In Ruhe trägt der D-Anteil nichts bei.
          - text: Der Zeitschritt ist zu klein
            correct: false
            why: Ein kleinerer Zeitschritt macht die Simulation nur genauer.
