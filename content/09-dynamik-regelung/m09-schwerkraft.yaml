id: m09-schwerkraft
title: Schwerkraftkompensation
minutes: 9
goals:
  - Das Schwerkraftmoment eines Glieds berechnen
  - Erklären, warum ein PD-Regler unter Schwerkraft durchhängt
  - Ein Modell der Schwerkraft zum Regler addieren (Kompensation)
concepts: [schwerkraftkompensation]
steps:
  - type: text
    body: |
      ## Der Arm hängt durch

      Ein Glied (Stab, Masse $m$, Länge $l$, Schwerpunkt bei $l_c = l/2$) dreht um ein Gelenk, $q$ von der Waagerechten gemessen. Die Schwerkraft zieht nach unten, das Moment um das Gelenk ist

      $$G(q) = m\,g\,l_c\cos q$$

      – maximal waagerecht, null senkrecht. Dynamik mit Trägheit $I = m l^2/3$ und Reibung $b$:

      $$I\,\ddot q = \tau - b\,\dot q - G(q)$$

      Ein PD-Regler muss $G(q)$ im Stillstand mit $K_p e$ tragen – also bleibt ein Fehler $e = G(q)/K_p$.
  - type: example
    code: |
      import numpy as np
      import lab

      m, l, g, b = 1.0, 1.0, 9.81, 0.1
      lc, I = l / 2, m * l**2 / 3

      def link_step(state, tau, dt=0.01):
          q, qd = state
          qdd = (tau - b * qd - m * g * lc * np.cos(q)) / I
          qd = qd + dt * qdd
          return np.array([q + dt * qd, qd])

      q_ref, Kp, Kd = np.pi / 4, 20.0, 3.0
      state, qs = np.array([0.0, 0.0]), [0.0]
      for k in range(300):
          tau = Kp * (q_ref - state[0]) - Kd * state[1]
          state = link_step(state, tau)
          qs.append(state[0])

      print("bleibender Fehler:", round(q_ref - qs[-1], 3), "rad")
      fig = lab.Figure(title="PD unter Schwerkraft", xlabel="Schritt (0.01 s)", ylabel="q (rad)")
      fig.line(qs, label="Ist")
      fig.hline(q_ref, label="Soll")
      fig.show()
      lab.arm([[q] for q in qs[::4]], links=(1.0,), target=(np.cos(q_ref), np.sin(q_ref)), title="Der Arm hängt durch")
    subgoals:
      - lines: [4, 11]
        label: Glied mit Schwerkraft modellieren
      - lines: [13, 18]
        label: PD-Regelschleife
      - lines: [20, 25]
        label: Fehler ausgeben, plotten, animieren
    after: |
      Rund 0.2 rad (etwa 12°) zu tief. Das Moment des PD-Reglers entsteht ja nur **durch** den Fehler.
  - type: predict
    intro: |
      Gleicher PD-Regler, aber Sollwert $q_{\text{ref}} = \pi/2$ (senkrecht nach oben).
    code: |
      import numpy as np

      m, g, lc, I, b = 1.0, 9.81, 0.5, 1.0 / 3, 0.1

      def link_step(state, tau, dt=0.01):
          q, qd = state
          qd = qd + dt * (tau - b * qd - m * g * lc * np.cos(q)) / I
          return np.array([q + dt * qd, qd])

      q_ref = np.pi / 2
      state = np.array([0.0, 0.0])
      for k in range(300):
          state = link_step(state, 20.0 * (q_ref - state[0]) - 3.0 * state[1])
      print(abs(round(q_ref - state[0], 2)))
    options: ["0.0", "0.25", "0.2", "0.49"]
    answer: "0.0"
    explanation: |
      Senkrecht ist $\cos q = 0$: Die Schwerkraft wirkt durch das Gelenk hindurch und erzeugt kein Moment – nichts hängt durch. Die bleibende Abweichung hängt also von der **Stellung** ab ($e = G(q)/K_p$).
  - type: explain
    question: |
      Man könnte das Durchhängen auch mit einem I-Anteil beseitigen. Warum ist Schwerkraftkompensation meist besser?
    options:
      - text: Die Schwerkraft ist bekannt und hängt von $q$ ab – ein Modell gleicht sie sofort in jeder Stellung aus, der I-Anteil muss sie nach jeder Bewegung erst langsam „lernen“.
        correct: true
        why: Die Kompensation liefert das nötige Moment direkt aus dem Modell; das Integral reagiert erst auf entstandene Fehler und neigt zu Überschwingen.
      - text: Der I-Anteil funktioniert bei Schwerkraft grundsätzlich nicht.
        correct: false
        why: Er funktioniert schon – nur langsam, und bei wechselnden Stellungen hinkt er hinterher.
      - text: Kompensation macht den D-Anteil überflüssig.
        correct: false
        why: Gedämpft werden muss weiterhin; Kompensation entfernt nur die Last.
  - type: fill
    fading: true
    prompt: |
      Ergänze die Schwerkraftkompensation, sodass das Glied ohne bleibenden Fehler auf $q_{\text{ref}} = 0.5$ rad steht.
    code: |
      import numpy as np

