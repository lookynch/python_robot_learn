              caps.append(f"Soll {q_ref} rad")
      lab.arm(qs[::3], links=(1.0,), title="Kompensiert", captions=caps[::3])
    solution: |
      import numpy as np
      import lab

      m, l, g, b = 1.0, 1.0, 9.81, 0.1
      lc, I = l / 2, m * l**2 / 3

      def link_step(state, tau, dt=0.01):
          q, qd = state
          qd = qd + dt * (tau - b * qd - m * g * lc * np.cos(q)) / I
          return np.array([q + dt * qd, qd])

      def controller(q, qd, q_ref):
          return 20.0 * (q_ref - q) - 3.0 * qd + m * g * lc * np.cos(q)

      state, qs, caps = np.array([0.0, 0.0]), [], []
      for q_ref in [0.5, 1.5, -0.6, 0.0]:
          for k in range(100):
              state = link_step(state, controller(state[0], state[1], q_ref))
              qs.append([state[0]])
              caps.append(f"Soll {q_ref} rad")
      lab.arm(qs[::3], links=(1.0,), title="Kompensiert", captions=caps[::3])
    tests:
      - name: In Ruhe am Sollwert genau das Haltemoment
        code: |
          import numpy as np
          for qr in (0.0, 0.7, -1.0):
              tau = float(controller(qr, 0.0, qr))
              assert close(tau, 9.81 * 0.5 * np.cos(qr), tol=1e-6), f"Bei q = q_ref = {qr} und qd = 0 sollte der Regler genau G(q) = {9.81 * 0.5 * np.cos(qr):.3f} N·m liefern, liefert {tau:.3f}"
      - name: Kein bleibender Fehler
        code: |
          import numpy as np
          def _step(s, tau, dt=0.01):
              q, qd = s
              qd = qd + dt * (tau - 0.1 * qd - 9.81 * 0.5 * np.cos(q)) * 3.0
              return np.array([q + dt * qd, qd])
          for qr in (0.0, np.pi / 4, -np.pi / 3, 2.0):
              s = np.array([0.5, 0.0])
              for k in range(400):
                  s = _step(s, controller(s[0], s[1], qr))
              assert abs(s[0] - qr) < 0.005, f"Soll {qr:.2f}: nach 4 s ist q = {s[0]:.3f}"
      - name: Gedämpft
        code: |
          import numpy as np
          t1 = float(controller(0.3, 1.0, 0.3))
          t0 = float(controller(0.3, 0.0, 0.3))
          assert close(t1 - t0, -3.0), f"Der D-Anteil sollte bei qd = 1 rad/s genau -3 N·m beitragen, trägt {t1 - t0:.3f} bei"
    mutants:
      - |
        import numpy as np
        def controller(q, qd, q_ref):
            return 20.0 * (q_ref - q) - 3.0 * qd
      - |
        import numpy as np
        def controller(q, qd, q_ref):
            return 20.0 * (q_ref - q) - 3.0 * qd + 9.81 * 0.5 * np.sin(q)
      - |
        import numpy as np
        def controller(q, qd, q_ref):
            return 20.0 * (q_ref - q) - 3.0 * qd - 9.81 * 0.5 * np.cos(q)
      - |
        import numpy as np
        def controller(q, qd, q_ref):
            return 20.0 * (q_ref - q) + 9.81 * 0.5 * np.cos(q)
    hints:
      - "Teilziel: PD-Moment berechnen und das Schwerkraftmodell dazuaddieren."
      - "PD: `20.0 * (q_ref - q) - 3.0 * qd`. Kompensation: genau das Moment, das die Schwerkraft am Gelenk erzeugt."
      - "$G(q) = m g l_c \\cos q$ – im Code `m * g * lc * np.cos(q)`."
      - "`return 20.0 * (q_ref - q) - 3.0 * qd + m * g * lc * np.cos(q)`"
    explanation: |
      Statt $G(q)$ kann man auch $G(q_{\text{ref}})$ addieren (reine Vorsteuerung) – im Stillstand am Sollwert ist es dasselbe. Wichtig ist: Die Kompensation ist nur so gut wie das Modell. Falsche Masse → wieder ein kleiner Restfehler.
  - type: quiz
    question: |
      In welcher Stellung muss ein Motor das **größte** Haltemoment gegen die Schwerkraft liefern?
    options:
      - text: Glied waagerecht ($q = 0$ oder $\pi$)
        correct: true
        why: $|\cos q| = 1$ – der Hebelarm des Schwerpunkts ist maximal.
      - text: Glied senkrecht nach oben ($q = \pi/2$)
        correct: false
        why: Dort ist $\cos q = 0$ – der Schwerpunkt liegt genau über dem Gelenk.
      - text: Bei $q = \pi/4$
        correct: false
        why: $\cos(\pi/4) \approx 0.71$ – weniger als waagerecht.
cards:
