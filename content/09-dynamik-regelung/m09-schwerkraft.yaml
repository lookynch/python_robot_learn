      def link_step(state, tau, dt=0.01):
          q, qd = state
          qd = qd + dt * (tau - b * qd - m * g * lc * np.cos(q)) / I
          return np.array([q + dt * qd, qd])

      q_ref = 0.5
      state = np.array([0.0, 0.0])
      for k in range(400):
          q, qd = state
          tau = 20.0 * (q_ref - q) - 3.0 * qd + ___
          state = link_step(state, tau)
      print(round(q_ref - state[0], 3))
    blanks:
      - answer: "m * g * lc * np.cos(q)"
        options: ["m * g * lc * np.cos(q)", "m * g * lc * np.sin(q)", "-m * g * lc * np.cos(q)", "m * g * np.cos(q)"]
    expect_output: "0.0"
    explanation: |
      Der Regler addiert genau das Moment, das die Schwerkraft abzieht – dann bleibt für den PD-Anteil nur noch die eigentliche Regelaufgabe. Mit dem falschen Vorzeichen verdoppelt sich das Durchhängen ungefähr.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `controller(q, qd, q_ref)` mit $K_p = 20$, $K_d = 3$ **plus** Schwerkraftkompensation. Der Code fährt damit nacheinander mehrere Sollwerte an und animiert den Arm.
    starter: |
      import numpy as np
      import lab

      m, l, g, b = 1.0, 1.0, 9.81, 0.1
      lc, I = l / 2, m * l**2 / 3

      def link_step(state, tau, dt=0.01):
          q, qd = state
          qd = qd + dt * (tau - b * qd - m * g * lc * np.cos(q)) / I
          return np.array([q + dt * qd, qd])

      def controller(q, qd, q_ref):
          pass

      state, qs, caps = np.array([0.0, 0.0]), [], []
      for q_ref in [0.5, 1.5, -0.6, 0.0]:
          for k in range(100):
              state = link_step(state, controller(state[0], state[1], q_ref))
