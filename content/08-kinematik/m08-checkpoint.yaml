  - type: exercise
    mode: make
    prompt: |
      Schreibe `jacobian(q, l1=1.0, l2=1.0)` – die 2×2-Jacobi-Matrix der FK als NumPy-Array.
    starter: |
      import numpy as np

      def jacobian(q, l1=1.0, l2=1.0):
          pass
    solution: |
      import numpy as np

      def jacobian(q, l1=1.0, l2=1.0):
          s1, c1 = np.sin(q[0]), np.cos(q[0])
          s12, c12 = np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-l1 * s1 - l2 * s12, -l2 * s12],
                           [l1 * c1 + l2 * c12, l2 * c12]])
    tests:
      - name: Vergleich mit numerischer Ableitung
        code: |
          import numpy as np
          def _fk(q, l1, l2):
              return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]), l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])
          rng = np.random.default_rng(8)
          for _ in range(6):
              q = rng.uniform(-np.pi, np.pi, 2)
              l1, l2 = rng.uniform(0.4, 1.6, 2)
              Jn = np.stack([(_fk(q + 1e-6 * e, l1, l2) - _fk(q - 1e-6 * e, l1, l2)) / 2e-6 for e in np.eye(2)], axis=1)
              J = np.asarray(jacobian(q, l1, l2))
              assert J.shape == (2, 2) and close(J, Jn, tol=1e-6), f"Bei q={np.round(q, 2)}: erwartet {np.round(Jn, 3).tolist()}, bekommen {np.round(J, 3).tolist()}"
    mutants:
