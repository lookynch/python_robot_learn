  - type: exercise
    mode: make
    prompt: |
      Schreibe `ik(p, l1=1.0, l2=1.0, elbow=1)` für den 2-Gelenk-Arm: Rückgabe `np.array([q1, q2])` mit `fk(ik(p)) ≈ p`, Vorzeichen von $q_2$ = `elbow`, `ValueError` bei unerreichbaren Zielen. `fk` ist gegeben.
    starter: |
      import numpy as np

      def fk(q, l1=1.0, l2=1.0):
          return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]),
                           l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])

      def ik(p, l1=1.0, l2=1.0, elbow=1):
          x, y = p
          pass
    solution: |
      import numpy as np

      def fk(q, l1=1.0, l2=1.0):
          return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]),
                           l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])

      def ik(p, l1=1.0, l2=1.0, elbow=1):
          x, y = p
          c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)
          if abs(c2) > 1:
              raise ValueError("nicht erreichbar")
          q2 = elbow * np.arccos(c2)
          q1 = np.arctan2(y, x) - np.arctan2(l2 * np.sin(q2), l1 + l2 * np.cos(q2))
          return np.array([q1, q2])
    tests:
      - name: Zurückrechnen über FK
        code: |
          import numpy as np
          rng = np.random.default_rng(21)
          for _ in range(6):
              l1, l2 = rng.uniform(0.5, 1.5, 2)
              p = fk(rng.uniform([-np.pi, 0.2], [np.pi, 2.9]), l1, l2)
              for e in (1, -1):
                  q = ik(p, l1, l2, elbow=e)
                  assert close(fk(q, l1, l2), p), f"fk(ik(p)) ≠ p für p={np.round(p, 3)}, elbow={e}"
                  assert np.sign(q[1]) == e, f"Vorzeichen von q2 sollte {e} sein, q2 = {q[1]:.3f}"
      - name: Unerreichbar
        code: |
          try:
              ik((0.0, 2.3))
          except ValueError:
              pass
          else:
              raise AssertionError("ik((0, 2.3)) sollte ValueError auslösen (Reichweite 2).")
