  - type: fill
    prompt: |
      Ergänze die Iteration der differentiellen IK (DLS, $\lambda = 0.1$, $\alpha = 0.5$).
    code: |
      import numpy as np

      def fk(q):
          return np.array([np.cos(q[0]) + np.cos(q[0] + q[1]), np.sin(q[0]) + np.sin(q[0] + q[1])])

      def jacobian(q):
          s1, c1, s12, c12 = np.sin(q[0]), np.cos(q[0]), np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-s1 - s12, -s12], [c1 + c12, c12]])

      target = np.array([-0.7, 1.1])
      q = np.array([0.3, 0.6])
      for k in range(80):
          J = jacobian(q)
          e = ___
          dq = J.T @ np.linalg.solve(J @ J.T + 0.01 * np.eye(2), e)
          q = ___
      print(np.round(fk(q), 2))
    blanks:
      - answer: "target - fk(q)"
        options: ["target - fk(q)", "fk(q) - target", "target - q"]
      - answer: "q + 0.5 * dq"
        options: ["q + 0.5 * dq", "q - 0.5 * dq", "0.5 * dq"]
    expect_output: "[-0.7  1.1]"
  - type: quiz
    question: |
      Für welche Stellung ist die Jacobi-Matrix eines 2-Gelenk-Arms singulär?
    options:
      - text: $q = (1.2, \pi)$
        correct: true
        why: $\det J = l_1 l_2 \sin \pi = 0$ – der Arm ist gefaltet.
      - text: $q = (0, \pi/2)$
        correct: false
        why: $\sin(\pi/2) = 1$ – hier ist $|\det J|$ maximal.
      - text: $q = (\pi, 1.0)$
        correct: false
        why: $q_1$ spielt keine Rolle; $\sin 1.0 \neq 0$.
  - type: quiz
    question: |
      Was beschreibt die **erste Spalte** der Jacobi-Matrix?
    options:
      - text: Die Spitzengeschwindigkeit, wenn nur Gelenk 1 mit 1 rad/s dreht
        correct: true
        why: $J e_1$ – Ableitung der FK nach $q_1$.
      - text: Die x-Komponenten der Spitzengeschwindigkeit für beide Gelenke
        correct: false
        why: Das ist die erste **Zeile**.
      - text: Die Position des Ellbogens
        correct: false
        why: J enthält Ableitungen, keine Positionen.
