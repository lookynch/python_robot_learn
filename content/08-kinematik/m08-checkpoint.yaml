  - type: quiz
    question: |
      Ein Arm hat $l_1 = 1.2$ m und $l_2 = 0.7$ m, keine Gelenkgrenzen. Welche Aussage über den Arbeitsraum stimmt?
    options:
      - text: Ring mit Innenradius 0.5 m und Außenradius 1.9 m
        correct: true
        why: $|l_1 - l_2|$ und $l_1 + l_2$.
      - text: Kreisscheibe mit Radius 1.9 m
        correct: false
        why: Eine volle Scheibe gibt es nur bei $l_1 = l_2$.
      - text: Ring mit Innenradius 0.7 m und Außenradius 1.2 m
        correct: false
        why: Das sind die Gliedlängen, nicht die Radien.
