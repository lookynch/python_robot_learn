id: m08-ik-analytisch
title: Inverse Kinematik analytisch
minutes: 10
goals:
  - Die Gelenkwinkel zu einem Zielpunkt mit Kosinussatz und `atan2` berechnen
  - Beide Lösungen (Ellbogen oben/unten) unterscheiden
  - Unerreichbare Ziele erkennen und das Ergebnis über FK prüfen
concepts: [inverse-kinematik]
steps:
  - type: text
    body: |
      ## Rückwärts: vom Ziel zu den Winkeln

      **Inverse Kinematik** (IK): Gegeben $(x, y)$, gesucht $q$. Beim 2-Gelenk-Arm geht das geschlossen:

      1. Abstand $r^2 = x^2 + y^2$. Kosinussatz im Dreieck Basis–Ellbogen–Spitze:
         $$\cos q_2 = \frac{r^2 - l_1^2 - l_2^2}{2 l_1 l_2}$$
      2. $q_2 = \pm\arccos(\dots)$ – **zwei** Lösungen, spiegelbildlich zur Linie Basis–Ziel (Ellbogen oben/unten, elbow up/down). Wir wählen sie über das Vorzeichen `elbow = +1` oder `-1`.
      3. $q_1 = \operatorname{atan2}(y, x) - \operatorname{atan2}(l_2\sin q_2,\; l_1 + l_2\cos q_2)$

      Liegt $\cos q_2$ außerhalb von $[-1, 1]$, ist das Ziel nicht erreichbar.
  - type: example
    code: |
      import numpy as np
      import lab

      def fk(q, l1=1.0, l2=1.0):
          return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]),
                           l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])

      def ik(p, l1=1.0, l2=1.0, elbow=1):
          x, y = p
          c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)
          q2 = elbow * np.arccos(c2)
          q1 = np.arctan2(y, x) - np.arctan2(l2 * np.sin(q2), l1 + l2 * np.cos(q2))
          return np.array([q1, q2])

      target = (0.8, 1.2)
      for elbow in (1, -1):
          q = ik(target, elbow=elbow)
          print("elbow", elbow, "q =", np.round(q, 3), "fk =", np.round(fk(q), 3))
          lab.arm(q, target=target, title=f"elbow = {elbow}")
    subgoals:
      - lines: [9, 10]
        label: Kosinussatz für q2
      - lines: 11
        label: Ellbogenlösung wählen
      - lines: [12, 13]
        label: q1 aus zwei Winkeln
      - lines: [15, 19]
        label: Über FK zurückrechnen und zeichnen
    after: |
      Beide Stellungen treffen das Ziel – die FK bestätigt es. **Immer** so prüfen: IK-Ergebnis in FK einsetzen.
  - type: explain
    question: |
      Warum `np.arctan2(y, x)` und nicht `np.arctan(y / x)`?
    options:
      - text: "`arctan2` kennt den Quadranten (über die Vorzeichen von x und y) und funktioniert auch bei $x = 0$."
        correct: true
        why: "`arctan(y / x)` liefert nur Winkel in $(-\\pi/2, \\pi/2)$ – für Ziele links der Basis wäre $q_1$ um $\\pi$ falsch."
      - text: "`arctan2` ist genauer gerundet."
        correct: false
        why: Es geht nicht um Rundung, sondern um den Wertebereich $(-\pi, \pi]$.
      - text: "`arctan2` rechnet in Grad."
        correct: false
        why: Beide liefern Radiant.
