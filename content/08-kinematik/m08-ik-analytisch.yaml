    explanation: |
      In der Praxis setzt man nach der Prüfung oft noch `c2 = np.clip(c2, -1, 1)`: Rundungsfehler können am Rand sonst `1.0000000000000002` liefern und damit `nan`.
  - type: example
    title: Gerade Linie im Arbeitsraum
    intro: |
      Mit IK kann die Spitze eine **Gerade** fahren: Punkte auf der Linie wählen, für jeden die IK lösen.
    code: |
      import numpy as np
      import lab

      def ik(p, l1=1.0, l2=1.0, elbow=1):
          x, y = p
          c2 = np.clip((x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2), -1, 1)
          q2 = elbow * np.arccos(c2)
          q1 = np.arctan2(y, x) - np.arctan2(l2 * np.sin(q2), l1 + l2 * np.cos(q2))
          return np.array([q1, q2])

      start, end = np.array([1.6, -0.6]), np.array([-0.4, 1.4])
      qs = [ik(start + s * (end - start)) for s in np.linspace(0, 1, 80)]
      lab.arm(qs, target=tuple(end), title="Geradlinig dank IK")
    subgoals:
      - lines: [4, 9]
        label: IK als Funktion
      - lines: 11
        label: Start und Ziel im Arbeitsraum
      - lines: 12
        label: Für jeden Punkt der Linie IK lösen
      - lines: 13
        label: Bewegung animieren
    after: |
      Vergleiche mit der Lektion zum Gelenkraum: Dort war die Spur ein Bogen, hier ist sie gerade. Die Gelenkwinkel ändern sich dafür **ungleichmäßig**.
  - type: quiz
    question: |
      Wie viele IK-Lösungen hat ein 2-Gelenk-Arm ohne Gelenkgrenzen für einen Punkt **genau auf dem Außenrand** $r = l_1 + l_2$?
    options:
      - text: Eine
        correct: true
        why: $\cos q_2 = 1$, also $q_2 = 0$ – „oben“ und „unten“ fallen zusammen (gestreckter Arm).
      - text: Zwei
        correct: false
        why: Zwei verschiedene Lösungen gibt es nur strikt **innerhalb** des Rings.
      - text: Keine
        correct: false
        why: Der Rand gehört noch zum Arbeitsraum.
      - text: Unendlich viele
        correct: false
        why: Das passiert beim 2-Gelenk-Arm nur bei $l_1 = l_2$ für die Basis selbst ($r = 0$); bei Armen mit mehr Gelenken als nötig (redundant) dagegen häufig.
cards:
  - id: m08-c-kosinussatz
    concept: inverse-kinematik
    variants:
      - type: predict
        code: |
          x, y, l1, l2 = 0.0, 1.0, 1.0, 1.0
          c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)
          print(c2)
        options: ["-0.5", "0.5", "0.0", "-1.0"]
        answer: "-0.5"
        explanation: $(1 - 1 - 1)/2 = -0.5$, also $q_2 = \pm 2\pi/3$ – der Arm ist stark eingeknickt.
      - type: predict
        code: |
          x, y, l1, l2 = 3.0, 0.0, 2.0, 1.0
          c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)
          print(c2)
        options: ["1.0", "0.0", "-1.0", "2.0"]
        answer: "1.0"
        explanation: Das Ziel liegt auf dem Außenrand $l_1 + l_2 = 3$, also $q_2 = 0$.
      - type: predict
        code: |
          x, y, l1, l2 = 3.0, 0.0, 1.0, 1.0
          c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)
          print(c2)
        options: ["3.5", "1.0", "1.5", "0.5"]
        answer: "3.5"
        explanation: $\cos q_2 = 3.5 > 1$ – nicht erreichbar.
  - id: m08-c-ik-loesungen
    concept: inverse-kinematik
    variants:
      - type: quiz
        question: Wie viele IK-Lösungen hat ein Punkt **strikt innerhalb** des Arbeitsraum-Rings?
        options:
          - text: Zwei (Ellbogen oben und unten)
            correct: true
            why: $q_2 = \pm\arccos(\dots)$ mit $\arccos \in (0, \pi)$.
          - text: Eine
            correct: false
            why: Nur auf dem Rand fallen beide zusammen.
          - text: Keine
            correct: false
            why: Innerhalb des Rings ist der Punkt erreichbar.
      - type: quiz
        question: Was liefert `np.arccos(1.3)`?
        options:
          - text: "`nan` (mit Warnung)"
            correct: true
            why: NumPy gibt bei ungültigen Werten `nan` zurück, statt abzubrechen.
          - text: Einen ValueError
            correct: false
            why: Das macht `math.acos(1.3)` – NumPy nicht.
          - text: "`0.0`"
            correct: false
            why: NumPy schneidet nicht automatisch ab; dafür bräuchte man `np.clip`.
