      $\cos q_2 = 0$, also $q_2 = \pi/2$. Dann $q_1 = \pi/4 - \pi/4 = 0$: Glied 1 auf der x-Achse bis $(1, 0)$, Glied 2 nach oben bis $(1, 1)$. `0.785 …` vergisst den Korrekturwinkel.
