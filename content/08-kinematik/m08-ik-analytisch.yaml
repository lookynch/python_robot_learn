    explanation: |
      $\cos q_2 = 1.42 > 1$ – kein Winkel hat diesen Kosinus, das Ziel liegt außerhalb der Reichweite 2. `np.arccos` wirft **keinen** Fehler, sondern liefert `nan` (not a number) und eine Warnung. `nan` breitet sich still durch alle weiteren Rechnungen aus – deshalb vorher prüfen.
