      - "`elbow = (l1 * np.cos(q[0]), l1 * np.sin(q[0]))`"
      - "`tip = fk(q, l1, l2)` und `return [(0.0, 0.0), elbow, (tip[0], tip[1])]` – die Längen an `fk` weitergeben!"
  - type: quiz
    question: |
      Was liefert `fk([np.pi, 0.0])` mit $l_1 = l_2 = 1$ (gerundet)?
    options:
      - text: "`[-2, 0]`"
        correct: true
        why: Beide Glieder zeigen in Richtung $\pi$, also nach links.
      - text: "`[2, 0]`"
        correct: false
        why: Das wäre $q_1 = 0$.
      - text: "`[0, 2]`"
        correct: false
        why: Das wäre $q_1 = \pi/2$ – $\pi$ ist eine halbe Umdrehung.
      - text: "`[-1, 1]`"
        correct: false
        why: Mit $q_2 = 0$ ist der Arm gestreckt, beide Glieder zeigen in dieselbe Richtung.
