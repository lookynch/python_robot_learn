  - type: exercise
    mode: make
    prompt: |
      Schreibe `fk(q, l1=1.0, l2=1.0)`, die die Spitzenposition als `np.array([x, y])` zurückgibt.

      Die Tests prüfen bekannte Stellungen (gestreckt, abgeknickt, gefaltet) und zufällige Winkel.
    starter: |
      import numpy as np

      def fk(q, l1=1.0, l2=1.0):
          # x und y berechnen, als np.array zurückgeben
          pass
    solution: |
      import numpy as np

      def fk(q, l1=1.0, l2=1.0):
          x = l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1])
          y = l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])
          return np.array([x, y])
    tests:
      - name: Gestreckt nach oben
        code: |
          import numpy as np
          p = fk([np.pi / 2, 0.0])
          assert close(p, [0.0, 2.0]), f"fk([π/2, 0]) sollte [0, 2] sein, ist {p}"
      - name: Gliedlängen werden benutzt
        code: |
          import numpy as np
          p = fk([0.0, np.pi / 2], 1.0, 0.5)
          assert close(p, [1.0, 0.5]), f"fk([0, π/2], l1=1, l2=0.5) sollte [1, 0.5] sein, ist {p}"
          p = fk([0.0, np.pi], 2.0, 0.5)
          assert close(p, [1.5, 0.0]), f"fk([0, π], l1=2, l2=0.5) sollte [1.5, 0] sein, ist {p}"
      - name: Zufällige Winkel
        code: |
          import numpy as np
          rng = np.random.default_rng(5)
          for _ in range(5):
              q = rng.uniform(-np.pi, np.pi, 2)
              l1, l2 = rng.uniform(0.3, 2.0, 2)
              ref = [l1 * np.cos(q[0]) + l2 * np.cos(q.sum()), l1 * np.sin(q[0]) + l2 * np.sin(q.sum())]
              assert close(fk(q, l1, l2), ref), f"fk({np.round(q, 2)}, {l1:.2f}, {l2:.2f}) sollte {np.round(ref, 3)} sein, ist {fk(q, l1, l2)}"
      - name: Rückgabe ist ein NumPy-Array
        code: |
          import numpy as np
          p = fk([0.1, 0.2])
          assert isinstance(p, np.ndarray) and p.shape == (2,), f"fk soll np.array([x, y]) zurückgeben (Form (2,)), bekommen {type(p).__name__}"
