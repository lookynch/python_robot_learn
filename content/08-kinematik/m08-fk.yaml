    solution: |
      import numpy as np
      import lab

      def fk(q, l1=1.0, l2=1.0):
          x = l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1])
          y = l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])
          return np.array([x, y])

      def arm_frame(q, l1=1.0, l2=1.0):
          elbow = (l1 * np.cos(q[0]), l1 * np.sin(q[0]))
          tip = fk(q, l1, l2)
          return [(0.0, 0.0), elbow, (tip[0], tip[1])]

      ts = np.linspace(0, 2 * np.pi, 90)
      frames = [arm_frame([1.2 + 0.2 * np.sin(t), 0.8 * np.sin(2 * t)]) for t in ts]
      lab.chain(frames, title="Winken")
    tests:
      - name: Drei Punkte, Basis im Ursprung
        code: |
          f = arm_frame([0.3, 0.4])
          assert len(f) == 3, f"Erwartet 3 Punkte (Basis, Ellbogen, Spitze), bekommen {len(f)}"
          assert close(f[0], [0.0, 0.0]), f"Erster Punkt sollte die Basis (0, 0) sein, ist {f[0]}"
      - name: Ellbogen und Spitze stimmen
        code: |
          import numpy as np
          import lab
          for q, links in [([0.3, 0.4], (1.0, 1.0)), ([2.0, -1.0], (1.5, 0.5)), ([-0.7, 2.5], (0.8, 1.2))]:
              f = arm_frame(q, *links)
              ref = lab.arm_points(q, links)
              assert close(f[1], ref[1]), f"Ellbogen bei q={q}, Längen {links}: erwartet {np.round(ref[1], 3)}, bekommen {np.round(f[1], 3)}"
              assert close(f[2], ref[2]), f"Spitze bei q={q}, Längen {links}: erwartet {np.round(ref[2], 3)}, bekommen {np.round(f[2], 3)}"
    mutants:
