  - id: m08-c-fk-formel
    concept: vorwaertskinematik
    variants:
      - type: quiz
        question: Welcher Ausdruck ist die y-Koordinate der Spitze?
        options:
          - text: $l_1\sin q_1 + l_2\sin(q_1+q_2)$
            correct: true
            why: Summe beider Gliedvektoren, Glied 2 mit absolutem Winkel.
          - text: $l_1\sin q_1 + l_2\sin q_2$
            correct: false
            why: $q_2$ ist relativ – es fehlt $q_1$.
          - text: $(l_1 + l_2)\sin(q_1+q_2)$
            correct: false
            why: Das gilt nur, wenn beide Glieder in dieselbe Richtung zeigen ($q_1 = q_1 + q_2$, also $q_2 = 0$).
      - type: quiz
        question: Welcher Ausdruck ist die x-Koordinate des **Ellbogens**?
        options:
          - text: $l_1\cos q_1$
            correct: true
            why: Der Ellbogen ist das Ende von Glied 1.
          - text: $l_1\cos q_1 + l_2\cos(q_1+q_2)$
            correct: false
            why: Das ist die Spitze.
          - text: $l_2\cos(q_1+q_2)$
            correct: false
            why: Das ist nur der Vektor von Glied 2.
