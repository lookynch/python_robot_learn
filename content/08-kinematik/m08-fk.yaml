id: m08-fk
title: Vorwärtskinematik mit 2 Gelenken
minutes: 9
goals:
  - Die FK-Formel des 2-Gelenk-Arms in eine Funktion `fk(q, l1, l2)` übersetzen
  - Ellbogen- und Spitzenposition berechnen und mit `lab.chain` zeichnen
  - FK an bekannten Stellungen testen
concepts: [vorwaertskinematik]
steps:
  - type: text
    body: |
      ## Vorwärtskinematik (forward kinematics, FK)

      Gegeben die Gelenkwinkel, gesucht die Spitze. Jedes Glied ist ein Vektor der Länge $l_i$ in seiner **absoluten** Richtung; die Spitze ist ihre Summe:

      $$
      \begin{aligned}
      x &= l_1\cos q_1 + l_2\cos(q_1+q_2)\\
      y &= l_1\sin q_1 + l_2\sin(q_1+q_2)
      \end{aligned}
      $$

      Der erste Summand ist der **Ellbogen**. In Code (Kurs-Konvention):

      `fk(q, l1=1.0, l2=1.0)` → `np.array([x, y])`
  - type: example
    code: |
      import numpy as np
      import lab

      def fk(q, l1=1.0, l2=1.0):
          x = l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1])
          y = l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])
          return np.array([x, y])

      q = [0.6, 0.9]
      elbow = (np.cos(q[0]), np.sin(q[0]))
      tip = fk(q)
      print(np.round(tip, 3))
      lab.chain([[(0, 0), elbow, tuple(tip)]], title="Selbst berechnet")
    subgoals:
      - lines: [4, 7]
        label: FK-Formel als Funktion
      - lines: [9, 11]
        label: Gelenkpositionen berechnen
      - lines: [12, 13]
        label: Ergebnis ausgeben und zeichnen
    after: |
      `lab.chain` bekommt eine Liste von **Frames**, jeder Frame ist eine Liste von Punkten (Basis, Ellbogen, Spitze). Ein Frame = ein Standbild; viele Frames = Animation.
  - type: explain
    question: |
      Warum steht im zweiten Summanden $\cos(q_1+q_2)$ und nicht $\cos q_2$?
    options:
      - text: Weil $q_2$ relativ zum ersten Glied gemessen wird – die absolute Richtung von Glied 2 ist $q_1+q_2$.
        correct: true
        why: Die Kosinus-/Sinusterme brauchen den Winkel gegenüber der x-Achse.
      - text: Weil sich die Fehler von $q_1$ und $q_2$ so ausgleichen.
        correct: false
        why: Es geht nicht um Fehler, sondern um Geometrie – die Summe ist die absolute Richtung.
      - text: Das ist eine Näherung für kleine Winkel.
        correct: false
        why: Die Formel ist exakt, für alle Winkel.
  - type: predict
    code: |
      import numpy as np

      def fk(q, l1=1.0, l2=1.0):
          x = l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1])
          y = l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])
          return np.array([x, y])

      x, y = fk([0.0, np.pi], l1=2.0, l2=1.0)
      print(f"{x:.2f} {y:.2f}")
    options: ["1.00 0.00", "3.00 0.00", "-1.00 0.00", "2.00 1.00"]
    answer: "1.00 0.00"
    explanation: |
      $q_2 = \pi$ faltet Glied 2 komplett zurück: $x = 2\cos 0 + 1\cos\pi = 2 - 1 = 1$. `3.00` wäre gestreckt, `2.00 1.00` ein Knick um $\pi/2$.
