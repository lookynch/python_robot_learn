      - name: Vergleich mit der Formel
        code: |
          import numpy as np
          rng = np.random.default_rng(2)
          for _ in range(4):
              J = rng.normal(size=(2, 2))
              e = rng.normal(size=2)
              ref = J.T @ np.linalg.inv(J @ J.T + 0.01 * np.eye(2)) @ e
              assert close(dls_step(J, e), ref), f"dls_step stimmt nicht: erwartet {np.round(ref, 4)}, bekommen {np.round(dls_step(J, e), 4)}"
  - type: exercise
    mode: make
    prompt: |
      Schreibe `ik_dls(target, q0, lam=0.1, alpha=0.5, iters=100)`. Sie startet bei `q0`, macht `iters` DLS-Schritte und gibt die **Liste aller Stellungen** zurück (inklusive `q0`, also `iters + 1` Einträge). Damit animiert der Code den Arm.
    starter: |
      import numpy as np
      import lab

      def fk(q, l1=1.0, l2=1.0):
          return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]),
                           l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])

      def jacobian(q, l1=1.0, l2=1.0):
          s1, c1 = np.sin(q[0]), np.cos(q[0])
          s12, c12 = np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-l1 * s1 - l2 * s12, -l2 * s12], [l1 * c1 + l2 * c12, l2 * c12]])

