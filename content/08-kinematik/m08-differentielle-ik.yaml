    hints:
      - "Teilziel: In jeder Iteration Fehler berechnen, Gelenkschritt lösen und anwenden, Stellung merken."
      - "Fehler = Ziel minus aktuelle Spitze. `J` muss in **jeder** Iteration an der aktuellen Stellung neu berechnet werden."
      - |
        ```python
        for k in range(iters):
            J = jacobian(q)
            e = np.asarray(target) - fk(q)
            ...
        ```
      - "`dq = J.T @ np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)`, dann `q = q + alpha * dq` und `qs.append(q)`."
    explanation: |
      `q = q + …` erzeugt jedes Mal ein **neues** Array – deshalb enthält `qs` wirklich verschiedene Stellungen. Mit `q += …` würdest du dasselbe Array verändern, und alle Einträge in `qs` wären am Ende gleich.
  - type: quiz
    question: |
      Was bewirkt ein **größeres** $\lambda$ bei DLS?
    options:
      - text: Kleinere, vorsichtigere Schritte – robust nahe Singularitäten, aber langsamere Konvergenz
        correct: true
        why: $\lambda^2 I$ vergrößert die zu invertierende Matrix, $\Delta q$ wird kleiner.
      - text: Größere Schritte, schnellere Konvergenz
        correct: false
        why: Umgekehrt – $\lambda$ dämpft.
      - text: Nichts, solange $J$ regulär ist
        correct: false
        why: Auch bei regulärem $J$ verkleinert $\lambda > 0$ die Schritte etwas; mit $\lambda = 0$ wäre es exakt $J^{-1} e$.
cards:
  - id: m08-c-fehler-vorzeichen
    concept: differentielle-ik
    variants:
      - type: quiz
        question: Welcher Fehler gehört in den IK-Schritt $\Delta q = J^{-1} e$, damit die Spitze **zum** Ziel läuft?
        options:
          - text: $e = p_{\text{ziel}} - \mathrm{fk}(q)$
            correct: true
            why: $e$ zeigt von der Spitze zum Ziel; $J\,\Delta q = e$ bewegt die Spitze genau dorthin.
          - text: $e = \mathrm{fk}(q) - p_{\text{ziel}}$
            correct: false
            why: Dann läuft die Spitze vom Ziel weg.
          - text: $e = \lVert p_{\text{ziel}} - \mathrm{fk}(q) \rVert$
            correct: false
            why: Eine Zahl reicht nicht – $e$ braucht die Richtung.
      - type: quiz
        question: Warum muss $J$ in **jeder** Iteration neu berechnet werden?
        options:
          - text: J hängt von der aktuellen Stellung q ab
            correct: true
            why: Die Linearisierung gilt nur lokal um das aktuelle q.
          - text: Wegen Rundungsfehlern
            correct: false
            why: Es geht um die Nichtlinearität der FK, nicht um Rundung.
          - text: Muss es nicht – einmal am Start reicht
            correct: false
            why: Mit dem Start-J läuft die Iteration in die falsche Richtung, sobald sich der Arm deutlich bewegt hat.
  - id: m08-c-dls-lambda
    concept: differentielle-ik
    variants:
      - type: quiz
        question: Was ist DLS mit $\lambda = 0$ (bei regulärem $J$)?
        options:
          - text: Dasselbe wie $\Delta q = J^{-1} e$
            correct: true
            why: $J^T (J J^T)^{-1} = J^{-1}$ für quadratisches, reguläres $J$.
          - text: Kein Schritt ($\Delta q = 0$)
            correct: false
            why: $\lambda$ dämpft nur, mit 0 gibt es keine Dämpfung.
          - text: Gradientenabstieg $\Delta q = J^T e$
            correct: false
            why: Das wäre der Grenzfall für sehr **großes** $\lambda$ (bis auf den Faktor $1/\lambda^2$).
      - type: quiz
        question: Welche Methode funktioniert auch für einen 3-Gelenk-Arm mit 2×3-Jacobi-Matrix?
        options:
          - text: Pseudoinverse bzw. DLS
            correct: true
            why: Beide brauchen kein quadratisches $J$.
          - text: "`np.linalg.solve(J, e)`"
            correct: false
            why: "`solve` braucht eine quadratische Matrix."
          - text: "`np.linalg.inv(J)`"
            correct: false
            why: Nicht-quadratische Matrizen haben keine Inverse.
