      lab.arm(qs, target=tuple(target), title="DLS zum Ziel")
    solution: |
      import numpy as np
      import lab

      def fk(q, l1=1.0, l2=1.0):
          return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]),
                           l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])

      def jacobian(q, l1=1.0, l2=1.0):
          s1, c1 = np.sin(q[0]), np.cos(q[0])
          s12, c12 = np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-l1 * s1 - l2 * s12, -l2 * s12], [l1 * c1 + l2 * c12, l2 * c12]])

      def ik_dls(target, q0, lam=0.1, alpha=0.5, iters=100):
          q = np.array(q0, dtype=float)
          qs = [q]
          for k in range(iters):
              J = jacobian(q)
              e = np.asarray(target) - fk(q)
              dq = J.T @ np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)
              q = q + alpha * dq
              qs.append(q)
          return qs

      target = np.array([-1.2, -0.9])
      qs = ik_dls(target, [0.5, 0.5], iters=60)
      lab.arm(qs, target=tuple(target), title="DLS zum Ziel")
    tests:
      - name: Länge und Start
        code: |
          import numpy as np
          traj = ik_dls(np.array([1.0, 1.0]), [0.2, 0.3], iters=10)
          assert len(traj) == 11, f"Bei iters=10 erwartet 11 Stellungen (inkl. Start), bekommen {len(traj)}"
          assert close(traj[0], [0.2, 0.3]), f"Erste Stellung sollte q0 = [0.2, 0.3] sein, ist {traj[0]}"
      - name: Erreicht verschiedene Ziele
        code: |
          import numpy as np
          for tgt, q0 in [((1.2, 0.8), (0.3, 0.5)), ((-0.5, 1.5), (0.3, 0.5)), ((0.3, -1.1), (-0.2, 1.0)), ((-1.5, -0.7), (1.0, 1.0))]:
              q = ik_dls(np.array(tgt), q0)[-1]
              err = np.linalg.norm(fk(q) - np.array(tgt))
              assert err < 1e-3, f"Ziel {tgt}: Restfehler {err:.3g} m nach 100 Schritten (Vorzeichen des Fehlers? q aktualisiert?)"
      - name: Unerreichbares Ziel bleibt stabil
        code: |
          import numpy as np
          traj = np.array(ik_dls(np.array([3.0, 0.0]), [0.3, 0.5], iters=200))
          assert np.all(np.isfinite(traj)), "Die Stellungen enthalten nan/inf."
          p = fk(traj[-1])
          assert np.linalg.norm(p) > 1.9 and p[0] > 1.9, f"Der Arm sollte sich Richtung (3, 0) strecken, Spitze ist bei {np.round(p, 3)}"
