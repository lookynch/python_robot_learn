id: m08-differentielle-ik
title: Differentielle IK – Schritt für Schritt zum Ziel
minutes: 10
goals:
  - IK iterativ mit der Jacobi-Matrix lösen
  - Pseudoinverse und Damped Least Squares (DLS) einordnen
  - Einen Arm per DLS animiert zum Ziel fahren
concepts: [differentielle-ik]
steps:
  - type: text
    body: |
      ## IK ohne geschlossene Formel

      Für Arme mit vielen Gelenken oder in 3D gibt es oft keine handliche IK-Formel. Dann iteriert man mit der Linearisierung $\Delta p \approx J\,\Delta q$:

      1. Fehler $e = p_{\text{ziel}} - \mathrm{fk}(q)$
      2. Löse $J\,\Delta q = e$ nach $\Delta q$
      3. $q \leftarrow q + \alpha\,\Delta q$ mit Schrittweite $0 < \alpha \le 1$
      4. Wiederholen, bis $\lVert e \rVert$ klein ist

      Das ist das Newton-Verfahren – verwandt mit dem Gradientenabstieg aus Modul 7.
  - type: example
    code: |
      import numpy as np
      import lab

      def fk(q, l1=1.0, l2=1.0):
          return np.array([l1 * np.cos(q[0]) + l2 * np.cos(q[0] + q[1]),
                           l1 * np.sin(q[0]) + l2 * np.sin(q[0] + q[1])])

      def jacobian(q, l1=1.0, l2=1.0):
          s1, c1 = np.sin(q[0]), np.cos(q[0])
          s12, c12 = np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-l1 * s1 - l2 * s12, -l2 * s12], [l1 * c1 + l2 * c12, l2 * c12]])

      target = np.array([-0.6, 1.2])
      q = np.array([0.3, 0.8])
      qs = [q]
      for k in range(30):
          e = target - fk(q)
          dq = np.linalg.solve(jacobian(q), e)
          q = q + 0.3 * dq
          qs.append(q)
      print("Restfehler:", f"{np.linalg.norm(target - fk(q)):.1e}", "m")
      lab.arm(qs, target=tuple(target), title="Newton-Schritte, α = 0.3")
    subgoals:
      - lines: [13, 15]
        label: Startwerte festlegen
      - lines: [16, 17]
        label: Fehler im Arbeitsraum berechnen
      - lines: [18, 20]
        label: Gelenkschritt lösen und anwenden
      - lines: [21, 22]
        label: Ergebnis prüfen und animieren
    after: |
      Jeder Frame ist eine Iteration. Die Schritte werden kleiner, weil der Fehler schrumpft. `np.linalg.solve(J, e)` löst das 2×2-System, ohne $J^{-1}$ explizit zu bilden.
  - type: explain
    question: |
      Warum nimmt man nicht einfach **einen** vollen Schritt $\Delta q = J^{-1} e$ und ist fertig?
    options:
      - text: $\Delta p \approx J\,\Delta q$ gilt nur für kleine $\Delta q$ – die FK ist nichtlinear, ein großer Schritt landet daneben.
        correct: true
        why: Die Linearisierung ist eine Tangente. Deshalb wiederholt man kleine Schritte und rechnet $J$ jedes Mal neu.
      - text: Weil $J^{-1}$ immer existiert, aber zu teuer ist.
        correct: false
        why: $J^{-1}$ existiert gerade **nicht** immer (Singularitäten), und 2×2 ist billig.
      - text: Weil der Arm sich physikalisch nicht so schnell bewegen kann.
        correct: false
        why: Hier wird nur gerechnet, nicht simuliert – es geht um die Genauigkeit der Näherung.
  - type: text
    title: Pseudoinverse und Damped Least Squares
    body: |
      $J^{-1}$ gibt es nur für quadratische, reguläre $J$. Allgemeiner:

      - **Pseudoinverse** (`np.linalg.pinv(J)`): $\Delta q = J^{+} e$ – kleinstes $\Delta q$, das den Fehler bestmöglich reduziert. Funktioniert auch für Arme mit 3+ Gelenken (J ist dann 2×n).
      - **Damped Least Squares** (DLS):
        $$\Delta q = J^T (J J^T + \lambda^2 I)^{-1} e$$
        Der Dämpfungsterm $\lambda^2 I$ hält $\Delta q$ klein, wenn $J$ fast singulär ist. Mit $\lambda = 0$ ist DLS gleich der Pseudoinversen (bei vollem Rang).

      In Code: `J.T @ np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)`.
  - type: predict
    intro: |
      Das Ziel $(3, 0)$ liegt **außerhalb** der Reichweite 2. Was macht DLS?
    code: |
      import numpy as np

      def fk(q):
          return np.array([np.cos(q[0]) + np.cos(q[0] + q[1]), np.sin(q[0]) + np.sin(q[0] + q[1])])

      def jacobian(q):
          s1, c1, s12, c12 = np.sin(q[0]), np.cos(q[0]), np.sin(q[0] + q[1]), np.cos(q[0] + q[1])
          return np.array([[-s1 - s12, -s12], [c1 + c12, c12]])

      target = np.array([3.0, 0.0])
      q = np.array([0.3, 0.5])
      for k in range(200):
          J = jacobian(q)
          e = target - fk(q)
          q = q + 0.5 * J.T @ np.linalg.solve(J @ J.T + 0.1**2 * np.eye(2), e)
      print(f"{np.linalg.norm(fk(q)):.1f}")
    options: ["2.0", "3.0", "nan", "0.0"]
    answer: "2.0"
    explanation: |
      DLS kann das Ziel nicht erreichen, liefert aber das Bestmögliche: Der Arm streckt sich in Richtung Ziel, Abstand der Spitze zur Basis $\approx 2$. Ohne Dämpfung würde $J^{-1}$ nahe der gestreckten Stellung riesige Schritte liefern – mehr dazu in der nächsten Lektion.
