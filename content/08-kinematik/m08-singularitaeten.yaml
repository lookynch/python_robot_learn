    hints:
      - "Teilziel: nur die Zeile mit `dq = ...` ändern."
      - "DLS: $\\Delta q = J^T (J J^T + \\lambda^2 I)^{-1} e$ – die Inverse wieder über `np.linalg.solve`."
      - "`np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)` und davor `J.T @`."
      - "`dq = J.T @ np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)`"
    explanation: |
      Die Pseudoinverse (`np.linalg.pinv`) hilft hier **nicht**: Nahe der Singularität ist $J$ noch regulär, $J^+ = J^{-1}$ – mit denselben Riesenschritten. Erst die Dämpfung begrenzt sie.
  - type: quiz
    question: |
      Welche Stellungen eines 2-Gelenk-Arms sind singulär?
    options:
      - text: Alle mit $q_2 = 0$ oder $q_2 = \pi$, unabhängig von $q_1$
        correct: true
        why: $\det J = l_1 l_2 \sin q_2$ hängt nur von $q_2$ ab.
      - text: Alle mit $q_1 = 0$
        correct: false
        why: $q_1$ dreht nur den ganzen Arm – das ändert die Determinante nicht.
      - text: Nur $q = (0, 0)$
        correct: false
        why: Gestreckt ist der Arm für **jedes** $q_1$, solange $q_2 = 0$.
      - text: Alle mit $q_2 = \pi/2$
        correct: false
        why: Dort ist $|\det J|$ gerade **maximal** – die beste Stellung für Bewegungen in alle Richtungen.
cards:
  - id: m08-c-det-j
    concept: singularitaet
    variants:
      - type: predict
        code: |
          import numpy as np
          l1, l2 = 1.0, 0.5
          for q2 in [0.0, np.pi / 2, np.pi / 6]:
              print(f"{l1 * l2 * np.sin(q2):.2f}")
        options:
          - |
            0.00
            0.50
            0.25
          - |
            0.50
            0.00
            0.43
          - |
            0.00
            1.50
            0.75
        answer: |
          0.00
          0.50
          0.25
        explanation: $\det J = l_1 l_2 \sin q_2$ – null gestreckt, maximal bei rechtem Winkel.
      - type: predict
        code: |
          import numpy as np
          J = np.array([[0.0, 0.0], [2.0, 1.0]])
          print(round(np.linalg.det(J), 2))
        options: ["0.0", "2.0", "-2.0", "1.0"]
        answer: "0.0"
        explanation: Die erste Zeile ist null (gestreckter Arm auf der x-Achse) – keine Bewegung in x möglich, $\det J = 0$.
  - id: m08-c-singular-verhalten
    concept: singularitaet
    variants:
      - type: quiz
        question: Der Arm ist gestreckt ($q_2 = 0$). In welche Richtung kann sich die Spitze (in erster Ordnung) **nicht** bewegen?
        options:
          - text: Radial, also entlang des Arms
            correct: true
            why: Beide Spalten von $J$ stehen senkrecht auf dem gestreckten Arm.
          - text: Quer zum Arm
            correct: false
            why: Quer geht – beide Gelenke drehen die Spitze genau in diese Richtung.
          - text: In gar keine Richtung
            correct: false
            why: $J$ hat noch Rang 1 – eine Richtung bleibt.
      - type: quiz
        question: Was passiert mit $\Delta q = J^{-1} e$, wenn sich der Arm einer Singularität nähert und $e$ eine radiale Komponente hat?
        options:
          - text: $\lVert\Delta q\rVert$ wächst stark an
            correct: true
            why: $J^{-1}$ enthält $1/\det J$.
          - text: $\Delta q$ wird null
            correct: false
            why: Das macht DLS in der Singularität selbst für die unmögliche Richtung – nicht $J^{-1}$.
          - text: Nichts Besonderes
            correct: false
            why: Genau dort wird die Inverse schlecht konditioniert.
