    hints:
      - "Teilziel: Jacobi-Matrix als Funktion – jede Spalte ist die Ableitung der FK nach einem Gelenk."
      - "Leite $x = l_1 c_1 + l_2 c_{12}$ und $y = l_1 s_1 + l_2 s_{12}$ nach $q_1$ (Spalte 1) und $q_2$ (Spalte 2) ab. Zeilen = x, y."
      - "Erste Zeile: `[-l1 * s1 - l2 * s12, -l2 * s12]`"
      - "Zweite Zeile: `[l1 * c1 + l2 * c12, l2 * c12]`, beides in `np.array([...])`."
  - type: fill
    fading: true
    prompt: |
      Ergänze die numerische Jacobi-Matrix (Zentraldifferenz), sodass sie für jede Funktion `f` funktioniert.
    code: |
      import numpy as np

      def num_jacobian(f, q, h=1e-6):
          q = np.asarray(q, dtype=float)
          cols = []
          for i in range(len(q)):
              dq = np.zeros_like(q)
              dq[i] = ___
              cols.append(___)
          return np.stack(cols, axis=1)
    blanks:
      - answer: "h"
        options: ["h", "1.0", "q[i] + h"]
      - answer: "(f(q + dq) - f(q - dq)) / (2 * h)"
        options: ["(f(q + dq) - f(q - dq)) / (2 * h)", "(f(q + dq) - f(q - dq)) / h", "f(q + dq) - f(q)"]
    tests:
      - name: Lineare Funktion
        code: |
          import numpy as np
          A = np.array([[1.0, 2.0], [3.0, -1.0]])
          J = num_jacobian(lambda q: A @ q, [0.3, -0.2])
          assert close(J, A, tol=1e-6), f"Für f(q) = A q muss J = A sein, bekommen {np.round(J, 4).tolist()}"
      - name: Nichtlineare Funktion
        code: |
          import numpy as np
          J = num_jacobian(lambda q: np.array([np.sin(q[0]) * q[1], q[0] ** 2]), [0.5, 2.0])
          ref = np.array([[2.0 * np.cos(0.5), np.sin(0.5)], [1.0, 0.0]])
          assert close(J, ref, tol=1e-5), f"Erwartet {np.round(ref, 4).tolist()}, bekommen {np.round(J, 4).tolist()}"
  - type: quiz
    question: |
      Gestreckter Arm $q = (0, 0)$, $l_1 = l_2 = 1$, also $J = \begin{pmatrix}0&0\\2&1\end{pmatrix}$. Wohin bewegt sich die Spitze ungefähr bei $\Delta q = (0.01, 0)$?
    options:
      - text: Um $(0, 0.02)$ – senkrecht nach oben
        correct: true
        why: $J\,\Delta q = (0 \cdot 0.01,\; 2 \cdot 0.01)$.
      - text: Um $(0.02, 0)$ – nach außen
        correct: false
        why: Gestreckt kann die Spitze sich (in erster Ordnung) gar nicht nach außen bewegen – die erste Zeile von $J$ ist null.
      - text: Um $(0, 0.01)$
        correct: false
        why: Gelenk 1 bewegt die Spitze im Abstand 2 – Hebelarm $l_1 + l_2$.
cards:
  - id: m08-c-jacobi-spalte
    concept: jacobi-matrix
    variants:
      - type: quiz
        question: Was bedeutet die **zweite Spalte** von $J(q)$?
        options:
          - text: Die Geschwindigkeit der Spitze, wenn nur Gelenk 2 mit 1 rad/s dreht
            correct: true
            why: $J e_2$ mit $e_2 = (0, 1)$.
          - text: Wie sich die y-Koordinate mit beiden Gelenken ändert
            correct: false
            why: Das ist die zweite **Zeile**.
          - text: Die Position des Ellbogens
            correct: false
            why: J enthält Ableitungen, keine Positionen.
      - type: quiz
        question: Was bedeutet die **erste Zeile** von $J(q)$?
        options:
          - text: Wie stark sich x ändert, wenn Gelenk 1 bzw. Gelenk 2 dreht
            correct: true
            why: Zeile 1 = $(\partial x/\partial q_1, \partial x/\partial q_2)$.
          - text: Die Geschwindigkeit der Spitze, wenn nur Gelenk 1 dreht
            correct: false
            why: Das ist die erste **Spalte**.
          - text: Die Länge des ersten Glieds
            correct: false
            why: Die Längen stecken in den Einträgen, sind aber keine Zeile.
  - id: m08-c-jacobi-dp
    concept: jacobi-matrix
    variants:
      - type: predict
        code: |
          import numpy as np
          J = np.array([[-1.0, -1.0], [1.0, 0.0]])
          dq = np.array([0.0, 0.1])
          print(J @ dq)
        options: ["[-0.1  0. ]", "[-0.1  0.1]", "[ 0.  -0.1]", "[0.1 0. ]"]
        answer: "[-0.1  0. ]"
        explanation: Nur Gelenk 2 bewegt sich, also zählt nur Spalte 2, mal 0.1.
      - type: predict
        code: |
          import numpy as np
          J = np.array([[0.0, 0.0], [2.0, 1.0]])
          dq = np.array([0.1, -0.2])
          print(J @ dq)
        options: ["[0. 0.]", "[0.  0.4]", "[0.2 0. ]", "[ 0.  -0.1]"]
        answer: "[0. 0.]"
        explanation: $2 \cdot 0.1 + 1 \cdot (-0.2) = 0$ – diese Gelenkbewegung bewegt die Spitze in erster Ordnung gar nicht.
