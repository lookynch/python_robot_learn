id: m08-fk-allgemein
title: FK für beliebig viele Gelenke
minutes: 10
goals:
  - FK für n Gelenke mit einer Schleife berechnen (Winkel aufsummieren)
  - Dieselbe FK als Kette homogener Transformationen schreiben
  - Einen Arm mit vielen Gliedern animieren
concepts: [fk-kette]
steps:
  - type: text
    body: |
      ## Von 2 auf n Gelenke

      Mit relativen Winkeln hat Glied $i$ die absolute Richtung $\varphi_i = q_1 + \dots + q_i$. Die Spitze ist die Summe aller Gliedvektoren:

      $$
      p = \sum_{i=1}^{n} l_i \begin{pmatrix}\cos\varphi_i\\ \sin\varphi_i\end{pmatrix}
      $$

      Im Code heißt das: eine Schleife über die Gelenke, die einen **laufenden Winkel** (Akkumulator) und eine **laufende Position** mitführt. Jede Zwischenposition ist ein Gelenk – die brauchst du zum Zeichnen.
  - type: trace
    intro: |
      Der Kern der Schleife: den Winkel aufsummieren.
    code: |
      q = [0.5, 0.25, -0.75]
      angle = 0.0
      for qi in q:
          angle = angle + qi
          print(angle)
    questions:
      - line: 4
        hit: 2
        var: angle
        answer: "0.75"
        prompt: Welchen absoluten Winkel hat das **zweite** Glied?
      - line: 4
        hit: 3
        var: angle
        answer: "0.0"
        prompt: Und das dritte Glied?
    after: |
      Das dritte Glied zeigt wieder genau in x-Richtung, obwohl $q_3 = -0.75 \neq 0$ ist – die Knicke heben sich auf.
  - type: example
    code: |
      import numpy as np
      import lab

      def fk_chain(q, links):
          pts = [(0.0, 0.0)]
          angle, x, y = 0.0, 0.0, 0.0
          for qi, li in zip(q, links):
              angle += qi
              x += li * np.cos(angle)
              y += li * np.sin(angle)
              pts.append((x, y))
          return np.array(pts)

      links = [1.0, 0.8, 0.6, 0.4]
      ts = np.linspace(0, 2 * np.pi, 120)
      frames = [fk_chain([0.8 + 0.3 * np.sin(t), 0.6 * np.sin(t), 0.6 * np.sin(t + 1), 0.6 * np.sin(t + 2)], links) for t in ts]
      print(frames[0].shape)
      lab.chain(frames, title="Schlange mit 4 Gelenken")
    subgoals:
      - lines: [5, 6]
        label: Startwerte festlegen
      - lines: [7, 11]
        label: Schleife über alle Gelenke
      - lines: 12
        label: Gelenkpositionen zurückgeben
      - lines: [14, 18]
        label: Bewegung animieren
    after: |
      `fk_chain` liefert ein Array der Form `(n + 1, 2)`: Basis plus ein Punkt pro Gelenk. Die letzte Zeile ist die Spitze.
  - type: predict
    code: |
      import numpy as np

      q = [np.pi / 2, -np.pi / 2, 0.0]
      angle, x, y = 0.0, 0.0, 0.0
      for qi in q:
          angle += qi
          x += np.cos(angle)
          y += np.sin(angle)
      print(f"{x:.2f} {y:.2f}")
    options: ["2.00 1.00", "1.00 0.00", "0.00 3.00", "1.00 2.00"]
    answer: "2.00 1.00"
    explanation: |
      Absolute Richtungen $\pi/2, 0, 0$: einmal hoch, zweimal nach rechts → $(2, 1)$. `1.00 0.00` entsteht, wenn man die Winkel als **absolut** liest (hoch, runter, rechts).
  - type: text
    title: Dasselbe mit homogenen Transformationen
    body: |
      Aus Modul 5: Ein Glied ist „drehe um $q_i$, dann schiebe um $l_i$ entlang der **neuen** x-Achse“:

      $$
      T_i = \begin{pmatrix}\cos q_i & -\sin q_i & l_i\cos q_i\\ \sin q_i & \cos q_i & l_i\sin q_i\\ 0&0&1\end{pmatrix}
      $$

      Die ganze Kette ist das Produkt $T = T_1 T_2 \cdots T_n$, **von links nach rechts**. Die Spitze steht in der letzten Spalte: `T[:2, 2]`. Das ist dieselbe Rechnung wie die Schleife – aber sie verallgemeinert sich direkt auf 3D und liefert zusätzlich die Orientierung der Spitze.
  - type: example
    code: |
      import numpy as np

      def link_T(qi, li):
          c, s = np.cos(qi), np.sin(qi)
          return np.array([[c, -s, li * c],
                           [s,  c, li * s],
                           [0.0, 0.0, 1.0]])

      q = [0.4, -0.9, 1.3]
      links = [1.0, 0.8, 0.5]
      T = np.eye(3)
      for qi, li in zip(q, links):
          T = T @ link_T(qi, li)

      print("Spitze:", np.round(T[:2, 2], 3))
      print("Richtung der Spitze:", round(float(np.arctan2(T[1, 0], T[0, 0])), 3), "rad")
    subgoals:
      - lines: [3, 7]
        label: Transformation eines Glieds
      - lines: [11, 13]
        label: Kette von links nach rechts multiplizieren
      - lines: [15, 16]
        label: Position und Orientierung ablesen
    after: |
      Die Richtung der Spitze ist $0.4 - 0.9 + 1.3 = 0.8$ rad – die Summe der Winkel, wie erwartet. Die Reihenfolge `T @ link_T(...)` ist wichtig: Jedes neue Glied wird im Koordinatensystem des vorherigen angehängt.
  - type: fill
    fading: true
    prompt: |
      Ergänze die Schleife, sodass `fk_chain` die Gelenkpositionen liefert.
