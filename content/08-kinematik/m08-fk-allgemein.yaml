    hints:
      - "Teilziel: Kette von links nach rechts multiplizieren und nach jedem Glied die Position merken."
      - Nach jedem Glied ist `T` die Transformation von der Basis bis zu diesem Gelenk; dessen Position steht in `T[:2, 2]`.
      - |
        ```python
        for qi, li in zip(q, links):
            T = T @ link_T(qi, li)
            ...
        ```
      - "`pts.append(T[:2, 2].copy())` in der Schleife – `.copy()`, damit nicht alle Einträge auf dasselbe Array zeigen."
    explanation: |
      Mit `link_T(qi, li) @ T` (falsche Reihenfolge) würde das neue Glied **vor** die bisherige Kette gesetzt und die ganze bisherige Kette mitgedreht – die Positionen stimmen dann nicht mehr. Die Orientierung (Winkelsumme) bliebe trotzdem richtig, weil 2D-Drehungen vertauschbar sind; Translationen sind es nicht – deshalb fallen nur die Positionen falsch aus.
  - type: quiz
    question: |
      Ein 5-Gelenk-Arm hat $q = (0.2, 0.1, -0.4, 0.3, 0.5)$. In welche absolute Richtung zeigt das letzte Glied?
    options:
      - text: 0.7 rad
        correct: true
        why: Summe aller relativen Winkel.
      - text: 0.5 rad
        correct: false
        why: Das ist nur der letzte relative Winkel.
      - text: 0.14 rad
        correct: false
        why: Das ist der Mittelwert – Richtungen addieren sich aber.
cards:
  - id: m08-c-winkel-akku
    concept: fk-kette
    variants:
      - type: predict
        code: |
          q = [0.5, -0.25, 1.0]
          angle = 0.0
          for qi in q:
              angle += qi
          print(angle)
        options: ["1.25", "1.0", "0.4166666666666667", "0.5"]
        answer: "1.25"
        explanation: Der Akkumulator summiert alle relativen Winkel.
      - type: predict
        code: |
          q = [1.0, 0.5, -1.5]
          angles = []
          a = 0.0
          for qi in q:
              a += qi
              angles.append(a)
          print(angles)
        options: ["[1.0, 1.5, 0.0]", "[1.0, 0.5, -1.5]", "[0.0, 1.0, 1.5]", "[1.5, 0.0, 0.0]"]
        answer: "[1.0, 1.5, 0.0]"
        explanation: Nach jedem Gelenk wird der laufende (absolute) Winkel gespeichert.
  - id: m08-c-homogen-reihenfolge
    concept: fk-kette
    variants:
      - type: quiz
        question: |
          Wie setzt man die Transformation eines 3-Gelenk-Arms aus $T_1, T_2, T_3$ zusammen?
        options:
          - text: $T = T_1 T_2 T_3$
            correct: true
            why: Jedes Glied wird im Koordinatensystem des vorherigen angehängt – von links nach rechts.
          - text: $T = T_3 T_2 T_1$
            correct: false
            why: Matrixprodukte sind nicht vertauschbar – Drehungen und Verschiebungen zusammen ergeben in umgekehrter Reihenfolge eine andere (falsche) Spitzenposition.
          - text: $T = T_1 + T_2 + T_3$
            correct: false
            why: Transformationen werden verkettet (multipliziert), nicht addiert.
      - type: quiz
        question: |
          Wo steht in der homogenen 3×3-Matrix `T` die Position der Spitze?
        options:
          - text: "`T[:2, 2]` (letzte Spalte, obere zwei Einträge)"
            correct: true
            why: Die Translation steht in der letzten Spalte.
          - text: "`T[2, :2]` (letzte Zeile)"
            correct: false
            why: Die letzte Zeile ist immer `[0, 0, 1]`.
          - text: "`T[:2, :2]`"
            correct: false
            why: Das ist der Rotationsanteil (Orientierung).
