  - type: exercise
    mode: make
    prompt: |
      Schreibe `fk_chain(q, links)` jetzt selbst – diesmal mit **homogenen Transformationen**. Rückgabe: Array der Form `(n + 1, 2)` mit Basis und allen Gelenkpositionen (die letzte Zeile ist die Spitze). `link_T` ist gegeben.
    starter: |
