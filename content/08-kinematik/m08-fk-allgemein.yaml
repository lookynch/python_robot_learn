    solution: |
      import numpy as np

      def link_T(qi, li):
          c, s = np.cos(qi), np.sin(qi)
          return np.array([[c, -s, li * c], [s, c, li * s], [0.0, 0.0, 1.0]])

      def fk_chain(q, links):
          T = np.eye(3)
          pts = [T[:2, 2].copy()]
          for qi, li in zip(q, links):
              T = T @ link_T(qi, li)
              pts.append(T[:2, 2].copy())
          return np.array(pts)
    tests:
      - name: Form (n + 1, 2)
        code: |
          import numpy as np
          P = np.asarray(fk_chain([0.1, 0.2, 0.3], [1.0, 1.0, 1.0]))
          assert P.shape == (4, 2), f"Bei 3 Gelenken erwartet Form (4, 2), bekommen {P.shape}"
          assert close(P[0], [0.0, 0.0]), f"Erste Zeile sollte die Basis (0, 0) sein, ist {P[0]}"
      - name: Bekannte Stellung
        code: |
          import numpy as np
          P = np.asarray(fk_chain([np.pi / 2, -np.pi / 2, 0.0], [1.0, 1.0, 1.0]))
          assert close(P[-1], [2.0, 1.0]), f"Spitze bei q=(π/2, -π/2, 0) sollte (2, 1) sein, ist {np.round(P[-1], 3)}"
      - name: Zufällige Arme
        code: |
          import numpy as np
          import lab
          rng = np.random.default_rng(7)
          for n in (2, 3, 5):
              q = rng.uniform(-np.pi, np.pi, n)
              links = rng.uniform(0.3, 1.5, n)
              ref = np.array(lab.arm_points(q, links))
              got = np.asarray(fk_chain(q, links))
              assert got.shape == ref.shape and close(got, ref), f"n={n}: Gelenkpositionen stimmen nicht. Erwartet {np.round(ref, 2).tolist()}, bekommen {np.round(got, 2).tolist()}"
    mutants:
      - |
