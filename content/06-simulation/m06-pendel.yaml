    hints:
      - "Teilziel: Physik in step kapseln – erst `alpha`, dann `omega`, dann `theta`."
      - "$\\ddot\\theta = \\frac{g}{l}\\sin\\theta + \\frac{u}{m l^2}$ – mit **Plus**, weil $\\theta = 0$ oben ist."
      - |
        ```python
        alpha = g / l * np.sin(theta) + u / (m * l**2)
        omega = ...
        theta = ...
        ```
    explanation: |
      Der häufigste Fehler ist das Minuszeichen aus Lehrbüchern, in denen $\theta = 0$ **unten** ist. Der Test „Oben kippt es weg“ fängt genau das ab. `lab.envs.Pendulum` (ab Modul 9) nutzt dieselbe Konvention, modelliert aber eine **Stange** mit verteilter Masse (Trägheitsmoment $\tfrac13 m l^2$): dort steht $\ddot\theta = \frac{3g}{2l}\sin\theta + \frac{3u}{m l^2}$, und standardmäßig ist $g = 10$.
  - type: example
    intro: |
      Prüfstein für jede Pendelsimulation ist die Energie $E = \tfrac12 m l^2 \dot\theta^2 + m g l \cos\theta$ (Höhe $y = l\cos\theta$). Wir simulieren 10 s explizit und semi-implizit.
    code: |
      import numpy as np
      import lab

      g, l, m, dt = 9.81, 1.0, 1.0, 0.02

      def energy(s):
          return 0.5 * m * l**2 * s[1]**2 + m * g * l * np.cos(s[0])

      semi = np.array([2.5, 0.0])
      expl = np.array([2.5, 0.0])
      E_semi, E_expl = [energy(semi)], [energy(expl)]
      for k in range(500):
          th, om = semi
          om = om + dt * g / l * np.sin(th)
          semi = np.array([th + dt * om, om])
          th, om = expl
          expl = np.array([th + dt * om, om + dt * g / l * np.sin(th)])
          E_semi.append(energy(semi))
          E_expl.append(energy(expl))

      print(f"E am Anfang {E_semi[0]:.2f} J, nach 10 s: semi {E_semi[-1]:.2f} J, explizit {E_expl[-1]:.2f} J")
      ts = np.arange(501) * dt
      fig = lab.Figure(title="Pendelenergie", xlabel="t [s]", ylabel="E [J]")
      fig.line(E_semi, x=ts, label="semi-implizit")
      fig.line(E_expl, x=ts, label="explizit")
      fig.hline(m * g * l, label="reicht bis ganz oben")
      fig.show()
    subgoals:
      - lines: [6, 7]
        label: Energie als Kontrollgröße definieren
      - lines: [9, 19]
        label: Beide Verfahren parallel simulieren
      - lines: [21, 26]
        label: Energien vergleichen
    after: |
      Explizit steigt die Energie von $-7{,}86$ J auf etwa $0$ J – das Pendel schwingt nach 10 s schon bis zur Waagrechten, obwohl kein Motor arbeitet. Semi-implizit bleibt sie in einem schmalen Band. Für Regelung und Planen heißt das: Ein Simulator mit Energiedrift belohnt Regler, die in Wirklichkeit nicht funktionieren.
  - type: quiz
    question: |
      Wo befindet sich die Masse bei $\theta = -\pi/2$ (Konvention des Kurses, $l = 1$ m)?
    options:
      - text: waagrecht **rechts** vom Drehpunkt, bei $(1, 0)$
        correct: true
        why: $x = -l\sin(-\pi/2) = 1$, $y = l\cos(-\pi/2) = 0$. Negativ heißt im Uhrzeigersinn von oben aus.
      - text: waagrecht **links**, bei $(-1, 0)$
        correct: false
        why: Das ist $\theta = +\pi/2$ (gegen den Uhrzeigersinn von oben).
      - text: unten, bei $(0, -1)$
        correct: false
        why: Unten ist $\theta = \pm\pi$.
      - text: oben, bei $(0, 1)$
        correct: false
        why: Oben ist $\theta = 0$.
cards:
  - id: m06-c-pendel-lage
    concept: pendel-ode
    variants:
      - type: quiz
        question: Welcher Winkel beschreibt das **herabhängende** Pendel (Konvention des Kurses)?
        options:
          - text: $\theta = \pi$
            correct: true
            why: $\theta = 0$ ist oben, eine halbe Umdrehung weiter ist unten.
          - text: $\theta = 0$
            correct: false
            why: In diesem Kurs ist $\theta = 0$ **oben** (wie in Gymnasium und `lab.envs.Pendulum`).
          - text: $\theta = \pi/2$
            correct: false
            why: Das ist waagrecht links.
      - type: quiz
        question: "$\\theta = 0{,}2$ rad, $\\dot\\theta = 0$, $u = 0$. In welche Richtung beschleunigt das Pendel?"
        options:
          - text: positiv – weiter weg von oben
            correct: true
            why: $\ddot\theta = (g/l)\sin 0{,}2 > 0$. Oben ist instabil.
          - text: negativ – zurück nach oben
            correct: false
            why: Das wäre die Gleichung mit $\theta = 0$ **unten**. Oben zieht die Schwerkraft weg.
          - text: gar nicht, es ist in Ruhe
            correct: false
            why: Ruhe ($\dot\theta = 0$) heißt nicht, dass keine Beschleunigung wirkt.
  - id: m06-c-pendel-beschleunigung
    concept: pendel-ode
    variants:
      - type: predict
        code: |
          import numpy as np

          g, l, m = 9.81, 2.0, 1.0
          alpha = g / l * np.sin(np.pi / 2) + 1.0 / (m * l**2)
          print(round(alpha, 3))
        options: ["5.155", "4.905", "10.81", "5.405"]
        answer: "5.155"
        explanation: "$9{,}81/2 \\cdot 1 + 1/(1 \\cdot 4) = 4{,}905 + 0{,}25 = 5{,}155$ rad/s²."
      - type: predict
        code: |
          import numpy as np

          g, l, m = 10.0, 1.0, 0.5
          alpha = g / l * np.sin(0.0) + 2.0 / (m * l**2)
          print(round(alpha, 3))
        options: ["4.0", "1.0", "14.0", "0.0"]
        answer: "4.0"
        explanation: "Oben ($\\theta = 0$) wirkt keine Schwerkraft-Drehung; der Motor liefert $2/(0{,}5 \\cdot 1) = 4$ rad/s²."
