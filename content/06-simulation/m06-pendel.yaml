id: m06-pendel
title: Pendel simulieren
minutes: 10
goals:
  - Die Pendelgleichung mit der Konvention $\theta = 0$ oben aufstellen
  - Eine `step`-Funktion für das Pendel mit Drehmoment schreiben
  - Die Simulation mit `lab.pendulum` animieren und über die Energie prüfen
concepts: [pendel-ode, step-funktion, energiedrift]
steps:
  - type: text
    body: |
      ## Pendel mit Motor

      Punktmasse $m$ (kg) an einer masselosen Stange der Länge $l$ (m), im Drehpunkt ein Motor mit Drehmoment $u$ (N·m).

      **Konvention im ganzen Kurs:** $\theta = 0$ zeigt **nach oben**, positiv gegen den Uhrzeigersinn. Die Masse sitzt bei $x = -l\sin\theta$, $y = l\cos\theta$. Unten hängen heißt $\theta = \pi$.

      Drallsatz um den Drehpunkt:

      $$
      m l^2\, \ddot\theta = m g l \sin\theta + u
      \quad\Rightarrow\quad
      \ddot\theta = \frac{g}{l}\sin\theta + \frac{u}{m l^2}
      $$

      Das Pluszeichen ist kein Tippfehler: Weicht das Pendel oben ein wenig ab ($\theta > 0$ klein), beschleunigt die Schwerkraft es **weiter weg** – oben ist instabil. Zustand: $[\theta, \dot\theta]$.
  - type: example
    code: |
      import numpy as np
      import lab

      g, l, m = 9.81, 1.0, 1.0     # m/s², m, kg

      def step(state, u, dt):
          theta, omega = state
          alpha = g / l * np.sin(theta) + u / (m * l**2)
          omega = omega + dt * alpha
          theta = theta + dt * omega
          return np.array([theta, omega])

      dt = 0.02
      state = np.array([2.5, 0.0])    # 0,64 rad neben der unteren Ruhelage
      thetas = [state[0]]
      for k in range(200):
          state = step(state, 0.0, dt)
          thetas.append(state[0])

      print(f"theta zwischen {min(thetas):.2f} und {max(thetas):.2f} rad")
      lab.pendulum(thetas, length=l, title="Pendel ohne Motor, 4 s", fps=50)
    subgoals:
      - lines: [6, 11]
        label: Physik in step kapseln
      - lines: [13, 18]
        label: Simulationsschleife
      - lines: [20, 21]
        label: Ergebnis prüfen und animieren
    after: |
      Das Pendel schwingt symmetrisch um $\pi \approx 3{,}14$: von 2,50 bis 3,78 rad ($= 2\pi - 2{,}5$). Mit `fps=50` und `dt = 0.02` läuft die Animation in Echtzeit. Die gestrichelte Linie in der Animation markiert $\theta = 0$ (oben).
  - type: predict
    code: |
      import numpy as np

      g, l, m = 9.81, 1.0, 1.0

      def accel(theta, u=0.0):
          return g / l * np.sin(theta) + u / (m * l**2)

      print(round(accel(np.pi / 2), 2), round(accel(np.pi), 2))
    question: Welche Winkelbeschleunigungen (rad/s²) gibt das Programm aus?
    options: ["9.81 0.0", "0.0 9.81", "-9.81 0.0", "9.81 -9.81"]
    answer: "9.81 0.0"
    explanation: |
      Bei $\theta = \pi/2$ liegt die Stange waagrecht **links** ($x = -l$); die Schwerkraft dreht sie mit $g/l$ weiter in positive Richtung nach unten. Bei $\theta = \pi$ hängt sie senkrecht – kein Drehmoment, Ruhelage. (`np.sin(np.pi)` ist nur fast 0, nach dem Runden 0.0.)
  - type: explain
    question: |
      $\theta = 0$ und $\theta = \pi$ sind beide Ruhelagen ($\ddot\theta = 0$). Warum fällt das Pendel bei `state = [1e-6, 0.0]` trotzdem um, bei `[np.pi + 1e-6, 0.0]` aber nicht?
    options:
      - text: Oben ist $\sin\theta \approx \theta$, die Abweichung wird verstärkt; unten ist $\sin\theta \approx -(\theta - \pi)$, die Abweichung wird zurückgetrieben.
        correct: true
        why: Linearisiert ist oben $\ddot\theta \approx (g/l)\,\theta$ (exponentielles Wachstum), unten $\ddot\theta \approx -(g/l)(\theta-\pi)$ (Schwingung). Deshalb braucht man in Modul 9 einen Regler, um das Pendel oben zu halten.
      - text: Wegen Rundungsfehlern, die nur oben auftreten.
        correct: false
        why: Die Störung von $10^{-6}$ ist gewollt. Entscheidend ist, ob die Dynamik sie verstärkt oder dämpft.
      - text: Weil das Euler-Verfahren oben Energie hinzufügt.
        correct: false
        why: Auch die exakte Lösung kippt oben – das ist Physik, kein Verfahrensfehler.
  - type: fill
    fading: true
    prompt: |
      Ergänze die `step`-Funktion des Pendels (semi-impliziter Euler). Nach 5 Schritten mit `dt = 0.05` ab $\theta = 2$ rad soll `2.3255 2.1248` herauskommen.
    code: |
      import numpy as np

      g, l, m = 9.81, 1.0, 1.0

      def step(state, u, dt):
          theta, omega = state
          alpha = g / l * np.___(theta) + u / (m * l**2)
          omega = omega + dt * alpha
          theta = theta + dt * ___
          return np.array([theta, omega])

      s = np.array([2.0, 0.0])
      for k in range(5):
          s = step(s, 0.0, 0.05)
      print(round(s[0], 4), round(s[1], 4))
    blanks:
      - answer: sin
        options: [sin, cos, tan]
      - answer: omega
        options: [omega, alpha, theta]
    expect_output: "2.3255 2.1248"
    explanation: |
      Das Drehmoment der Schwerkraft ist proportional zu $\sin\theta$ (Hebelarm $l\sin\theta$). Die Ableitung des Winkels ist die Winkelgeschwindigkeit – und zwar die **neue**, schon aktualisierte.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `pendulum_step(state, u, dt, g=9.81, l=1.0, m=1.0)`: ein semi-impliziter Euler-Schritt für das Pendel mit Drehmoment `u` (N·m), Konvention $\theta = 0$ oben. Gib ein neues Array `[theta, omega]` zurück.
    starter: |
      import numpy as np

      def pendulum_step(state, u, dt, g=9.81, l=1.0, m=1.0):
          theta, omega = state
          # alpha berechnen, dann omega, dann theta
          return np.array([theta, omega])
    solution: |
      import numpy as np

      def pendulum_step(state, u, dt, g=9.81, l=1.0, m=1.0):
          theta, omega = state
          alpha = g / l * np.sin(theta) + u / (m * l**2)
          omega = omega + dt * alpha
          theta = theta + dt * omega
          return np.array([theta, omega])
    tests:
      - name: Ruhelage oben
        code: |
          s = pendulum_step(np.array([0.0, 0.0]), 0.0, 0.01)
          assert close(s, [0.0, 0.0]), f"Bei theta = 0, u = 0 darf sich nichts ändern, bekommen {s}"
      - name: Oben kippt es weg
        code: |
          s = pendulum_step(np.array([0.1, 0.0]), 0.0, 0.01)
          assert s[1] > 0, f"Bei theta = 0.1 (knapp neben oben) muss omega positiv werden, ist {s[1]:.4f} – Konvention theta = 0 oben?"
      - name: Drehmoment, Länge und Masse
        code: |
          th, om, u, dt, l, m = 1.0, 0.5, 0.3, 0.05, 0.5, 2.0
          alpha = 9.81 / l * np.sin(th) + u / (m * l**2)
          om2 = om + dt * alpha
          expected = [th + dt * om2, om2]
          s = pendulum_step(np.array([th, om]), u, dt, l=l, m=m)
          assert close(s, expected), f"Erwartet {np.round(expected, 4)}, bekommen {np.round(s, 4)}"
      - name: Eingabe bleibt unverändert
        code: |
          s0 = np.array([2.0, 1.0])
          pendulum_step(s0, 1.0, 0.1)
          assert s0[0] == 2.0 and s0[1] == 1.0, f"Der übergebene Zustand wurde verändert: {s0}"
