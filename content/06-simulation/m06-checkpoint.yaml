concepts: [sim-zustand, sim-schleife, euler-explizit, diskretisierungsfehler, ode-erste-ordnung, energiedrift, semi-implizit-euler, step-funktion, rollout, pendel-ode]
steps:
  - type: quiz
    question: |
      Ein Wagen fährt auf einer Schiene, oben auf ihm ist ein frei drehbarer Stab gelagert (Cart-Pole). Welcher Zustand ist vollständig?
    options:
      - text: "$[x,\\ \\dot x,\\ \\theta,\\ \\dot\\theta]$"
        correct: true
        why: Zwei Freiheitsgrade, jeder mit Lage und Geschwindigkeit.
      - text: "$[x,\\ \\theta]$"
        correct: false
        why: Ohne Geschwindigkeiten lässt sich die Beschleunigung nicht berechnen – das System ist 2. Ordnung.
      - text: "$[x,\\ \\dot x,\\ \\theta,\\ \\dot\\theta,\\ l,\\ m]$"
        correct: false
        why: Stablänge und Masse sind Parameter, keine Zustandsgrößen.
  - type: predict
    code: |
      x = 8.0
      for k in range(2):
          x = x + 1.0 * (-0.5 * x)
      print(x)
    options: ["2.0", "4.0", "0.0", "6.0"]
    answer: "2.0"
    explanation: |
      Euler für $\dot x = -0{,}5x$ mit `dt = 1`: Jeder Schritt multipliziert mit $1 - 0{,}5 = 0{,}5$, also 8 → 4 → 2.
