  - type: exercise
    mode: make
    prompt: |
      Schreibe `step(state, u, dt, g=9.81, l=1.0, m=1.0, b=0.1)` für ein **gedämpftes** Pendel mit Motor (Konvention $\theta = 0$ oben):

      $$\ddot\theta = \frac{g}{l}\sin\theta - b\,\dot\theta + \frac{u}{m l^2}$$

      Semi-impliziter Euler, `state = [theta, omega]` darf nicht verändert werden, Rückgabe als neues Array.
    starter: |
      import numpy as np

      def step(state, u, dt, g=9.81, l=1.0, m=1.0, b=0.1):
          theta, omega = state
          # dein Code
          return np.array([theta, omega])
    solution: |
      import numpy as np

      def step(state, u, dt, g=9.81, l=1.0, m=1.0, b=0.1):
          theta, omega = state
          alpha = g / l * np.sin(theta) - b * omega + u / (m * l**2)
          omega = omega + dt * alpha
          theta = theta + dt * omega
          return np.array([theta, omega])
    tests:
      - name: Oben kippt es weg
        code: |
          s = step(np.array([0.1, 0.0]), 0.0, 0.01)
          assert s[1] > 0, f"Knapp neben oben (theta = 0.1) muss omega positiv werden, ist {s[1]:.4f}"
      - name: Dämpfung bremst
        code: |
          s = step(np.array([np.pi, 2.0]), 0.0, 0.1, b=0.5)
          assert close(s[1], 1.9, tol=1e-6), f"Unten mit omega = 2, b = 0.5, dt = 0.1 erwartet omega = 1.9, bekommen {s[1]:.4f}"
      - name: Vergleich mit Referenz
        code: |
          th, om, u, dt, l, m, b = 1.0, -0.5, 0.4, 0.05, 0.5, 2.0, 0.2
          alpha = 9.81 / l * np.sin(th) - b * om + u / (m * l**2)
          om2 = om + dt * alpha
          expected = [th + dt * om2, om2]
          s = step(np.array([th, om]), u, dt, l=l, m=m, b=b)
          assert close(s, expected), f"Erwartet {np.round(expected, 4)}, bekommen {np.round(s, 4)}"
      - name: Eingabe bleibt unverändert
        code: |
          s0 = np.array([2.0, 1.0])
          s1 = step(s0, 1.0, 0.1)
          assert s0[0] == 2.0 and s0[1] == 1.0 and s1 is not s0, f"step hat den übergebenen Zustand verändert: {s0}"
    mutants:
