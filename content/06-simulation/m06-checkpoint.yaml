  - type: predict
    code: |
      omega, dt = 3.0, 0.1
      x, v = 1.0, 0.0
      E0 = 0.5 * v**2 + 0.5 * omega**2 * x**2
      x, v = x + dt * v, v - dt * omega**2 * x
      E1 = 0.5 * v**2 + 0.5 * omega**2 * x**2
      print(round(E1 / E0, 4))
    question: Um welchen Faktor ändert dieser **explizite** Euler-Schritt die Energie?
    options: ["1.09", "1.0", "1.3", "0.91"]
    answer: "1.09"
    explanation: |
      Faktor $1 + \omega^2 dt^2 = 1 + 9 \cdot 0{,}01 = 1{,}09$ – in **jedem** Schritt. Das ist die Energiedrift des expliziten Euler.
