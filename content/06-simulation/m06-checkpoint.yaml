      - |
        import numpy as np

        def step(state, u, dt, g=9.81, l=1.0, m=1.0, b=0.1):
            alpha = g / l * np.sin(state[0]) - b * state[1] + u / (m * l**2)
            state[1] = state[1] + dt * alpha
            state[0] = state[0] + dt * state[1]
            return state
