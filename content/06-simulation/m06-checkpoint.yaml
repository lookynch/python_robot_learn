  - type: quiz
    question: |
      Eine Euler-Simulation über 3 s hat mit `dt = 0.01` s einen Endfehler von 2 cm. Welche Schrittweite brauchst du ungefähr für 5 mm?
    options:
      - text: "`dt = 0.0025` s"
        correct: true
        why: Fehler ~ `dt`. Ein Viertel des Fehlers braucht ein Viertel der Schrittweite.
      - text: "`dt = 0.005` s"
        correct: false
        why: Damit halbiert sich der Fehler nur auf etwa 1 cm.
      - text: "`dt = 0.04` s"
        correct: false
        why: Größere Schritte machen den Fehler größer, nicht kleiner.
  - type: predict
    code: |
      import numpy as np

      def step(state, action, dt):
          state[1] = state[1] + dt * action
          return state

      s0 = np.array([0.0, 1.0])
      a = step(s0, 2.0, 0.5)
      b = step(s0, -2.0, 0.5)
      print(a[1], b[1])
    options: ["1.0 1.0", "2.0 0.0", "2.0 1.0", "0.0 0.0"]
    answer: "1.0 1.0"
    explanation: |
      `step` verändert `s0` direkt: Nach dem ersten Aufruf ist `s0[1] = 2.0`, der zweite setzt es auf `1.0`. `a`, `b` und `s0` sind **dasselbe** Array – beide zeigen am Ende `1.0`. Ein Planer würde hier zwei Aktionen vergleichen und völlig falsche Ergebnisse bekommen.
  - type: quiz
    question: |
      Semi-impliziter Euler für eine Feder mit $k = 100$ N/m und $m = 1$ kg. Welche Schrittweite ist noch stabil?
    options:
      - text: "`dt = 0.1` s"
        correct: true
        why: $\omega = \sqrt{k/m} = 10$ rad/s, stabil für $\omega\, dt < 2$, also $dt < 0{,}2$ s.
      - text: "`dt = 0.25` s"
        correct: false
        why: $\omega\, dt = 2{,}5 > 2$ – die Simulation explodiert.
      - text: jede Schrittweite, semi-implizit ist immer stabil
        correct: false
        why: Auch der semi-implizite Euler hat eine Stabilitätsgrenze; steife Federn brauchen kleine `dt`.
