id: m06-zustand
title: Zustand und Simulationsschleife
minutes: 8
goals:
  - Den Zustand eines Systems von seinen Parametern unterscheiden
  - Eine Simulationsschleife mit festem Zeitschritt `dt` schreiben
  - Eine Trajektorie als Liste bzw. 2D-Array speichern und plotten
concepts: [sim-zustand, sim-schleife]
steps:
  - type: text
    body: |
      ## Was ein Simulator sich merkt

      Ein Simulator rechnet nicht kontinuierlich, sondern in **Zeitschritten** (time step) der Länge `dt`: $t_k = k \cdot dt$.

      Der **Zustand** (state) ist alles, was man über das System zum Zeitpunkt $t_k$ wissen muss, um den nächsten Schritt zu berechnen. Für einen Wagen auf einer Schiene: Position $x$ (m) und Geschwindigkeit $v$ (m/s).

      Masse, Reibwert oder `dt` sind **Parameter**: Sie ändern sich während der Simulation nicht.

      Jede Simulation hat dieselbe Form: Zustand festlegen → in einer Schleife weiterrechnen → jeden Zustand speichern. Die Folge der gespeicherten Zustände heißt **Trajektorie** (trajectory).
  - type: example
    code: |
      import numpy as np
      import lab

      dt = 0.1                # s
      n_steps = 20
      x, v = 0.0, 2.0         # m, m/s
      xs = [x]
      for k in range(n_steps):
          x = x + v * dt
          xs.append(x)

      ts = np.arange(n_steps + 1) * dt
      print(len(xs), round(xs[-1], 3))
      lab.plot(xs, x=ts, title="Wagen mit v = 2 m/s", xlabel="t [s]", ylabel="x [m]")
    subgoals:
      - lines: [4, 6]
        label: Parameter und Startzustand festlegen
      - lines: [7, 10]
        label: Schleife über die Zeitschritte
      - lines: [12, 14]
        label: Trajektorie auswerten
    after: |
      Nach 20 Schritten à 0,1 s ist $t = 2$ s und $x = 2 \cdot 2 = 4$ m. Die Liste hat **21** Einträge: den Startzustand plus einen pro Schritt. Die Zeitachse `ts` muss genauso lang sein, sonst passt der Plot nicht.
  - type: explain
    question: |
      Warum wird `xs = [x]` **vor** der Schleife mit dem Startwert gefüllt?
    options:
      - text: Damit die Trajektorie bei $t = 0$ beginnt und zu jedem Zeitpunkt in `ts` genau ein Zustand gehört.
        correct: true
        why: Ohne den Startwert fehlt $t = 0$, und `xs` hätte nur `n_steps` Einträge – eins weniger als `ts`.
      - text: Weil `append` auf einer leeren Liste nicht funktioniert.
        correct: false
        why: "`append` funktioniert auch auf `[]`. Es geht um den fehlenden Startzustand."
      - text: Damit die Schleife einen Durchlauf mehr macht.
        correct: false
        why: Die Anzahl der Durchläufe hängt nur von `range(n_steps)` ab, nicht vom Inhalt der Liste.
  - type: predict
    code: |
      dt = 0.5
      t = 0.0
      ts = [t]
      for k in range(4):
          t = t + dt
          ts.append(t)
      print(len(ts), ts[-1])
    options: ["5 2.0", "4 2.0", "5 2.5", "4 1.5"]
    answer: "5 2.0"
    explanation: |
      4 Schritte → 5 Zeitpunkte (0; 0,5; 1,0; 1,5; 2,0). Die Endzeit ist `n_steps * dt` = 2,0 s. Das „+1“ wirst du bei jeder Trajektorie wiedersehen.
  - type: trace
    intro: |
      Jetzt bremst der Wagen mit $a = -1$ m/s². Der Zustand hat zwei Größen, die in jedem Schritt aktualisiert werden.
    code: |
      x, v = 0.0, 2.0
      a = -1.0
      dt = 0.5
      for k in range(3):
          x = x + v * dt
          v = v + a * dt
      print(x, v)
    questions:
      - line: 6
        hit: 2
        var: v
        prompt: Welchen Wert hat `v` nach dem **zweiten** Durchlauf von Zeile 6?
        answer: "1.0"
      - line: 5
        hit: 3
        var: x
        prompt: Welchen Wert hat `x` nach dem **dritten** Durchlauf von Zeile 5?
        answer: "2.25"
    after: |
      Zeile 5 benutzt das `v` vom **Anfang** des Schritts, Zeile 6 ändert es erst danach. Diese Reihenfolge ist eine Entscheidung – in der Lektion über semi-implizites Rechnen siehst du, warum sie wichtig ist.
  - type: fill
    fading: true
    prompt: |
      Statt zweier Variablen speichert man den Zustand meist als **ein** NumPy-Array `[x, v]`. Ergänze so, dass die Trajektorie ein Array der Form `(5, 2)` wird und die letzte Position ausgegeben wird.
    code: |
      import numpy as np

      dt = 0.5
      state = np.array([0.0, 2.0])     # [x, v]
      traj = [state]
      for k in range(4):
          x, v = state
          state = np.array([x + v * dt, v])
          traj.___(state)
      traj = np.array(traj)
      print(traj.shape)
      print(traj[___, 0])
    blanks:
      - answer: append
        options: [append, extend, add]
      - answer: "-1"
        options: ["-1", "1", "5", "0"]
    expect_output: |
      (5, 2)
      4.0
    explanation: |
      `np.array(liste_von_zuständen)` stapelt die Zustände zeilenweise: Zeile = Zeitpunkt, Spalte = Zustandsgröße. `traj[-1, 0]` ist die Position (Spalte 0) im letzten Zustand. `extend` würde die beiden Zahlen einzeln anhängen und die Struktur zerstören.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `simulate(x0, v0, a, dt, n_steps)`. Sie simuliert einen Wagen mit konstanter Beschleunigung `a` und gibt die Trajektorie als NumPy-Array der Form `(n_steps + 1, 2)` zurück; jede Zeile ist `[x, v]`.

      Pro Schritt: **erst** `x` mit dem alten `v` aktualisieren, **dann** `v` – wie im Trace oben.
    starter: |
      import numpy as np

      def simulate(x0, v0, a, dt, n_steps):
          x, v = x0, v0
          traj = []
          # Startzustand speichern, dann n_steps Schritte
          return np.array(traj)
    solution: |
      import numpy as np

      def simulate(x0, v0, a, dt, n_steps):
          x, v = x0, v0
          traj = [[x, v]]
          for k in range(n_steps):
              x = x + v * dt
              v = v + a * dt
              traj.append([x, v])
          return np.array(traj)
    tests:
      - name: Form der Trajektorie
        code: |
          traj = simulate(0.0, 2.0, -1.0, 0.5, 3)
          assert np.shape(traj) == (4, 2), f"Erwartet Form (4, 2) für 3 Schritte, bekommen {np.shape(traj)}"
      - name: Startzustand in Zeile 0
        code: |
          traj = simulate(1.0, -3.0, 2.0, 0.1, 5)
          assert close(traj[0], [1.0, -3.0]), f"Zeile 0 sollte der Startzustand [1.0, -3.0] sein, ist {traj[0]}"
      - name: Bremsender Wagen
        code: |
          traj = simulate(0.0, 2.0, -1.0, 0.5, 3)
          assert close(traj[-1], [2.25, 0.5]), f"Nach 3 Schritten erwartet [2.25, 0.5], bekommen {traj[-1]}"
      - name: Anderer Fall
        code: |
          traj = simulate(1.0, 0.0, 2.0, 0.25, 4)
          assert close(traj[-1], [1.75, 2.0]), f"Erwartet [1.75, 2.0] im letzten Zustand, bekommen {traj[-1]}"
    mutants:
      - |
        import numpy as np

        def simulate(x0, v0, a, dt, n_steps):
            x, v = x0, v0
            traj = []
            for k in range(n_steps):
                x = x + v * dt
