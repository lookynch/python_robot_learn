                traj.append([x, v])
            return np.array(traj)
      - |
        import numpy as np

        def simulate(x0, v0, a, dt, n_steps):
            x, v = x0, v0
            traj = [[x, v]]
            for k in range(n_steps):
                v = v + a * dt
                x = x + v * dt
                traj.append([x, v])
            return np.array(traj)
      - |
        import numpy as np

        def simulate(x0, v0, a, dt, n_steps):
            x, v = x0, v0
            traj = [[x, v]]
            for k in range(n_steps):
                x = x + v * dt
                v = v + a
                traj.append([x, v])
            return np.array(traj)
    hints:
      - "Teilziel: Startzustand speichern, dann Schleife über die Zeitschritte."
      - "`traj` muss schon vor der Schleife den Startzustand `[x, v]` enthalten; in der Schleife kommt pro Schritt ein Zustand dazu."
      - |
        ```python
        traj = [[x, v]]
        for k in range(n_steps):
            x = x + v * dt
            ...
        ```
      - |
        ```python
        traj = [[x, v]]
        for k in range(n_steps):
            x = x + v * dt
            v = v + a * dt
            traj.append([x, v])
        ```
  - type: quiz
    question: |
      Du simulierst ein Pendel mit Motor. Welche Größen bilden den **Zustand**?
    options:
      - text: Winkel $\theta$ und Winkelgeschwindigkeit $\dot\theta$
        correct: true
        why: Beide zusammen legen fest, wie es weitergeht. Der Winkel allein sagt nicht, ob das Pendel gerade nach links oder rechts schwingt.
      - text: nur der Winkel $\theta$
        correct: false
        why: Bei gleichem Winkel kann sich das Pendel unterschiedlich schnell und in unterschiedliche Richtungen bewegen.
      - text: $\theta$, $\dot\theta$, Länge $l$ und Erdbeschleunigung $g$
        correct: false
        why: "$l$ und $g$ sind Parameter: Sie ändern sich während der Simulation nicht und gehören nicht in den Zustand."
      - text: $\theta$, $\dot\theta$ und `dt`
        correct: false
        why: "`dt` ist eine Einstellung des Simulators, keine Eigenschaft des Pendels."
cards:
  - id: m06-c-trajektorie-laenge
    concept: sim-schleife
    variants:
      - type: predict
        code: |
          xs = [0.0]
          for k in range(6):
              xs.append(xs[-1] + 1.0)
          print(len(xs))
        options: ["7", "6", "5"]
        answer: "7"
        explanation: Startzustand plus 6 Schritte = 7 Einträge.
      - type: predict
        code: |
          dt = 0.25
          n_steps = 8
          traj = [0.0]
          for k in range(n_steps):
              traj.append(traj[-1] + dt)
          print(len(traj), traj[-1])
        options: ["9 2.0", "8 2.0", "9 2.25", "8 1.75"]
        answer: "9 2.0"
        explanation: "8 Schritte → 9 Zeitpunkte; Endzeit 8 · 0,25 s = 2,0 s."
  - id: m06-c-zustand-parameter
    concept: sim-zustand
    variants:
      - type: quiz
        question: |
          Ein Wagen der Masse $m$ wird mit Reibwert $c$ simuliert, Zeitschritt `dt`. Was gehört in den Zustand?
        options:
          - text: Position $x$ und Geschwindigkeit $v$
            correct: true
            why: Nur diese beiden ändern sich und bestimmen den nächsten Schritt.
          - text: $x$, $v$ und $m$
            correct: false
            why: Die Masse ist ein konstanter Parameter.
          - text: $x$, $v$, $c$ und `dt`
            correct: false
            why: Reibwert und Zeitschritt sind Parameter, kein Zustand.
      - type: quiz
        question: |
          Ein Roboterarm mit zwei Gelenken wird dynamisch simuliert. Welcher Zustand ist vollständig?
        options:
          - text: beide Gelenkwinkel und beide Gelenkgeschwindigkeiten
            correct: true
            why: Für eine Dynamik 2. Ordnung braucht jedes Gelenk Winkel **und** Geschwindigkeit.
          - text: beide Gelenkwinkel
            correct: false
            why: Ohne Geschwindigkeiten weiß man nicht, wohin sich der Arm gerade bewegt.
          - text: beide Gelenkwinkel und die Gliedlängen
            correct: false
            why: Gliedlängen sind konstante Parameter; die Geschwindigkeiten fehlen.
