id: m04-aggregation
title: Zusammenfassen mit sum, mean, argmax
minutes: 9
goals:
  - "`sum`, `mean`, `max`, `min` auf ganze Arrays und entlang einer Achse anwenden"
  - Den Parameter `axis` sicher deuten
  - Mit `argmin`/`argmax` den Index des besten Werts finden
concepts: [np-aggregation]
steps:
  - type: text
    body: |
      ## Viele Werte, eine Zahl

      **Aggregationen** fassen ein Array zusammen: `a.sum()`, `a.mean()`, `a.max()`, `a.min()`, `a.std()` (Standardabweichung). Ohne weitere Angabe über **alle** Elemente.

      Mit `axis` wählst du die Achse, die **weggerechnet** wird:

      - Trajektorie `traj` mit Form `(T, n)` – Zeilen = Zeitschritte, Spalten = Gelenke
      - `traj.mean(axis=0)` mittelt über die Zeit → ein Wert **pro Gelenk**, Form `(n,)`
      - `traj.mean(axis=1)` mittelt über die Gelenke → ein Wert **pro Zeitschritt**, Form `(T,)`

      `argmax`/`argmin` liefern nicht den Wert, sondern seinen **Index**.
  - type: example
    code: |
      import numpy as np
      traj = np.array([[0.0, 1.0],
                       [0.5, 0.8],
                       [1.0, 0.2]])
      print(traj.sum())
      print(traj.mean(axis=0))
      print(traj.max(axis=1))
      print(traj[:, 1].argmin())
    subgoals:
      - lines: [1, 4]
        label: Trajektorie anlegen (3 Zeitschritte, 2 Gelenke)
      - lines: 5
        label: Über alles summieren
      - lines: [6, 7]
        label: Entlang einer Achse zusammenfassen
      - lines: 8
        label: Index des kleinsten Werts finden
    after: |
      `mean(axis=0)` liefert 2 Werte – den mittleren Winkel jedes Gelenks. `max(axis=1)` liefert 3 Werte – den größten Winkel in jedem Zeitschritt. `argmin` sagt: Gelenk 2 ist im Zeitschritt mit Index 2 am kleinsten.
  - type: explain
    question: |
      `traj` hat die Form `(3, 2)`. Warum liefert `traj.mean(axis=0)` genau **2** Werte?
    options:
      - text: Achse 0 (die 3 Zeilen) wird weggerechnet – übrig bleibt Achse 1 mit 2 Spalten, also ein Mittelwert pro Spalte.
        correct: true
        why: "`axis=k` heißt: entlang Achse k zusammenfassen; diese Achse verschwindet aus der Form."
      - text: "`axis=0` wählt die erste Spalte aus."
        correct: false
        why: "`axis` wählt nichts aus, es gibt die Richtung des Zusammenfassens an."
      - text: Weil NumPy immer die kürzere Achse behält.
        correct: false
        why: Mit `axis=1` bekämst du 3 Werte – welche Achse verschwindet, bestimmst du.
  - type: predict
    code: |
      import numpy as np
      M = np.array([[1, 2, 3],
                    [4, 5, 6]])
      print(M.sum(axis=0))
      print(M.sum(axis=1))
    options:
      - |
        [5 7 9]
        [ 6 15]
      - |
        [ 6 15]
        [5 7 9]
      - |
        21
        21
    answer: |
      [5 7 9]
      [ 6 15]
    explanation: |
      `axis=0` summiert die Zeilen untereinander (Spaltensummen: 1+4, 2+5, 3+6). `axis=1` summiert innerhalb jeder Zeile (1+2+3, 4+5+6).
  - type: predict
    code: |
      import numpy as np
      kosten = np.array([3.2, 0.7, 1.5, 0.7])
      print(kosten.argmin())
      print(kosten.min())
    options:
      - |
        1
        0.7
      - |
        3
        0.7
      - |
        0.7
        1
      - |
        0
        3.2
    answer: |
      1
      0.7
    explanation: |
      `argmin` liefert den Index des kleinsten Werts. Bei Gleichstand gewinnt das **erste** Vorkommen (Index 1, nicht 3). `min` liefert den Wert selbst.

      Das ist der Kern einfacher Planer: Kosten für viele Kandidaten berechnen, mit `argmin` den besten wählen.
  - type: fill
    fading: true
    prompt: |
      Berechne den mittleren Betrag des Regelfehlers **pro Gelenk** (Spalten) über alle Zeitschritte.
    code: |
      import numpy as np
      fehler = np.array([[0.1, -0.2],
                         [0.3, 0.0],
                         [-0.1, 0.2]])
      mittel = np.___(fehler).mean(axis=___)
      print(np.round(mittel, 3))
    blanks:
      - answer: abs
        options: [abs, sum, sqrt]
      - answer: "0"
        options: ["0", "1", "None"]
    expect_output: "[0.167 0.133]"
    explanation: |
      Erst Beträge (sonst heben sich positive und negative Fehler auf), dann `axis=0` für einen Wert pro Spalte.
  - type: parsons
    fading: true
    prompt: |
      Wähle aus fünf Kandidaten-Steuersignalen das mit den kleinsten Kosten $(u - 0.3)^2$. Achtung: überzählige Zeilen.
    lines:
      - "import numpy as np"
      - "u = np.array([-1.0, -0.5, 0.0, 0.5, 1.0])"
      - "kosten = (u - 0.3) ** 2"
      - "i = kosten.argmin()"
      - "print(u[i])"
    distractors:
      - "i = kosten.min()"
      - "i = kosten.argmax()"
    expect_output: "0.5"
  - type: exercise
    mode: modify
    prompt: |
      Statt des Gesamtmittelwerts soll das Programm den **größten Winkel jedes Gelenks** (eine Zahl pro Spalte) in der Variablen `maxima` speichern und ausgeben.
    starter: |
      import numpy as np
      messung = np.array([[0.1, 0.5, -0.2],
                          [0.3, 0.4, -0.1],
                          [0.2, 0.9, 0.0],
                          [0.0, 0.6, -0.3]])
      maxima = messung.mean()
      print(maxima)
    solution: |
      import numpy as np
      messung = np.array([[0.1, 0.5, -0.2],
                          [0.3, 0.4, -0.1],
                          [0.2, 0.9, 0.0],
                          [0.0, 0.6, -0.3]])
      maxima = messung.max(axis=0)
      print(maxima)
    tests:
      - name: Ein Wert pro Gelenk
        code: |
          import numpy as np
          assert np.shape(maxima) == (3,), f"maxima sollte 3 Werte haben (einen pro Spalte), Form ist {np.shape(maxima)}"
      - name: Werte
        code: |
          assert close(maxima, [0.3, 0.9, 0.0]), f"Erwartet [0.3, 0.9, 0.0], bekommen {maxima}"
    mutants:
      - |
        import numpy as np
        messung = np.array([[0.1, 0.5, -0.2], [0.3, 0.4, -0.1], [0.2, 0.9, 0.0], [0.0, 0.6, -0.3]])
        maxima = messung.max(axis=1)
        print(maxima)
      - |
        import numpy as np
        messung = np.array([[0.1, 0.5, -0.2], [0.3, 0.4, -0.1], [0.2, 0.9, 0.0], [0.0, 0.6, -0.3]])
        maxima = messung.mean(axis=0)
        print(maxima)
      - |
        import numpy as np
        messung = np.array([[0.1, 0.5, -0.2], [0.3, 0.4, -0.1], [0.2, 0.9, 0.0], [0.0, 0.6, -0.3]])
        maxima = messung.argmax(axis=0)
        print(maxima)
    hints:
      - "Teilziel: pro Spalte (Gelenk) das Maximum über alle Zeilen (Zeitschritte)."
      - "Die Zeilen sollen verschwinden – das ist Achse 0."
      - "`maxima = messung.max(axis=0)`"
  - type: exercise
    mode: make
    prompt: |
      Schreibe `bester_kandidat(kandidaten, ziel)`. `kandidaten` hat die Form `(N, 2)` (mögliche Endpositionen), `ziel` die Form `(2,)`. Gib die **Zeile** (den Punkt) zurück, die dem Ziel am nächsten liegt.
    starter: |
      import numpy as np

      def bester_kandidat(kandidaten, ziel):
          d = kandidaten - ziel
          # quadrierte Abstände pro Zeile, dann den besten Index finden
          pass
    solution: |
      import numpy as np

      def bester_kandidat(kandidaten, ziel):
          d = kandidaten - ziel
          abstand2 = (d ** 2).sum(axis=1)
          i = abstand2.argmin()
          return kandidaten[i]
    tests:
      - name: Drei Kandidaten
        code: |
          import numpy as np
          k = np.array([[0.0, 0.0], [1.0, 1.0], [3.0, 0.0]])
          r = bester_kandidat(k, np.array([1.2, 0.9]))
          assert close(r, [1.0, 1.0]), f"Erwartet [1, 1], bekommen {r}"
      - name: Bester ist der letzte
        code: |
          import numpy as np
          k = np.array([[0.0, 0.0], [1.0, 1.0], [3.0, 0.0]])
          r = bester_kandidat(k, np.array([2.8, -0.5]))
          assert close(r, [3.0, 0.0]), f"Erwartet [3, 0], bekommen {r}"
      - name: Viele Kandidaten
        code: |
          import numpy as np
          k = np.array([[0.1, 0.0], [0.0, 2.0], [0.5, 0.5], [2.0, 2.0], [-1.0, 0.5]])
          r = bester_kandidat(k, np.array([0.0, 1.8]))
          assert close(r, [0.0, 2.0]), f"Erwartet [0, 2], bekommen {r}"
    mutants:
      - |
        import numpy as np

        def bester_kandidat(kandidaten, ziel):
            d = kandidaten - ziel
            return kandidaten[(d ** 2).sum(axis=0).argmin()]
      - |
        import numpy as np

        def bester_kandidat(kandidaten, ziel):
            d = kandidaten - ziel
            return kandidaten[(d ** 2).sum(axis=1).argmax()]
      - |
        import numpy as np

        def bester_kandidat(kandidaten, ziel):
            d = kandidaten - ziel
            return (d ** 2).sum(axis=1).argmin()
    hints:
      - "Teilziel: quadrierte Abstände pro Zeile → Index des kleinsten → Zeile zurückgeben."
      - "Pro Zeile summieren heißt `axis=1`. Die Wurzel brauchst du nicht: Der kleinste Abstand hat auch das kleinste Quadrat."
      - "`i = (d ** 2).sum(axis=1).argmin()`"
      - "`return kandidaten[i]`"
  - type: quiz
    question: |
      `A` hat die Form `(100, 3)`. Welche Form hat `A.mean(axis=0)`?
    options:
      - text: "`(3,)`"
        correct: true
        why: Achse 0 (100 Zeilen) wird weggerechnet; es bleibt ein Mittelwert pro Spalte.
      - text: "`(100,)`"
        correct: false
        why: Das wäre `axis=1`.
      - text: "`(1, 3)`"
        correct: false
        why: Die Achse verschwindet ganz (es sei denn, man gibt `keepdims=True` an).
      - text: eine einzelne Zahl
        correct: false
        why: Das gibt es ohne `axis`, also `A.mean()`.
cards:
  - id: m04-c-axis
    concept: np-aggregation
    variants:
      - type: predict
        code: |
          import numpy as np
          M = np.array([[1, 1], [2, 2], [3, 3]])
          print(M.sum(axis=0))
        options: ["[6 6]", "[2 4 6]", "12", "[1 2 3]"]
        answer: "[6 6]"
        explanation: Über die 3 Zeilen summiert → ein Wert pro Spalte.
      - type: predict
        code: |
          import numpy as np
          M = np.array([[1, 1], [2, 2], [3, 3]])
          print(M.sum(axis=1))
        options: ["[2 4 6]", "[6 6]", "12", "[3 3]"]
        answer: "[2 4 6]"
        explanation: Innerhalb jeder Zeile summiert → ein Wert pro Zeile.
      - type: predict
        code: |
          import numpy as np
          M = np.array([[1.0, 3.0], [5.0, 7.0]])
          print(M.mean(axis=0))
        options: ["[3. 5.]", "[2. 6.]", "4.0", "[1. 7.]"]
        answer: "[3. 5.]"
        explanation: "Spaltenmittel: $(1+5)/2$ und $(3+7)/2$."
  - id: m04-c-argmin
    concept: np-aggregation
    variants:
      - type: predict
        code: |
          import numpy as np
          a = np.array([4.0, 1.0, 9.0])
          print(a.argmax())
        options: ["2", "9.0", "1", "3"]
        answer: "2"
        explanation: "`argmax` liefert den Index (ab 0) des größten Werts, nicht den Wert."
      - type: predict
        code: |
          import numpy as np
          kosten = np.array([2.0, 0.5, 0.5, 3.0])
          print(kosten.argmin())
        options: ["1", "2", "0.5", "[1 2]"]
        answer: "1"
        explanation: Bei Gleichstand gewinnt das erste Vorkommen.
      - type: predict
        code: |
          import numpy as np
          u = np.array([-1.0, 0.0, 1.0])
          kosten = (u - 0.8) ** 2
          print(u[kosten.argmin()])
        options: ["1.0", "2", "0.04", "0.0"]
        answer: "1.0"
        explanation: Der Index des kleinsten Kostenwerts wählt das passende Steuersignal aus.
