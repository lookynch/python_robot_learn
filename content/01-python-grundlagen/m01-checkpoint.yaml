id: m01-checkpoint
title: "Checkpoint: Python-Grundlagen"
kind: checkpoint
minutes: 15
goals:
  - Typen, Strings, Eingaben, Bedingungen, Schleifen und Listen gemischt anwenden
  - Fehlermeldungen deuten und beheben
concepts:
  - datentypen
  - typumwandlung
  - f-string
  - input-eingabe
  - logische-operatoren
  - if-verzweigung
  - while-schleife
  - for-range
  - akkumulator
  - liste-durchlaufen
  - traceback-lesen
steps:
  - type: text
    body: |
      ## Checkpoint Modul 1

      Zehn gemischte Aufgaben zu allem aus diesem Modul. Bestanden hast du mit mindestens 80 % beim ersten Versuch.

      Kennst du Python schon? Dann kannst du hier direkt einsteigen – schaffst du den Checkpoint, kannst du das Modul überspringen.
  - type: predict
    code: |
      a = "4"
      b = 4
      print(a * 2, b * 2, int(a) + b)
    options: ["44 8 8", "8 8 8", "44 8 44", "8 44 8"]
    answer: "44 8 8"
    explanation: |
      `a` ist Text: `"4" * 2` wiederholt ihn zu `44`. `b` ist eine Zahl: 8. Nach `int(a)` wird gerechnet: 4 + 4 = 8.
  - type: predict
    code: |
      x = 15
      if x > 10:
          print("A")
      elif x > 5:
          print("B")
      if x > 12:
          print("C")
      else:
          print("D")
    options:
      - |
        A
        C
      - |
        A
      - |
        A
        B
        C
      - |
        A
        D
    answer: |
      A
      C
    explanation: |
      Im ersten `if`/`elif` gewinnt der erste Treffer (`A`), `B` wird nicht mehr geprüft. Das zweite `if` ist davon unabhängig: `15 > 12`, also `C`.
  - type: fill
    prompt: |
      Addiere alle **ungeraden** Zahlen von 1 bis 9 (Ergebnis 25).
    code: |
      summe = 0
      for k in range(1, ___, ___):
          summe = summe + k
      print(summe)
    blanks:
      - answer: "10"
        options: ["10", "9", "8"]
      - answer: "2"
        options: ["2", "1", "3"]
    expect_output: "25"
    explanation: |
      `range(1, 10, 2)` liefert 1, 3, 5, 7, 9. Der Stopp-Wert muss **größer** als 9 sein, weil er selbst nie dabei ist.
  - type: quiz
    question: |
      Der Nutzer soll eine ganze Zahl eingeben, das Programm soll das Doppelte ausgeben. Welche Version ist richtig?
    options:
      - text: '`n = int(input("n: "))` und dann `print(n * 2)`'
        correct: true
        why: "`input()` liefert Text; `int()` macht daraus eine Zahl, mit der gerechnet wird."
      - text: '`n = input("n: ")` und dann `print(n * 2)`'
        correct: false
        why: Dann ist `n` Text, und `* 2` wiederholt ihn (aus `5` wird `55`).
      - text: '`n = input(int("n: "))` und dann `print(n * 2)`'
        correct: false
        why: 'Die Reihenfolge ist vertauscht – `int("n: ")` ist ein `ValueError`, weil der Fragetext keine Zahl ist.'
      - text: '`n = str(input("n: "))` und dann `print(n * 2)`'
        correct: false
        why: "`str()` ändert nichts – `input()` liefert ohnehin Text."
  - type: predict
    code: |
      n = 20
      schritte = 0
      while n > 1:
          n = n // 2
          schritte = schritte + 1
      print(n, schritte)
    options: ["1 4", "0 5", "1 5", "2 3"]
    answer: "1 4"
    explanation: |
      20 → 10 → 5 → 2 → 1: vier Durchläufe. Bei `n = 1` ist `n > 1` falsch, die Schleife endet.
  - type: parsons
    prompt: |
      Zähle, wie viele Messwerte größer als 0.5 sind (Ausgabe `2`). Bringe die Zeilen in Reihenfolge und Einrückung.
    lines:
      - "werte = [0.2, 0.9, 0.4, 1.3]"
      - "anzahl = 0"
      - "for w in werte:"
      - "    if w > 0.5:"
      - "        anzahl = anzahl + 1"
      - "print(anzahl)"
    distractors:
      - "if w > 0.5"
      - "anzahl = anzahl + w"
    expect_output: "2"
  - type: quiz
    question: |
      Bei Eingabe `0.3` bricht das Programm so ab. Welche Korrektur ist richtig?

      ```text
      Traceback (most recent call last):
        Datei <dein Code>, line 2, in <module>
          if abstand < 0.5:
             ^^^^^^^^^^^^^
      TypeError: '<' not supported between instances of 'str' and 'float'
      ```
    code: |
      abstand = input("Abstand: ")
      if abstand < 0.5:
          print("Stopp")
    options:
      - text: 'Zeile 1: `abstand = float(input("Abstand: "))`'
        correct: true
        why: "`abstand` ist Text (`str`), `0.5` eine Zahl (`float`) – die lassen sich nicht vergleichen. Nach `float()` klappt es, auch bei Kommazahlen."
      - text: 'Zeile 1: `abstand = int(input("Abstand: "))`'
        correct: false
        why: '`int("0.3")` ist ein `ValueError` – für Kommazahlen braucht es `float()`.'
      - text: "Zeile 2: `if abstand < \"0.5\":`"
        correct: false
        why: Dann werden zwei Texte Zeichen für Zeichen verglichen – kein Fehler mehr, aber kein Zahlenvergleich (`"10" < "5"` wäre z. B. True).
      - text: "Zeile 2: `if abstand = 0.5:`"
        correct: false
        why: "`=` ist eine Zuweisung – das ist ein `SyntaxError`."
  - type: exercise
    mode: make
    prompt: |
      Berechne mit einer Schleife den Mittelwert der gemessenen Kräfte und gib ihn mit zwei Nachkommastellen aus.

      Erwartete Ausgabe:
      ```
      Mittelwert: 3.00 N
      ```
    starter: |
      kraefte = [2.0, 3.5, 2.5, 4.0]
      summe = 0
      # Schleife, Mittelwert, Ausgabe
    solution: |
      kraefte = [2.0, 3.5, 2.5, 4.0]
      summe = 0
      for k in kraefte:
          summe = summe + k
      mittel = summe / len(kraefte)
      print(f"Mittelwert: {mittel:.2f} N")
    tests:
      - name: Summe
        code: |
          assert summe == 12.0, f"summe sollte nach der Schleife 12.0 sein, ist {summe}"
      - name: Ausgabe
        code: |
          assert lines() == ["Mittelwert: 3.00 N"], f"Erwartet ['Mittelwert: 3.00 N'], bekommen {lines()}"
    mutants:
      - |
        kraefte = [2.0, 3.5, 2.5, 4.0]
        summe = 0
        for k in kraefte:
            summe = summe + k
        mittel = summe / 3
        print(f"Mittelwert: {mittel:.2f} N")
      - |
        kraefte = [2.0, 3.5, 2.5, 4.0]
        summe = 0
        for k in kraefte:
            summe = summe + k
        mittel = summe / len(kraefte)
        print(f"Mittelwert: {mittel} N")
      - |
        kraefte = [2.0, 3.5, 2.5, 4.0]
        summe = 0
        for k in kraefte:
            summe = k
        mittel = summe / len(kraefte)
        print(f"Mittelwert: {mittel:.2f} N")
      - |
        kraefte = [2.0, 3.5, 2.5, 4.0]
        summe = 0
        for k in kraefte:
            summe = summe + k
            mittel = summe / len(kraefte)
            print(f"Mittelwert: {mittel:.2f} N")
    hints:
      - "Teilziel: aufsummieren → durch die Anzahl teilen → formatiert ausgeben."
      - "Mittelwert = Summe / Anzahl. Die Anzahl liefert `len()`, zwei Nachkommastellen `:.2f`."
      - |
        ```python
        for k in kraefte:
            summe = summe + k
        mittel = summe / len(kraefte)
        ```
  - type: exercise
    mode: make
    prompt: |
      Lies eine ganze Zahl `n` ein und gib die Summe $1 + 2 + \dots + n$ aus.

      Bei Eingabe `4` soll die letzte Zeile lauten:
      ```
      Summe: 10
      ```
    starter: |
      n = input("n: ")
    stdin: ["4"]
    solution: |
      n = int(input("n: "))
      summe = 0
      for k in range(1, n + 1):
          summe = summe + k
      print(f"Summe: {summe}")
    tests:
      - name: Summe bis 4
        code: |
          assert lines() and lines()[-1] == "Summe: 10", f"Letzte Zeile sollte 'Summe: 10' sein, ist {lines()[-1:]}"
    mutants:
      - |
        n = int(input("n: "))
        summe = 0
        for k in range(1, n):
            summe = summe + k
        print(f"Summe: {summe}")
      - |
        n = input("n: ")
        summe = 0
        for k in range(1, n + 1):
            summe = summe + k
        print(f"Summe: {summe}")
      - |
        n = int(input("n: "))
        summe = 0
        for k in range(n):
            summe = summe + k
        print(f"Summe: {summe}")
      - |
        n = int(input("n: "))
        for k in range(1, n + 1):
            summe = 0
            summe = summe + k
        print(f"Summe: {summe}")
    hints:
      - "Teilziel: Eingabe umwandeln → aufsummieren → ausgeben."
      - "`range(1, n + 1)` liefert 1 bis einschließlich n."
      - |
        ```python
        n = int(input("n: "))
        summe = 0
        for k in range(1, n + 1):
            ...
        ```
  - type: predict
    code: |
      x = 0.0
      print(x >= 0 and x < 1, x > 0 or x == 0, not x == 0)
    options: ["True True False", "True False False", "False True True", "True True True"]
    answer: "True True False"
    explanation: |
      `0 >= 0` und `0 < 1` → `True`. Bei `or` reicht `x == 0`. `x == 0` ist `True`, `not` macht `False` daraus.
