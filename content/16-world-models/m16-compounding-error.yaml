      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=300, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      def true_step(s, a):
          q = env.dynamics(s[..., :2], a)
          return np.concatenate([q, env.fk(q)], axis=-1)

      def open_loop_errors(model, s0, U):
          errors = []
          s_model, s_real = s0.copy(), s0.copy()
          for a in U:
              s_model = predict(model, s_model, a)
              s_real = true_step(s_real, a)
              errors.append(np.linalg.norm(s_model[2:] - s_real[2:]))
          return np.array(errors)

      rng = np.random.default_rng(0)
      S, A, S2 = collect(20, 25, rng)
      model = fit_model(S, A, S2, rng)
      s0 = S[0]
      U = np.random.default_rng(1).uniform(-2, 2, (20, 2))
      print(np.round(open_loop_errors(model, s0, U), 3))
    tests:
      - name: Länge und Startwert
        code: |
          e = np.asarray(open_loop_errors(model, S[5], np.zeros((7, 2))))
          assert e.shape == (7,), f"Für 7 Aktionen erwartet 7 Fehlerwerte, bekommen Form {e.shape}"
      - name: Mehrschritt-Fehler stimmen
        code: |
          def _ref(model, s0, U):
              sm, sr, out = s0.copy(), s0.copy(), []
              for a in U:
                  sm, sr = predict(model, sm, a), true_step(sr, a)
                  out.append(np.linalg.norm(sm[2:] - sr[2:]))
              return np.array(out)
          for k, i in enumerate([0, 40, 333]):
              Ut = np.random.default_rng(50 + k).uniform(-2, 2, (15, 2))
              got = np.asarray(open_loop_errors(model, S[i], Ut), dtype=float)
              want = _ref(model, S[i], Ut)
              assert got.shape == want.shape and close(got, want, 1e-6), f"Fehlerverlauf stimmt nicht: erwartet {np.round(want[:4], 4)}…, bekommen {np.round(got[:4], 4)}… – rollt das Modell auf seiner eigenen Vorhersage weiter, und misst du nur die Spitze (Spalten 2, 3)?"
      - name: Fehler wächst über den Horizont
        code: |
          r = np.random.default_rng(9)
          curves = [open_loop_errors(model, S[i], r.uniform(-2, 2, (25, 2))) for i in range(0, 500, 50)]
          mean_curve = np.mean(curves, axis=0)
          assert mean_curve[-1] > 3 * mean_curve[0], f"Im Mittel sollte der Fehler nach 25 Schritten deutlich größer sein als nach 1 Schritt: {mean_curve[0]:.4f} → {mean_curve[-1]:.4f}"
