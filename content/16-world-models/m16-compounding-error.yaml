id: m16-compounding-error
title: Compounding Error – wenn Fehler sich aufschaukeln
minutes: 9
goals:
  - Einschritt- und Mehrschritt-Vorhersage unterscheiden
  - Erklären, warum sich Modellfehler über den Horizont aufsummieren
  - Den Mehrschrittfehler eines gelernten Modells messen und plotten
concepts: [wm-compounding]
steps:
  - type: text
    body: |
      ## Vorhersagen als neue Eingaben

      Beim Training sieht das Modell immer **echte** Zustände: $\hat s_{t+1} = \hat f(s_t, a_t)$.

      Beim Planen rollt es dagegen in **offener Schleife** (open loop) – jede Vorhersage wird zur nächsten Eingabe:

      $$\hat s_{t+1} = \hat f(\hat s_t, a_t)$$

      Für den Fehler $e_t = \hat s_t - s_t$ gilt grob

      $$e_{t+1} \approx \frac{\partial \hat f}{\partial s}\, e_t + \varepsilon_t$$

      Der alte Fehler wird weitergereicht (und evtl. verstärkt), dazu kommt der neue Einschrittfehler $\varepsilon_t$. Außerdem landet $\hat s_t$ in Regionen, für die das Modell nie trainiert wurde. Das nennt man **Compounding Error**.
  - type: example
    heavy: true
    intro: |
      Wir trainieren das Modell aus der letzten Lektion und vergleichen über 30 Schritte (1,5 s) für 50 zufällige Aktionsfolgen: Mehrschritt-Vorhersage gegen Einschritt-Vorhersage (immer vom echten Zustand aus).
    code: |
      import numpy as np
      import lab
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=400, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      def true_step(s, a):
          q = env.dynamics(s[..., :2], a)
          return np.concatenate([q, env.fk(q)], axis=-1)

      rng = np.random.default_rng(0)
      S, A, S2 = collect(40, 25, rng)
      model = fit_model(S, A, S2, rng)

      r = np.random.default_rng(1)
      q0 = r.uniform(-np.pi, np.pi, (50, 2))
      s_true = np.hstack([q0, env.fk(q0)])
      s_multi = s_true.copy()
      U = r.uniform(-2, 2, (30, 50, 2))
      err_multi, err_one, path_true, path_multi = [], [], [], []
      for t in range(30):
          s_one = predict(model, s_true, U[t])
          s_multi = predict(model, s_multi, U[t])
          s_true = true_step(s_true, U[t])
          err_one.append(np.mean(np.linalg.norm(s_one[:, 2:] - s_true[:, 2:], axis=1)))
          err_multi.append(np.mean(np.linalg.norm(s_multi[:, 2:] - s_true[:, 2:], axis=1)))
          path_true.append(s_true[0, 2:])
          path_multi.append(s_multi[0, 2:])

      print(f"Fehler der Spitze nach 1 Schritt: {err_multi[0]:.3f} m, nach 30: {err_multi[-1]:.3f} m")
      fig = lab.Figure(title="Fehler der Spitze", xlabel="Schritt", ylabel="mittlerer Fehler in m")
      fig.line(err_multi, label="Mehrschritt (offene Schleife)")
      fig.line(err_one, label="Einschritt (vom echten Zustand)")
      fig.show()
      scene = lab.Scene(title="Bahn der Spitze: echt vs. Modell", bounds=[-2.2, 2.2, -2.2, 2.2])
      scene.line(path_true, color="good", width=3)
      scene.line(path_multi, color="bad", width=2, dashed=True)
      scene.show()
