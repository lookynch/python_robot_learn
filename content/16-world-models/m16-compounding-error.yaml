  - type: quiz
    question: |
      MBPO (Janner et al. 2019) erzeugt mit einem gelernten Ensemble zusätzliche Trainingsdaten für einen modellfreien Agenten (SAC). Wie hält es den Compounding Error klein?
    options:
      - text: Es rollt das Modell nur wenige Schritte weit, und zwar ausgehend von echten, gesammelten Zuständen.
        correct: true
        why: Kurze, „abzweigende“ Rollouts (branched rollouts) – der Fehler hat keine Zeit, sich aufzuschaukeln, und startet immer von echten Daten.
      - text: Es rollt das Modell möglichst lange, damit sich Fehler im Mittel aufheben.
        correct: false
        why: Fehler heben sich nicht auf – sie wachsen mit dem Horizont, wie im Plot.
      - text: Es trainiert das Modell nur auf einem einzigen Schritt.
        correct: false
        why: Das tun wir auch – und trotzdem driften Mehrschritt-Rollouts.
  - type: quiz
    question: |
      Unser Planer wird mit 10 Schritten Horizont planen. Warum stört der Compounding Error dabei weniger als hier im 30-Schritte-Plot?
    options:
      - text: Bei MPC wird nach jedem echten Schritt vom **gemessenen** Zustand neu geplant – der Fehler wird ständig zurückgesetzt, und der Horizont ist kurz.
        correct: true
        why: Rückkopplung durch Messung ist das wichtigste Gegenmittel gegen Modellfehler.
      - text: Weil CEM die Modellfehler automatisch korrigiert.
        correct: false
        why: CEM optimiert nur im Modell – es weiß nichts von dessen Fehlern.
      - text: Gar nicht – der Fehler ist beim Planen genauso groß wie bei 30 Schritten offener Schleife.
        correct: false
        why: Kurzer Horizont plus Neuplanen ab echtem Zustand verhindern, dass sich der Fehler über 30 Schritte aufbaut.
cards:
  - id: m16-c-open-loop
    concept: wm-compounding
    variants:
      - type: quiz
        question: Was ist der Unterschied zwischen Einschritt- und Mehrschritt-Vorhersage?
        options:
          - text: Mehrschritt füttert die eigene Vorhersage $\hat s_t$ wieder ins Modell, Einschritt startet immer vom echten $s_t$.
            correct: true
            why: Deshalb können sich nur bei Mehrschritt-Vorhersagen Fehler aufsummieren.
          - text: Mehrschritt nutzt ein größeres Netz.
            correct: false
            why: Es ist dasselbe Modell, nur anders benutzt.
          - text: Einschritt sagt $\Delta s$ voraus, Mehrschritt $s'$.
            correct: false
            why: Beide nutzen $\hat f(s, a) = s + g(s, a)$.
      - type: predict
        code: |
          true_s, model_s = 0.0, 0.0
          for t in range(5):
              true_s = true_s + 1.0
              model_s = model_s + 1.2
          print(round(model_s - true_s, 1))
        options: ["1.0", "0.2", "6.0", "1.2"]
        answer: "1.0"
        explanation: Bei einem neutralen System addiert sich der Einschrittfehler 0,2 einfach auf – nach 5 Schritten 1,0.
  - id: m16-c-compounding-mittel
    concept: wm-compounding
    variants:
      - type: quiz
        question: Welche Maßnahme verkleinert den Compounding Error beim Planen am direktesten?
        options:
          - text: Kurzer Planungshorizont und nach jedem Schritt vom gemessenen Zustand neu planen.
            correct: true
            why: So kann sich der Fehler nur über wenige Schritte aufbauen.
          - text: Längerer Planungshorizont.
            correct: false
            why: Mehr Schritte in offener Schleife – mehr Fehler.
          - text: Die Lernrate erhöhen.
            correct: false
            why: Das ändert nicht, dass Vorhersagen als Eingaben weitergereicht werden.
      - type: quiz
        question: Der Mehrschrittfehler wächst schneller als linear. Was ist die wahrscheinlichste Ursache?
        options:
          - text: Das System (bzw. Modell) verstärkt Abweichungen; zusätzlich gerät $\hat s$ in Bereiche ohne Trainingsdaten.
            correct: true
            why: Verstärkungsfaktor $\partial \hat f / \partial s > 1$ und Verteilungsverschiebung lassen den Fehler überproportional wachsen.
          - text: Ein Bug – Fehler wachsen immer genau linear.
            correct: false
            why: Linear nur, wenn sich Fehler bloß addieren; Rückkopplung kann sie verstärken oder dämpfen.
          - text: Rundungsfehler in NumPy.
            correct: false
            why: Viel zu klein, um sichtbare Abweichungen zu erklären.
