    after: |
      Der Einschrittfehler bleibt bei knapp 1 cm. Der Mehrschrittfehler wächst Schritt für Schritt – nach 30 Schritten auf rund 15 cm, obwohl dasselbe Modell benutzt wird. In der Animation: grün die echte Bahn, rot gestrichelt die vorhergesagte.
  - type: predict
    intro: |
      Ein Spielzeugsystem, in dem der Zustand jedes Mal um 10 % wächst. Das Modell macht pro Schritt einen kleinen, festen Fehler von 0,1.
    code: |
      true_s, model_s = 0.0, 0.0
      for t in range(10):
          true_s = 1.1 * true_s + 1.0
          model_s = 1.1 * model_s + 1.1
      print(round(model_s - true_s, 2))
    options: ["1.59", "1.0", "0.1", "0.65"]
    answer: "1.59"
    explanation: |
      Der Fehler folgt $e_{t+1} = 1{,}1\, e_t + 0{,}1$. Nach 10 Schritten ist er $0{,}1 \cdot (1{,}1^{10} - 1)/0{,}1 \approx 1{,}59$ – mehr als zehnmal der Einschrittfehler, weil alte Fehler mitwachsen. (0,65 wäre es bei einem dämpfenden System mit Faktor 0,9.)
  - type: explain
    question: |
      Warum ist der Mehrschrittfehler oft größer als (Einschrittfehler) × (Anzahl Schritte)?
    options:
      - text: Fehlerhafte Vorhersagen werden zu Eingaben; das Modell rechnet von falschen und oft ungewohnten Zuständen aus weiter, wo es zusätzlich ungenauer ist.
        correct: true
        why: Zwei Effekte – Weitergabe/Verstärkung alter Fehler und Verteilungsverschiebung (distribution shift) der Eingaben.
      - text: Weil das Modell bei jedem Aufruf zufällig ein wenig anders rechnet.
        correct: false
        why: Unser MLP ist deterministisch – gleiche Eingabe, gleiche Ausgabe.
      - text: Weil Rundungsfehler von NumPy sich aufsummieren.
        correct: false
        why: Gleitkomma-Rundung liegt bei etwa $10^{-16}$ – viel zu klein, um Zentimeter-Fehler zu erklären.
  - type: exercise
    mode: make
    heavy: true
