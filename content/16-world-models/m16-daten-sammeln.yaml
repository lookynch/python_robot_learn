id: m16-daten-sammeln
title: Daten sammeln mit Zufallsaktionen
minutes: 8
goals:
  - Einen Zustand $s = [q_1, q_2, x, y]$ für das Modell festlegen
  - Übergänge $(s, a, s')$ mit Zufallsaktionen in Arrays sammeln
  - Abdeckung des Zustandsraums und saubere Validierungsdaten beurteilen
concepts: [wm-datensatz]
steps:
  - type: text
    body: |
      ## Was soll das Modell kennen?

      `Reacher2D` liefert die Gelenkwinkel $q = (q_1, q_2)$ in rad, Aktion $a$ = Gelenkgeschwindigkeiten in rad/s (begrenzt auf ±2).

      Für unser Modell wählen wir als **Zustand**

      $$s = [q_1,\ q_2,\ x,\ y]$$

      also Winkel **plus gemessene Position der Spitze** in m (wie mit einer Kamera oder einem Marker). Das Modell soll selbst lernen, wie Aktionen die Spitze bewegen – Vorwärtskinematik bekommt es nicht verraten.

      Ein Datensatz besteht aus drei Arrays gleicher Länge: `S` (Zustände), `A` (Aktionen), `S2` (Folgezustände).
  - type: example
    code: |
      import numpy as np
      import lab
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      rng = np.random.default_rng(0)
      S, A, S2 = [], [], []
      for episode in range(20):
          env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
          s = observe(env)
          for t in range(25):
              a = rng.uniform(-2, 2, 2)
              env.step(a)
              s2 = observe(env)
              S.append(s)
              A.append(a)
              S2.append(s2)
              s = s2
      S, A, S2 = np.array(S), np.array(A), np.array(S2)
      print(S.shape, A.shape, S2.shape)
      lab.scatter(S[:, 2], S[:, 3], title="Gesehene Positionen der Spitze", xlabel="x in m", ylabel="y in m")
    subgoals:
      - lines: [7, 8]
        label: Zustand definieren
      - lines: [12, 14]
        label: Episode mit zufälligem Start beginnen
      - lines: [15, 22]
        label: Zufallsaktion ausführen und Übergang speichern
      - lines: [23, 25]
        label: In Arrays umwandeln und Abdeckung prüfen
    after: |
      500 Übergänge aus 20 kurzen Episoden. Die Punktwolke zeigt, **wo** das Modell später Daten gesehen hat – dort kann es gut sein, anderswo nicht.
  - type: predict
    code: |
      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)
      rng = np.random.default_rng(0)
      S, A = [], []
      for episode in range(3):
          env.reset(q=(0.0, 0.0), goal=(1.0, 1.0))
          for t in range(4):
              a = rng.uniform(-2, 2, 2)
              S.append(np.concatenate([env.q, env.fk(env.q)]))
              A.append(a)
              env.step(a)
      print(np.array(S).shape, np.array(A).shape)
    options:
      - "(12, 4) (12, 2)"
      - "(3, 4) (3, 2)"
      - "(4, 12) (2, 12)"
      - "(12, 2) (12, 2)"
    answer: "(12, 4) (12, 2)"
    explanation: |
      3 Episoden × 4 Schritte = 12 Übergänge. Jede Zeile von `S` hat 4 Einträge ($q_1, q_2, x, y$), jede Zeile von `A` 2.
  - type: explain
    question: |
      Warum startet jede Episode in einer **zufälligen** Stellung, statt eine lange Episode ab $q = (0, 0)$ zu fahren?
    options:
      - text: Zufallsaktionen bewegen den Arm kaum vom Start weg; zufällige Starts verteilen die Daten über den ganzen Zustandsraum.
        correct: true
        why: Zufallsaktionen mitteln sich weg – der Arm „zittert“ um den Start. Ohne breite Abdeckung kennt das Modell nur eine kleine Region.
      - text: Weil `env.reset` sonst einen Fehler wirft.
        correct: false
        why: "`reset(q=(0, 0))` funktioniert problemlos – es geht um die Verteilung der Daten."
      - text: Damit die Übergänge innerhalb einer Episode unabhängig voneinander sind.
        correct: false
        why: Innerhalb einer Episode bleiben aufeinanderfolgende Übergänge stark korreliert, egal wo sie startet.
      - text: Weil ein neuronales Netz nur Daten aus kurzen Episoden lernen kann.
        correct: false
        why: Das Netz sieht nur einzelne Übergänge – wie lang die Episoden waren, ist ihm egal.
  - type: fill
    fading: true
    prompt: |
      Ergänze die Lücken, sodass jeder Übergang korrekt gespeichert wird und die Episode vom **neuen** Zustand aus weiterläuft.
    code: |
