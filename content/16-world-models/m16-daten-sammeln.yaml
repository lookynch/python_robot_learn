  - type: quiz
    question: |
      Du willst prüfen, wie gut dein Modell auf **neuen** Daten ist. Welche Validierungsdaten sind am aussagekräftigsten?
    options:
      - text: Eigene Episoden, die nicht zum Training benutzt werden.
        correct: true
        why: Aufeinanderfolgende Übergänge einer Episode sind fast gleich. Nur getrennte Episoden zeigen echte Verallgemeinerung.
      - text: Jeder zweite Übergang aus denselben Episoden.
        correct: false
        why: Der Nachbar-Übergang ist im Training enthalten und fast identisch – der Validierungsfehler wird zu optimistisch.
      - text: Die Trainingsdaten selbst, wenn man lange genug trainiert.
        correct: false
        why: Der Trainingsfehler sagt nichts über Overfitting (Modul 12).
cards:
  - id: m16-c-datensatz-form
    concept: wm-datensatz
    variants:
      - type: quiz
        question: Du sammelst 8 Episoden mit je 30 Schritten, Zustand $s \in \mathbb{R}^4$, Aktion $a \in \mathbb{R}^2$. Welche Form hat `A`?
        options:
          - text: "`(240, 2)`"
            correct: true
            why: 8 · 30 = 240 Übergänge, je 2 Aktionswerte.
          - text: "`(8, 2)`"
            correct: false
            why: Gespeichert wird jeder Schritt, nicht jede Episode.
          - text: "`(240, 4)`"
            correct: false
            why: Das wäre die Form von `S` oder `S2`.
      - type: quiz
        question: 5 Episoden mit je 40 Schritten, Zustand mit 4 Einträgen. Welche Form hat `S2`?
        options:
          - text: "`(200, 4)`"
            correct: true
            why: 5 · 40 = 200 Folgezustände mit je 4 Einträgen.
          - text: "`(201, 4)`"
            correct: false
            why: Pro Übergang gibt es genau einen Folgezustand – das „+1“ gilt nur für einen einzelnen Rollout mit Startzustand.
          - text: "`(5, 40)`"
            correct: false
            why: Die Übergänge werden flach gespeichert, ein Übergang pro Zeile.
  - id: m16-c-abdeckung
    concept: wm-datensatz
    variants:
      - type: quiz
        question: Alle Trainingsdaten stammen aus Stellungen mit $|q_1| < 1$ rad. Wo ist dein Modell vermutlich unzuverlässig?
        options:
          - text: Bei $q_1 \approx 2{,}5$ rad.
            correct: true
            why: Dort lagen keine Daten – das Netz extrapoliert, und das geht meist schief.
          - text: Bei $q_1 \approx 0$ rad.
            correct: false
            why: Mitten in den Trainingsdaten ist das Modell am besten.
          - text: Nirgends, ein neuronales Netz verallgemeinert überall gleich gut.
            correct: false
            why: Netze interpolieren gut, extrapolieren aber schlecht.
      - type: quiz
        question: Warum liegen die Daten nach einer langen Zufallsepisode ab $q = (0, 0)$ fast alle nahe beim Start?
        options:
          - text: Unabhängige Zufallsaktionen heben sich im Mittel auf; der Arm macht nur eine kleine Irrfahrt.
            correct: true
            why: Die Auslenkung wächst bei einer Irrfahrt nur mit $\sqrt{T}$.
          - text: Weil `Reacher2D` den Arm automatisch zurückstellt.
            correct: false
            why: Die Umgebung setzt nur bei `reset` zurück.
          - text: Weil die Aktionen auf ±2 rad/s begrenzt sind und der Arm sich deshalb nicht bewegt.
            correct: false
            why: Mit 2 rad/s käme der Arm in 1,6 s halb herum – wenn die Aktionen in eine Richtung zeigten.
