    blanks:
      - answer: s
        options: [s, s2, env.q]
      - answer: s2
        options: [s2, s, "s + s2"]
    tests:
      - name: Übergänge verändern den Zustand
        code: |
          assert np.all(np.abs(S2 - S).sum(axis=1) > 0), "S und S2 sind teilweise gleich – wird vielleicht der Folgezustand als Zustand gespeichert?"
      - name: Episode läuft weiter
        code: |
          for e in range(2):
              assert close(S[e * 5 + 1:(e + 1) * 5], S2[e * 5:(e + 1) * 5 - 1]), "Innerhalb einer Episode muss der Zustand eines Übergangs der Folgezustand des vorherigen sein."
    explanation: |
      `env.q` wäre beim Speichern schon der **neue** Winkel (der Schritt ist ausgeführt) – und ohne `.copy()` würde die Liste nur Verweise auf dasselbe Array enthalten.
