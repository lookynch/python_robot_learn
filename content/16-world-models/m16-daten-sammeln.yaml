    solution: |
      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s)
                  A.append(a)
                  S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      S, A, S2 = collect(4, 10, np.random.default_rng(0))
      print(S.shape, A.shape, S2.shape)
    tests:
      - name: Formen
        code: |
          S_, A_, S2_ = collect(3, 5, np.random.default_rng(7))
          assert np.shape(S_) == (15, 4) and np.shape(A_) == (15, 2) and np.shape(S2_) == (15, 4), f"Für 3 Episoden × 5 Schritte erwartet (15, 4), (15, 2), (15, 4), bekommen {np.shape(S_)}, {np.shape(A_)}, {np.shape(S2_)}"
      - name: Übergänge passen zur Physik
        code: |
          S_, A_, S2_ = collect(3, 5, np.random.default_rng(7))
          assert close(S2_[:, :2], S_[:, :2] + np.clip(A_, -2, 2) * 0.05), "S2 muss der Zustand NACH der Aktion A aus Zustand S sein."
          assert close(S_[:, 2:], env.fk(S_[:, :2])), "Die Spalten 3–4 von S müssen die Position der Spitze sein – nutze observe(env)."
      - name: Episoden laufen weiter
        code: |
          S_, A_, S2_ = collect(3, 5, np.random.default_rng(7))
          for e in range(3):
              assert close(S_[e * 5 + 1:(e + 1) * 5], S2_[e * 5:(e + 1) * 5 - 1]), "Innerhalb einer Episode muss jeder Zustand der Folgezustand des vorherigen Übergangs sein (s = s2 vergessen?)."
      - name: Zufällige Starts
        code: |
          S_, A_, S2_ = collect(6, 3, np.random.default_rng(7))
          starts = S_[::3, :2]
          assert np.ptp(starts[:, 0]) > 1.0 and np.ptp(starts[:, 1]) > 1.0, f"Die Startwinkel sollten zufällig in [-pi, pi] liegen, bekommen {starts}"
          assert np.all(np.abs(starts) <= np.pi + 1e-9), "Startwinkel außerhalb von [-pi, pi]."
      - name: Zufallsaktionen in beide Richtungen
        code: |
          S_, A_, S2_ = collect(5, 20, np.random.default_rng(7))
          assert A_.min() < -1.5 and A_.max() > 1.5 and np.all(np.abs(A_) <= 2), f"Aktionen sollen gleichverteilt in [-2, 2] sein, Bereich ist [{A_.min():.2f}, {A_.max():.2f}]"
