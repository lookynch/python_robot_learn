    explanation: |
      Nach einer einzigen zusätzlichen Episode trifft der Arm hier meist schon. Insgesamt hat der Agent 280 echte Übergänge gebraucht – das sind 14 s Roboterzeit. Modellfreie Verfahren wie Actor-Critic brauchen für vergleichbare Aufgaben typischerweise ein Vielfaches davon.
  - type: quiz
    question: |
      In Modul 14 hast du Dyna-Q kennengelernt. Was hat diese Lernschleife damit gemeinsam?
    options:
      - text: Beide lernen aus echten Erfahrungen ein Modell und nutzen es zum Planen; neue Erfahrungen verbessern das Modell laufend.
        correct: true
        why: Dyna-Q nutzt ein Tabellenmodell für simulierte Q-Updates, hier plant MPC mit einem Netz – die Grundidee ist dieselbe.
      - text: Beide lernen eine Q-Tabelle.
        correct: false
        why: Unsere Schleife lernt keine Wertfunktion, nur das Dynamikmodell.
      - text: Beide brauchen kein Modell der Umgebung.
        correct: false
        why: Gerade das Modell ist der gemeinsame Kern.
  - type: quiz
    question: |
      Nach 4 Iterationen trifft der Arm das Ziel $(-0{,}6,\ 1{,}3)$. Du gibst ein Ziel auf der **anderen** Seite vor, z. B. $(0{,}3,\ -1{,}5)$. Was erwartest du?
    options:
      - text: Wahrscheinlich klappt es nicht sofort – dort liegen kaum Daten; nach ein, zwei weiteren Iterationen schon.
        correct: true
        why: Die Daten sind dorthin gewachsen, wo der Planer für das **alte** Ziel hinwollte. Neue Regionen brauchen neue Daten.
      - text: Es klappt sicher, das Modell kennt jetzt die Physik des Arms.
        correct: false
        why: Das Modell ist nur in abgedeckten Regionen verlässlich – Netze extrapolieren schlecht.
      - text: Es klappt nie, weil das Modell auf das alte Ziel trainiert wurde.
        correct: false
        why: Das Modell lernt die Dynamik, nicht das Ziel. Mit Daten aus der neuen Region funktioniert es.
cards:
  - id: m16-c-schleife
    concept: wm-iteration
    variants:
      - type: quiz
        question: In welcher Reihenfolge läuft eine Iteration der modellbasierten Lernschleife?
        options:
          - text: Modell trainieren → mit dem Modell planen und handeln → neue Übergänge zu den Daten hinzufügen
            correct: true
            why: Danach beginnt die nächste Iteration mit mehr (und relevanteren) Daten.
          - text: Planen → Modell trainieren → Daten löschen
            correct: false
            why: Ohne Modell kann man nicht planen, und gelöschte Daten fehlen später.
          - text: Daten sammeln → planen → nie wieder trainieren
            correct: false
            why: Dann bleiben die Modellfehler in neuen Regionen bestehen.
      - type: quiz
        question: Warum ersetzt man die alten Daten nicht einfach durch die neuen?
        options:
          - text: Das Modell würde vergessen, was es über andere Regionen wusste – und mit 40 Übergängen ist es schlecht trainiert.
            correct: true
            why: Daten werden gesammelt, nicht ausgetauscht (wie ein Replay Buffer).
          - text: Weil `np.vstack` nur anhängen kann.
            correct: false
            why: Das ist kein inhaltlicher Grund – ersetzen ginge technisch problemlos.
          - text: Weil neue Daten schlechter sind als Zufallsdaten.
            correct: false
            why: Neue Daten aus MPC-Episoden sind für die Aufgabe meist **besonders** wertvoll.
  - id: m16-c-abdeckung-planer
    concept: wm-iteration
    variants:
      - type: quiz
        question: Woher kommen in der Lernschleife die wertvollsten neuen Daten?
        options:
          - text: Aus Episoden, die mit dem aktuellen Planer gefahren wurden.
            correct: true
            why: Sie liegen dort, wo der Planer hinwill – genau dort muss das Modell genau sein.
          - text: Aus weiteren Zufallsaktionen am Start.
            correct: false
            why: Die decken nur die schon bekannte Region ab.
          - text: Aus Vorhersagen des Modells selbst.
            correct: false
            why: Modellvorhersagen sind keine echten Daten – das Modell würde seine eigenen Fehler lernen.
      - type: quiz
        question: Iteration 0 verfehlt das Ziel um 1,6 m, Iteration 1 nur noch um 8 cm. Was hat sich zwischen den Iterationen geändert?
        options:
          - text: Das Modell wurde zusätzlich mit den 40 Übergängen der ersten MPC-Episode trainiert.
            correct: true
            why: Diese Übergänge decken die Region zwischen Start und Ziel ab.
          - text: CEM hat mehr Iterationen bekommen.
            correct: false
            why: Planer-Einstellungen bleiben gleich – nur die Daten wachsen.
          - text: Das Ziel wurde verschoben.
            correct: false
            why: Das Ziel bleibt fest bei (−0,6, 1,3) m.
