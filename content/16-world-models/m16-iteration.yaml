id: m16-iteration
title: Die Lernschleife – Daten, Training, Planen, mehr Daten
minutes: 10
goals:
  - Erkennen, warum ein Modell aus wenigen Zufallsdaten beim Planen versagt
  - Die Schleife Daten → Training → Planen → neue Daten implementieren
  - Den Lernfortschritt über Iterationen messen
concepts: [wm-iteration]
steps:
  - type: text
    body: |
      ## Daten dort sammeln, wo der Planer hinwill

      Bisher hattest du 1000 Zufallsübergänge aus dem **ganzen** Zustandsraum. Ein echter Roboter startet aber meist in derselben Stellung – Zufallsaktionen decken dann nur die Umgebung des Starts ab.

      Plant man mit so einem Modell, führt der Plan in Regionen ohne Daten – dort irrt das Modell, und der Arm verfehlt das Ziel. Die Lösung ist eine Schleife:

      1. Startdaten sammeln (zufällig, wenig).
      2. Modell trainieren.
      3. Mit MPC auf dem Modell eine Episode fahren – **diese Übergänge speichern**.
      4. Zu den Daten hinzufügen, zurück zu 2.

      So wächst der Datensatz genau dort, wo der Planer ihn braucht. Das ist der Kern von PETS und vielen modellbasierten RL-Verfahren.
  - type: example
    heavy: true
    intro: |
      Iteration 0: nur 120 Zufallsübergänge mit Startwinkeln in $[-0{,}3, 0{,}3]$ rad. Ziel bei $(-0{,}6,\ 1{,}3)$ m – dafür muss sich das erste Gelenk um über 1,5 rad drehen.
    code: |
      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng, q_range=np.pi):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-q_range, q_range, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=300, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      def rollout_cost(model, s, U, goal):
          S = np.tile(s, (len(U), 1))
          cost = np.zeros(len(U))
          for t in range(U.shape[1]):
              S = predict(model, S, U[:, t])
              cost += np.linalg.norm(S[:, 2:] - goal, axis=1)
          return cost

      def cem_plan(model, s, goal, mu, rng, n=100, n_elite=10, iters=3):
          sd = np.ones_like(mu)
          for _ in range(iters):
              U = np.clip(mu + sd * rng.standard_normal((n,) + mu.shape), -2, 2)
              elite = U[np.argsort(rollout_cost(model, s, U, goal))[:n_elite]]
              mu, sd = elite.mean(axis=0), elite.std(axis=0) + 0.05
          return mu

      def run_mpc(model, goal, rng, steps=40, horizon=10):
          env.reset(q=(0.0, 0.0), goal=goal)
          S, A, S2, mu = [], [], [], np.zeros((horizon, 2))
          for _ in range(steps):
              s = observe(env)
              mu = cem_plan(model, s, goal, mu, rng)
              env.step(mu[0])
              S.append(s); A.append(mu[0]); S2.append(observe(env))
              mu = np.vstack([mu[1:], mu[-1:]])
          return np.array(S), np.array(A), np.array(S2)

      rng = np.random.default_rng(0)
      goal = np.array([-0.6, 1.3])
      S, A, S2 = collect(8, 15, rng, q_range=0.3)
      model = fit_model(S, A, S2, rng)
      Sn, An, S2n = run_mpc(model, goal, rng)
      print(f"Iteration 0: Endabstand {np.linalg.norm(S2n[-1, 2:] - goal):.2f} m")
      print(f"q1 in den Daten: {S[:, 0].min():.2f} bis {S[:, 0].max():.2f} rad")
      env.render(np.vstack([Sn[:1, :2], S2n[:, :2]]), title="Iteration 0: Modell aus Zufallsdaten")
    subgoals:
      - lines: [72, 81]
        label: MPC-Episode fahren und Übergänge mitschreiben
      - lines: [83, 86]
        label: Wenig Startdaten sammeln und trainieren
      - lines: [87, 90]
        label: Planen und Ergebnis prüfen
    after: |
      Der Arm verfehlt das Ziel deutlich: Das Modell kennt nur $q_1$ zwischen etwa −0,3 und 0,4 rad. Aber `run_mpc` gibt jetzt die gefahrenen Übergänge zurück – **genau aus der Region, in die der Planer wollte**.
  - type: explain
    question: |
      Warum hilft es, gerade die Übergänge einer **misslungenen** MPC-Episode zum Training hinzuzufügen?
    options:
      - text: Sie stammen aus Zuständen und Aktionen, die der Planer für gut hielt – also genau dort, wo das Modell falsch lag und wo es für die Aufgabe genau sein muss.
        correct: true
        why: Der Planer „zeigt“ auf die Modellfehler, die ihn in die Irre geführt haben. Neue Daten korrigieren sie gezielt.
      - text: Weil misslungene Episoden eine negative Belohnung haben, aus der das Modell lernt.
        correct: false
        why: Das Dynamikmodell lernt keine Belohnungen, sondern $s' $ aus $(s, a)$ – egal, ob die Episode gut oder schlecht war.
      - text: Weil mehr Daten immer gleich viel helfen, egal woher sie kommen.
        correct: false
        why: Weitere Zufallsdaten nahe dem Start würden kaum helfen – entscheidend ist die Abdeckung der relevanten Region.
  - type: fill
    fading: true
    prompt: |
      Die Schleife als Gerüst mit Platzhalter-Funktionen. Ergänze sie so, dass der Datensatz von 2 auf 5 auf 8 Übergänge wächst.
    code: |
      def collect_random():
          return ["z1", "z2"]

      def train(data):
          print("trainiere auf", len(data), "Übergängen")
          return "modell"

      def plan_and_act(model):
          return ["neu1", "neu2", "neu3"]

      data = collect_random()
      for it in range(3):
          model = ___(data)
          new = ___(model)
          data = data + ___
    blanks:
      - answer: train
        options: [train, plan_and_act, collect_random]
      - answer: plan_and_act
        options: [plan_and_act, train, collect_random]
      - answer: new
        options: [new, data, model]
    expect_output: |
      trainiere auf 2 Übergängen
      trainiere auf 5 Übergängen
      trainiere auf 8 Übergängen
  - type: exercise
    mode: make
    heavy: true
    prompt: |
