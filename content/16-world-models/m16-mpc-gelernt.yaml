id: m16-mpc-gelernt
title: "Capstone: Planen auf dem gelernten Modell"
minutes: 10
goals:
  - CEM-MPC aus Modul 11 mit dem gelernten Modell statt der wahren Dynamik betreiben
  - Eine vektorisierte Kostenfunktion für viele Aktionsfolgen im Modell schreiben
  - Den Arm sichtbar zum Ziel steuern und Modellausnutzung erkennen
concepts: [wm-mpc-gelernt, wm-modell-ausnutzung]
steps:
  - type: text
    body: |
      ## Alles zusammen

      Der Planer aus Modul 11 bleibt fast gleich – nur `env.dynamics` wird durch `predict(model, …)` ersetzt:

      1. Ziehe $N = 100$ Aktionsfolgen der Länge $H = 10$ um den Mittelwert $\mu$.
      2. Rolle **alle gleichzeitig** im gelernten Modell aus. Kosten = Summe der Abstände der **vorhergesagten** Spitze $(\hat x, \hat y)$ zum Ziel über den Horizont.
      3. Die 10 besten (Elite) bestimmen neues $\mu$ und $\sigma$; 3 Iterationen.
      4. Führe nur die **erste** Aktion am echten Arm aus, miss den neuen Zustand, plane neu (MPC).

      Das Modell hat nie FK gesehen – es hat aus 1000 Zufallsübergängen gelernt, wie Gelenkgeschwindigkeiten die Spitze bewegen.
  - type: example
    heavy: true
    code: |
      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=400, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      def rollout_cost(model, s, U, goal):
          S = np.tile(s, (len(U), 1))
          cost = np.zeros(len(U))
          for t in range(U.shape[1]):
              S = predict(model, S, U[:, t])
              cost += np.linalg.norm(S[:, 2:] - goal, axis=1)
          return cost

      def cem_plan(model, s, goal, mu, rng, n=100, n_elite=10, iters=3):
          sd = np.ones_like(mu)
          for _ in range(iters):
              U = np.clip(mu + sd * rng.standard_normal((n,) + mu.shape), -2, 2)
              elite = U[np.argsort(rollout_cost(model, s, U, goal))[:n_elite]]
              mu, sd = elite.mean(axis=0), elite.std(axis=0) + 0.05
          return mu

      def run_mpc(model, goal, rng, steps=40, horizon=10):
          env.reset(q=(0.0, 0.0), goal=goal)
          qs, mu = [env.q.copy()], np.zeros((horizon, 2))
          for _ in range(steps):
              mu = cem_plan(model, observe(env), goal, mu, rng)
              env.step(mu[0])
              qs.append(env.q.copy())
              mu = np.vstack([mu[1:], mu[-1:]])
          return np.array(qs)

      rng = np.random.default_rng(0)
      S, A, S2 = collect(40, 25, rng)
      model = fit_model(S, A, S2, rng)
      goal = np.array([-1.0, 0.8])
      qs = run_mpc(model, goal, rng)
      print(f"Endabstand zum Ziel: {np.linalg.norm(env.fk(qs[-1]) - goal):.3f} m")
      env.render(qs, title="CEM-MPC auf dem gelernten Modell")
