    after: |
      Nach etwa 20 Schritten (1 s) ist die Spitze am Ziel und bleibt dort auf wenige Zentimeter genau. Die Zeile `mu = np.vstack([mu[1:], mu[-1:]])` ist der **Warmstart**: Der Rest des alten Plans wird zum Startpunkt der nächsten Suche.
  - type: explain
    question: |
      Das Modell hat Einschrittfehler von etwa 1 cm, und 10 Schritte offene Schleife driften noch mehr. Warum landet der Arm trotzdem auf wenige Zentimeter genau am Ziel?
    options:
      - text: MPC misst nach jedem Schritt den echten Zustand und plant neu; Fehler wirken nur kurz, und nahe am Ziel sind die nötigen Bewegungen klein.
        correct: true
        why: Rückkopplung macht Planen robust gegen Modellfehler – derselbe Grund, aus dem ein P-Regler mit grobem Modell funktioniert.
      - text: CEM findet die exakt optimale Aktionsfolge, Modellfehler spielen dann keine Rolle.
        correct: false
        why: CEM optimiert im Modell. Eine im Modell optimale Folge ist in der Realität nur so gut wie das Modell.
      - text: Weil das Modell während des Planens weiter lernt.
        correct: false
        why: Hier wird das Modell nur einmal vorher trainiert. Nachtrainieren kommt in der nächsten Lektion.
