    explanation: |
      Wenn du nur den Abstand **am Ende** des Horizonts zählst, funktioniert der Planer oft auch – aber er hat keinen Grund, schnell zum Ziel zu fahren. Die Summe über alle Schritte belohnt kurze Wege.
  - type: quiz
    question: |
      `cem_plan` beschneidet die Stichproben mit `np.clip(…, -2, 2)`. Warum ist das beim **gelernten** Modell besonders wichtig?
    options:
      - text: Das Modell hat nur Aktionen in $[-2, 2]$ gesehen. Außerhalb könnte CEM Aktionen finden, die nur im Modell gut aussehen – Modellausnutzung.
        correct: true
        why: Optimierer suchen gezielt die Stellen, an denen das Modell zu optimistisch irrt; ungesehene Eingaben sind dafür ideal.
      - text: Weil NumPy sonst einen Überlauf meldet.
        correct: false
        why: Zahlen wie 5 oder −7 sind für NumPy kein Problem.
      - text: Damit CEM schneller konvergiert.
        correct: false
        why: Das Clipping dient der Gültigkeit der Aktionen und dem Schutz vor Extrapolation, nicht der Geschwindigkeit.
  - type: quiz
    question: |
      Du willst ein **neues** Ziel anfahren. Was musst du ändern?
    options:
      - text: Nur `goal` in der Kostenfunktion – das Modell bleibt, wie es ist.
        correct: true
        why: Das World Model beschreibt die Physik, nicht die Aufgabe. Ein großer Vorteil gegenüber einer Policy, die für ein Ziel trainiert wurde.
      - text: Neue Daten sammeln und das Modell neu trainieren.
        correct: false
        why: Die Dynamik des Arms hängt nicht vom Ziel ab – solange das Ziel in einer Region mit Daten liegt.
      - text: Den Planungshorizont auf die Entfernung zum Ziel anpassen.
        correct: false
        why: MPC plant in jedem Schritt neu; ein fester Horizont von 10 Schritten genügt.
cards:
  - id: m16-c-mpc-gelernt
    concept: wm-mpc-gelernt
    variants:
      - type: quiz
        question: Was unterscheidet CEM-MPC auf dem gelernten Modell von CEM-MPC aus Modul 11?
        options:
          - text: Nur die Funktion, mit der die Aktionsfolgen ausgerollt werden – `predict` statt `env.dynamics`.
            correct: true
            why: Der Algorithmus bleibt gleich; das Modell ist austauschbar.
          - text: CEM wählt beim gelernten Modell die schlechtesten Folgen als Elite.
            correct: false
            why: Die Elite sind immer die Folgen mit den niedrigsten Kosten.
          - text: Beim gelernten Modell wird die ganze Folge ausgeführt, nicht nur die erste Aktion.
            correct: false
            why: Gerade beim ungenauen Modell ist Neuplanen nach jedem Schritt wichtig.
      - type: quiz
        question: Warum führt MPC nur die **erste** Aktion des Plans aus?
        options:
          - text: Danach wird vom echt gemessenen Zustand neu geplant – Modellfehler und Störungen werden so laufend korrigiert.
            correct: true
            why: Receding Horizon = Rückkopplung.
          - text: Weil die übrigen Aktionen meist außerhalb von $[-2, 2]$ liegen.
            correct: false
            why: Alle Aktionen werden beschnitten.
          - text: Um Rechenzeit zu sparen.
            correct: false
            why: Neuplanen kostet sogar mehr Rechenzeit.
  - id: m16-c-exploitation
    concept: wm-modell-ausnutzung
    variants:
      - type: quiz
        question: Ein Planer findet im Modell einen Weg mit fast null Kosten, am echten Arm ist er schlecht. Wie heißt das Phänomen?
        options:
          - text: Modellausnutzung (Model Exploitation)
            correct: true
            why: Der Optimierer hat einen Fehler des Modells gefunden und ausgenutzt.
          - text: Overfitting des Planers
            correct: false
            why: Der Planer lernt keine Parameter – das Problem liegt im Modell.
          - text: Exploration
            correct: false
            why: Exploration ist gewolltes Ausprobieren in der echten Welt.
      - type: quiz
        question: Welche Maßnahme hilft **nicht** gegen Modellausnutzung?
        options:
          - text: Mehr CEM-Iterationen, damit der Planer noch besser im Modell optimiert.
            correct: true
            why: Besser optimieren heißt auch, Modellfehler noch zielsicherer zu finden.
          - text: Aktionen auf den Bereich der Trainingsdaten beschränken.
            correct: false
            why: Das hilft – das Modell extrapoliert dann weniger.
          - text: Ensemble-Kosten über mehrere Modelle mitteln (wie PETS).
            correct: false
            why: Das hilft – ein Fehler einzelner Modelle zählt dann weniger.
