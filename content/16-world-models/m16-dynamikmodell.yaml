      [[-1. -1.]
       [ 1.  1.]]
    explanation: |
      Jede **Spalte** wird für sich normalisiert (`axis 0`): Mittelwerte 1 und 20, Standardabweichungen 1 und 10. Danach haben beide Spalten Mittelwert 0 und Streuung 1 – egal, wie groß sie vorher waren.
