      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=400, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          losses = []
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
              losses.append(np.sum((out - Y) ** 2) / len(X))
          return p, losses

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p, losses = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      rng = np.random.default_rng(0)
      S, A, S2 = collect(40, 25, rng)
      model = fit_model(S, A, S2, rng)
      Sv, Av, S2v = collect(10, 25, np.random.default_rng(99))
      print("Validierungs-MSE:", np.mean(np.sum((predict(model, Sv, Av) - S2v) ** 2, axis=1)))
    tests:
      - name: Modell hat die erwarteten Schlüssel
        code: |
          assert isinstance(model, dict), f"fit_model soll ein Dict zurückgeben, bekommen {type(model).__name__}"
          missing = [k for k in ("p", "mx", "sx", "my", "sy") if k not in model]
          assert not missing, f"Im Modell fehlen die Schlüssel {missing}"
      - name: Vorhersage funktioniert für viele Zustände auf einmal
        code: |
          St, At, S2t = collect(4, 25, np.random.default_rng(123))
          P = predict(model, St, At)
          assert np.shape(P) == (100, 4), f"predict(model, S, A) sollte Form (100, 4) liefern, bekommen {np.shape(P)}"
      - name: Validierungsfehler unter Schwelle
        code: |
          St, At, S2t = collect(10, 25, np.random.default_rng(123))
          mse = np.mean(np.sum((predict(model, St, At) - S2t) ** 2, axis=1))
          assert mse < 6e-4, f"Validierungs-MSE ist {mse:.2e}, sollte unter 6e-4 liegen. Werden die Ziele als Differenz S2 - S gebildet und normalisiert?"
      - name: Deutlich besser als 'nichts ändert sich'
        code: |
          St, At, S2t = collect(10, 25, np.random.default_rng(321))
          mse = np.mean(np.sum((predict(model, St, At) - S2t) ** 2, axis=1))
          ref = np.mean(np.sum((St - S2t) ** 2, axis=1))
          assert mse < 0.05 * ref, f"Modellfehler {mse:.2e} ist nicht mindestens 20-mal kleiner als die Referenz s' = s ({ref:.2e})."
