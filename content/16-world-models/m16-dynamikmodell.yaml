    expect_output: "[2.6 2.8]"
    explanation: |
      $\Delta s = [1, -1] \cdot [0{,}1, 0{,}2] + [0{,}5, 0] = [0{,}6, -0{,}2]$, also $s' = [2{,}6,\ 2{,}8]$. Ohne `s +` hättest du nur die Änderung, mit `sx` die Statistik der **Eingaben** statt der Ziele.
