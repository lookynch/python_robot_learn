id: m16-dynamikmodell
title: Das Dynamikmodell trainieren
minutes: 10
goals:
  - Ein MLP die Änderung $\Delta s = s' - s$ vorhersagen lassen
  - Ein- und Ausgaben normalisieren und beim Vorhersagen zurückrechnen
  - Den Validierungsfehler mit einer einfachen Referenz („nichts ändert sich“) vergleichen
concepts: [wm-delta-vorhersage, wm-normalisierung]
steps:
  - type: text
    body: |
      ## Δs statt s′

      Der nächste Zustand liegt fast beim aktuellen: In 0,05 s ändert sich ein Winkel um höchstens 0,1 rad. Ein Netz, das $s'$ direkt ausgibt, müsste vor allem lernen, $s$ zu kopieren. Einfacher ist

      $$\hat f(s, a) = s + g_\theta(s, a)$$

      Das MLP $g_\theta$ (1 Hidden Layer, 32 tanh-Units) sagt nur die **Änderung** $\Delta s$ vorher.

      **Normalisierung:** Eingaben (Winkel bis ±π rad, Aktionen bis ±2 rad/s) und Ziele ($\Delta q$ nur ±0,1 rad) haben sehr verschiedene Größen. Wir bringen beide mit Mittelwert $\mu$ und Standardabweichung $\sigma$ der **Trainingsdaten** auf Skala 1 – und rechnen die Ausgabe danach zurück:

      $$\Delta s = \text{out} \cdot \sigma_y + \mu_y$$
  - type: example
    heavy: true
    intro: |
      Das komplette Training: Daten sammeln (wie in der letzten Lektion), Netz mit Adam trainieren, auf **neuen** Episoden prüfen. Die Bausteine – MLP, Backprop, Adam – kennst du aus Modul 12.
    code: |
      import numpy as np
      import lab
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=400, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          losses = []
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
              losses.append(np.sum((out - Y) ** 2) / len(X))
          return p, losses

      def fit_model(S, A, S2, rng, epochs=400):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p, losses = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy, epochs)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy, "losses": losses}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      rng = np.random.default_rng(0)
      S, A, S2 = collect(40, 25, rng)
      model = fit_model(S, A, S2, rng)
      Sv, Av, S2v = collect(10, 25, np.random.default_rng(99))
      mse = np.mean(np.sum((predict(model, Sv, Av) - S2v) ** 2, axis=1))
      mse_still = np.mean(np.sum((Sv - S2v) ** 2, axis=1))
      print(f"Validierung: Modell {mse:.1e}, 'nichts ändert sich' {mse_still:.1e}")
      lab.plot(model["losses"], title="Trainingsverlust (normalisiert)", xlabel="Epoche", ylabel="MSE", logy=True)
    subgoals:
      - lines: [10, 20]
        label: Daten sammeln
      - lines: [22, 44]
        label: MLP und Adam bereitstellen
      - lines: [46, 51]
        label: Δs-Ziele bilden und normalisiert trainieren
      - lines: [53, 56]
        label: Zurückrechnen und s addieren
      - lines: [58, 64]
        label: Auf neuen Episoden validieren
    after: |
      1000 Übergänge, 400 Epochen. Das Modell ist auf ungesehenen Episoden etwa hundertmal genauer als die Referenz „$s' = s$“.
  - type: explain
    question: |
      Warum vergleichen wir den Validierungsfehler mit der Referenz „nichts ändert sich“ ($s' = s$)?
    options:
      - text: Weil $\Delta s$ winzig ist – schon $s' = s$ hat einen kleinen absoluten Fehler. Erst der Vergleich zeigt, ob das Modell wirklich etwas gelernt hat.
        correct: true
        why: Ein MSE von 0,01 klingt gut, ist hier aber nicht besser als Raten „bleibt stehen“. Eine einfache Referenz macht die Zahl interpretierbar.
      - text: Weil das Modell sonst nicht konvergiert.
        correct: false
        why: Die Referenz beeinflusst das Training nicht, sie dient nur der Bewertung.
      - text: Weil $s' = s$ die wahre Dynamik des Reachers ist.
        correct: false
        why: Der Arm bewegt sich mit der Aktion – $s' = s$ gilt nur bei $a = 0$.
  - type: predict
    code: |
      import numpy as np
      X = np.array([[0.0, 10.0], [2.0, 30.0]])
      mx, sx = X.mean(0), X.std(0)
