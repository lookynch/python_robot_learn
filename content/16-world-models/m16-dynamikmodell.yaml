            for _ in range(n_episodes):
                env.reset(q=rng.uniform(-np.pi, np.pi, 2), goal=(1.0, 1.0))
                s = observe(env)
                for _ in range(steps):
                    a = rng.uniform(-2, 2, 2)
                    env.step(a)
                    s2 = observe(env)
                    S.append(s); A.append(a); S2.append(s2)
                    s = s2
            return np.array(S), np.array(A), np.array(S2)
        def init_mlp(n_in, n_hidden, n_out, rng):
            return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                    "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}
        def forward(p, X):
            H = np.tanh(X @ p["W1"] + p["b1"])
            return H @ p["W2"] + p["b2"], H
        def train_mlp(p, X, Y, epochs=400, lr=0.02):
            m = {k: np.zeros_like(w) for k, w in p.items()}
            v = {k: np.zeros_like(w) for k, w in p.items()}
            for t in range(1, epochs + 1):
                out, H = forward(p, X)
                D = 2 * (out - Y) / len(X)
                dH = (D @ p["W2"].T) * (1 - H ** 2)
                g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
                for k in p:
                    m[k] = 0.9 * m[k] + 0.1 * g[k]
                    v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                    p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
            return p, []
        def predict(model, s, a):
            X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
            out, _ = forward(model["p"], X)
            return s + out * model["sy"] + model["my"]
        def fit_model(S, A, S2, rng):
            X, Y = np.hstack([S, A]), S - S2
            mx, sx = X.mean(0), X.std(0) + 1e-8
            my, sy = Y.mean(0), Y.std(0) + 1e-8
            p, losses = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
            return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}
        rng = np.random.default_rng(0)
        S, A, S2 = collect(40, 25, rng)
        model = fit_model(S, A, S2, rng)
    hints:
      - "Teilziel: Δs-Ziele bilden und normalisiert trainieren – dann alles fürs Zurückrechnen im Dict speichern."
      - "`np.hstack([S, A])` legt die Spalten nebeneinander (Form `(n, 6)`); Mittelwert und Streuung spaltenweise mit `axis=0` bzw. `.mean(0)`."
      - |
        ```python
        X, Y = np.hstack([S, A]), S2 - S
        mx, sx = X.mean(0), X.std(0) + 1e-8
        my, sy = ...
        ```
      - |
        ```python
        p, losses = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
        return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}
        ```
    explanation: |
      Lässt du die **Ausgabe-Normalisierung** weg, wird der Validierungsfehler hier etwa 7-mal größer; sagt das Netz $s'$ statt $\Delta s$ vorher, etwa 40-mal. Die Eingaben liegen bei diesem Arm schon ungefähr auf Skala 1 – dort hilft Normalisierung weniger, schadet aber nie.
  - type: quiz
    question: |
      Beim Vorhersagen für einen **neuen** Zustand: Mit welchem $\mu$ und $\sigma$ normalisierst du die Eingabe?
    options:
      - text: Mit $\mu$ und $\sigma$ der Trainingsdaten, die im Modell gespeichert sind.
        correct: true
        why: Das Netz hat gelernt, mit genau dieser Skalierung umzugehen. Andere Werte verschieben die Eingaben.
      - text: Mit Mittelwert und Streuung der neuen Eingabe selbst.
        correct: false
        why: Ein einzelner Zustand hat Streuung 0 – und selbst bei einem Batch würde sich die Skala von Aufruf zu Aufruf ändern.
      - text: Gar nicht – Normalisierung braucht man nur beim Training.
        correct: false
        why: Das Netz erwartet normalisierte Eingaben; rohe Werte liegen außerhalb dessen, was es gesehen hat.
cards:
  - id: m16-c-delta
    concept: wm-delta-vorhersage
    variants:
      - type: quiz
        question: Warum sagt das Netz $\Delta s = s' - s$ statt $s'$ vorher?
        options:
          - text: "$s'$ liegt fast bei $s$; das Netz muss so nur die kleine Änderung lernen statt den Zustand zu kopieren."
            correct: true
            why: Der Kopieranteil steckt im festen `s +` – das Netz modelliert nur die Physik des Schritts.
          - text: Weil $\Delta s$ immer positiv ist.
            correct: false
            why: Änderungen haben beide Vorzeichen.
          - text: Weil ein MLP keine Werte größer als 1 ausgeben kann.
            correct: false
            why: Die Ausgabeschicht ist linear und kann beliebige Werte liefern.
      - type: predict
        code: |
          import numpy as np
          s = np.array([1.0, 2.0])
          delta = np.array([0.1, -0.2])
          print(s + delta)
        options: ["[1.1 1.8]", "[0.1 -0.2]", "[1.1 2.2]", "[0.9 1.8]"]
        answer: "[1.1 1.8]"
        explanation: Das Modell gibt $s + \Delta s$ zurück.
  - id: m16-c-denorm
    concept: wm-normalisierung
    variants:
      - type: predict
        code: |
          import numpy as np
          out = np.array([2.0, -1.0])
          my, sy = np.array([0.0, 0.5]), np.array([0.1, 0.2])
          print(out * sy + my)
        options: ["[0.2 0.3]", "[2.1 -0.8]", "[0.2 -0.2]", "[20. -5.]"]
        answer: "[0.2 0.3]"
        explanation: Zurückrechnen = mit $\sigma$ multiplizieren, dann $\mu$ addieren.
      - type: predict
        code: |
          import numpy as np
          y = np.array([0.3, 0.5])
          my, sy = np.array([0.1, 0.5]), np.array([0.1, 0.25])
          print((y - my) / sy)
        options: ["[2. 0.]", "[0.02 0.]", "[4. 2.]", "[0.2 0.]"]
        answer: "[2. 0.]"
        explanation: Normalisieren = $\mu$ abziehen, durch $\sigma$ teilen.
  - id: m16-c-norm-stats
    concept: wm-normalisierung
    variants:
      - type: quiz
        question: Woher kommen $\mu_y$ und $\sigma_y$, mit denen du die Netzausgabe zurückrechnest?
        options:
          - text: Aus den Zielen $\Delta s$ des Trainingsdatensatzes.
            correct: true
            why: Das Netz wurde auf $(\Delta s - \mu_y)/\sigma_y$ trainiert – also muss die Rückrechnung dieselben Werte nutzen.
          - text: Aus den Eingaben $[s, a]$.
            correct: false
            why: Das sind $\mu_x, \sigma_x$ – andere Spalten, andere Größen.
          - text: Sie sind immer 0 und 1.
            correct: false
            why: Nur die **normalisierten** Ziele haben Mittelwert 0 und Streuung 1.
      - type: quiz
        question: Du vergisst, die Ziele $\Delta q \approx \pm 0{,}1$ rad zu normalisieren. Was passiert am ehesten?
        options:
          - text: Das Training funktioniert, aber deutlich schlechter – die winzigen Zielwerte passen nicht zur Skala von Initialisierung und Lernrate.
            correct: true
            why: Im Versuch dieser Lektion wurde der Fehler etwa 7-mal größer.
          - text: Python wirft einen Fehler.
            correct: false
            why: Die Formen stimmen – es rechnet nur schlechter.
          - text: Gar nichts, Adam gleicht alles aus.
            correct: false
            why: Adam skaliert die Schritte, aber nicht die Ausgabe der Initialisierung oder das Verhältnis der Ziele zueinander.
