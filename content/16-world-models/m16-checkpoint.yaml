            return elite.mean(axis=0), sd
      - |
        import numpy as np
        def cem_step(mu, sd, cost_fn, rng, n=200, n_elite=20):
            U = mu + sd * rng.standard_normal((n,) + np.shape(mu))
            return U.mean(axis=0), U.std(axis=0)
    hints:
      - "Teilziel: Stichproben ziehen → nach Kosten sortieren → Elite zusammenfassen."
      - "`np.argsort(kosten)` liefert die Indizes von klein nach groß; die ersten `n_elite` sind die besten."
