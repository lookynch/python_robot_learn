  - type: quiz
    question: |
      Ein Ensemble aus 5 Modellen ist sich bei einem Zustand $s^*$ stark uneinig. Wie sollte ein Planer damit umgehen?
    options:
      - text: Pläne durch $s^*$ als riskant behandeln – z. B. die Kosten über die Modelle mitteln (wie PETS) oder dort neue Daten sammeln.
        correct: true
        why: Große Streuung bedeutet hohe epistemische Unsicherheit – das Modell weiß dort wenig.
      - text: Das Modell mit der günstigsten Vorhersage nehmen.
        correct: false
        why: Das ist maximale Modellausnutzung – genau der optimistische Fehler wird gewählt.
      - text: Die Streuung ignorieren; der Mittelwert ist immer richtig.
        correct: false
        why: Der Mittelwert kann außerhalb der Daten genauso falsch sein wie jedes einzelne Modell.
  - type: quiz
    question: |
      Ein Arm startet immer bei $q = (0, 0)$. Ein Modell aus 120 Zufallsübergängen führt MPC zu einem fernen Ziel – der Arm verfehlt es. Was ist der beste nächste Schritt?
    options:
      - text: Die Übergänge der MPC-Episode zum Datensatz hinzufügen, neu trainieren und wieder planen.
        correct: true
        why: Die Lernschleife sammelt Daten dort, wo der Planer hinwill.
      - text: Mehr CEM-Iterationen pro Schritt.
        correct: false
        why: Besser im falschen Modell zu optimieren hilft nicht – eher im Gegenteil.
      - text: Den Planungshorizont auf 100 Schritte erhöhen.
        correct: false
        why: Längere offene Rollouts vergrößern den Compounding Error.
