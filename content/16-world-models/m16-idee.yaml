        def rollout(step_fn, s0, actions):
            s = np.array(s0, dtype=float)
            for a in actions:
                s = step_fn(s, a)
            return s
    hints:
      - "Teilziel: Liste mit dem Startzustand anlegen, dann Schleife über alle Aktionen."
      - In jedem Schritt wird der **aktuelle** Zustand an `step_fn` übergeben und durch das Ergebnis ersetzt.
      - |
        ```python
        s = np.array(s0, dtype=float)
        states = [s]
        for a in actions:
            ...
        ```
      - |
        ```python
        for a in actions:
            s = step_fn(s, a)
            states.append(s)
        return np.array(states)
        ```
  - type: quiz
    question: |
      Ein Agent hat 200 echte Übergänge $(s, a, s')$ gesammelt. Was macht ein **modellbasierter** Agent damit, was ein modellfreier nicht tut?
    options:
      - text: Er trainiert daraus $\hat f(s, a) \approx s'$ und spielt damit neue Aktionsfolgen durch, die er nie echt ausprobiert hat.
        correct: true
        why: Das Modell verallgemeinert auf neue Aktionsfolgen – Planen oder Lernen „in der Vorstellung“.
      - text: Er speichert die Übergänge in einer Q-Tabelle.
        correct: false
        why: Das ist modellfreies, tabellarisches Lernen (Modul 14).
      - text: Er braucht keine weiteren Daten mehr, weil das Modell perfekt ist.
        correct: false
        why: Mit 200 Übergängen ist das Modell nur dort gut, wo Daten liegen. Mehr Daten aus neuen Regionen bleiben nötig.
  - type: quiz
    question: |
      Was ist das **Hauptrisiko** beim Planen mit einem gelernten Modell?
    options:
      - text: Der Planer vertraut Vorhersagen, die falsch sind, und wählt Aktionen, die nur im Modell gut aussehen.
        correct: true
        why: Das nennt man Modellausnutzung (Model Exploitation). Gegenmittel – Ensembles und Neuplanen – kommen in diesem Modul.
      - text: Das Modell lernt zu langsam, weil es nur Belohnungen sieht.
        correct: false
        why: Das Modell lernt überwacht aus ganzen Zustandsvektoren $s'$ – das ist gerade sein Vorteil.
      - text: Planen funktioniert nur mit diskreten Aktionen.
        correct: false
        why: CEM und MPPI aus Modul 11 arbeiten mit kontinuierlichen Aktionen.
cards:
  - id: m16-c-world-model-def
    concept: wm-world-model
    variants:
      - type: quiz
        question: Was berechnet ein World Model für einen Roboterarm?
        options:
          - text: Aus Zustand und Aktion den vorhergesagten nächsten Zustand.
            correct: true
            why: "$\\hat f(s, a) \\approx s'$ – ein gelernter Simulator."
          - text: Aus dem Zustand direkt die beste Aktion.
            correct: false
            why: Das ist eine Policy, kein Modell der Welt.
          - text: Aus dem Zustand den erwarteten Return.
            correct: false
            why: Das ist eine Wertfunktion $V(s)$.
      - type: quiz
        question: Welche Funktion ist ein (einfaches) World Model?
        options:
          - text: "`def f(s, a): return s + 0.05 * a`"
            correct: true
            why: Sie sagt aus Zustand und Aktion den nächsten Zustand voraus.
          - text: "`def pi(s): return -0.5 * s`"
            correct: false
            why: Das ist eine Policy – Zustand rein, Aktion raus.
          - text: "`def V(s): return -abs(s)`"
            correct: false
            why: Das ist eine Wertfunktion – sie bewertet Zustände, sagt aber nichts über Übergänge.
  - id: m16-c-rollout
    concept: wm-world-model
    variants:
      - type: predict
        code: |
          def f(s, a):
              return 2 * s + a

          s = 0
          out = [s]
          for a in [1, 1]:
              s = f(s, a)
              out.append(s)
          print(out)
        options: ["[0, 1, 3]", "[1, 3]", "[0, 1, 1]", "[0, 2, 4]"]
        answer: "[0, 1, 3]"
        explanation: 0 → 2·0+1 = 1 → 2·1+1 = 3. Der Startzustand gehört dazu.
      - type: predict
        code: |
          def f(s, a):
              return s - a

          s = 5
          out = [s]
          for a in [2, 2, 2]:
              s = f(s, a)
              out.append(s)
          print(len(out), out[-1])
        options: ["4 -1", "3 -1", "4 3", "3 1"]
        answer: "4 -1"
        explanation: Drei Aktionen ergeben vier Zustände (mit Start); 5 → 3 → 1 → −1.
  - id: m16-c-sample-effizienz
    concept: wm-modellbasiert
    variants:
      - type: quiz
        question: Was ist typischerweise **teurer** bei modellbasierten Verfahren als bei modellfreien?
        options:
          - text: Rechenzeit beim Handeln, weil vor jeder Aktion geplant wird.
            correct: true
            why: MPC rollt in jedem Schritt Hunderte Aktionsfolgen im Modell aus.
          - text: Die Anzahl echter Interaktionen.
            correct: false
            why: Die ist meist deutlich kleiner – das ist der Hauptvorteil.
          - text: Speicher für eine Q-Tabelle.
            correct: false
            why: Modellbasierte Verfahren brauchen keine Q-Tabelle.
      - type: quiz
        question: Warum ist Sample-Effizienz bei **echten** Robotern so wichtig?
        options:
          - text: Jede echte Interaktion kostet Zeit, Verschleiß und birgt Risiko – Rechenzeit ist vergleichsweise billig.
            correct: true
            why: In der Simulation sind Millionen Schritte möglich, am echten Arm nicht.
          - text: Echte Roboter können nur diskrete Aktionen ausführen.
            correct: false
            why: Motoren werden kontinuierlich angesteuert.
          - text: Weil echte Roboter keine Belohnung messen können.
            correct: false
            why: Kosten wie „Abstand zum Ziel“ lassen sich messen – das ist nicht der Engpass.
