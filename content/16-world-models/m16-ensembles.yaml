    expect_output: "(5, 4) (5, 4)"
    explanation: |
      Achse 0 zählt die Modelle. Mittelt man über Achse 1, mischt man verschiedene Zustände – das ergibt Form `(3, 4)` und keine Unsicherheit pro Zustand.
