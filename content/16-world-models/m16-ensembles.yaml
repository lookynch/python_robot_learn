id: m16-ensembles
title: Ensembles – wissen, was man nicht weiß
minutes: 10
goals:
  - Aleatorische und epistemische Unsicherheit unterscheiden
  - Ein Ensemble aus Bootstrap-Stichproben trainieren
  - Zeigen, dass die Ensemble-Streuung außerhalb der Trainingsdaten wächst
concepts: [wm-ensemble]
steps:
  - type: text
    body: |
      ## Zwei Arten von Unsicherheit

      - **Aleatorisch**: echtes Rauschen im System (z. B. Sensorrauschen). Mehr Daten helfen nicht.
      - **Epistemisch**: Unwissen, weil an dieser Stelle **keine Daten** lagen. Mehr Daten helfen.

      Ein einzelnes Netz sagt immer *irgendetwas* voraus – auch dort, wo es nichts weiß. Trick: Trainiere $K$ Netze (ein **Ensemble**) mit verschiedener Initialisierung und je einer **Bootstrap-Stichprobe** (zufällig mit Zurücklegen gezogene Daten). Wo Daten liegen, stimmen sie überein; wo nicht, raten sie verschieden. Ihre **Streuung** ist ein Maß für epistemische Unsicherheit.

      PETS (Chua et al. 2018) kombiniert so ein Ensemble mit CEM-Planung. Dort gibt jedes Netz zusätzlich eine Varianz aus (für aleatorische Unsicherheit) – das lassen wir weg.
  - type: example
    heavy: true
    intro: |
      Fünf Modelle, trainiert auf Daten mit Startwinkeln in $[-1, 1]$ rad. Dann fahren wir $q_1$ von $-\pi$ bis $\pi$ (bei $q_2 = 0$, Aktion $a = (1, 0)$ rad/s) und vergleichen die vorhergesagte Änderung $\Delta y$ der Spitze.
    code: |
      import numpy as np
      import lab
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng, q_range=np.pi):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-q_range, q_range, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=240, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      rng = np.random.default_rng(0)
      S, A, S2 = collect(20, 20, rng, q_range=1.0)
      models = []
      for k in range(5):
          idx = rng.integers(0, len(S), len(S))
          models.append(fit_model(S[idx], A[idx], S2[idx], rng))

      q1 = np.linspace(-np.pi, np.pi, 60)
      s = np.stack([q1, 0 * q1, 2 * np.cos(q1), 2 * np.sin(q1)], axis=1)
      a = np.tile([1.0, 0.0], (60, 1))
      P = np.array([predict(m, s, a) for m in models])
      dy = P[:, :, 3] - s[:, 3]
      fig = lab.Figure(title="Vorhergesagtes Δy der Spitze", xlabel="q1 in rad", ylabel="Δy in m")
      for k in range(5):
          fig.line(dy[k], x=q1, label=f"Modell {k + 1}")
      fig.line(2 * (np.sin(q1 + 0.05) - np.sin(q1)), x=q1, label="wahr", color="fg")
      fig.show()
      lab.plot(dy.std(axis=0), x=q1, title="Streuung des Ensembles", xlabel="q1 in rad", ylabel="Std von Δy in m")
      print("Trainingsdaten q1 von", round(S[:, 0].min(), 2), "bis", round(S[:, 0].max(), 2), "rad")
    subgoals:
      - lines: [57, 58]
        label: Daten nur aus einer Region sammeln
      - lines: [59, 62]
