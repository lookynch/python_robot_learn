      import numpy as np
      from lab.envs import Reacher2D

      env = Reacher2D(seed=0)

      def observe(env):
          return np.concatenate([env.q, env.fk(env.q)])

      def collect(n_episodes, steps, rng, q_range=np.pi):
          S, A, S2 = [], [], []
          for _ in range(n_episodes):
              env.reset(q=rng.uniform(-q_range, q_range, 2), goal=(1.0, 1.0))
              s = observe(env)
              for _ in range(steps):
                  a = rng.uniform(-2, 2, 2)
                  env.step(a)
                  s2 = observe(env)
                  S.append(s); A.append(a); S2.append(s2)
                  s = s2
          return np.array(S), np.array(A), np.array(S2)

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=240, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(6, 32, 4, rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      def ensemble_predict(models, s, a):
          P = np.array([predict(m, s, a) for m in models])
          return P.mean(axis=0), P.std(axis=0)

      def fit_ensemble(S, A, S2, k, rng):
          models = []
          n = len(S)
          for _ in range(k):
              idx = rng.integers(0, n, n)
              models.append(fit_model(S[idx], A[idx], S2[idx], rng))
          return models

      rng = np.random.default_rng(0)
      S, A, S2 = collect(20, 20, rng, q_range=1.0)
      models = fit_ensemble(S, A, S2, 5, rng)
      print(len(models), "Modelle")
    tests:
      - name: Richtige Anzahl Modelle
        code: |
          assert isinstance(models, list) and len(models) == 5, f"fit_ensemble(S, A, S2, 5, rng) soll eine Liste mit 5 Modellen liefern, bekommen {type(models).__name__} der Länge {len(models) if hasattr(models, '__len__') else '?'}"
      - name: Modelle unterscheiden sich
        code: |
          r = np.random.default_rng(3)
          q = r.uniform(-3, 3, (50, 2))
          s = np.hstack([q, env.fk(q)])
          a = r.uniform(-2, 2, (50, 2))
          _, std = ensemble_predict(models, s, a)
          assert std[:, 2:].mean() > 1e-4, "Alle Modelle sagen dasselbe vorher – bekommt jedes eine eigene Bootstrap-Stichprobe und läuft rng weiter?"
      - name: Gute Vorhersage im Datenbereich
        code: |
          St, At, S2t = collect(10, 20, np.random.default_rng(77), q_range=1.0)
          mean, _ = ensemble_predict(models, St, At)
          err = np.mean(np.linalg.norm(mean[:, 2:] - S2t[:, 2:], axis=1))
          assert err < 0.02, f"Im Bereich der Trainingsdaten sollte der Mittelwert des Ensembles auf unter 2 cm genau sein, Fehler {err:.3f} m"
      - name: Streuung außerhalb der Daten größer
        code: |
          r = np.random.default_rng(4)
          q_in = r.uniform(-1.0, 1.0, (200, 2))
          q_out = r.uniform(2.3, 3.1, (200, 2)) * r.choice([-1, 1], (200, 2))
          a = r.uniform(-2, 2, (200, 2))
          _, sd_in = ensemble_predict(models, np.hstack([q_in, env.fk(q_in)]), a)
          _, sd_out = ensemble_predict(models, np.hstack([q_out, env.fk(q_out)]), a)
          ratio = sd_out[:, 2:].mean() / sd_in[:, 2:].mean()
          assert ratio > 3, f"Außerhalb der Trainingsdaten sollte die Streuung mindestens 3-mal größer sein, Verhältnis {ratio:.1f}"
