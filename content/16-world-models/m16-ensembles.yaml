    after: |
      Im Bereich der Trainingsdaten (etwa $-1$ bis $1{,}5$ rad, siehe Ausgabe) liegen alle fünf Kurven auf der wahren Kurve. Außerhalb fächern sie auf – die Streuung wächst um ein Vielfaches. **Genau dort** sollte ein Planer dem Modell nicht trauen.
  - type: predict
    intro: |
      Eine Bootstrap-Stichprobe zieht Indizes **mit Zurücklegen**. Hier ein fester Satz gezogener Indizes:
    code: |
      import numpy as np
      data = np.array([10, 20, 30, 40, 50, 60])
      idx = np.array([0, 2, 2, 5, 1, 2])
      print(data[idx], len(set(idx.tolist())))
    options:
      - "[10 30 30 60 20 30] 4"
      - "[10 30 30 60 20 30] 6"
      - "[10 20 30 40 50 60] 6"
      - "[10 30 60 20] 4"
    answer: "[10 30 30 60 20 30] 4"
    explanation: |
      Die Stichprobe ist so groß wie der Datensatz, enthält aber Duplikate (30 dreimal) und lässt Punkte weg (40, 50). Bei großen Datensätzen fehlen im Mittel etwa 37 % ($\approx 1/e$) der Punkte – so sieht jedes Modell etwas andere Daten.
  - type: explain
    question: |
      Warum stimmen die Ensemble-Mitglieder bei den Trainingsdaten überein, außerhalb aber nicht?
    options:
      - text: Bei den Daten zwingt der Verlust alle Netze zur selben Antwort; außerhalb legt nichts sie fest, also bestimmen zufällige Initialisierung und Stichprobe die Extrapolation.
        correct: true
        why: Die Daten „nageln“ die Funktion nur dort fest, wo sie liegen. Dazwischen und daneben ist jedes Netz frei.
      - text: Weil außerhalb der Daten Messrauschen auftritt.
        correct: false
        why: Unser Reacher ist rauschfrei. Die Streuung ist epistemisch, nicht aleatorisch.
      - text: Weil die Netze außerhalb der Trainingsdaten numerisch instabil werden.
        correct: false
        why: tanh-Netze bleiben beschränkt und stabil – sie sind dort nur nicht durch Daten festgelegt.
