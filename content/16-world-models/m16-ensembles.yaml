  - type: quiz
    question: |
      Wie nutzt PETS (Chua et al. 2018) das Ensemble beim Planen mit CEM?
    options:
      - text: Jede Aktionsfolge wird mit mehreren Partikeln durch zufällig gewählte Ensemble-Mitglieder gerollt; die Kosten werden über die Partikel gemittelt.
        correct: true
        why: Das heißt Trajectory Sampling. Aktionsfolgen, die nur in einem Teil der Modelle gut aussehen, bekommen schlechtere mittlere Kosten.
      - text: Es nimmt für jede Aktionsfolge das Modell mit den niedrigsten Kosten.
        correct: false
        why: Das wäre maximal optimistisch und lädt zur Modellausnutzung ein.
      - text: Es benutzt das Ensemble nur beim Training, geplant wird mit einem einzigen Netz.
        correct: false
        why: Gerade beim Planen ist die Unsicherheit wichtig.
  - type: quiz
    question: |
      Welche Unsicherheit schrumpft, wenn du in einer Region genug Daten sammelst?
    options:
      - text: Die epistemische – die Ensemble-Mitglieder werden dort übereinstimmen.
        correct: true
        why: Epistemische Unsicherheit ist Unwissen und nimmt mit Daten ab.
      - text: Die aleatorische.
        correct: false
        why: Echtes Rauschen bleibt, egal wie viele Daten man hat.
      - text: Beide bleiben gleich.
        correct: false
        why: Mehr Daten verringern sehr wohl die epistemische Unsicherheit – das siehst du in der Lektion zur Lernschleife.
cards:
  - id: m16-c-epistemisch
    concept: wm-ensemble
    variants:
      - type: quiz
        question: Ein Ensemble ist sich bei $q_1 = 2{,}8$ rad sehr uneinig, bei $q_1 = 0$ einig. Was folgt daraus?
        options:
          - text: Bei $q_1 = 2{,}8$ rad fehlen vermutlich Trainingsdaten – dort sollte man dem Modell nicht trauen.
            correct: true
            why: Große Streuung = hohe epistemische Unsicherheit.
          - text: Bei $q_1 = 2{,}8$ rad ist das System verrauscht.
            correct: false
            why: Das Ensemble misst vor allem fehlendes Wissen, nicht Rauschen.
          - text: Das Ensemble ist falsch trainiert.
            correct: false
            why: Genau dieses Verhalten ist gewünscht.
      - type: quiz
        question: Warum ist ein einzelnes Netz als Unsicherheitsmaß ungeeignet?
        options:
          - text: Es gibt überall eine Zahl aus – auch dort, wo es nichts weiß – ohne zu verraten, wie verlässlich sie ist.
            correct: true
            why: Erst der Vergleich mehrerer Netze zeigt, wo die Daten die Antwort nicht festlegen.
          - text: Ein einzelnes Netz kann nicht extrapolieren.
            correct: false
            why: Es extrapoliert – nur meist falsch und ohne Warnung.
          - text: Ein einzelnes Netz ist immer überangepasst.
            correct: false
            why: Mit genug Daten und Validierung nicht – das Problem ist fehlende Selbsteinschätzung.
  - id: m16-c-bootstrap
    concept: wm-ensemble
    variants:
      - type: predict
        code: |
          import numpy as np
          idx = np.array([3, 3, 0, 1])
          print(len(idx), len(set(idx.tolist())))
        options: ["4 3", "4 4", "3 3", "4 2"]
        answer: "4 3"
        explanation: Bootstrap-Stichprobe = gleiche Größe, aber mit Zurücklegen – Index 3 kommt doppelt vor, 2 fehlt.
      - type: quiz
        question: Was passiert, wenn alle Ensemble-Mitglieder mit **demselben** Seed und denselben Daten trainiert werden?
        options:
          - text: Sie werden identisch – die Streuung ist überall 0 und zeigt keine Unsicherheit mehr an.
            correct: true
            why: Vielfalt durch Initialisierung und Stichprobe ist die Grundlage der Methode.
          - text: Die Streuung wird größer, weil mehr Modelle trainiert werden.
            correct: false
            why: Identische Modelle streuen nicht.
          - text: Nichts – die Reihenfolge der Daten unterscheidet sie ohnehin.
            correct: false
            why: Wir trainieren mit dem ganzen Datensatz pro Schritt (full batch); gleiche Daten und Initialisierung ergeben exakt dasselbe Netz.
