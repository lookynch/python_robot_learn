    hints:
      - "Teilziel: jeden Eintrag einzeln stören, `f` zweimal auswerten, wiederherstellen."
      - "`old = W.flat[i]` merken; dann `W.flat[i] = old + h` bzw. `old - h` setzen und jeweils `f(W)` aufrufen."
      - "Am Ende `W.flat[i] = old` und `g.flat[i] = (fp - fm) / (2 * h)`."
      - |
        ```python
        old = W.flat[i]
        W.flat[i] = old + h
        fp = f(W)
        W.flat[i] = old - h
        fm = f(W)
        W.flat[i] = old
        g.flat[i] = (fp - fm) / (2 * h)
        ```
    explanation: |
      Die Vorwärtsdifferenz hat bei $h = 10^{-5}$ einen Fehler von etwa $10^{-5}$ – zu groß für einen sauberen Check. Vergessenes Wiederherstellen verfälscht alle folgenden Einträge und zerstört nebenbei die Parameter.
  - type: example
    intro: |
      Fehlersuche: In `backward_buggy` fehlt die tanh-Ableitung. Der Check pro Parameter zeigt, **wo** der Fehler sitzt.
    code: |
      import numpy as np

      def num_grad(f, W, h=1e-5):
          g = np.zeros_like(W)
          for i in range(W.size):
              old = W.flat[i]
              W.flat[i] = old + h
              fp = f(W)
              W.flat[i] = old - h
              fm = f(W)
              W.flat[i] = old
              g.flat[i] = (fp - fm) / (2 * h)
          return g

      def rel_error(a, b):
          return np.max(np.abs(a - b) / np.maximum(1e-8, np.abs(a) + np.abs(b)))

      def forward(X, P):
          H = np.tanh(X @ P["W1"] + P["b1"])
          return H @ P["W2"] + P["b2"], H

      def backward_buggy(X, Y, P):
          out, H = forward(X, P)
          d_out = 2 * (out - Y) / len(X)
          dZ1 = d_out @ P["W2"].T              # tanh-Ableitung vergessen!
          return {"W1": X.T @ dZ1, "b1": dZ1.sum(axis=0), "W2": H.T @ d_out, "b2": d_out.sum(axis=0)}

      rng = np.random.default_rng(0)
      X, Y = rng.normal(size=(8, 2)), rng.normal(size=(8, 1))
      P = {"W1": rng.normal(size=(2, 5)), "b1": rng.normal(size=5),
           "W2": rng.normal(size=(5, 1)), "b2": rng.normal(size=1)}
      G = backward_buggy(X, Y, P)
      for k in P:
          num = num_grad(lambda W: np.mean((forward(X, P)[0] - Y) ** 2), P[k])
          print(f"{k}: relativer Fehler {rel_error(G[k], num):.1e}")
    subgoals:
      - lines: [22, 26]
        label: Verdächtiger Rückwärtsdurchlauf
      - lines: [28, 32]
        label: Kleines Testproblem
      - lines: [33, 35]
        label: Pro Parameter prüfen
    after: |
      `W2` und `b2` stimmen, `W1` und `b1` nicht. Der Fehler liegt also **zwischen** Ausgabeschicht und erster Schicht – genau dort, wo die Ableitung der Aktivierung fehlt. Die Funktion `f` braucht kein Argument zu nutzen: `num_grad` ändert `P[k]` direkt, und `forward` liest es aus `P`.
  - type: quiz
    question: |
      Ein Gradient-Check meldet: `W2` 3e-10, `b2` 1e-10, `W1` 2e-10, `b1` 0.5. Wo suchst du zuerst?
    options:
      - text: In der Zeile für `db1`, z. B. `mean` statt `sum` oder falsche Achse.
        correct: true
        why: Nur `b1` ist falsch; `W1` nutzt dasselbe `dZ1` und stimmt – also ist `dZ1` korrekt, nur die Reduktion zu `db1` nicht.
      - text: In der tanh-Ableitung.
        correct: false
        why: Dann wäre auch `W1` falsch, weil `dW1` aus demselben `dZ1` kommt.
      - text: Im Verlust `d_out`.
        correct: false
        why: Dann wären alle vier Gradienten falsch.
      - text: Nirgends – ein einzelner großer Wert ist Rundungsrauschen.
        correct: false
        why: 0,5 ist um Größenordnungen über der Faustregel-Schwelle von etwa 1e-3.
cards:
  - id: m12-c-rel-error
    concept: ml-gradient-check
    variants:
      - type: quiz
        question: |
          Relativer Fehler zwischen analytischem und numerischem Gradienten: `2e-9`. Was bedeutet das?
        options:
          - text: Der analytische Gradient ist sehr wahrscheinlich korrekt.
            correct: true
            why: Das liegt im Bereich der numerischen Genauigkeit der zentralen Differenz.
          - text: Es gibt einen kleinen Fehler im Backprop.
            correct: false
            why: Fehler im Backprop führen typischerweise zu Werten von 1e-3 bis 1.
          - text: Das Netz ist fertig trainiert.
            correct: false
            why: Der Check sagt nichts über die Güte des Modells, nur über die Korrektheit der Ableitung.
      - type: quiz
        question: |
          Relativer Fehler `0.3` für alle Parameter. Was ist am wahrscheinlichsten?
        options:
          - text: Ein Fehler ganz am Anfang des Rückwärtsdurchlaufs, z. B. in `d_out` (Faktor 2 oder 1/N vergessen).
            correct: true
            why: Ein Fehler am Ausgang pflanzt sich in alle Gradienten fort.
          - text: "`h` ist zu groß gewählt."
            correct: false
            why: Mit $h = 10^{-5}$ ist der Abbruchfehler um $10^{-10}$, nicht 0,3.
          - text: Nur der Bias der ersten Schicht ist falsch.
            correct: false
            why: Dann wäre nur dieser eine Wert groß.
  - id: m12-c-zentral
    concept: ml-gradient-check
    variants:
      - type: predict
        code: |
          f = lambda x: x ** 2
          x, h = 3.0, 0.1
          print(round((f(x + h) - f(x - h)) / (2 * h), 6), round((f(x + h) - f(x)) / h, 6))
        options: ["6.0 6.1", "6.1 6.0", "6.0 6.0", "6.01 6.1"]
        answer: "6.0 6.1"
        explanation: Für Parabeln ist die zentrale Differenz exakt; die Vorwärtsdifferenz hat den Fehler $h$.
      - type: quiz
        question: |
          Wie viele Auswertungen der Verlustfunktion braucht ein Gradient-Check mit zentraler Differenz für 1000 Parameter?
        options:
          - text: "2000"
            correct: true
            why: Zwei Auswertungen pro Parameter.
          - text: "2"
            correct: false
            why: Jeder Parameter wird einzeln gestört.
          - text: "1000"
            correct: false
            why: Das reicht nur für die Vorwärtsdifferenz (plus eine Basisauswertung).
