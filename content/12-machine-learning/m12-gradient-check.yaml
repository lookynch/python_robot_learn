id: m12-gradient-check
title: Gradient-Check
minutes: 10
goals:
  - Einen numerischen Gradienten mit zentraler Differenz für beliebige Arrays berechnen
  - Analytische und numerische Gradienten mit dem relativen Fehler vergleichen
  - Mit dem Gradient-Check einen Backprop-Fehler lokalisieren
concepts: [ml-gradient-check]
steps:
  - type: text
    body: |
      ## Vertrauen ist gut, Kontrolle ist besser

      Ein Fehler im Backprop ist tückisch: Das Training läuft oft trotzdem, nur schlechter. Darum prüft man den analytischen Gradienten gegen die **zentrale Differenz** (Modul 7), Eintrag für Eintrag:

      $$\frac{\partial L}{\partial w_i} \approx \frac{L(w + h e_i) - L(w - h e_i)}{2h}$$

      Verglichen wird mit dem **relativen Fehler**

      $$\text{rel} = \frac{|a - n|}{\max(10^{-8},\ |a| + |n|)}$$

      Faustregel bei `float64` und $h \approx 10^{-5}$: um $10^{-7}$ oder kleiner ist gut, ab etwa $10^{-3}$ liegt fast sicher ein Fehler vor.
  - type: predict
    code: |
      x, h = 2.0, 1e-3
      zentral = ((x + h) ** 3 - (x - h) ** 3) / (2 * h)
      vorwaerts = ((x + h) ** 3 - x ** 3) / h
      print(round(zentral, 6), round(vorwaerts, 6))
    options:
      - "12.000001 12.006001"
      - "12.0 12.0"
      - "12.006001 12.000001"
      - "12.000001 12.000001"
    answer: "12.000001 12.006001"
    explanation: |
      Die exakte Ableitung ist $3x^2 = 12$. Der Fehler der Vorwärtsdifferenz ist $\mathcal O(h)$ (hier $6 \cdot 10^{-3}$), der zentralen $\mathcal O(h^2)$ (hier $10^{-6}$).
  - type: explain
    question: |
      Warum nimmt man für den Gradient-Check nicht einfach $h = 10^{-12}$, um den Abbruchfehler zu minimieren?
    options:
      - text: Dann subtrahiert man zwei fast gleiche Zahlen; die Rundungsfehler von `float64` (≈ 1e-16 relativ) werden durch das winzige $h$ riesig verstärkt.
        correct: true
        why: Der Gesamtfehler ist Abbruchfehler + Rundungsfehler/h. Für die zentrale Differenz liegt das Optimum grob bei $h \approx 10^{-5}$ bis $10^{-6}$.
      - text: Python kann keine Zahlen kleiner als 1e-10 darstellen.
        correct: false
        why: "`float64` reicht bis etwa 1e-308."
      - text: Weil die Rechnung dann zu lange dauert.
        correct: false
        why: Die Rechenzeit hängt nicht von $h$ ab.
      - text: Bei kleinem $h$ wird die zentrale Differenz zur Vorwärtsdifferenz.
        correct: false
        why: Die Formel bleibt dieselbe; das Problem ist die Auslöschung.
  - type: example
    intro: |
      Allgemein für ein Array beliebiger Shape: `W.flat[i]` greift auf den i-ten Eintrag zu, egal ob `W` 1D oder 2D ist. Getestet am Gradienten der logistischen Regression.
    code: |
      import numpy as np

      def num_grad(f, W, h=1e-5):
          g = np.zeros_like(W)
          for i in range(W.size):
              old = W.flat[i]
              W.flat[i] = old + h
              fp = f(W)
              W.flat[i] = old - h
              fm = f(W)
              W.flat[i] = old                 # wiederherstellen!
              g.flat[i] = (fp - fm) / (2 * h)
          return g

      def rel_error(a, b):
          return np.max(np.abs(a - b) / np.maximum(1e-8, np.abs(a) + np.abs(b)))

      rng = np.random.default_rng(0)
      X, y = rng.normal(size=(20, 3)), rng.integers(0, 2, 20)
      w = rng.normal(size=3)

      def loss(w):
          p = 1 / (1 + np.exp(-(X @ w)))
          return -np.mean(y * np.log(p) + (1 - y) * np.log(1 - p))

      analytisch = X.T @ (1 / (1 + np.exp(-(X @ w))) - y) / len(y)
      numerisch = num_grad(loss, w)
      print(f"relativer Fehler: {rel_error(analytisch, numerisch):.1e}")
    subgoals:
      - lines: [3, 13]
        label: Jeden Eintrag einzeln stören
      - lines: [15, 16]
        label: Relativen Fehler messen
      - lines: [18, 24]
        label: Testproblem aufsetzen
      - lines: [26, 28]
        label: Analytisch gegen numerisch vergleichen
    after: |
      Der Fehler liegt weit unter $10^{-7}$ – der Gradient $X^\top(p - y)/N$ stimmt. Kosten: 2 Verlustauswertungen **pro Parameter**. Deshalb prüft man nur an kleinen Netzen und wenigen Beispielen und trainiert dann mit Backprop.
  - type: fill
    fading: true
    prompt: |
      Ergänze das Wiederherstellen und den Nenner. Geprüft wird an $f(W) = \sum W^3$ mit bekannter Ableitung $3W^2$.
    code: |
      import numpy as np

      def num_grad(f, W, h=1e-5):
          g = np.zeros_like(W)
          for i in range(W.size):
              old = W.flat[i]
              W.flat[i] = old + h
              fp = f(W)
              W.flat[i] = old - h
              fm = f(W)
              W.flat[i] = ___
              g.flat[i] = (fp - fm) / (___)
          return g
    blanks:
      - answer: old
        options: [old, old + h, "0.0"]
      - answer: 2 * h
        options: [2 * h, h, h ** 2]
    tests:
      - name: Ableitung von sum(W³)
        code: |
          import numpy as np
          Wt = np.array([[1.0, -2.0], [0.5, 3.0]])
          W0 = Wt.copy()
          g = num_grad(lambda W: np.sum(W ** 3), Wt)
          assert close(g, 3 * W0 ** 2, 1e-6), f"Erwartet {3 * W0 ** 2}, bekommen {g}"
          assert close(Wt, W0, 0), f"W wurde verändert: {Wt}"
  - type: exercise
    mode: make
    prompt: |
      Schreibe `num_grad(f, W, h=1e-5)` selbst: Für jeden Eintrag von `W` (beliebige Shape) die zentrale Differenz von `f(W)` bilden. `W` muss nach dem Aufruf **unverändert** sein.
    starter: |
      import numpy as np

      def num_grad(f, W, h=1e-5):
          g = np.zeros_like(W)
          for i in range(W.size):
              # Eintrag i stören, f auswerten, wiederherstellen
              pass
          return g
    solution: |
      import numpy as np

      def num_grad(f, W, h=1e-5):
          g = np.zeros_like(W)
          for i in range(W.size):
              old = W.flat[i]
              W.flat[i] = old + h
              fp = f(W)
              W.flat[i] = old - h
              fm = f(W)
              W.flat[i] = old
              g.flat[i] = (fp - fm) / (2 * h)
          return g
    tests:
      - name: Quadratsumme
        code: |
          import numpy as np
          Wt = np.array([[1.0, -2.0, 0.5], [3.0, 0.0, -1.5]])
          g = num_grad(lambda W: np.sum(W ** 2), Wt.copy())
          assert np.shape(g) == (2, 3), f"Ergebnis sollte Shape (2, 3) haben, hat {np.shape(g)}"
          assert close(g, 2 * Wt, 1e-7), f"Erwartet {2 * Wt}, bekommen {np.round(g, 6)}"
      - name: Nichtlineare Funktion
        code: |
          import numpy as np
          A = np.array([1.0, 2.0, -3.0, 0.5])
          Wt = np.array([0.3, -1.2, 2.0, 0.0])
          g = num_grad(lambda W: np.sum(np.sin(W) * A), Wt.copy())
          assert close(g, np.cos(Wt) * A, 1e-7), f"Erwartet {np.round(np.cos(Wt) * A, 5)}, bekommen {np.round(g, 5)}"
      - name: W bleibt unverändert
        code: |
          import numpy as np
          Wt = np.array([[1.0, 2.0], [3.0, 4.0]])
          num_grad(lambda W: np.sum(W ** 2), Wt)
          assert close(Wt, [[1.0, 2.0], [3.0, 4.0]], 0), f"W wurde verändert: {Wt}"
    mutants:
