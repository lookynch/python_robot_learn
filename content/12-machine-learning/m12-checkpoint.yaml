                b = b - lr * 2 * np.mean(err)
            return w, b
    hints:
      - "Teilziel: in jedem Schritt Gradient berechnen und beide Parameter aktualisieren."
      - "$\\nabla_w = \\frac{2}{N}X^\\top \\mathrm{err}$, $\\partial_b = 2\\,\\mathrm{mean}(\\mathrm{err})$; Update mit Minus."
      - "`w = w - lr * 2 * X.T @ err / len(y)`"
  - type: quiz
    question: |
      Gradient-Check eines MLP: `W2` 1e-10, `b2` 1e-10, `W1` 0.8, `b1` 0.8. Was ist die wahrscheinlichste Ursache?
    options:
      - text: Fehler zwischen Ausgabeschicht und erster Schicht, z. B. vergessene Ableitung der Aktivierung.
        correct: true
        why: Die Ausgabeschicht stimmt, beide Gradienten der ersten Schicht sind falsch – der gemeinsame Teil `dZ1` ist verdächtig.
      - text: Fehler im Gradienten am Ausgang `d_out`.
        correct: false
        why: Dann wären auch `W2` und `b2` falsch.
      - text: Die Schrittweite h ist zu klein.
        correct: false
        why: Dann wären alle Werte etwas verrauscht, nicht genau zwei um Größenordnungen falsch.
