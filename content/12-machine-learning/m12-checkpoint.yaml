  - type: quiz
    question: |
      Polynom-Regression mit wachsendem Grad. Grad 2: Training 0,30 / Test 0,32. Grad 12: Training 0,002 / Test 3,1. Welche Aussage stimmt?
    options:
      - text: Grad 12 overfittet; ein kleinerer Grad oder Ridge-Regularisierung verallgemeinert besser.
        correct: true
        why: Winziger Trainingsfehler bei großem Testfehler ist das Kennzeichen von Overfitting.
      - text: Grad 12 ist besser, weil der Trainingsfehler kleiner ist.
        correct: false
        why: Gemessen wird die Qualität auf neuen Daten – dort ist Grad 12 zehnmal schlechter.
      - text: Grad 2 overfittet, weil Training und Test fast gleich sind.
        correct: false
        why: Nah beieinander liegende Fehler sprechen gegen Overfitting.
      - text: Man sollte λ verkleinern.
        correct: false
        why: Kleineres λ bedeutet weniger Regularisierung – das verstärkt Overfitting.
