  - type: exercise
    mode: make
    prompt: |
      Schreibe `train_linear(X, y, lr, steps)`: Gradientenabstieg auf dem MSE für $\hat y = X\mathbf w + b$, Start bei `w = 0`, `b = 0`. Rückgabe `(w, b)`.
    starter: |
      import numpy as np

      def train_linear(X, y, lr, steps):
          w = np.zeros(X.shape[1])
          b = 0.0
          for step in range(steps):
              err = X @ w + b - y
              # Update von w und b
          return w, b
    solution: |
      import numpy as np

      def train_linear(X, y, lr, steps):
          w = np.zeros(X.shape[1])
          b = 0.0
          for step in range(steps):
              err = X @ w + b - y
              w = w - lr * 2 * X.T @ err / len(y)
              b = b - lr * 2 * np.mean(err)
          return w, b
    tests:
      - name: Findet die lstsq-Lösung
        code: |
          import numpy as np
          rng = np.random.default_rng(6)
          Xt = rng.normal(size=(30, 3))
          yt = Xt @ np.array([1.0, -0.5, 2.0]) + 3.0 + rng.normal(0, 0.1, 30)
          w, b = train_linear(Xt, yt, 0.1, 500)
          ref = np.linalg.lstsq(np.column_stack([Xt, np.ones(30)]), yt, rcond=None)[0]
          assert close(w, ref[:3], 1e-3), f"w erwartet {ref[:3].round(3)}, bekommen {np.round(w, 3)}"
          assert close(b, ref[3], 1e-3), f"b erwartet {ref[3]:.3f}, bekommen {b:.3f}"
      - name: Verlust sinkt unter Schwelle
        code: |
          import numpy as np
          Xt = np.linspace(0, 1, 20).reshape(-1, 1)
          yt = 4 * Xt[:, 0] - 1
          w, b = train_linear(Xt, yt, 0.5, 2000)
          mse = np.mean((Xt @ w + b - yt) ** 2)
          assert mse < 1e-6, f"MSE sollte unter 1e-6 fallen, ist {mse:.2e}"
    mutants:
      - |
        import numpy as np
        def train_linear(X, y, lr, steps):
            w = np.zeros(X.shape[1])
            b = 0.0
            for step in range(steps):
                err = X @ w + b - y
                w = w - lr * 2 * X.T @ err / len(y)
            return w, b
      - |
