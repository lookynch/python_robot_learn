  - type: exercise
    mode: make
    prompt: |
      Schreibe `dense_backward(X, W, dY)` für die Schicht `Y = X @ W + b`. Rückgabe: `(dX, dW, db)` – die Gradienten nach Eingabe, Gewichten und Bias.
    starter: |
      import numpy as np

      def dense_backward(X, W, dY):
          # dX = ...
          # dW = ...
          # db = ...
          return dX, dW, db
    solution: |
      import numpy as np

      def dense_backward(X, W, dY):
          dX = dY @ W.T
          dW = X.T @ dY
          db = dY.sum(axis=0)
          return dX, dW, db
    tests:
      - name: Shapes
        code: |
          import numpy as np
          rng = np.random.default_rng(1)
          Xt, Wt, dYt = rng.normal(size=(6, 4)), rng.normal(size=(4, 3)), rng.normal(size=(6, 3))
          dX, dW, db = dense_backward(Xt, Wt, dYt)
          assert np.shape(dX) == (6, 4), f"dX sollte Shape (6, 4) haben, hat {np.shape(dX)}"
          assert np.shape(dW) == (4, 3), f"dW sollte Shape (4, 3) haben, hat {np.shape(dW)}"
          assert np.shape(db) == (3,), f"db sollte Shape (3,) haben, hat {np.shape(db)}"
      - name: Werte gegen numerische Ableitung
        code: |
          import numpy as np
          rng = np.random.default_rng(1)
          Xt, Wt, dYt = rng.normal(size=(6, 4)), rng.normal(size=(4, 3)), rng.normal(size=(6, 3))
          bt = rng.normal(size=3)
          # Verlust L = sum(dY * Y) hat genau dY als Gradient nach Y
          L = lambda X, W, b: np.sum(dYt * (X @ W + b))
          dX, dW, db = dense_backward(Xt, Wt, dYt)
          h = 1e-6
          for name, arr, got in [("dX", Xt, dX), ("dW", Wt, dW), ("db", bt, db)]:
              num = np.zeros_like(arr)
              for i in range(arr.size):
                  old = arr.flat[i]
                  arr.flat[i] = old + h
                  fp = L(Xt, Wt, bt)
                  arr.flat[i] = old - h
                  fm = L(Xt, Wt, bt)
                  arr.flat[i] = old
                  num.flat[i] = (fp - fm) / (2 * h)
              assert close(got, num, 1e-5), f"{name} stimmt nicht mit der numerischen Ableitung überein"
    mutants:
      - |
        import numpy as np
        def dense_backward(X, W, dY):
            return dY @ W.T, X.T @ dY, dY.mean(axis=0)
      - |
        import numpy as np
        def dense_backward(X, W, dY):
            return X.T @ dY, dY @ W.T, dY.sum(axis=0)
      - |
        import numpy as np
        def dense_backward(X, W, dY):
            return dY @ W, X.T @ dY, dY.sum(axis=0)
      - |
        import numpy as np
        def dense_backward(X, W, dY):
            return dY @ W.T, X.T @ dY, dY.sum(axis=1)
    hints:
      - "Teilziel: jeder Gradient hat die Shape seiner Größe – `X`, `W` bzw. `b`."
      - "Für $Y = XW$: `dW = X.T @ dY`, `dX = dY @ W.T`. Der Bias wirkt auf jede Zeile."
      - "`db = dY.sum(axis=0)`"
    explanation: |
      Der Test nutzt einen Trick: Für $L = \sum_{ij} dY_{ij} Y_{ij}$ ist $\partial L / \partial Y$ genau `dY`.
  - type: quiz
    question: |
      Du standardisierst Merkmale. Welche Statistik verwendest du für die Testdaten?
    options:
