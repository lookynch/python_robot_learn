id: m12-lineare-regression
title: Lineare Regression
minutes: 10
goals:
  - Ein lineares Modell vektorisiert als `X @ w + b` schreiben
  - Die Ausgleichsgerade geschlossen mit `lstsq` berechnen
  - Den MSE-Gradienten selbst implementieren und Gradientenabstieg mit Lernkurve laufen lassen
concepts: [ml-lineare-regression, ml-mse-gradient]
steps:
  - type: text
    body: |
      ## Lernen = Verlust minimieren

      Ein Kraftsensor liefert eine Spannung $x$ (V), gesucht ist die Kraft $y$ (N). Aus $N$ Messpaaren soll ein Modell entstehen:

      $$\hat y = w x + b$$

      „Gut“ heißt: Der **mittlere quadratische Fehler** (Mean Squared Error, MSE) ist klein.

      $$L(w, b) = \frac1N \sum_{i=1}^{N} (\hat y_i - y_i)^2$$

      Mit $d$ Merkmalen (Features) wird daraus $\hat{\mathbf y} = X\mathbf w + b$ mit `X.shape == (N, d)` und `w.shape == (d,)`.

      Konvention für das ganze Modul: **eine Zeile von `X` = ein Beispiel.**
  - type: example
    intro: |
      Für lineare Modelle gibt es eine geschlossene Lösung – die Ausgleichsgerade aus Modul 5. Eine Spalte Einsen in `A` übernimmt den Achsenabschnitt $b$.
    code: |
      import numpy as np
      import lab

      rng = np.random.default_rng(0)
      x = rng.uniform(0, 5, 30)                     # Spannung in V
      y = 2.0 * x + 1.0 + rng.normal(0, 0.5, 30)    # Kraft in N, verrauscht

      A = np.column_stack([x, np.ones_like(x)])     # (30, 2)
      w, b = np.linalg.lstsq(A, y, rcond=None)[0]
      print(f"w = {w:.3f} N/V, b = {b:.3f} N")

      xs = np.linspace(0, 5, 50)
      fig = lab.Figure(title="Ausgleichsgerade", xlabel="Spannung (V)", ylabel="Kraft (N)")
      fig.scatter(x, y, label="Messung")
      fig.line(w * xs + b, x=xs, label="Fit")
      fig.show()
    subgoals:
      - lines: [4, 6]
        label: Daten erzeugen
      - lines: [8, 10]
        label: Geschlossen lösen
      - lines: [12, 16]
        label: Fit zeichnen
    after: |
      Die wahren Werte waren $w = 2$, $b = 1$ – das Rauschen verschiebt die Schätzung etwas. Für Modelle, die **nicht linear in den Parametern** sind (neuronale Netze), gibt es keine solche Formel. Dann braucht man iterative Verfahren wie den Gradientenabstieg.
  - type: predict
    intro: |
      Shapes sind beim ML-Code die häufigste Fehlerquelle. Vorhersage zuerst:
    code: |
      import numpy as np
      X = np.ones((50, 3))
      w = np.ones(3)
      print((X @ w).shape)
      print((X.T @ (X @ w)).shape)
    options:
      - |
        (50,)
        (3,)
      - |
        (50, 1)
        (3, 1)
      - |
        (3,)
        (50,)
      - |
        (50, 3)
        (3,)
    answer: |
      (50,)
      (3,)
    explanation: |
      `(50, 3) @ (3,)` ergibt einen Vektor mit einem Wert pro Beispiel: `(50,)`. `X.T` hat Shape `(3, 50)`, mal `(50,)` ergibt `(3,)` – genau die Shape von `w`. Ein 1D-Array ist weder Zeilen- noch Spaltenvektor, deshalb nicht `(50, 1)`.
  - type: example
    intro: |
      Der Gradient des MSE (Kettenregel, Modul 7):

      $$\nabla_{\mathbf w} L = \frac{2}{N} X^\top(\hat{\mathbf y} - \mathbf y), \qquad \frac{\partial L}{\partial b} = \frac{2}{N}\sum_i (\hat y_i - y_i)$$

      Shape-Probe: `(d, N) @ (N,)` → `(d,)`. **Ein Gradient hat immer die Shape seines Parameters.**
    code: |
      import numpy as np
      import lab

      rng = np.random.default_rng(0)
      x = rng.uniform(0, 5, 30)
      y = 2.0 * x + 1.0 + rng.normal(0, 0.5, 30)
      X = x.reshape(-1, 1)              # (30, 1): N Beispiele, d = 1
      N = len(y)

      w = np.zeros(1)
      b = 0.0
      lr = 0.05
      losses = []
      for step in range(300):
          err = X @ w + b - y           # (N,)
          losses.append(np.mean(err ** 2))
          gw = 2 * X.T @ err / N        # (1,) wie w
          gb = 2 * np.mean(err)
          w = w - lr * gw
          b = b - lr * gb

      print(f"w = {w[0]:.3f}, b = {b:.3f}, MSE = {losses[-1]:.3f}")
      lab.plot(losses, title="Lernkurve", xlabel="Schritt", ylabel="MSE", logy=True)
    subgoals:
      - lines: [4, 8]
        label: Daten als Matrix vorbereiten
      - lines: [10, 13]
        label: Parameter initialisieren
      - lines: [15, 16]
        label: Fehler und Verlust berechnen
      - lines: [17, 18]
        label: Gradient berechnen
      - lines: [19, 20]
        label: Parameter aktualisieren
    after: |
      Nach 300 Schritten landet der Abstieg bei derselben Lösung wie `lstsq`. Die **Lernkurve** (Verlust über Schritte, logarithmisch) ist dein wichtigstes Diagnosewerkzeug: Sie soll fallen und dann abflachen.
  - type: explain
    question: |
      Warum steht im Gradienten `X.T @ err` und nicht `X @ err`?
    options:
      - text: Jedes Gewicht $w_j$ sammelt die Fehler, gewichtet mit seiner Merkmalsspalte; `X.T @ err` summiert über die N Beispiele und liefert eine Zahl pro Gewicht.
        correct: true
        why: Genau – $\partial L/\partial w_j \propto \sum_i x_{ij}\,\mathrm{err}_i$, das ist Zeile $j$ von $X^\top$ mal `err`. Ergebnis-Shape `(d,)` wie `w`.
      - text: "`X @ err` liefert dasselbe, `.T` ist nur schneller."
        correct: false
        why: "`(N, d) @ (N,)` passt nicht zusammen – NumPy meldet einen `ValueError` (außer zufällig bei N = d, dann ist es falsch statt laut)."
      - text: Das Transponieren dreht das Vorzeichen, damit es bergab geht.
        correct: false
        why: Transponieren ändert keine Vorzeichen. Bergab geht es durch das Minus im Update `w - lr * gw`.
      - text: NumPy speichert Matrizen spaltenweise, deshalb muss man transponieren.
        correct: false
        why: Die Speicherreihenfolge ist für die Mathematik egal; es geht um die Summation über die Beispiele.
  - type: fill
    fading: true
    prompt: |
      Zwei Merkmale, wahre Gewichte `[1.5, -2.0]`, Bias `0.5`. Ergänze Gradient und Update, sodass der Abstieg die wahren Werte findet.
    code: |
      import numpy as np
      rng = np.random.default_rng(1)
      X = rng.normal(size=(40, 2))
      y = X @ np.array([1.5, -2.0]) + 0.5
      N = len(y)
      w = np.zeros(2)
      b = 0.0
      for step in range(200):
          err = X @ w + b - y
          gw = 2 * ___ @ err / N
          gb = 2 * np.mean(err)
          w = w ___ 0.1 * gw
          b = b - 0.1 * gb
      print(np.round(w, 2), round(b, 2))
    blanks:
      - answer: X.T
        options: [X.T, X, err.T, y]
      - answer: "-"
        options: ["-", "+", "*"]
    expect_output: "[ 1.5 -2. ] 0.5"
    explanation: |
      `X.T @ err` hat Shape `(2,)`. `err.T` ist bei einem 1D-Array dasselbe wie `err` – das Ergebnis wäre ein Skalar, beide Gewichte bekämen denselben Schritt. Mit `+` läuft man bergauf, der Verlust explodiert.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `grad(X, y, w, b)`, die den MSE-Gradienten zurückgibt: `gw` (Shape wie `w`) und `gb` (eine Zahl). Arbeite vektorisiert, ohne Schleife über die Beispiele.
    starter: |
      import numpy as np

      def grad(X, y, w, b):
          err = X @ w + b - y
          # gw = ...
          # gb = ...
          return gw, gb
    solution: |
      import numpy as np

      def grad(X, y, w, b):
          err = X @ w + b - y
          gw = 2 * X.T @ err / len(y)
          gb = 2 * np.mean(err)
          return gw, gb
    tests:
      - name: Shape von gw
        code: |
          import numpy as np
          rng = np.random.default_rng(5)
          Xt, yt, wt = rng.normal(size=(7, 3)), rng.normal(size=7), rng.normal(size=3)
          gw, gb = grad(Xt, yt, wt, 0.3)
          assert np.shape(gw) == (3,), f"gw sollte die Shape von w haben (3,), hat {np.shape(gw)}"
      - name: Werte stimmen mit numerischer Ableitung überein
        code: |
          import numpy as np
          rng = np.random.default_rng(5)
          Xt, yt, wt = rng.normal(size=(7, 3)), rng.normal(size=7), rng.normal(size=3)
          def mse(w, b):
              return np.mean((Xt @ w + b - yt) ** 2)
          h = 1e-6
          num_w = np.array([(mse(wt + h * e, 0.3) - mse(wt - h * e, 0.3)) / (2 * h) for e in np.eye(3)])
          num_b = (mse(wt, 0.3 + h) - mse(wt, 0.3 - h)) / (2 * h)
          gw, gb = grad(Xt, yt, wt, 0.3)
          assert close(gw, num_w, 1e-5), f"gw erwartet {np.round(num_w, 4)}, bekommen {np.round(gw, 4)}"
          assert close(gb, num_b, 1e-5), f"gb erwartet {num_b:.4f}, bekommen {float(gb):.4f}"
      - name: Gradient null bei perfektem Fit
        code: |
          import numpy as np
          Xt = np.array([[1.0, 2.0], [0.0, 1.0], [3.0, -1.0]])
          yt = Xt @ np.array([2.0, -1.0]) + 4.0
          gw, gb = grad(Xt, yt, np.array([2.0, -1.0]), 4.0)
          assert close(gw, [0, 0]) and close(gb, 0), f"Bei exakt passenden Parametern sollte der Gradient 0 sein, ist {gw}, {gb}"
    mutants:
      - |
        import numpy as np
        def grad(X, y, w, b):
            err = X @ w + b - y
            gw = X.T @ err / len(y)
            gb = np.mean(err)
            return gw, gb
      - |
        import numpy as np
        def grad(X, y, w, b):
            err = X @ w + b - y
            gw = 2 * X.T @ err
            gb = 2 * np.sum(err)
            return gw, gb
      - |
        import numpy as np
        def grad(X, y, w, b):
            err = y - (X @ w + b)
            gw = 2 * X.T @ err / len(y)
            gb = 2 * np.mean(err)
            return gw, gb
      - |
        import numpy as np
        def grad(X, y, w, b):
            err = X @ w + b - y
            gw = 2 * np.mean(X.T * err)
            gb = 2 * np.mean(err)
            return gw, gb
    hints:
      - "Teilziel: Gradient berechnen – eine Zahl pro Gewicht, gemittelt über die Beispiele."
      - "Formel: $\\nabla_w L = \\frac{2}{N} X^\\top \\mathrm{err}$ und $\\partial L/\\partial b = \\frac{2}{N}\\sum \\mathrm{err}$. `N` ist `len(y)`."
      - "`gw = 2 * X.T @ err / len(y)`"
      - "`gb = 2 * np.mean(err)`"
    explanation: |
      Der Test vergleicht mit einer **numerischen Ableitung** (zentrale Differenz). Dieses Muster – analytisch rechnen, numerisch prüfen – wirst du beim Backprop wieder brauchen.
  - type: quiz
    question: |
      Wann brauchst du Gradientenabstieg statt `np.linalg.lstsq`?
    options:
      - text: Wenn das Modell nicht linear in den Parametern ist, z. B. ein neuronales Netz.
        correct: true
        why: Dann gibt es keine Normalgleichung mehr; man muss iterativ bergab gehen.
      - text: Wenn die Daten verrauscht sind.
        correct: false
        why: "`lstsq` ist gerade für verrauschte, überbestimmte Systeme gemacht."
      - text: Immer – Gradientenabstieg ist genauer als `lstsq`.
        correct: false
        why: Für lineare Regression liefert `lstsq` das exakte Minimum; Gradientenabstieg nähert sich ihm nur an.
      - text: Wenn es mehr Beispiele als Parameter gibt.
        correct: false
        why: Das ist der Normalfall, für den `lstsq` die Ausgleichslösung liefert.
cards:
  - id: m12-c-shape-xw
    concept: ml-lineare-regression
    variants:
      - type: predict
        code: |
          import numpy as np
          X = np.zeros((20, 4))
          w = np.zeros(4)
          print((X @ w).shape)
        options: ["(20,)", "(4,)", "(20, 4)", "(20, 1)"]
        answer: "(20,)"
        explanation: Eine Vorhersage pro Beispiel (Zeile).
      - type: predict
        code: |
          import numpy as np
          X = np.zeros((8, 3))
          err = np.zeros(8)
          print((X.T @ err).shape)
        options: ["(3,)", "(8,)", "(3, 8)", "()"]
        answer: "(3,)"
        explanation: "`(3, 8) @ (8,)` summiert über die 8 Beispiele – eine Zahl pro Gewicht."
  - id: m12-c-mse-update
    concept: ml-mse-gradient
    variants:
      - type: quiz
        question: |
          Der Verlust in deiner Lernkurve steigt mit jedem Schritt und wird schließlich `inf`. Was ist die wahrscheinlichste Ursache?
        options:
          - text: Zu große Lernrate oder `+` statt `-` im Update.
            correct: true
            why: Beides lässt den Abstieg divergieren.
          - text: Zu wenige Schritte.
            correct: false
            why: Dann wäre der Verlust nur noch nicht klein, er würde aber fallen.
          - text: Der Bias `b` fehlt.
            correct: false
            why: Ohne Bias wird der Fit schlechter, divergiert aber nicht.
      - type: quiz
        question: |
          `w.shape == (5,)`. Welche Shape muss `gw` haben, damit `w - lr * gw` sinnvoll ist?
        options:
          - text: "`(5,)`"
            correct: true
            why: Ein Gradient hat immer die Shape seines Parameters.
          - text: "`(N,)`"
            correct: false
            why: Das ist die Shape des Fehlervektors, nicht des Gradienten.
          - text: "`(N, 5)`"
            correct: false
            why: Das wäre ein Gradient pro Beispiel – er muss noch über die Beispiele gemittelt werden.
  - id: m12-c-einsen-spalte
    concept: ml-lineare-regression
    variants:
      - type: quiz
        question: |
          Wozu dient die Spalte Einsen in `A = np.column_stack([x, np.ones_like(x)])`?
        options:
          - text: Ihr Koeffizient ist der Achsenabschnitt $b$.
            correct: true
            why: "$[x_i, 1] \\cdot [w, b] = w x_i + b$."
          - text: Sie normiert die Daten.
            correct: false
            why: Eine konstante Spalte verändert die Merkmale nicht.
          - text: Sie verhindert, dass `lstsq` durch null teilt.
            correct: false
            why: Mit der Lösbarkeit hat sie nichts zu tun – sie erweitert das Modell um einen konstanten Term.
      - type: quiz
        question: |
          Du lässt bei `A` die Einsen-Spalte weg. Was passiert mit der Ausgleichsgeraden?
        options:
          - text: Sie muss durch den Ursprung gehen.
            correct: true
            why: Ohne konstanten Term ist $\hat y = w x$, also $\hat y(0) = 0$.
          - text: Nichts, `lstsq` ergänzt den Bias automatisch.
            correct: false
            why: "`lstsq` löst genau das System, das du übergibst."
          - text: Sie wird waagerecht.
            correct: false
            why: Waagerecht wäre ein Modell nur mit Bias.
