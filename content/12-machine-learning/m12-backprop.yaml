id: m12-backprop
title: Backpropagation von Hand
minutes: 12
goals:
  - Für jede Operation des Vorwärtsdurchlaufs die passende Rückwärtsregel anwenden
  - Gradienten eines MLP mit einer verborgenen Schicht vektorisiert in NumPy berechnen
  - Mit den eigenen Gradienten ein Netz auf eine Sinuskurve trainieren
concepts: [ml-backprop]
steps:
  - type: text
    body: |
      ## Kettenregel, rückwärts

      Der Rechengraph aus Modul 7, jetzt mit Matrizen. Schreibweise: `dW` bedeutet $\partial L / \partial W$ und hat **dieselbe Shape wie `W`**.

      | Vorwärts | Rückwärts |
      |---|---|
      | `L = mean((out - Y)**2)` | `d_out = 2 * (out - Y) / N` |
      | `out = H @ W2 + b2` | `dW2 = H.T @ d_out`, `db2 = d_out.sum(axis=0)`, `dH = d_out @ W2.T` |
      | `H = tanh(Z1)` | `dZ1 = dH * (1 - H**2)` |
      | `Z1 = X @ W1 + b1` | `dW1 = X.T @ dZ1`, `db1 = dZ1.sum(axis=0)` |

      Faustregel für $Y = XW$: **`dW = X.T @ dY`, `dX = dY @ W.T`** – die Transponierten stehen immer so, dass die Shapes passen.
  - type: example
    code: |
      import numpy as np

      rng = np.random.default_rng(0)
      X = rng.normal(size=(6, 2))                   # N = 6, 2 Merkmale
      Y = rng.normal(size=(6, 1))
      P = {"W1": rng.normal(size=(2, 4)), "b1": np.zeros(4),
           "W2": rng.normal(size=(4, 1)), "b2": np.zeros(1)}

      # vorwärts
      Z1 = X @ P["W1"] + P["b1"]                    # (6, 4)
      H = np.tanh(Z1)                               # (6, 4)
      out = H @ P["W2"] + P["b2"]                   # (6, 1)
      loss = np.mean((out - Y) ** 2)

      # rückwärts
      d_out = 2 * (out - Y) / len(X)                # (6, 1)
      dW2 = H.T @ d_out                             # (4, 1)
      db2 = d_out.sum(axis=0)                       # (1,)
      dH = d_out @ P["W2"].T                        # (6, 4)
      dZ1 = dH * (1 - H ** 2)                       # (6, 4)
      dW1 = X.T @ dZ1                               # (2, 4)
      db1 = dZ1.sum(axis=0)                         # (4,)
      print(dW1.shape, db1.shape, dW2.shape, db2.shape)
    subgoals:
      - lines: [3, 7]
        label: Daten und Parameter
      - lines: [9, 13]
        label: Vorwärts rechnen und Zwischenwerte merken
      - lines: [15, 16]
        label: Gradient am Ausgang
      - lines: [17, 19]
        label: Durch die Ausgabeschicht zurück
      - lines: [20, 22]
        label: Durch die Aktivierung und die erste Schicht zurück
    after: |
      Rückwärts braucht man `H` (und `X`) aus dem Vorwärtsdurchlauf – deshalb merkt man sich die Zwischenwerte (**Cache**). Die Ableitung $\tanh'(z) = 1 - \tanh^2(z)$ lässt sich direkt aus `H` berechnen.
  - type: predict
    code: |
      import numpy as np
      X = np.zeros((64, 2))
      W1 = np.zeros((2, 10))
      dZ1 = np.zeros((64, 10))
      dW1 = X.T @ dZ1
      db1 = dZ1.sum(axis=0)
      print(dW1.shape, db1.shape)
    options:
      - "(2, 10) (10,)"
      - "(64, 10) (64,)"
      - "(10, 2) (10,)"
      - "(2, 10) (64,)"
    answer: "(2, 10) (10,)"
    explanation: |
      `dW1` hat die Shape von `W1`: `(2, 64) @ (64, 10)` → `(2, 10)`. `sum(axis=0)` summiert über die 64 Beispiele – übrig bleibt ein Wert pro Neuron wie bei `b1`.
  - type: explain
    question: |
      Warum ist `db1 = dZ1.sum(axis=0)` – eine Summe über die Beispiele?
    options:
      - text: Derselbe Bias wird per Broadcasting zu jeder Zeile addiert; er beeinflusst den Verlust über alle Beispiele, also addieren sich die Beiträge.
        correct: true
        why: "Mehrfach verwendete Größe → Gradienten summieren (mehrvariable Kettenregel). Der Faktor $1/N$ steckt schon in `d_out`."
      - text: Man könnte genauso `mean` nehmen, das ist nur eine Konvention.
        correct: false
        why: "`d_out` enthält bereits $1/N$. Mit `mean` würde der Bias-Gradient noch einmal durch $N$ geteilt – falsch skaliert."
      - text: Damit die Shape zu `W1` passt.
        correct: false
        why: "`db1` muss die Shape von `b1` haben, `(d_out,)`, nicht die von `W1`."
      - text: "`axis=0` summiert über die Neuronen."
        correct: false
        why: "Achse 0 ist die Batch-Achse; über die Neuronen würde `axis=1` summieren."
  - type: fill
    fading: true
    prompt: |
      Ergänze die Gradienten der Ausgabeschicht `out = H @ W2 + b2`.
    code: |
      import numpy as np
