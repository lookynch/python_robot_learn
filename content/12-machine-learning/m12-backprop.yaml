      H = np.tanh(rng.normal(size=(5, 3)))
      W2, b2 = rng.normal(size=(3, 1)), np.zeros(1)
      Y = rng.normal(size=(5, 1))
      out = H @ W2 + b2
      d_out = 2 * (out - Y) / len(H)
      dW2 = ___ @ d_out
      db2 = d_out.___
    blanks:
      - answer: H.T
        options: [H.T, H, W2.T]
      - answer: sum(axis=0)
        options: [sum(axis=0), mean(axis=0), sum(axis=1)]
    tests:
      - name: Gradienten der Ausgabeschicht
        code: |
          import numpy as np
          def loss_of(W, b):
              return np.mean((H @ W + b - Y) ** 2)
          h = 1e-6
          num_W = np.zeros_like(W2)
          for i in range(3):
              E = np.zeros_like(W2)
              E[i, 0] = h
              num_W[i, 0] = (loss_of(W2 + E, b2) - loss_of(W2 - E, b2)) / (2 * h)
          num_b = (loss_of(W2, b2 + h) - loss_of(W2, b2 - h)) / (2 * h)
          assert np.shape(dW2) == (3, 1), f"dW2 sollte Shape (3, 1) haben, hat {np.shape(dW2)}"
          assert close(dW2, num_W, 1e-5), f"dW2 erwartet {num_W.ravel().round(4)}, bekommen {np.ravel(dW2).round(4)}"
          assert np.shape(db2) == (1,), f"db2 sollte Shape (1,) haben, hat {np.shape(db2)}"
          assert close(db2, num_b, 1e-5), f"db2 erwartet {num_b:.4f}, bekommen {db2}"
    explanation: |
      `H.T @ d_out`: `(3, 5) @ (5, 1)` → `(3, 1)`. `sum(axis=1)` würde pro Beispiel summieren und `(5,)` liefern.
  - type: exercise
    mode: make
    prompt: |
      Vervollständige `backward`: Die Ausgabeschicht ist fertig. Ergänze `dH`, `dZ1`, `dW1` und `db1` für die tanh-Schicht. Der Test vergleicht alle vier Gradienten mit einer numerischen Ableitung.
    starter: |
      import numpy as np

      def forward(X, P):
          H = np.tanh(X @ P["W1"] + P["b1"])
          out = H @ P["W2"] + P["b2"]
          return out, H

      def backward(X, Y, P, out, H):
          d_out = 2 * (out - Y) / len(X)
          dW2 = H.T @ d_out
          db2 = d_out.sum(axis=0)
          # dH = ...
          # dZ1 = ...
          # dW1 = ...
          # db1 = ...
          return {"W1": dW1, "b1": db1, "W2": dW2, "b2": db2}
    solution: |
      import numpy as np

      def forward(X, P):
          H = np.tanh(X @ P["W1"] + P["b1"])
          out = H @ P["W2"] + P["b2"]
          return out, H

      def backward(X, Y, P, out, H):
          d_out = 2 * (out - Y) / len(X)
          dW2 = H.T @ d_out
          db2 = d_out.sum(axis=0)
          dH = d_out @ P["W2"].T
          dZ1 = dH * (1 - H ** 2)
          dW1 = X.T @ dZ1
          db1 = dZ1.sum(axis=0)
          return {"W1": dW1, "b1": db1, "W2": dW2, "b2": db2}
    tests:
      - name: Gradienten stimmen mit numerischer Ableitung überein
        code: |
          import numpy as np
          rng = np.random.default_rng(3)
          Xt, Yt = rng.normal(size=(6, 2)), rng.normal(size=(6, 1))
          Pt = {"W1": rng.normal(size=(2, 4)), "b1": rng.normal(size=4),
                "W2": rng.normal(size=(4, 1)), "b2": rng.normal(size=1)}
          def loss_of(P):
              o = np.tanh(Xt @ P["W1"] + P["b1"]) @ P["W2"] + P["b2"]
              return np.mean((o - Yt) ** 2)
          out_t, H_t = forward(Xt, Pt)
          G = backward(Xt, Yt, Pt, out_t, H_t)
          for k in ["W2", "b2", "W1", "b1"]:
              num = np.zeros_like(Pt[k])
              for i in range(Pt[k].size):
                  Q = {n: v.copy() for n, v in Pt.items()}
                  Q[k].flat[i] += 1e-6
                  fp = loss_of(Q)
                  Q[k].flat[i] -= 2e-6
                  num.flat[i] = (fp - loss_of(Q)) / 2e-6
              assert np.shape(G[k]) == Pt[k].shape, f"d{k} sollte Shape {Pt[k].shape} haben, hat {np.shape(G[k])}"
              assert close(G[k], num, 1e-5), f"d{k} stimmt nicht: erwartet {num.ravel()[:4].round(4)}, bekommen {np.ravel(G[k])[:4].round(4)}"
    mutants:
