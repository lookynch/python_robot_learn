    solution: |
      import numpy as np

      GOAL = 3.0

      def reward(X):
          return (np.abs(X - GOAL) < 0.2).astype(float)

      def value(x):
          return -np.abs(x - GOAL)

      def plan(x, mu, rng, H=5, N=200, gamma=0.95, temp=0.1):
          U = np.clip(mu + 0.5 * rng.standard_normal((N, H)), -1, 1)
          X = x + 0.1 * np.cumsum(U, axis=1)
          score = np.sum(reward(X) * gamma ** np.arange(H), axis=1)
          score = score + gamma ** H * value(X[:, -1])
          w = np.exp((score - score.max()) / temp)
          w = w / w.sum()
          return w @ U

      def run(x0=0.0, steps=50, seed=0):
          rng = np.random.default_rng(seed)
          x, mu = x0, np.zeros(5)
          for _ in range(steps):
              mu = plan(x, mu, rng)
              x = x + 0.1 * mu[0]
              mu = np.append(mu[1:], mu[-1])
          return x

      print("Ende:", round(run(), 2), "m")
    tests:
      - name: Von links zum Ziel
        code: |
          for seed in [0, 1, 2]:
              x = run(0.0, seed=seed)
              assert abs(x - 3.0) < 0.2, f"Start bei 0 m (Seed {seed}): Endposition {x:.2f} m, sollte innerhalb von 0,2 m um 3 m liegen."
      - name: Von rechts zum Ziel
        code: |
          x = run(5.5, seed=3)
          assert abs(x - 3.0) < 0.2, f"Start bei 5,5 m: Endposition {x:.2f} m, sollte nahe 3 m liegen."
      - name: Belohnungen zählen weiter
        code: |
          r = np.random.default_rng(0)
          mu = plan(2.6, np.zeros(5), r)
          assert np.all(np.abs(mu) <= 1.0) and np.shape(mu) == (5,), f"plan soll weiterhin 5 Aktionen in [-1, 1] liefern, bekommen {mu}"
    mutants:
