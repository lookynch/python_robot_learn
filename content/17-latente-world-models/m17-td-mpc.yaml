      - |
        import numpy as np
        GOAL = 3.0
        def reward(X):
            return (np.abs(X - GOAL) < 0.2).astype(float)
        def value(x):
            return -np.abs(x - GOAL)
        def plan(x, mu, rng, H=5, N=200, gamma=0.95, temp=0.1):
            U = np.clip(mu + 0.5 * rng.standard_normal((N, H)), -1, 1)
            X = x + 0.1 * np.cumsum(U, axis=1)
            score = np.sum(reward(X) * gamma ** np.arange(H), axis=1)
            score = score + gamma ** H * value(x)
            w = np.exp((score - score.max()) / temp)
            w = w / w.sum()
            return w @ U
        def run(x0=0.0, steps=50, seed=0):
            rng = np.random.default_rng(seed)
            x, mu = x0, np.zeros(5)
            for _ in range(steps):
                mu = plan(x, mu, rng)
                x = x + 0.1 * mu[0]
                mu = np.append(mu[1:], mu[-1])
            return x
    hints:
      - "Teilziel: Zu jeder Folge den abgezinsten Wert ihres letzten vorgestellten Zustands addieren."
      - "`X` hat die Form `(N, H)`; die letzten Zustände aller Folgen sind `X[:, -1]`. Der Abzinsungsfaktor ist $\\gamma^H$."
      - "`score = score + ...`"
      - "`score = score + gamma ** H * value(X[:, -1])`"
    explanation: |
      Ließest du die Belohnungen im Horizont weg und nutztest **nur** den Endwert, käme der Punkt hier ebenfalls ans Ziel. Bei Aufgaben, in denen kurzfristige Belohnung und Wert nicht in dieselbe Richtung zeigen (z. B. ein Hindernis mit Strafe), verschenkt das aber Information – TD-MPC nutzt beides.
  - type: quiz
    question: |
      TD-MPC verzichtet auf einen Decoder. Was ist der Hauptgrund?
    options:
      - text: Der latente Raum soll nur enthalten, was für Belohnung und Wert wichtig ist – Pixel zu rekonstruieren würde Kapazität für Unwichtiges verbrauchen.
        correct: true
        why: Stattdessen sorgt die latente Konsistenz dafür, dass das Dynamikmodell zu den codierten Beobachtungen passt.
      - text: Decoder sind mathematisch unmöglich für latente Modelle.
        correct: false
        why: Dreamer und PlaNet haben einen Decoder.
      - text: Weil TD-MPC keine Bilder, sondern nur Zahlen verarbeiten kann.
        correct: false
        why: TD-MPC wurde auch mit Bildbeobachtungen eingesetzt.
  - type: quiz
    question: |
      Was unterscheidet TD-MPC beim **Handeln** von Dreamer?
    options:
      - text: TD-MPC plant in jedem Schritt mit MPPI im Modell (Policy und Wert helfen nur); Dreamer führt die Aktion seines in der Vorstellung trainierten Actors direkt aus.
        correct: true
        why: Online-Planung ist rechenintensiver, kann aber Fehler der Policy ausgleichen.
      - text: Dreamer plant mit CEM, TD-MPC nutzt nur die Policy.
        correct: false
        why: Genau umgekehrt.
      - text: Kein Unterschied – beide handeln identisch.
        correct: false
        why: Beide lernen in einem latenten Modell, nutzen es aber verschieden.
cards:
  - id: m17-c-td-mpc-endwert
    concept: lwm-td-mpc
    variants:
      - type: quiz
        question: Was ersetzt in TD-MPC den Teil der Zukunft hinter dem Planungshorizont?
        options:
          - text: Der gelernte Wert $Q(z_H, \pi(z_H))$ am Ende jeder vorgestellten Folge.
            correct: true
            why: Er schätzt die Belohnungen nach dem Horizont.
          - text: Ein längerer Horizont von 1000 Schritten.
            correct: false
            why: TD-MPC plant gerade kurz.
          - text: Der Decoder.
            correct: false
            why: TD-MPC hat keinen Decoder.
      - type: quiz
        question: Warum hilft ein Endwert besonders bei **spärlichen** Belohnungen?
        options:
          - text: Liegt die Belohnung außerhalb des Horizonts, sehen alle Folgen gleich aus – nur der Endwert unterscheidet sie.
            correct: true
            why: Wie im Beispiel mit dem Ziel bei 3 m.
          - text: Weil spärliche Belohnungen negativ sind.
            correct: false
            why: Spärlich heißt selten, nicht negativ.
          - text: Weil der Endwert die Belohnungsfunktion verändert.
            correct: false
            why: Er ergänzt die Bewertung, die Belohnung bleibt gleich.
  - id: m17-c-told
    concept: lwm-td-mpc
    variants:
      - type: quiz
        question: Womit wird der latente Raum von TD-MPC trainiert?
        options:
          - text: Belohnungsvorhersage, TD-Lernen des Werts und latente Konsistenz der Dynamik.
            correct: true
            why: Alles Signale, die mit der Aufgabe zu tun haben – keine Pixelrekonstruktion.
          - text: Nur mit Bildrekonstruktion.
            correct: false
            why: Das ist der Ansatz von Autoencoder/VAE-basierten Modellen.
          - text: Gar nicht – der latente Raum ist fest vorgegeben.
            correct: false
            why: Der Encoder wird mittrainiert.
      - type: quiz
        question: Welcher Planer steckt in TD-MPC?
        options:
          - text: MPPI – gewichtete Mittelung vieler Aktionsfolgen, ergänzt um Vorschläge der gelernten Policy.
            correct: true
            why: Bekannt aus Modul 11, hier im latenten Raum.
          - text: Value Iteration über alle Zustände.
            correct: false
            why: Kontinuierliche latente Räume lassen sich nicht vollständig aufzählen.
          - text: Gar keiner, TD-MPC ist rein modellfrei.
            correct: false
            why: "Der Name sagt es: Model Predictive Control."
