id: m17-autoencoder
title: Ein winziger Autoencoder
minutes: 9
goals:
  - Encoder, Decoder und latenten Vektor $z$ erklären
  - Einen linearen Autoencoder mit Gradientenabstieg trainieren
  - Rekonstruktionen beurteilen und ihre Grenzen benennen
concepts: [lwm-autoencoder]
steps:
  - type: text
    body: |
      ## Komprimieren und wiederherstellen

      Ein **Autoencoder** besteht aus zwei Teilen:

      - **Encoder**: $z = \text{enc}(o)$ – aus 256 Pixeln wird ein kleiner **latenter** Vektor, hier mit $k = 8$ Zahlen.
      - **Decoder**: $\hat o = \text{dec}(z)$ – aus $z$ wird wieder ein Bild.

      Trainiert wird nur mit dem **Rekonstruktionsfehler** $\lVert \hat o - o \rVert^2$ – ohne Labels, die Bilder sind ihr eigenes Ziel (selbstüberwacht). Der Engpass (bottleneck) von 8 Zahlen zwingt das Netz, das Wesentliche zu behalten.

      Spielversion: Encoder und Decoder sind **linear** (je eine Matrix $E$: 256×8, $D$: 8×256). Damit die Bilder sich bei kleinen Bewegungen sanft ändern, zeichnen wir die Glieder als weiche Linien.
  - type: example
    heavy: true
    code: |
      import numpy as np
      import lab

      N = 16
      c = (np.arange(N) + 0.5) / N * 4.4 - 2.2
      PX, PY = np.meshgrid(c, -c)
      P = np.stack([PX.ravel(), PY.ravel()], axis=1)

      def seg_dist(a, b):
          ab = b - a
          ap = P[None] - a[:, None]
          t = np.clip((ap * ab[:, None]).sum(-1) / (ab * ab).sum(-1)[:, None], 0, 1)
          return np.linalg.norm(ap - t[..., None] * ab[:, None], axis=-1)

      def render(q):
          p1 = np.stack([np.cos(q[:, 0]), np.sin(q[:, 0])], axis=1)
          p2 = p1 + np.stack([np.cos(q[:, 0] + q[:, 1]), np.sin(q[:, 0] + q[:, 1])], axis=1)
          d = np.minimum(seg_dist(0 * p1, p1), seg_dist(p1, p2))
          return np.exp(-(d / 0.35) ** 2)

      def train_ae(X, k, rng, epochs=100, lr=0.02):
          mu = X.mean(0)
          Xc = X - mu
          p = {"E": rng.normal(0, 0.1, (X.shape[1], k)), "D": rng.normal(0, 0.1, (k, X.shape[1]))}
          m = {n: np.zeros_like(w) for n, w in p.items()}
          v = {n: np.zeros_like(w) for n, w in p.items()}
          losses = []
          for t in range(1, epochs + 1):
              Z = Xc @ p["E"]
              G = 2 * (Z @ p["D"] - Xc) / len(X)
              g = {"D": Z.T @ G, "E": Xc.T @ (G @ p["D"].T)}
              for n in p:  # Adam
                  m[n] = 0.9 * m[n] + 0.1 * g[n]
                  v[n] = 0.999 * v[n] + 0.001 * g[n] ** 2
                  p[n] -= lr * m[n] / (1 - 0.9 ** t) / (np.sqrt(v[n] / (1 - 0.999 ** t)) + 1e-8)
              losses.append(np.sum((Z @ p["D"] - Xc) ** 2) / len(X))
          return p, mu, losses

      rng = np.random.default_rng(0)
      X = render(rng.uniform(-np.pi, np.pi, (400, 2)))
      p, mu, losses = train_ae(X, 8, rng)
      Xt = render(np.random.default_rng(1).uniform(-np.pi, np.pi, (4, 2)))
      R = (Xt - mu) @ p["E"] @ p["D"] + mu
      rel = np.mean((R - Xt) ** 2) / np.mean((mu - Xt) ** 2)
      print(f"Relativer Rekonstruktionsfehler: {rel:.2f}  (1.0 = nur Durchschnittsbild)")
      top = np.hstack(list(Xt.reshape(4, N, N)))
      bottom = np.hstack(list(R.reshape(4, N, N)))
      lab.heatmap(np.vstack([top, bottom]), title="oben: Original, unten: aus z (8 Zahlen) rekonstruiert")
    subgoals:
      - lines: [4, 19]
        label: Arm als weiches 16×16-Bild rendern
      - lines: [21, 37]
        label: Encoder und Decoder mit Adam trainieren
      - lines: [39, 41]
        label: 400 Bilder erzeugen und trainieren
      - lines: [42, 48]
        label: Neue Bilder rekonstruieren und vergleichen
    after: |
      Die Rekonstruktionen zeigen die grobe Stellung, sind aber verwaschen. Der relative Fehler von etwa 0,3 heißt: 8 Zahlen erklären rund 70 % der Abweichung vom Durchschnittsbild.
  - type: explain
    question: |
      Warum sind die Rekonstruktionen unscharf?
    options:
      - text: Ein linearer Encoder/Decoder mit 8 Zahlen kann die schmalen, gekrümmt wandernden Linien nur als Überlagerung von 8 festen Mustern darstellen.
        correct: true
        why: Echte World Models nutzen nichtlineare Faltungsnetze (CNN), die solche Strukturen viel genauer abbilden.
      - text: Weil der Decoder Zufallsrauschen hinzufügt.
        correct: false
        why: Unser Decoder ist deterministisch – die Unschärfe kommt aus der begrenzten Darstellungskraft.
      - text: Weil 100 Epochen nicht reichen; mit 10 000 Epochen wäre das Bild scharf.
        correct: false
        why: Der lineare Autoencoder ist hier schon fast am Optimum – das beste lineare 8-dimensionale Modell (PCA) ist kaum besser.
  - type: predict
    code: |
      import numpy as np
      X = np.zeros((400, 256))
      E = np.zeros((256, 8))
      D = np.zeros((8, 256))
      Z = X @ E
      print(Z.shape, (Z @ D).shape)
    options:
      - "(400, 8) (400, 256)"
      - "(8, 400) (256, 400)"
      - "(400, 256) (400, 8)"
      - "(256, 8) (8, 256)"
    answer: "(400, 8) (400, 256)"
    explanation: |
      Jede Zeile von `X` ist ein Bild. `X @ E` macht aus jeder Zeile 8 Zahlen, `Z @ D` daraus wieder 256 Pixel.
  - type: fill
    fading: true
    prompt: |
      Ergänze Encoder und Decoder. Der Mittelwert `mu` wird beim Encodieren abgezogen und beim Decodieren wieder addiert.
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      p = {"E": rng.normal(size=(6, 2)), "D": rng.normal(size=(2, 6))}
      mu = np.arange(6.0)

      def encode(X):
          return (X - mu) @ ___

      def decode(Z):
          return Z @ ___ + mu

      X = rng.normal(size=(3, 6))
      print(encode(X).shape, decode(encode(X)).shape)
    blanks:
      - answer: p["E"]
        options: ["p[\"E\"]", "p[\"D\"]", "p[\"E\"].T"]
      - answer: p["D"]
        options: ["p[\"D\"]", "p[\"E\"]", "p[\"D\"].T"]
    tests:
      - name: Werte stimmen
        code: |
          assert close(encode(X), (X - mu) @ p["E"]), "encode soll (X - mu) mit der Encoder-Matrix E multiplizieren."
          assert close(decode(np.ones((2, 2))), np.ones((2, 2)) @ p["D"] + mu), "decode soll Z mit der Decoder-Matrix D multiplizieren und mu addieren."
  - type: exercise
    mode: make
    heavy: true
    prompt: |
