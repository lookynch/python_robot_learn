    explanation: |
      Ein linearer Autoencoder mit Quadratfehler lernt im Optimum denselben Unterraum wie die Hauptkomponentenanalyse (PCA). Nichtlineare Encoder (in der Praxis Faltungsnetze) können gekrümmte Strukturen wie den Arm-„Torus“ $(q_1, q_2)$ viel besser einfangen.
  - type: quiz
    question: |
      Ha & Schmidhuber (2018) und Dreamer nutzen keinen einfachen Autoencoder, sondern einen **variationellen** (VAE) bzw. stochastische latente Zustände. Was ist der wichtigste Unterschied?
    options:
      - text: Der Encoder liefert eine Verteilung über $z$ (Mittelwert und Streuung), und ein Zusatzterm hält diese nahe an einer einfachen Normalverteilung – der latente Raum wird glatt und man kann darin sinnvoll ziehen.
        correct: true
        why: Genau das braucht man, um im latenten Raum zu „träumen“ und Zufall in Vorhersagen abzubilden.
      - text: Ein VAE hat keinen Decoder.
        correct: false
        why: Auch ein VAE rekonstruiert das Bild mit einem Decoder.
      - text: Ein VAE braucht gelabelte Daten.
        correct: false
        why: Auch der VAE lernt selbstüberwacht nur aus den Bildern.
cards:
  - id: m17-c-autoencoder
    concept: lwm-autoencoder
    variants:
      - type: quiz
        question: Womit wird ein Autoencoder trainiert?
        options:
          - text: Mit dem Fehler zwischen rekonstruiertem und Originalbild.
            correct: true
            why: Das Bild ist sein eigenes Ziel – keine Labels nötig.
          - text: Mit von Hand eingetragenen Gelenkwinkeln zu jedem Bild.
            correct: false
            why: Das wäre überwachtes Lernen einer Zustandsschätzung, kein Autoencoder.
          - text: Mit der Belohnung der Aufgabe.
            correct: false
            why: Der klassische Autoencoder kennt keine Belohnung.
      - type: quiz
        question: Was erzwingt beim Autoencoder, dass $z$ etwas Sinnvolles enthält?
        options:
          - text: Der Engpass – $z$ ist viel kleiner als das Bild, trotzdem muss das Bild daraus rekonstruiert werden.
            correct: true
            why: Ohne Engpass könnte das Netz das Bild einfach kopieren.
          - text: Die Aktivierungsfunktion tanh.
            correct: false
            why: Unser Autoencoder ist sogar ganz linear.
          - text: Die Lernrate.
            correct: false
            why: Sie steuert nur die Optimierung, nicht, was gelernt wird.
  - id: m17-c-ae-formen
    concept: lwm-autoencoder
    variants:
      - type: predict
        code: |
          import numpy as np
          X = np.zeros((50, 256))
          E = np.zeros((256, 4))
          print((X @ E).shape)
        options: ["(50, 4)", "(4, 50)", "(256, 4)", "(50, 256)"]
        answer: "(50, 4)"
