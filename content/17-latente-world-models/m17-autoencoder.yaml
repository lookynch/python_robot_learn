      - type: predict
        code: |
          import numpy as np
          Z = np.zeros((10, 8))
          D = np.zeros((8, 256))
          print((Z @ D).shape)
        options: ["(10, 256)", "(8, 256)", "(10, 8)", "(256, 10)"]
        answer: "(10, 256)"
        explanation: Der Decoder macht aus 10 latenten Vektoren 10 Bilder mit je 256 Pixeln.
