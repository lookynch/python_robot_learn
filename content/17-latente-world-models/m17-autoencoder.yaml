    solution: |
      import numpy as np

      N = 16
      c = (np.arange(N) + 0.5) / N * 4.4 - 2.2
      PX, PY = np.meshgrid(c, -c)
      P = np.stack([PX.ravel(), PY.ravel()], axis=1)

      def seg_dist(a, b):
          ab = b - a
          ap = P[None] - a[:, None]
          t = np.clip((ap * ab[:, None]).sum(-1) / (ab * ab).sum(-1)[:, None], 0, 1)
          return np.linalg.norm(ap - t[..., None] * ab[:, None], axis=-1)

      def render(q):
          p1 = np.stack([np.cos(q[:, 0]), np.sin(q[:, 0])], axis=1)
          p2 = p1 + np.stack([np.cos(q[:, 0] + q[:, 1]), np.sin(q[:, 0] + q[:, 1])], axis=1)
          d = np.minimum(seg_dist(0 * p1, p1), seg_dist(p1, p2))
          return np.exp(-(d / 0.35) ** 2)

      def train_ae(X, k, rng, epochs=100, lr=0.02):
          mu = X.mean(0)
          Xc = X - mu
          p = {"E": rng.normal(0, 0.1, (X.shape[1], k)), "D": rng.normal(0, 0.1, (k, X.shape[1]))}
          m = {n: np.zeros_like(w) for n, w in p.items()}
          v = {n: np.zeros_like(w) for n, w in p.items()}
          losses = []
          for t in range(1, epochs + 1):
              Z = Xc @ p["E"]
              G = 2 * (Z @ p["D"] - Xc) / len(X)
              g = {"D": Z.T @ G, "E": Xc.T @ (G @ p["D"].T)}
              for n in p:  # Adam
                  m[n] = 0.9 * m[n] + 0.1 * g[n]
                  v[n] = 0.999 * v[n] + 0.001 * g[n] ** 2
                  p[n] -= lr * m[n] / (1 - 0.9 ** t) / (np.sqrt(v[n] / (1 - 0.999 ** t)) + 1e-8)
              losses.append(np.sum((Z @ p["D"] - Xc) ** 2) / len(X))
          return p, mu, losses

      rng = np.random.default_rng(0)
      X = render(rng.uniform(-np.pi, np.pi, (400, 2)))
      p, mu, losses = train_ae(X, 8, rng)
      print("Verlust:", round(losses[0], 2), "->", round(losses[-1], 2))
    tests:
      - name: Formen der Gewichte
        code: |
          assert np.shape(p["E"]) == (256, 8) and np.shape(p["D"]) == (8, 256), f"E sollte (256, 8) und D (8, 256) sein, sind {np.shape(p['E'])} und {np.shape(p['D'])}"
      - name: Verlust sinkt
        code: |
          assert losses[-1] < 0.5 * losses[0], f"Der Verlust sollte deutlich sinken, ging aber von {losses[0]:.2f} auf {losses[-1]:.2f}"
      - name: Rekonstruktion neuer Bilder
        code: |
          Xt = render(np.random.default_rng(5).uniform(-np.pi, np.pi, (100, 2)))
          R = (Xt - mu) @ p["E"] @ p["D"] + mu
          rel = np.mean((R - Xt) ** 2) / np.mean((mu - Xt) ** 2)
          assert rel < 0.4, f"Relativer Rekonstruktionsfehler {rel:.2f} – sollte unter 0,4 liegen. Stimmen beide Gradienten?"
