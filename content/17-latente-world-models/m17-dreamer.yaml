  - type: quiz
    question: |
      Welche Teile von Dreamer werden mit **echten** Daten trainiert, welche nur in der Vorstellung?
    options:
      - text: Das World Model (RSSM, Decoder, Belohnungskopf) auf echten Episoden; Actor und Critic nur auf vorgestellten Trajektorien.
        correct: true
        why: Echte Interaktionen dienen dem Modell; das Verhalten wird im Modell gelernt.
      - text: Alles wird nur in der Vorstellung trainiert.
        correct: false
        why: Ohne echte Daten gäbe es kein Modell, in dem man sich etwas vorstellen könnte.
      - text: Der Actor auf echten Daten, das Modell in der Vorstellung.
        correct: false
        why: Umgekehrt – das Modell muss die Realität lernen, der Actor nutzt das Modell.
cards:
  - id: m17-c-rssm
    concept: lwm-rssm
    variants:
      - type: quiz
        question: Wofür benutzt Dreamer den **Prior** $p(z_t \mid h_t)$?
        options:
          - text: Zum Vorstellen – er sagt den nächsten Zustand ohne Bild voraus.
            correct: true
            why: In der Vorstellung gibt es keine Bilder, also nur den Prior.
          - text: Zum Rekonstruieren des Bildes.
            correct: false
            why: Das macht der Decoder aus $(h_t, z_t)$.
          - text: Zum Wählen der Aktion.
            correct: false
            why: Das ist die Aufgabe des Actors.
      - type: quiz
        question: Was enthält der deterministische Teil $h_t$ des RSSM?
        options:
          - text: Ein Gedächtnis aus früheren Zuständen und Aktionen (RNN-Zustand).
            correct: true
            why: So kann das Modell z. B. Geschwindigkeiten aus mehreren Bildern erschließen.
          - text: Das aktuelle Bild in voller Auflösung.
            correct: false
            why: Bilder werden nie vollständig im latenten Zustand gespeichert.
          - text: Den Return der Episode.
            correct: false
            why: Den schätzt der Critic.
  - id: m17-c-lambda
    concept: lwm-imagination
    variants:
      - type: quiz
        question: Was ergibt der λ-Return bei $\lambda = 0$?
        options:
          - text: Den Ein-Schritt-Zielwert $r_t + \gamma\, v(s_{t+1})$.
            correct: true
            why: Wie beim TD(0)-Update aus Modul 14.
          - text: Die Summe aller Belohnungen bis zum Horizont plus Endwert.
            correct: false
            why: Das ist der Fall $\lambda = 1$.
          - text: Immer 0.
            correct: false
            why: λ gewichtet nur zwischen kurzem und langem Ausblick.
      - type: predict
        code: |
          gamma, lam = 1.0, 0.0
          r, v = [2.0], [0.0, 3.0]
          print(r[0] + gamma * ((1 - lam) * v[1] + lam * v[1]))
        options: ["5.0", "2.0", "3.0", "0.0"]
        answer: "5.0"
        explanation: Mit einem Schritt ist $G_0 = r_0 + \gamma v_1 = 2 + 3$ – unabhängig von λ, weil $G_1 = v_1$.
