id: m17-latente-dynamik
title: Dynamik im latenten Raum
minutes: 9
goals:
  - Ein Dynamikmodell $z' = z + g(z, a)$ auf latenten Vektoren trainieren
  - Eine „Vorstellung“ (Dream) im latenten Raum rollen und decodieren
  - Erklären, warum man im latenten Raum statt in Pixeln vorhersagt
concepts: [lwm-latente-dynamik]
steps:
  - type: text
    body: |
      ## Modul 16, aber mit $z$ statt $s$

      Der Encoder macht aus jedem Bild $o_t$ einen latenten Vektor $z_t$ (8 Zahlen). Dann lernen wir genau wie in Modul 16

      $$\hat z_{t+1} = z_t + g_\theta(z_t, a_t)$$

      mit denselben Funktionen `fit_model` und `predict` – nur mit 8 statt 4 Zustandszahlen.

      Danach kann der Agent sich Zukünfte **vorstellen**: $z_0$ aus dem ersten Bild, dann nur noch das Modell. Der Decoder ist dafür gar nicht nötig – wir benutzen ihn nur, um zu **sehen**, was das Modell sich vorstellt.

      Spielversion: Den linearen Encoder berechnen wir direkt per Singulärwertzerlegung (`np.linalg.svd`). Das ergibt denselben Unterraum, den ein linearer Autoencoder im Optimum lernt (PCA), spart aber das Training.
  - type: example
    heavy: true
    code: |
      import numpy as np
      import lab
      from lab.envs import Reacher2D

      N = 16
      c = (np.arange(N) + 0.5) / N * 4.4 - 2.2
      PX, PY = np.meshgrid(c, -c)
      P = np.stack([PX.ravel(), PY.ravel()], axis=1)

      def seg_dist(a, b):
          ab = b - a
          ap = P[None] - a[:, None]
          t = np.clip((ap * ab[:, None]).sum(-1) / (ab * ab).sum(-1)[:, None], 0, 1)
          return np.linalg.norm(ap - t[..., None] * ab[:, None], axis=-1)

      def render(q):
          p1 = np.stack([np.cos(q[:, 0]), np.sin(q[:, 0])], axis=1)
          p2 = p1 + np.stack([np.cos(q[:, 0] + q[:, 1]), np.sin(q[:, 0] + q[:, 1])], axis=1)
          d = np.minimum(seg_dist(0 * p1, p1), seg_dist(p1, p2))
          return np.exp(-(d / 0.35) ** 2)

      def fit_encoder(X, k):
          mu = X.mean(0)
          _, _, Vt = np.linalg.svd(X - mu, full_matrices=False)
          return {"mu": mu, "W": Vt[:k].T}

      def encode(enc, X):
          return (X - enc["mu"]) @ enc["W"]

      def decode(enc, Z):
          return Z @ enc["W"].T + enc["mu"]

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=300, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(X.shape[1], 32, Y.shape[1], rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      env = Reacher2D(dt=0.1)
      rng = np.random.default_rng(0)
      Q = rng.uniform(-np.pi, np.pi, (800, 2))
      A = rng.uniform(-2, 2, (800, 2))
      X, X2 = render(Q), render(env.dynamics(Q, A))
      enc = fit_encoder(X, 8)
      Z, Z2 = encode(enc, X), encode(enc, X2)
      model = fit_model(Z, A, Z2, rng)

      q = np.array([[0.5, 0.8]])
      actions = np.tile([1.5, -1.0], (6, 1))
      z = encode(enc, render(q))
      real, dream = [render(q)[0]], [decode(enc, z)[0]]
      for a in actions:
          q = env.dynamics(q, a)
          z = predict(model, z, a[None])
          real.append(render(q)[0])
          dream.append(decode(enc, z)[0])
      Qt = np.random.default_rng(5).uniform(-np.pi, np.pi, (200, 2))
      At = np.random.default_rng(6).uniform(-2, 2, (200, 2))
      Zt, Z2t = encode(enc, render(Qt)), encode(enc, render(env.dynamics(Qt, At)))
      rel = np.mean((predict(model, Zt, At) - Z2t) ** 2) / np.mean((Zt - Z2t) ** 2)
      print(f"Einschrittfehler im latenten Raum: {rel:.2f} (relativ zu 'z bleibt gleich')")
      real, dream = np.array(real).reshape(-1, N, N), np.array(dream).reshape(-1, N, N)
      lab.heatmap(np.vstack([np.hstack(list(real)), np.hstack(list(dream))]), title="oben: echt, unten: Vorstellung des Modells")
    subgoals:
      - lines: [5, 20]
        label: Bilder rendern
      - lines: [22, 31]
        label: Linearen Encoder und Decoder bestimmen
      - lines: [67, 74]
        label: Übergänge als Bildpaare erzeugen, codieren, Modell trainieren
      - lines: [76, 84]
