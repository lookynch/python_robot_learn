  - type: quiz
    question: |
      Ein Roboter arbeitet vor einem bunten, sich bewegenden Hintergrund. Welches Problem bekommt ein World Model, dessen latenter Raum **nur** mit Rekonstruktionsfehler trainiert wird?
    options:
      - text: Es verwendet viel Kapazität darauf, den für die Aufgabe irrelevanten Hintergrund nachzubilden.
        correct: true
        why: Rekonstruktion belohnt jedes Pixel gleich. Deshalb verzichten TD-MPC und JEPA-artige Modelle auf den Decoder und lernen nur aufgabenrelevante oder vorhersagbare Merkmale.
      - text: Es kann den Hintergrund nicht darstellen und stürzt ab.
        correct: false
        why: Es stellt ihn (unscharf) dar – das Problem ist verschwendete Kapazität, kein Absturz.
      - text: Keines – Rekonstruktion lernt automatisch nur das Wichtige.
        correct: false
        why: Was „wichtig“ ist, weiß der Rekonstruktionsfehler nicht – er misst alle Pixel.
  - type: quiz
    question: |
      Ein Agent plant mit CEM auf einem latenten Modell. Wofür braucht er den Decoder **während** des Planens?
    options:
      - text: Für nichts – Rollouts und Kosten können ganz im latenten Raum berechnet werden, wenn auch die Belohnung aus $z$ vorhergesagt wird.
        correct: true
        why: So plant PlaNet (mit CEM im latenten Raum), und auch Dreamer stellt sich Zukünfte ohne Bilder vor. Der Decoder dient nur dem Training (bzw. uns zum Anschauen).
      - text: Er muss jedes vorgestellte Bild decodieren, um es mit dem Ziel zu vergleichen.
        correct: false
        why: Das wäre möglich, aber teuer und unnötig – Ziele lassen sich im latenten Raum oder über eine gelernte Belohnung ausdrücken.
      - text: Er braucht ihn, um Aktionen zu codieren.
        correct: false
        why: Aktionen gehen direkt (ohne Codierung) ins Dynamikmodell.
cards:
  - id: m17-c-latente-dynamik
    concept: lwm-latente-dynamik
    variants:
      - type: quiz
        question: Was sagt ein latentes Dynamikmodell vorher?
        options:
          - text: Den nächsten latenten Vektor $z_{t+1}$ aus $z_t$ und $a_t$.
            correct: true
            why: Die Dynamik läuft komplett im komprimierten Raum.
          - text: Das nächste Bild Pixel für Pixel.
            correct: false
            why: Das Bild entsteht – wenn überhaupt – erst durch den Decoder.
          - text: Die Aktion, die zum Ziel führt.
            correct: false
            why: Das wäre eine Policy.
      - type: quiz
        question: Woher kommt beim „Träumen“ der Startpunkt $z_0$?
        options:
          - text: Aus dem Encoder, angewandt auf die letzte echte Beobachtung.
            correct: true
            why: Danach braucht die Vorstellung keine Bilder mehr.
          - text: Aus dem Decoder.
            correct: false
            why: Der Decoder macht aus $z$ ein Bild, nicht umgekehrt.
          - text: Er wird zufällig gezogen und hat mit der Realität nichts zu tun.
            correct: false
            why: Zum Planen muss die Vorstellung beim aktuellen echten Zustand beginnen.
  - id: m17-c-latent-formen
    concept: lwm-latente-dynamik
    variants:
      - type: predict
        code: |
          import numpy as np
          Z = np.zeros((100, 6))
          A = np.zeros((100, 3))
          print(np.hstack([Z, A]).shape)
        options: ["(100, 9)", "(100, 6)", "(200, 9)", "(9, 100)"]
        answer: "(100, 9)"
        explanation: Latenter Zustand (6) und Aktion (3) nebeneinander.
      - type: predict
        code: |
          import numpy as np
          z = np.array([[1.0, 2.0]])
          dz = np.array([[0.5, -1.0]])
          print(z + dz)
        options: ["[[1.5 1. ]]", "[[0.5 -1. ]]", "[[1.5 3. ]]", "[[1.  2. ]]"]
        answer: "[[1.5 1. ]]"
        explanation: Wie in Modul 16 sagt das Netz die Änderung vorher, $\hat z' = z + \Delta z$.
