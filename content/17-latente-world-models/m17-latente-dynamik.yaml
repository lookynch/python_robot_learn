      - lines: [85, 91]
        label: Qualität messen und zeigen
    after: |
      Die untere Reihe entsteht **ohne** weitere Bilder – nur aus $z_0$ und den Aktionen. Sie ist verwaschen (der lineare Decoder), aber der Arm dreht sich wie in der Realität.
  - type: explain
    question: |
      Warum lernt man die Dynamik im latenten Raum statt direkt Bild → nächstes Bild?
    options:
      - text: Der latente Vektor ist klein und enthält das Wesentliche; das Modell bleibt klein, Vorstellen ist billig, und Planen kann ganz ohne Bilder auskommen.
        correct: true
        why: Statt 256 Pixeln pro Schritt werden 8 Zahlen vorhergesagt – bei echten Kamerabildern ist der Unterschied noch viel größer.
      - text: Weil Bilder sich nicht vorhersagen lassen.
        correct: false
        why: Es gibt Video-Vorhersagemodelle – sie sind nur sehr viel teurer.
      - text: Weil der Decoder sonst nicht trainiert werden kann.
        correct: false
        why: Der Decoder wird mit dem Rekonstruktionsfehler trainiert, unabhängig vom Dynamikmodell.
  - type: predict
    code: |
      import numpy as np
      Z = np.zeros((800, 8))
      A = np.zeros((800, 2))
      Z2 = np.ones((800, 8))
      X, Y = np.hstack([Z, A]), Z2 - Z
      print(X.shape, Y.shape)
    options:
      - "(800, 10) (800, 8)"
      - "(800, 8) (800, 8)"
      - "(1600, 8) (800, 8)"
      - "(800, 10) (800, 10)"
    answer: "(800, 10) (800, 8)"
    explanation: |
      Eingabe = latenter Zustand (8) plus Aktion (2). Ausgabe = Änderung des latenten Zustands (8). Das Netz in `fit_model` passt seine Größe daran an (`X.shape[1]`, `Y.shape[1]`).
