      import numpy as np
      import lab
      from lab.envs import Reacher2D

      N = 16
      c = (np.arange(N) + 0.5) / N * 4.4 - 2.2
      PX, PY = np.meshgrid(c, -c)
      P = np.stack([PX.ravel(), PY.ravel()], axis=1)

      def seg_dist(a, b):
          ab = b - a
          ap = P[None] - a[:, None]
          t = np.clip((ap * ab[:, None]).sum(-1) / (ab * ab).sum(-1)[:, None], 0, 1)
          return np.linalg.norm(ap - t[..., None] * ab[:, None], axis=-1)

      def render(q):
          p1 = np.stack([np.cos(q[:, 0]), np.sin(q[:, 0])], axis=1)
          p2 = p1 + np.stack([np.cos(q[:, 0] + q[:, 1]), np.sin(q[:, 0] + q[:, 1])], axis=1)
          d = np.minimum(seg_dist(0 * p1, p1), seg_dist(p1, p2))
          return np.exp(-(d / 0.35) ** 2)

      def fit_encoder(X, k):
          mu = X.mean(0)
          _, _, Vt = np.linalg.svd(X - mu, full_matrices=False)
          return {"mu": mu, "W": Vt[:k].T}

      def encode(enc, X):
          return (X - enc["mu"]) @ enc["W"]

      def decode(enc, Z):
          return Z @ enc["W"].T + enc["mu"]

      def init_mlp(n_in, n_hidden, n_out, rng):
          return {"W1": rng.normal(0, n_in ** -0.5, (n_in, n_hidden)), "b1": np.zeros(n_hidden),
                  "W2": rng.normal(0, n_hidden ** -0.5, (n_hidden, n_out)), "b2": np.zeros(n_out)}

      def forward(p, X):
          H = np.tanh(X @ p["W1"] + p["b1"])
          return H @ p["W2"] + p["b2"], H

      def train_mlp(p, X, Y, epochs=400, lr=0.02):
          m = {k: np.zeros_like(w) for k, w in p.items()}
          v = {k: np.zeros_like(w) for k, w in p.items()}
          for t in range(1, epochs + 1):
              out, H = forward(p, X)
              D = 2 * (out - Y) / len(X)
              dH = (D @ p["W2"].T) * (1 - H ** 2)
              g = {"W1": X.T @ dH, "b1": dH.sum(0), "W2": H.T @ D, "b2": D.sum(0)}
              for k in p:  # Adam
                  m[k] = 0.9 * m[k] + 0.1 * g[k]
                  v[k] = 0.999 * v[k] + 0.001 * g[k] ** 2
                  p[k] -= lr * m[k] / (1 - 0.9 ** t) / (np.sqrt(v[k] / (1 - 0.999 ** t)) + 1e-8)
          return p

      def fit_model(S, A, S2, rng):
          X, Y = np.hstack([S, A]), S2 - S
          mx, sx = X.mean(0), X.std(0) + 1e-8
          my, sy = Y.mean(0), Y.std(0) + 1e-8
          p = train_mlp(init_mlp(X.shape[1], 32, Y.shape[1], rng), (X - mx) / sx, (Y - my) / sy)
          return {"p": p, "mx": mx, "sx": sx, "my": my, "sy": sy}

      def predict(model, s, a):
          X = (np.concatenate([s, a], axis=-1) - model["mx"]) / model["sx"]
          out, _ = forward(model["p"], X)
          return s + out * model["sy"] + model["my"]

      env = Reacher2D(dt=0.1)
      rng = np.random.default_rng(0)
      Q = rng.uniform(-np.pi, np.pi, (800, 2))
      A = rng.uniform(-2, 2, (800, 2))
      X, X2 = render(Q), render(env.dynamics(Q, A))
      enc = fit_encoder(X, 8)
      Z, Z2 = encode(enc, X), encode(enc, X2)
      model = fit_model(Z, A, Z2, rng)

      def dream(model, enc, x0, actions):
          z = encode(enc, x0)
          frames = [decode(enc, z)[0]]
          for a in actions:
              z = predict(model, z, a[None])
              frames.append(decode(enc, z)[0])
          return np.array(frames)

      x0 = render(np.array([[0.5, 0.8]]))
      imgs = dream(model, enc, x0, np.tile([1.5, -1.0], (6, 1)))
      print(np.shape(imgs))
    tests:
      - name: Form
        code: |
          out = np.asarray(dream(model, enc, render(np.array([[0.0, 0.5]])), np.zeros((4, 2))))
          assert out.shape == (5, 256), f"Für 4 Aktionen erwartet Form (5, 256), bekommen {out.shape}"
      - name: Erstes Bild ist das decodierte Startbild
        code: |
          x0 = render(np.array([[1.0, -0.5]]))
          out = np.asarray(dream(model, enc, x0, np.ones((2, 2))))
          assert close(out[0], decode(enc, encode(enc, x0))[0]), "Das erste Bild soll decode(enc, encode(enc, x0)) sein."
      - name: Vorstellung stimmt mit Referenz
        code: |
          def _ref(x0, acts):
              z = encode(enc, x0)
              fr = [decode(enc, z)[0]]
              for a in acts:
                  z = predict(model, z, a[None])
                  fr.append(decode(enc, z)[0])
              return np.array(fr)
          r = np.random.default_rng(8)
          for _ in range(2):
              x0 = render(r.uniform(-np.pi, np.pi, (1, 2)))
              acts = r.uniform(-2, 2, (5, 2))
              got = np.asarray(dream(model, enc, x0, acts), dtype=float)
              assert got.shape == (6, 256) and close(got, _ref(x0, acts), 1e-6), "Die vorgestellten Bilder weichen ab – wird z in jedem Schritt mit predict weitergerollt (nicht immer vom Start aus)?"
      - name: Vorstellung ähnelt der Realität
        code: |
          q = np.array([[0.3, 1.0]])
          acts = np.tile([1.0, 1.0], (5, 1))
          out = np.asarray(dream(model, enc, render(q), acts))
          errs = []
          for t, a in enumerate(acts):
              q = env.dynamics(q, a)
              real = render(q)[0]
              errs.append(np.mean((out[t + 1] - real) ** 2) / np.mean((enc["mu"] - real) ** 2))
          assert max(errs) < 0.7, f"Die Vorstellung sollte deutlich näher an der Realität liegen als das Durchschnittsbild, relative Fehler {np.round(errs, 2)}"
