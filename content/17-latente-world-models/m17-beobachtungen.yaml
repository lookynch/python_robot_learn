    hints:
      - "Teilziel: Koordinate auf $[0, 1]$ bringen, mit $n$ multiplizieren, abschneiden, begrenzen."
      - Für die Spalte $(x + r) / (2r)$, für die Zeile $(r - y) / (2r)$ – so wächst die Zeile nach **unten**.
      - |
        ```python
        col = int((x + r) / (2 * r) * n)
        row = int((r - y) / (2 * r) * n)
        ```
      - "`return min(max(row, 0), n - 1), min(max(col, 0), n - 1)`"
  - type: quiz
    question: |
      Du beobachtest ein **Pendel** als Einzelbild. Warum reicht ein Bild nicht als Zustand?
    options:
      - text: Das Bild zeigt den Winkel, aber nicht die Winkelgeschwindigkeit – zwei Pendel mit gleichem Winkel und verschiedener Geschwindigkeit sehen gleich aus.
        correct: true
        why: Man braucht mehrere Bilder hintereinander oder ein Gedächtnis (RNN) – genau dafür hat Dreamer ein rekurrentes Modell.
      - text: Das Bild ist zu klein; mit 64×64 Pixeln wäre es ein vollständiger Zustand.
        correct: false
        why: Auch ein großes Einzelbild enthält keine Geschwindigkeit.
      - text: Bilder sind immer verrauscht und deshalb unbrauchbar.
        correct: false
        why: Rauschen erschwert das Lernen, macht Bilder aber nicht unbrauchbar.
  - type: quiz
    question: |
      Ha & Schmidhuber (2018) verwenden Farbbilder mit 64×64 Pixeln und 3 Farbkanälen. Wie viele Zahlen hat eine Beobachtung?
    options:
      - text: "12 288"
        correct: true
        why: 64 · 64 · 3 = 12 288.
      - text: "4 096"
        correct: false
        why: Das wären nur 64 · 64 Graustufenwerte – die 3 Farbkanäle fehlen.
      - text: "192"
        correct: false
        why: 64 · 3 zählt nur eine Zeile.
