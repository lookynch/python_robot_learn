id: m17-beobachtungen
title: Bilder statt Zustand
minutes: 8
goals:
  - Beobachtung $o$ und Zustand $s$ unterscheiden
  - Den Arm als 16×16-Bild (NumPy-Array) rendern
  - Weltkoordinaten in Pixel-Indizes umrechnen
concepts: [lwm-beobachtung-bild]
steps:
  - type: text
    body: |
      ## Was ein echter Roboter sieht

      In Modul 16 kannte das Modell den Zustand $s = [q_1, q_2, x, y]$. Ein Roboter mit Kamera bekommt dagegen eine **Beobachtung** $o$ (observation): ein Bild aus vielen Pixeln.

      Hier: ein 16×16-Graustufenbild des Arms, also ein Array mit 256 Zahlen in $[0, 1]$. Zeile 0 ist **oben**, Spalte 0 links. Der sichtbare Ausschnitt reicht von −2,2 m bis 2,2 m in $x$ und $y$.

      Wichtig: Ein **einzelnes** Bild zeigt die Stellung, aber keine Geschwindigkeit. Beim Reacher reicht das (Aktion = Geschwindigkeit), beim Pendel nicht.
  - type: example
    code: |
      import numpy as np
      import lab

      def to_pixel(x, y, n=16, r=2.2):
          col = int((x + r) / (2 * r) * n)
          row = int((r - y) / (2 * r) * n)
          return min(max(row, 0), n - 1), min(max(col, 0), n - 1)

      def render(q, n=16):
          img = np.zeros((n, n))
          p1 = np.array([np.cos(q[0]), np.sin(q[0])])
          p2 = p1 + np.array([np.cos(q[0] + q[1]), np.sin(q[0] + q[1])])
          for t in np.linspace(0, 1, 12):
              for x, y in [t * p1, p1 + t * (p2 - p1)]:
                  row, col = to_pixel(x, y)
                  img[row, col] = 1.0
          return img

      q = np.array([0.8, -1.2])
      img = render(q)
      print(img.shape, "Pixel an:", int(img.sum()))
      lab.heatmap(img, title="Beobachtung: 16×16 Pixel")
      lab.arm(q, title="Zustand: q = (0.8, -1.2) rad")
    subgoals:
      - lines: [4, 7]
        label: Weltkoordinaten in Pixel umrechnen
      - lines: [9, 17]
        label: Punkte entlang der Glieder einzeichnen
      - lines: [19, 23]
        label: Bild erzeugen und mit dem Arm vergleichen
    after: |
      Dieselbe Stellung zweimal: oben als Bild (was der Agent sieht), unten als Gelenkwinkel (was wir in Modul 16 benutzt haben). Aus 256 Pixeln muss ein Modell die 2 relevanten Zahlen erst selbst herausfinden.
  - type: predict
    code: |
      def to_pixel(x, y, n=16, r=2.2):
          col = int((x + r) / (2 * r) * n)
          row = int((r - y) / (2 * r) * n)
          return min(max(row, 0), n - 1), min(max(col, 0), n - 1)

      print(to_pixel(0.0, 0.0), to_pixel(2.0, 0.0), to_pixel(0.0, 2.0))
    options:
      - "(8, 8) (8, 15) (0, 8)"
      - "(8, 8) (15, 8) (8, 0)"
      - "(8, 8) (8, 15) (15, 8)"
      - "(7, 7) (7, 14) (0, 7)"
    answer: "(8, 8) (8, 15) (0, 8)"
    explanation: |
      Der Ursprung liegt in der Bildmitte (Zeile 8, Spalte 8). $x = 2$ m ist ganz rechts (Spalte 15). $y = 2$ m ist **oben** – also Zeile 0, weil Bildzeilen von oben nach unten zählen.
  - type: explain
    question: |
      Das Bild hat 256 Zahlen, der Arm aber nur 2 Freiheitsgrade. Warum ist das ein Problem für ein Dynamikmodell, das direkt auf Pixeln arbeitet?
    options:
      - text: Es müsste 256 Ausgaben vorhersagen, von denen fast alle von denselben 2 Größen abhängen – viel Aufwand, viele Parameter, viel Raum für Fehler.
        correct: true
        why: Deshalb komprimiert man Beobachtungen erst in einen kleinen latenten Vektor $z$ und lernt die Dynamik dort.
      - text: NumPy kann keine Arrays mit 256 Einträgen verarbeiten.
        correct: false
        why: NumPy rechnet mühelos mit Millionen Einträgen.
      - text: Bilder enthalten keine Information über die Stellung.
        correct: false
        why: Doch – aus dem Bild lässt sich die Stellung ablesen. Sie steckt nur verteilt in vielen Pixeln.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `to_pixel(x, y, n=16, r=2.2)`: Wandle einen Punkt $(x, y)$ in m in `(row, col)` um. Der Bereich $[-r, r]$ wird auf $n$ Pixel aufgeteilt, `int(...)` schneidet die Nachkommastellen ab. Zeile 0 ist **oben** (größtes $y$). Punkte außerhalb des Bildes werden auf den Rand begrenzt (0 bis $n-1$).
    starter: |
      def to_pixel(x, y, n=16, r=2.2):
          # dein Code
          pass

      print(to_pixel(0.0, 0.0), to_pixel(0.0, 2.0))
    solution: |
      def to_pixel(x, y, n=16, r=2.2):
          col = int((x + r) / (2 * r) * n)
          row = int((r - y) / (2 * r) * n)
          row = min(max(row, 0), n - 1)
          col = min(max(col, 0), n - 1)
          return row, col

      print(to_pixel(0.0, 0.0), to_pixel(0.0, 2.0))
    tests:
      - name: Mitte und Ränder
        code: |
          for (x, y), want in [((0.0, 0.0), (8, 8)), ((2.0, 0.0), (8, 15)), ((0.0, 2.0), (0, 8)), ((0.0, -2.0), (15, 8)), ((-2.0, 0.0), (8, 0))]:
              got = to_pixel(x, y)
              assert tuple(got) == want, f"to_pixel({x}, {y}) sollte {want} sein, ist {got}"
      - name: Oben ist Zeile 0
        code: |
          assert to_pixel(1.0, 1.5)[0] < to_pixel(1.0, -1.5)[0], "Ein Punkt weiter oben (größeres y) muss eine KLEINERE Zeilennummer haben."
      - name: Außerhalb wird begrenzt
        code: |
          assert tuple(to_pixel(5.0, -5.0)) == (15, 15), f"to_pixel(5, -5) sollte auf (15, 15) begrenzt werden, ist {to_pixel(5.0, -5.0)}"
          assert tuple(to_pixel(-5.0, 5.0)) == (0, 0), f"to_pixel(-5, 5) sollte auf (0, 0) begrenzt werden, ist {to_pixel(-5.0, 5.0)}"
      - name: Andere Bildgröße
        code: |
          assert tuple(to_pixel(0.0, 0.0, n=8)) == (4, 4), f"Bei n=8 sollte die Mitte (4, 4) sein, ist {to_pixel(0.0, 0.0, n=8)}"
          assert tuple(to_pixel(1.0, 0.5, n=32, r=1.0)) == (8, 31), f"to_pixel(1.0, 0.5, n=32, r=1.0) sollte (8, 31) sein, ist {to_pixel(1.0, 0.5, n=32, r=1.0)}"
    mutants:
