  - id: m17-c-zustand-beobachtung
    concept: lwm-beobachtung-bild
    variants:
      - type: quiz
        question: Was ist der Unterschied zwischen Zustand $s$ und Beobachtung $o$?
        options:
          - text: "$s$ enthält alles, was die Zukunft bestimmt; $o$ ist das, was der Sensor davon zeigt – oft hochdimensional und unvollständig."
            correct: true
            why: Bei Bildern steckt $s$ indirekt in vielen Pixeln, manches (wie Geschwindigkeit) fehlt ganz.
          - text: Es gibt keinen Unterschied, beide Begriffe meinen dasselbe.
            correct: false
            why: Nur wenn der Sensor den Zustand direkt liefert, fallen beide zusammen.
          - text: "$o$ ist immer kleiner als $s$."
            correct: false
            why: Ein Bild (256 Zahlen) ist viel größer als $s$ (2–4 Zahlen).
      - type: quiz
        question: Welche Beobachtung reicht beim **Reacher2D** als Zustand aus?
        options:
          - text: Ein einzelnes Bild – der Reacher ist kinematisch, die Aktion bestimmt die Geschwindigkeit direkt.
            correct: true
            why: Der nächste Zustand hängt nur von Stellung und Aktion ab, und die Stellung ist im Bild sichtbar.
          - text: Nur eine Folge von mindestens 10 Bildern.
            correct: false
            why: Für ein System ohne Trägheit reicht die aktuelle Stellung.
          - text: Gar kein Bild – Bilder enthalten nie die Stellung.
            correct: false
            why: Die Stellung ist im Bild klar zu sehen.
