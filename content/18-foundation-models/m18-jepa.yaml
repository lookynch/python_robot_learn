id: m18-jepa
title: JEPA – Vorhersage im latenten Raum
minutes: 10
goals:
  - Erklären, warum JEPA Repräsentationen statt Pixel vorhersagt
  - Das Kollaps-Problem und die Gegenmittel stop-gradient und EMA-Ziel-Encoder beschreiben
  - Ein EMA-Update selbst implementieren
concepts: [jepa-latente-vorhersage, ssl-kollaps-ema]
steps:
  - type: text
    body: |
      ## Pixel vorhersagen ist Verschwendung

      Dein Autoencoder aus Modul 17 musste jedes Pixel rekonstruieren. In echten Kamerabildern ist aber vieles **unvorhersagbar und für die Aufgabe egal**: flackerndes Licht, Blätter im Wind, Sensorrauschen. Ein Pixel-Modell muss dafür Kapazität aufwenden – und bei echtem Zufall ist seine beste Vorhersage ein verschwommener Mittelwert.

      **JEPA** (Joint-Embedding Predictive Architecture) dreht das um: Kontext *und* Ziel werden erst encodiert, vorhergesagt wird nur die **Repräsentation** des Ziels. Bei I-JEPA sagt das Modell aus einem Bildausschnitt die Repräsentationen anderer Ausschnitte desselben Bildes vorher ([Assran et al. 2023, arXiv:2301.08243](https://arxiv.org/abs/2301.08243); Stand: Oktober 2026).
  - type: text
    body: |
      ## Drei Bausteine

      - **Kontext-Encoder** $f_\theta$: $z_x = f_\theta(x)$ (sichtbarer Teil bzw. aktuelles Bild)
      - **Prädiktor** $g_\phi$: $\hat z_y = g_\phi(z_x)$ (bei Robotern zusätzlich mit der Aktion)
      - **Ziel-Encoder** $f_{\bar\theta}$: $z_y = f_{\bar\theta}(y)$ (verdeckter Teil bzw. nächstes Bild)

      Verlust im latenten Raum, V-JEPA 2 nutzt den L1-Abstand:

      $$
      L = \lVert \hat z_y - \mathrm{sg}(z_y) \rVert_1
      $$

      $\mathrm{sg}$ heißt **stop-gradient**: Durch den Ziel-Zweig fließt kein Gradient ([V-JEPA 2, arXiv:2506.09985](https://arxiv.org/abs/2506.09985); Stand: Oktober 2026).
  - type: explain
    question: |
      Warum sagt JEPA im latenten Raum vorher statt in Pixeln?
    options:
      - text: Der Encoder kann unvorhersagbare, unwichtige Details weglassen – der Fehler bewertet nur, was sich überhaupt vorhersagen lässt.
        correct: true
        why: Genau. Rauschen und Texturdetails müssen nicht modelliert werden; die Kapazität geht in die vorhersagbare Struktur (Positionen, Bewegungen).
      - text: Latente Vektoren sind kürzer, deshalb ist es nur schneller – das Ergebnis ist dasselbe.
        correct: false
        why: Weniger Rechenaufwand ist ein Nebeneffekt. Der Kern ist, *was* bewertet wird – ein Pixel-Fehler bestraft auch unvorhersagbare Details.
      - text: Pixel sind nicht differenzierbar, deshalb kann man auf ihnen nicht trainieren.
        correct: false
        why: Pixelwerte sind gewöhnliche Zahlen; dein Autoencoder in Modul 17 hat genau darauf per Gradient trainiert.
      - text: Im latenten Raum braucht man keine Trainingsdaten mehr.
        correct: false
        why: JEPA lernt selbstüberwacht aus sehr vielen Videos/Bildern – ohne Labels, aber nicht ohne Daten.
  - type: text
    body: |
      ## Die Falle: Kollaps

      Wenn beide Zweige frei lernen dürfen, gibt es eine triviale Lösung: Der Encoder gibt für **jedes** Bild denselben Vektor aus. Dann ist die Vorhersage perfekt und der Verlust null – aber die Repräsentation enthält keine Information mehr. Das heißt **Repräsentationskollaps** (representation collapse).

      Gegenmittel in I-JEPA und V-JEPA 2:

      1. **stop-gradient** auf dem Ziel: Das Ziel wird als feste Zahl behandelt.
      2. Der Ziel-Encoder ist ein **gleitender Mittelwert** (exponential moving average, EMA) der Encoder-Gewichte:

      $$
      \bar\theta \leftarrow \tau\,\bar\theta + (1-\tau)\,\theta, \quad \tau \approx 0{,}99\ldots
      $$

      Warum das zuverlässig reicht, ist theoretisch nicht vollständig geklärt. Im Beispiel siehst du den Effekt empirisch.
  - type: predict
    intro: |
      Ein Encoder, der alles auf den Nullvektor abbildet. Beobachtungen und Prädiktor sind beliebig.
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      O = rng.normal(size=(5, 4))       # 5 Beobachtungen jetzt
      O2 = rng.normal(size=(5, 4))      # 5 Beobachtungen danach
      W = np.zeros((2, 4))              # kollabierter Encoder
      P = np.eye(2)                     # Prädiktor
      E = (O @ W.T) @ P.T - O2 @ W.T
      print(np.mean(np.abs(E)))
    options: ["0.0", "eine Zahl um 0.8", "nan", "Fehler: Shapes passen nicht"]
    answer: "0.0"
    explanation: |
      Beide Seiten sind exakt null, also auch der Fehler. Ein Verlust von 0 klingt perfekt – das Modell hat aber nichts gelernt. Deshalb darf man bei JEPA nicht nur auf den Verlust schauen.
  - type: example
    intro: |
      Mini-JEPA in NumPy: Ein verborgener 2D-Zustand dreht sich pro Schritt um 0,3 rad (plus etwas Zufall). Beobachtet werden 4 Kanäle, die vom Zustand abhängen, und 4 reine Rausch-Kanäle. Encoder `W` (2×8), Prädiktor `P` (2×2). Vereinfachung: quadratischer statt L1-Fehler, lineare Netze.
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      R = np.array([[np.cos(0.3), -np.sin(0.3)], [np.sin(0.3), np.cos(0.3)]])
      S = rng.normal(size=(300, 2))
      S2 = S @ R.T + rng.normal(scale=0.3, size=(300, 2))
      M = rng.normal(size=(2, 4))
      def beobachte(S):
          return np.hstack([S @ M, rng.normal(scale=2.0, size=(len(S), 4))])
      O, O2 = beobachte(S), beobachte(S2)

      def train(stop_grad, schritte=1500, lr=0.05, tau=0.99):
          W = np.random.default_rng(1).normal(scale=0.3, size=(2, 8))
          W_ziel, P = W.copy(), np.eye(2)
          for _ in range(schritte):
              Z = O @ W.T
              Z_ziel = O2 @ (W_ziel if stop_grad else W).T
              E = Z @ P.T - Z_ziel
              gW = 2 * P.T @ E.T @ O / len(O)
              if not stop_grad:
                  gW -= 2 * E.T @ O2 / len(O)
              P -= lr * 2 * E.T @ Z / len(O)
              W -= lr * gW
              W_ziel = tau * W_ziel + (1 - tau) * W if stop_grad else W
          return np.mean(np.sum(E ** 2, axis=1)), (O @ W.T).std(axis=0)

      for sg in [False, True]:
          verlust, streuung = train(sg)
          print("stop_grad:", sg, "| Verlust:", round(verlust, 3), "| Streuung z:", streuung.round(2))
    subgoals:
      - lines: [1, 9]
        label: Daten mit verborgenem Zustand erzeugen
      - lines: [11, 13]
        label: Encoder, Ziel-Encoder und Prädiktor anlegen
      - lines: [14, 22]
        label: Im latenten Raum vorhersagen und Gradientenschritt
      - lines: 23
        label: Ziel-Encoder per EMA nachziehen
      - lines: [26, 28]
        label: Beide Varianten vergleichen
    heavy: true
    after: |
      - **Ohne stop-gradient**: Verlust 0, Streuung 0 – kollabiert. Den Abstand zu verkleinern war am einfachsten, indem alles auf einen Punkt fällt.
      - **Mit stop-gradient + EMA**: Der Verlust bleibt größer (der Zufall im nächsten Zustand ist nicht vorhersagbar), aber die Embeddings streuen und enthalten den Zustand.
      - Ein Pixel-Prädiktor müsste die 4 Rauschkanäle mitvorhersagen; deren Fehler wäre im Mittel $4 \cdot 2^2 = 16$ – egal wie gut das Modell ist.
  - type: exercise
    mode: make
    prompt: |
      Schreibe `ema_update(ziel, online, tau)`, die die neuen Ziel-Gewichte $\tau \cdot \text{ziel} + (1-\tau) \cdot \text{online}$ zurückgibt. Es soll für Zahlen und NumPy-Arrays funktionieren.
    starter: |
      import numpy as np

      def ema_update(ziel, online, tau):
          # gib die neuen Ziel-Gewichte zurück
          pass
    solution: |
      import numpy as np

      def ema_update(ziel, online, tau):
          return tau * ziel + (1 - tau) * online
    tests:
      - name: Zahlen
        code: |
          r = ema_update(1.0, 3.0, 0.9)
          assert r is not None, "Die Funktion gibt nichts zurück – return vergessen?"
          assert close(r, 1.2), f"ema_update(1.0, 3.0, 0.9) sollte 1.2 sein, ist {r}"
      - name: tau = 0 übernimmt online
        code: |
          r = ema_update(5.0, -2.0, 0.0)
          assert close(r, -2.0), f"Mit tau = 0 sollte das Ergebnis der Online-Wert -2.0 sein, ist {r}"
      - name: Arrays
        code: |
          z = np.array([0.0, 2.0, -1.0])
          o = np.array([4.0, 2.0, 1.0])
          r = ema_update(z, o, 0.75)
          assert close(r, np.array([1.0, 2.0, -0.5])), f"Erwartet [1.0, 2.0, -0.5], bekommen {r}"
    mutants:
      - |
        def ema_update(ziel, online, tau):
            return (1 - tau) * ziel + tau * online
      - |
        def ema_update(ziel, online, tau):
            return online
      - |
        def ema_update(ziel, online, tau):
            ziel = tau * ziel + (1 - tau) * online
      - |
        def ema_update(ziel, online, tau):
            return tau * ziel + online
    hints:
      - "Teilziel: neuen Wert berechnen und mit `return` zurückgeben."
      - "`tau` gewichtet den **alten Ziel**-Wert, `1 - tau` den Online-Wert."
      - "`return tau * ziel + (1 - tau) * online`"
    explanation: |
      Mit $\tau = 0{,}99$ wandert das Ziel pro Schritt nur 1 % in Richtung Online-Encoder. Das Ziel ist also eine langsame, geglättete Kopie – der Online-Encoder kann es nicht im selben Schritt mitverschieben.
  - type: quiz
    question: |
      Beim Training eines JEPA-Modells fällt der Verlust auf fast exakt 0, und die Embeddings aller Bilder sind nahezu gleich. Was ist die beste Diagnose?
    options:
      - text: Die Repräsentation ist kollabiert – das Modell hat die triviale Lösung gefunden.
        correct: true
        why: Gleiche Embeddings für alle Eingaben sind genau das Kollaps-Symptom. Ein kleiner Verlust ist hier kein Erfolg.
      - text: Das Modell ist fertig trainiert und perfekt.
        correct: false
        why: Wäre die Repräsentation informativ, müssten sich Embeddings verschiedener Bilder unterscheiden.
      - text: Die Lernrate ist zu klein.
        correct: false
        why: Eine zu kleine Lernrate führt zu langsamem Lernen, nicht zu identischen Embeddings bei Verlust 0.
cards:
  - id: m18-c-jepa-warum
    concept: jepa-latente-vorhersage
    variants:
      - type: quiz
        question: |
          Eine Kamera filmt einen Roboterarm vor einem flackernden Bildschirm. Welches Modell verschwendet am meisten Kapazität auf den Bildschirm?
        options:
          - text: Ein Modell, das die nächsten Pixel vorhersagt
            correct: true
            why: Der Pixel-Fehler bestraft jedes falsch vorhergesagte Flackern, obwohl es unvorhersagbar und unwichtig ist.
          - text: Ein JEPA-Modell, das die nächste Repräsentation vorhersagt
            correct: false
            why: Der Encoder kann das Flackern weglassen; bewertet wird nur die Vorhersage im latenten Raum.
          - text: Beide gleich viel
            correct: false
            why: Der Unterschied liegt genau darin, in welchem Raum der Fehler gemessen wird.
      - type: quiz
        question: |
          Ein Pixel-Videomodell sagt bei zufälligem Blätterrauschen verschwommene Bilder vorher. Warum?
        options:
          - text: Bei unvorhersagbaren Details minimiert der Mittelwert vieler möglicher Bilder den Pixelfehler – und der ist verschwommen.
            correct: true
            why: Genau. Ein quadratischer Fehler wird vom Erwartungswert minimiert; der Mittelwert vieler scharfer Bilder ist unscharf.
          - text: Die Kamera hat eine zu geringe Auflösung.
            correct: false
            why: Unschärfe entsteht hier durch die Vorhersage, nicht durch den Sensor.
          - text: Das Modell hat zu viele Parameter.
            correct: false
            why: Mehr Kapazität beseitigt die Unvorhersagbarkeit nicht.
  - id: m18-c-kollaps
    concept: ssl-kollaps-ema
    variants:
      - type: predict
        code: |
          import numpy as np
          z_jetzt = np.full((4, 3), 7.0)    # Encoder gibt immer denselben Vektor aus
          z_dann = np.full((4, 3), 7.0)
          print(np.mean(np.abs(z_jetzt - z_dann)))
        options: ["0.0", "7.0", "21.0", "nan"]
        answer: "0.0"
        explanation: Ein konstanter Encoder macht den Vorhersagefehler trivial null – das ist Kollaps, kein Lernerfolg.
      - type: quiz
        question: |
          Welche Maßnahme nutzt V-JEPA 2 gegen Repräsentationskollaps?
        options:
          - text: stop-gradient auf dem Ziel und ein Ziel-Encoder als EMA der Encoder-Gewichte
            correct: true
            why: Das Ziel bewegt sich nur langsam und wird nicht mitoptimiert – die triviale Abkürzung über beide Zweige ist versperrt.
          - text: Der Verlust wird in Pixeln statt im latenten Raum berechnet.
            correct: false
            why: Dann wäre es kein JEPA mehr; gerade die latente Vorhersage ist der Punkt.
          - text: Eine größere Lernrate
            correct: false
            why: Die Lernrate ändert nichts daran, dass die konstante Lösung den Verlust minimiert.
  - id: m18-c-ema
    concept: ssl-kollaps-ema
    variants:
      - type: predict
        code: |
          ziel, online, tau = 1.0, 3.0, 0.9
          ziel = tau * ziel + (1 - tau) * online
          print(round(ziel, 3))
        options: ["1.2", "2.8", "3.0", "1.0"]
        answer: "1.2"
        explanation: 0,9 · 1 + 0,1 · 3 = 1,2. Das Ziel bewegt sich nur ein Zehntel des Weges zum Online-Wert.
      - type: predict
        code: |
          ziel, online, tau = 0.0, 4.0, 0.5
          for _ in range(2):
              ziel = tau * ziel + (1 - tau) * online
          print(round(ziel, 3))
        options: ["3.0", "2.0", "4.0", "1.0"]
        answer: "3.0"
        explanation: Erst 0 → 2, dann 2 → 0,5 · 2 + 0,5 · 4 = 3. Das EMA-Ziel nähert sich dem Online-Wert schrittweise an.
