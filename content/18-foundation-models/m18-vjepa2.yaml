    hints:
      - "Teilziel: vorhersagen → Energie je Kandidat → besten auswählen."
      - "`praediktor(z, kandidaten)` funktioniert für alle Kandidaten auf einmal (Form `(n, 2)`). Die L1-Energie ist die Summe der Beträge entlang `axis=1`."
      - "`e = np.sum(np.abs(z_neu - z_ziel), axis=1)`, dann `np.argmin(e)` als Index verwenden."
      - "`return kandidaten[np.argmin(e)]`"
  - type: text
    body: |
      ## Ergebnisse und Grenzen

      Laut Paper ([arXiv:2506.09985](https://arxiv.org/abs/2506.09985)):

      - Greifen-und-Ablegen mit Zwischenziel-Bildern: 65–80 % Erfolg; die Behavior-Cloning-Baseline Octo erreichte 10–15 %.
      - Planungszeit pro Aktion auf einer RTX 4090: ca. 16 s – mit einem generativen Cosmos-Modell als Vergleich ca. 4 min.
      - **Grenzen**, von den Autoren selbst genannt: empfindlich gegenüber der Kameraposition, Ziele nur als Bilder (keine Sprache), längere Aufgaben brauchen Zwischenziel-Bilder.

      Das ist ein Forschungsergebnis auf teuren Industriearmen – kein fertiges Werkzeug für deinen Hobby-Arm (mehr dazu in Modul 19). *Stand: Oktober 2026.*
  - type: quiz
    question: |
      Warum führt der Planer nur die **erste** Aktion der optimierten Folge aus und plant danach neu?
    options:
      - text: Der Prädiktor ist ungenau; nach jedem Schritt liefert ein neues Kamerabild den wahren Zustand, und Fehler werden korrigiert.
        correct: true
        why: Das ist Receding-Horizon-Regelung (MPC). Vorhersagefehler summieren sich über mehrere Schritte – Neuplanen verhindert, dass sie sich aufschaukeln.
      - text: Weil der Roboter technisch nur eine Aktion pro Sekunde annehmen kann.
        correct: false
        why: Mit der Hardware hat das nichts zu tun; die Idee stammt aus der Regelungstechnik.
      - text: Weil die restlichen Aktionen der Folge immer null sind.
        correct: false
        why: CEM optimiert die ganze Folge; sie wird nur bewusst nicht vollständig ausgeführt.
cards:
  - id: m18-c-latent-energie
    concept: latentes-zielplanen
    variants:
      - type: predict
        code: |
          import numpy as np
          z_vorhergesagt = np.array([0.5, -1.0, 2.0])
          z_ziel = np.array([1.0, -1.0, 1.0])
          print(np.sum(np.abs(z_vorhergesagt - z_ziel)))
        options: ["1.5", "-0.5", "1.118", "0.5"]
        answer: "1.5"
        explanation: "L1-Energie: |−0,5| + |0| + |1| = 1,5. Ohne Betrag würden sich Abweichungen gegenseitig aufheben."
      - type: predict
        code: |
          import numpy as np
          kandidaten = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 0.0]])
          z_ziel = np.array([1.0, 0.5])
          e = np.sum(np.abs(kandidaten - z_ziel), axis=1)
          print(np.argmin(e))
        options: ["1", "0", "2", "[1.  0.5]"]
        answer: "1"
        explanation: "Energien 1,5 / 0,5 / 1,5 – Kandidat 1 ist dem Ziel am nächsten. `argmin` liefert den Index."
  - id: m18-c-zielbild
    concept: latentes-zielplanen
    variants:
      - type: quiz
        question: |
          Wie wird bei V-JEPA 2-AC festgelegt, was der Roboter tun soll?
        options:
          - text: Durch ein Zielbild, dessen Repräsentation der Planer möglichst genau erreichen soll
            correct: true
            why: Die Energie ist der latente Abstand zum Zielbild.
          - text: Durch einen Sprachbefehl
            correct: false
            why: Sprachziele nennen die Autoren ausdrücklich als offene Grenze.
          - text: Durch eine handgeschriebene Belohnungsfunktion
            correct: false
            why: Gerade die braucht der Ansatz nicht.
      - type: quiz
        question: |
          Eine Aufgabe lautet „räume den Tisch auf“ und dauert mehrere Minuten. Was ist bei V-JEPA 2-AC laut den Autoren nötig?
        options:
          - text: Eine Folge von Zwischenziel-Bildern
            correct: true
            why: Längere Aufgaben brauchen Zwischenziele; ohne sie reicht der kurze Vorhersagehorizont nicht.
          - text: Nichts – ein Zielbild reicht für beliebig lange Aufgaben.
            correct: false
            why: Die Vorhersage wird über lange Horizonte ungenau; deshalb Zwischenziele.
          - text: Ein neues Vortraining auf diesem Tisch
            correct: false
            why: Der Ansatz lief ohne neue Daten in fremden Laboren; nötig sind Zwischenziele, kein neues Training.
  - id: m18-c-mpc-latent
    concept: latentes-zielplanen
    variants:
      - type: quiz
        question: |
          Ein latentes World Model sagt 5 Schritte voraus. Nach Schritt 1 weicht die Realität etwas ab. Was tut ein MPC-Planer?
        options:
          - text: Neues Bild encodieren und ab dem echten Zustand neu planen
            correct: true
            why: Receding Horizon – Fehler aus Schritt 1 fließen nicht in die weitere Planung ein.
          - text: Die restlichen 4 geplanten Aktionen unverändert ausführen
            correct: false
            why: Dann würde sich der Fehler fortpflanzen; genau das vermeidet MPC.
          - text: Das Modell neu trainieren
            correct: false
            why: Neuplanen ist billig; Neutrainieren nach jeder Abweichung wäre weder nötig noch praktikabel.
      - type: quiz
        question: |
          Was optimiert CEM beim latenten Planen?
        options:
          - text: Die Verteilung (Mittelwert, Streuung) über Aktionsfolgen, sodass die Energie der Elite-Folgen sinkt
            correct: true
            why: CEM samplet, wählt die besten Folgen (Elite) und passt μ und σ an.
          - text: Die Gewichte des Prädiktors
            correct: false
            why: Beim Planen bleibt das Modell fest; optimiert werden nur die Aktionen.
          - text: Die Repräsentation des Zielbilds
            correct: false
            why: Das Ziel ist vorgegeben und bleibt fest.
