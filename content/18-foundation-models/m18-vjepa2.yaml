        B = np.array([[1.0, 0.2], [-0.1, 0.8]])
        def praediktor(z, a):
            return z + a @ B.T
        def waehle_aktion(z, z_ziel, kandidaten):
            e = np.sum(np.abs(kandidaten - z_ziel), axis=1)
            return kandidaten[np.argmin(e)]
      - |
        import numpy as np
        B = np.array([[1.0, 0.2], [-0.1, 0.8]])
        def praediktor(z, a):
            return z + a @ B.T
        def waehle_aktion(z, z_ziel, kandidaten):
            e = np.sum(np.abs(praediktor(z, kandidaten) - z_ziel), axis=1)
            return np.argmin(e)
      - |
