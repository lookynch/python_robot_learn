                if v < -self.max_speed:
                    speed = -self.max_speed
                self.speed = v
    hints:
      - "Teilziel: eine zweite Prüfung für die untere Grenze ergänzen."
      - Die untere Grenze ist `-self.max_speed` – auf die Attribute greifst du immer über `self` zu.
      - |
        ```python
        if v < -self.max_speed:
            v = -self.max_speed
        ```
  - type: exercise
    mode: make
    prompt: |
      Schreibe eine Klasse `Odometer` (Wegzähler):

      - `__init__(self)` setzt das Attribut `distance` auf `0.0`.
      - `add(self, speed, dt)` addiert den in der Zeit `dt` (s) zurückgelegten Weg $v \cdot \Delta t$ (m) zu `distance`.
      - `reset(self)` setzt `distance` wieder auf `0.0`.
    starter: |
      class Odometer:
          def __init__(self):
              # dein Code
              pass
    solution: |
      class Odometer:
          def __init__(self):
              self.distance = 0.0

          def add(self, speed, dt):
              self.distance = self.distance + speed * dt

          def reset(self):
              self.distance = 0.0
    tests:
      - name: Startwert
        code: |
          o = Odometer()
          assert o.distance == 0.0, f"Ein neuer Odometer sollte distance 0.0 haben, hat {o.distance}"
      - name: Aufaddieren
        code: |
          o = Odometer()
          o.add(2.0, 0.5)
          o.add(1.0, 3.0)
          assert close(o.distance, 4.0), f"Nach add(2.0, 0.5) und add(1.0, 3.0) sollte distance 4.0 sein, ist {o.distance}"
      - name: Unabhängige Objekte
        code: |
          a = Odometer()
          b = Odometer()
          a.add(1.0, 1.0)
          assert b.distance == 0.0, f"b sollte unverändert 0.0 sein, ist {b.distance}"
      - name: Zurücksetzen
        code: |
          o = Odometer()
          o.add(3.0, 1.0)
          o.reset()
          assert o.distance == 0.0, f"Nach reset() sollte distance 0.0 sein, ist {o.distance}"
          o.add(1.0, 2.0)
          assert close(o.distance, 2.0), f"Nach reset() und add(1.0, 2.0) sollte distance 2.0 sein, ist {o.distance}"
    mutants:
      - |
        class Odometer:
            def __init__(self):
                self.distance = 0.0

            def add(self, speed, dt):
                self.distance = speed * dt

            def reset(self):
                self.distance = 0.0
      - |
        class Odometer:
            def __init__(self):
                self.distance = 0.0

            def add(self, speed, dt):
                self.distance = self.distance + speed * dt

            def reset(self):
                distance = 0.0
      - |
        class Odometer:
            def __init__(self):
                self.distance = 0.0

            def add(self, speed, dt):
                self.distance = self.distance + speed + dt

            def reset(self):
                self.distance = 0.0
    hints:
      - "Teilziel: Attribut in `__init__` anlegen, in `add` aufaddieren, in `reset` zurücksetzen."
      - Jede Methode bekommt `self` als ersten Parameter; das Attribut heißt überall `self.distance`.
      - "In `add`: `self.distance = self.distance + speed * dt`"
  - type: quiz
    question: Was ist der Unterschied zwischen einer Klasse und einem Objekt?
    options:
      - text: Die Klasse ist der Bauplan, ein Objekt ein konkretes Exemplar mit eigenen Attributwerten.
        correct: true
        why: Aus einer Klasse `Motor` kannst du beliebig viele Motor-Objekte erzeugen.
      - text: Eine Klasse enthält Daten, ein Objekt enthält Methoden.
        correct: false
        why: Die Klasse definiert beides; jedes Objekt hat eigene Daten und nutzt die Methoden der Klasse.
      - text: Es gibt keinen Unterschied, beides sind nur Namen für dasselbe.
        correct: false
        why: "`Motor` (Klasse) und `Motor(\"links\", 2.0)` (Objekt) sind verschiedene Dinge – nur das Objekt hat z. B. eine `speed`."
cards:
  - id: m03-c-objekte-unabhaengig
    concept: m03-klasse-objekt
    variants:
      - type: predict
        code: |
          class Box:
              def __init__(self, v):
                  self.v = v

          a = Box(1)
          b = Box(2)
          a.v = 5
          print(a.v, b.v)
        options: ["5 2", "5 5", "1 2"]
        answer: "5 2"
        explanation: Jedes Objekt hat eigene Attribute.
      - type: predict
        code: |
          class Joint:
              def __init__(self):
                  self.angle = 0.0

              def move_by(self, d):
                  self.angle = self.angle + d

          j = Joint()
          k = Joint()
          j.move_by(0.5)
          k.move_by(0.25)
          j.move_by(0.5)
          print(j.angle, k.angle)
        options: ["1.0 0.25", "1.25 1.25", "0.5 0.25"]
        answer: "1.0 0.25"
        explanation: "`j` wurde zweimal um 0.5 bewegt, `k` einmal um 0.25."
  - id: m03-c-self
    concept: m03-methode-self
    variants:
      - type: quiz
        question: "`m.set_speed(3.0)` entspricht welchem Aufruf?"
        options:
          - text: "`Motor.set_speed(m, 3.0)`"
            correct: true
            why: Python übergibt das Objekt automatisch als `self`.
          - text: "`Motor.set_speed(3.0)`"
            correct: false
            why: Es fehlt das Objekt – Python wüsste nicht, welcher Motor gemeint ist.
          - text: "`set_speed(self, 3.0)`"
            correct: false
            why: "`self` ist kein globaler Name, sondern der Parameter in der Methode."
      - type: predict
        code: |
          class Wheel:
              def __init__(self, r):
                  self.r = r

              def distance(self, turns):
                  return 2 * 3.14 * self.r * turns

          w = Wheel(0.5)
          print(w.distance(2))
        options: ["6.28", "12.56", "3.14"]
        answer: "6.28"
        explanation: "`self.r` ist das Attribut dieses Rades (0.5 m): $2 \\cdot 3{,}14 \\cdot 0{,}5 \\cdot 2 = 6{,}28$ m."
