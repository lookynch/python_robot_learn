id: m03-klassen
title: Klassen – Daten und Verhalten bündeln
minutes: 10
goals:
  - Eine Klasse mit `__init__`, Attributen und Methoden schreiben
  - Erklären, wofür `self` steht
  - Mehrere unabhängige Objekte derselben Klasse erzeugen und benutzen
concepts: [m03-klasse-objekt, m03-methode-self]
steps:
  - type: text
    body: |
      ## Ein Bauplan für Motoren

      Ein Motor hat **Daten** (Name, Höchstgeschwindigkeit, aktuelle Geschwindigkeit) und **Verhalten** (Geschwindigkeit setzen, dabei begrenzen). Bisher lägen die Daten in Variablen oder einem Dict und das Verhalten in losen Funktionen.

      Eine **Klasse** (class) bündelt beides. Sie ist ein Bauplan; daraus erzeugst du beliebig viele **Objekte** (objects, auch Instanzen). Jedes Objekt hat seine eigenen Werte – seine **Attribute**. Funktionen innerhalb der Klasse heißen **Methoden** – wie `append` bei Listen.

      In diesem Modul sind Namen im Code englisch (`Motor`, `speed`), so wie in fast jeder Robotik-Bibliothek; die Erklärungen bleiben deutsch. Du wirst im Kurs beides sehen – wichtig ist nur, innerhalb eines Programms einheitlich zu bleiben. Klassennamen beginnen mit einem Großbuchstaben.
  - type: example
    code: |
      class Motor:
          def __init__(self, name, max_speed):
              self.name = name
              self.max_speed = max_speed
              self.speed = 0.0

          def set_speed(self, v):
              if v > self.max_speed:
                  v = self.max_speed
              self.speed = v

      m1 = Motor("links", 2.0)
      m2 = Motor("rechts", 1.5)
      m1.set_speed(3.0)
      m2.set_speed(1.0)
      print(m1.name, m1.speed)
      print(m2.name, m2.speed)
    subgoals:
      - lines: 1
        label: Klasse definieren
      - lines: [2, 5]
        label: Beim Erzeugen Attribute anlegen
      - lines: [7, 10]
        label: Methode mit Verhalten schreiben
      - lines: [12, 13]
        label: Objekte erzeugen
      - lines: [14, 17]
        label: Methoden aufrufen, Attribute lesen
    after: |
      - `Motor("links", 2.0)` erzeugt ein neues Objekt und ruft dabei automatisch `__init__` auf (zwei Unterstriche vorn und hinten; oft „Konstruktor“ genannt).
      - `self.name = name` speichert den Parameter als **Attribut** im Objekt.
      - `m1.set_speed(3.0)` ruft die Methode für `m1` auf – `m1` wird auf 2.0 m/s begrenzt.
  - type: explain
    question: |
      Was ist `self` beim Aufruf `m1.set_speed(3.0)`?
    options:
      - text: Das Objekt `m1` selbst – Python übergibt es automatisch als ersten Parameter.
        correct: true
        why: "`m1.set_speed(3.0)` entspricht `Motor.set_speed(m1, 3.0)`. Deshalb wirkt `self.speed = v` auf `m1` und nicht auf `m2`."
      - text: Die Klasse `Motor`.
        correct: false
        why: Dann hätten alle Motoren dieselbe Geschwindigkeit. `self` ist das einzelne Objekt, nicht der Bauplan.
      - text: Ein Schlüsselwort, das Python für Methoden verlangt, ohne eigene Bedeutung.
        correct: false
        why: "`self` ist ein ganz normaler Parameter (der Name ist Konvention). Über ihn erreicht die Methode die Attribute ihres Objekts."
  - type: predict
    code: |
      class Counter:
          def __init__(self):
              self.n = 0

          def tick(self):
              self.n = self.n + 1

      a = Counter()
      b = Counter()
      a.tick()
      a.tick()
      b.tick()
      print(a.n, b.n)
    options: ["2 1", "3 3", "1 1", "3 0"]
    answer: "2 1"
    explanation: |
      Jedes Objekt hat sein eigenes Attribut `n`. `a` wurde zweimal hochgezählt, `b` einmal.
  - type: predict
    code: |
      class Sensor:
          def __init__(self, offset):
              self.offset = offset

          def read(self, raw):
              return raw - self.offset

      s = Sensor(0.5)
      print(s.read(2.0))
      print(Sensor(1.0).read(2.0))
      print(s.offset)
    options:
      - |
        1.5
        1.0
        0.5
      - |
        1.5
        1.0
        1.0
      - |
        1.5
        1.5
        0.5
      - |
        2.0
        2.0
        0.5
    answer: |
      1.5
      1.0
      0.5
    explanation: |
      Methoden können wie Funktionen Werte zurückgeben. `Sensor(1.0)` ist ein **zweites** Objekt mit eigenem Offset – `s` bleibt bei 0.5.
  - type: text
    body: |
      ## Drei typische Fehler

      1. **`self` in der Parameterliste vergessen:** `def tick():` → beim Aufruf `a.tick()` gibt es einen `TypeError` („takes 0 positional arguments but 1 was given“), weil Python das Objekt trotzdem übergibt.
      2. **`self.` beim Attribut vergessen:** `n = 0` in `__init__` erzeugt nur eine lokale Variable, die nach `__init__` verschwindet.
      3. **Klasse statt Objekt benutzen:** `Motor.set_speed(3.0)` – es fehlt das Objekt, dessen Geschwindigkeit gesetzt werden soll.
  - type: quiz
    question: |
      Was passiert in der letzten Zeile?
    code: |
      class Gripper:
          def __init__(self):
              opened = False

          def open(self):
              self.opened = True

      g = Gripper()
      print(g.opened)
    options:
      - text: "Ein `AttributeError`, weil `g` noch kein Attribut `opened` hat."
        correct: true
        why: "`opened = False` ohne `self.` ist eine lokale Variable in `__init__`. Das Attribut entsteht erst, wenn `open()` aufgerufen wird."
      - text: "Es wird `False` ausgegeben."
        correct: false
        why: Dafür müsste in `__init__` `self.opened = False` stehen.
      - text: "Es wird `True` ausgegeben."
        correct: false
        why: "`open()` wurde nie aufgerufen."
  - type: fill
    fading: true
    prompt: |
      Ergänze die Akku-Klasse so, dass nach einem Verbrauch von 30 noch `70` ausgegeben wird.
    code: |
      class Battery:
          def __init__(self, capacity):
              ___.capacity = capacity
              self.charge = capacity

          def use(self, amount):
              self.charge = self.charge - amount

      b = ___(100)
      b.___(30)
      print(b.charge)
    blanks:
      - answer: self
        options: [self, capacity, b]
      - answer: Battery
        options: [Battery, self, use]
      - answer: use
        options: [use, charge, Battery]
    expect_output: "70"
  - type: parsons
    fading: true
    prompt: |
      Baue eine Klasse `Lamp`, die beim Erzeugen aus ist und mit `toggle()` umschaltet. Ausgabe: `True`.
    lines:
      - "class Lamp:"
      - "    def __init__(self):"
      - "        self.on = False"
      - "    def toggle(self):"
      - "        self.on = not self.on"
      - "lamp = Lamp()"
      - "lamp.toggle()"
      - "print(lamp.on)"
    expect_output: "True"
  - type: exercise
    mode: modify
    prompt: |
      `set_speed` begrenzt bisher nur nach oben. Ändere die Methode so, dass die Geschwindigkeit auch nach **unten** auf `-max_speed` begrenzt wird (rückwärts darf der Motor genauso schnell wie vorwärts).
    starter: |
      class Motor:
          def __init__(self, name, max_speed):
              self.name = name
              self.max_speed = max_speed
              self.speed = 0.0

          def set_speed(self, v):
              if v > self.max_speed:
                  v = self.max_speed
              self.speed = v
    solution: |
      class Motor:
          def __init__(self, name, max_speed):
              self.name = name
              self.max_speed = max_speed
              self.speed = 0.0

          def set_speed(self, v):
              if v > self.max_speed:
                  v = self.max_speed
              if v < -self.max_speed:
                  v = -self.max_speed
              self.speed = v
    tests:
      - name: Nach unten begrenzen
        code: |
          m = Motor("m", 2.0)
          m.set_speed(-5.0)
          assert m.speed == -2.0, f"set_speed(-5.0) bei max_speed 2.0 sollte -2.0 ergeben, ist {m.speed}"
      - name: Normale Werte
        code: |
          m = Motor("m", 2.0)
          m.set_speed(-1.0)
          assert m.speed == -1.0, f"set_speed(-1.0) sollte -1.0 ergeben, ist {m.speed}"
          m.set_speed(0.5)
          assert m.speed == 0.5, f"set_speed(0.5) sollte 0.5 ergeben, ist {m.speed}"
      - name: Nach oben begrenzen
        code: |
          m = Motor("m", 1.5)
          m.set_speed(4.0)
          assert m.speed == 1.5, f"set_speed(4.0) bei max_speed 1.5 sollte 1.5 ergeben, ist {m.speed}"
    mutants:
      - |
