            def __init__(self, name, max_speed):
                self.name = name
                self.max_speed = max_speed
                self.speed = 0.0

            def set_speed(self, v):
                if v > self.max_speed:
                    v = self.max_speed
                if v < 0:
                    v = 0
                self.speed = v
      - |
