    hints:
      - "Teilziel: über alle Gelenke laufen und bei jedem das Attribut ändern."
      - "`j = 0.0` würde nur die Schleifenvariable überschreiben. Ändern musst du das **Attribut** des Gelenks."
      - |
        ```python
