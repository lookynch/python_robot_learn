            for j in self.joints:
                j.angle = 0.0
        ```
  - type: exercise
    mode: make
    prompt: |
      `Joint` ist vorgegeben. Schreibe die Klasse `Robot` mit

      - `__init__(self, joints)` – speichert die Liste als Attribut `joints`,
      - `pose(self)` – liefert die Liste der Gelenkwinkel,
      - `set_pose(self, angles)` – löst einen `ValueError` aus, wenn die Anzahl der Winkel nicht zur Anzahl der Gelenke passt; sonst bewegt sie jedes Gelenk mit `move_to` (das begrenzt automatisch).
    starter: |
      class Joint:
          def __init__(self, limit=3.0):
              self.limit = limit
              self.angle = 0.0

          def move_to(self, target):
              self.angle = max(-self.limit, min(target, self.limit))

      class Robot:
          # dein Code
          pass
    solution: |
      class Joint:
          def __init__(self, limit=3.0):
              self.limit = limit
              self.angle = 0.0

          def move_to(self, target):
              self.angle = max(-self.limit, min(target, self.limit))

      class Robot:
          def __init__(self, joints):
              self.joints = joints

          def pose(self):
              return [j.angle for j in self.joints]

          def set_pose(self, angles):
              if len(angles) != len(self.joints):
                  raise ValueError("Anzahl der Winkel passt nicht zur Anzahl der Gelenke")
              for joint, q in zip(self.joints, angles):
                  joint.move_to(q)
    tests:
      - name: Stellung setzen
        code: |
          r = Robot([Joint(), Joint()])
          r.set_pose([0.5, -1.0])
          assert r.pose() == [0.5, -1.0], f"Erwartet [0.5, -1.0], bekommen {r.pose()}"
      - name: Begrenzung über move_to
        code: |
          r = Robot([Joint(1.0), Joint(2.0)])
          r.set_pose([1.5, -2.5])
          assert r.pose() == [1.0, -2.0], f"Die Gelenke begrenzen auf ±limit – erwartet [1.0, -2.0], bekommen {r.pose()}"
      - name: Falsche Anzahl
        code: |
          r = Robot([Joint(), Joint()])
          try:
              r.set_pose([0.1])
              assert False, "set_pose mit 1 Winkel für 2 Gelenke sollte einen ValueError auslösen"
          except ValueError:
              pass
          try:
              r.set_pose([0.1, 0.2, 0.3])
              assert False, "set_pose mit 3 Winkeln für 2 Gelenke sollte einen ValueError auslösen"
          except ValueError:
              pass
    mutants:
      - |
